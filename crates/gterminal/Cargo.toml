[package]
name = "gobby-terminal"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Josh Wilhelmi <hello@gobby.ai>"]
description = "Terminal keep-set for the Gobby gterm host and gclient workspace"
license = "Apache-2.0"
repository = "https://github.com/GobbyAI/gobby"
homepage = "https://gobby.ai"
keywords = ["gobby", "terminal", "pty"]
categories = ["command-line-utilities"]
build = "build.rs"

[lib]
name = "gobby_terminal"
path = "src/lib.rs"

[features]
default = []
vt-engine = []

[dependencies]
base64 = "0.22.1"
bincode = { version = "2", features = ["serde"] }
bytes = "1"
crossterm = "0.29"
interprocess = "2.4.2"
libc = "0.2"
png = "0.17"
portable-pty = "=0.9.0"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
widestring = "1.2"
wmi = { version = "0.18.4", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "frame_producer"
required-features = ["vt-engine"]

[[test]]
name = "host_lifecycle"
required-features = ["vt-engine"]

[[test]]
name = "control_protocol"
required-features = ["vt-engine"]

[[test]]
name = "frame_protocol"
required-features = ["vt-engine"]

[[test]]
name = "embed"
required-features = ["vt-engine"]

[[test]]
name = "wire_golden"

[[bin]]
name = "gterm"
path = "src/bin/gterm.rs"
required-features = ["vt-engine"]
