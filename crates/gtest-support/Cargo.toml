[package]
name = "gobby-test-support"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Dev-only test helpers for the Gobby workspace: database URL guard, isolated databases, full-daemon harness"
autotests = false

[lib]
name = "gobby_test_support"
path = "src/lib.rs"

[[test]]
name = "suite"
path = "tests/suite.rs"

[dependencies]
anyhow = "1"
# Same 0.8 line as gobby-core and gobby-daemon, so the workspace compiles one copy.
rand = "0.8"
# Same features as gobby-daemon's serde_json, so JSON fixtures parse the same way here.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11"
# The async tokio-postgres client needs a runtime; listeners bind through tokio's TcpListener.
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
tokio-postgres = "0.7.18"
# Blocking HTTP client for the v2 request sender; already in the lockfile through gobby-core.
ureq = "2"
# Self-cleaning per-run home directories, as the existing gdaemon tests use.
tempfile = "3"

# Unix-only: getifaddrs (net), kill and killpg (signal), passwd and uid lookups (user), and
# O_NOFOLLOW. Windows builds take the cfg(windows) branches in the source instead.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["net", "signal", "user"] }

[lints]
workspace = true
