[package]
name = "gobby-daemon"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Josh Wilhelmi <hello@gobby.ai>"]
description = "Schema authority CLI and future hosted backend for Gobby"
license = "FSL-1.1-ALv2"
repository = "https://github.com/GobbyAI/gobby"
homepage = "https://gobby.ai"
keywords = ["gobby", "database", "schema"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "gdaemon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gobby-core = { path = "../gcore", version = "0.10.0", features = ["postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
