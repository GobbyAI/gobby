[package]
name = "gobby-daemon"
version = "0.4.10"
edition = "2024"
rust-version = "1.88"
authors = ["Josh Wilhelmi <hello@gobby.ai>"]
description = "Schema authority CLI and future hosted backend for Gobby"
license = "FSL-1.1-ALv2"
repository = "https://github.com/GobbyAI/gobby"
homepage = "https://gobby.ai"
keywords = ["gobby", "database", "schema"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "gobby_daemon"
path = "src/lib.rs"

[[bin]]
name = "gdaemon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
gobby-core = { path = "../gcore", version = "0.10.0", features = ["postgres", "postgres-pool"] }
deadpool-postgres = { version = "0.14.2", features = ["rt_tokio_1"] }
gobby-terminals = { path = "../gterminals" }
http-body-util = "0.1"
hmac = "0.12"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
# ring only, matching the workspace's rustls; aws-lc-rs stays out of the build.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
num-bigint = "0.4"
rand = "0.8"
sha2 = "0.10"
time = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tower-service = "0.3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
futures-util = "0.3"
tempfile = "3"
tokio-postgres = "0.7.18"
tokio = { version = "1", features = ["test-util"] }
