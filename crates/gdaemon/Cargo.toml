[package]
name = "gobby-daemon"
version = "0.4.3"
edition = "2024"
rust-version = "1.88"
authors = ["Josh Wilhelmi <hello@gobby.ai>"]
description = "Schema authority CLI and future hosted backend for Gobby"
license = "FSL-1.1-ALv2"
repository = "https://github.com/GobbyAI/gobby"
homepage = "https://gobby.ai"
keywords = ["gobby", "database", "schema"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "gobby_daemon"
path = "src/lib.rs"

[[bin]]
name = "gdaemon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false }
bytes = "1"
clap = { version = "4", features = ["derive"] }
gobby-core = { path = "../gcore", version = "0.10.0", features = ["postgres"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-service = "0.3"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
