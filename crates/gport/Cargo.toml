[package]
name = "gobby-port"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Josh Wilhelmi <hello@gobby.ai>"]
description = "Development-only checks and records for the Gobby 1.0 port"
license.workspace = true
repository.workspace = true
publish = false
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "gport"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fancy-regex = "0.11"
gobby-core = { path = "../gcore", version = "0.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
ureq = { version = "2", features = ["json"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
