[package]
name = "gobby-terminals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Workspace-private gterm host-wire clients for the gdaemon terminal family"

[lints]
workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22.1"
bincode = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync", "time", "rt"] }
uuid = { version = "1", features = ["v4"] }
gobby-core = { path = "../gcore", features = ["postgres-pool"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
