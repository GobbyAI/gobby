[package]
name = "gobby-terminals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Workspace-private gterm host-wire clients for the gdaemon terminal family"

# The workspace forbids unsafe code, which no module can allow. Deny it here so
# host/process.rs alone may allow it for the macOS libproc identity lookup.
[lints.rust]
unsafe_code = "deny"

[dependencies]
anyhow = "1"
base64 = "0.22.1"
bincode = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync", "time", "rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
gobby-core = { path = "../gcore", features = ["postgres-pool"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
