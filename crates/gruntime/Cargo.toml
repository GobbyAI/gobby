[package]
name = "gobby-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Workspace-private gdaemon route family for /api/runtime and /api/config"

[lib]
name = "gobby_runtime"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false }
gobby-core = { path = "../gcore", version = "0.10.0", features = ["postgres", "postgres-pool", "route-family"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
anyhow = "1"
futures-util = "0.3"
http-body-util = "0.1"
tempfile = "3"
tokio-postgres = "0.7.18"
tower-service = "0.3"
