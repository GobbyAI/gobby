[package]
name = "gobby-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Josh Wilhelmi <hello@gobby.ai>"]
description = "Native MCP wrapper transport for the Gobby daemon"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
gobby-core = { path = "../gcore", version = "0.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
temp-env = "0.3.6"

[lints]
workspace = true
