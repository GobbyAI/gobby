[package]
name = "gobby-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Josh Wilhelmi <hello@gobby.ai>"]
description = "Native MCP wrapper transport for the Gobby daemon"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "gmcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gobby-core = { path = "../gcore", version = "0.10.0" }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio ={ version = "1", features = ["io-std", "macros", "rt", "sync", "time"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
temp-env = "0.3.6"

[lints]
workspace = true
