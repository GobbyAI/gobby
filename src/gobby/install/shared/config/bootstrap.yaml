# Gobby bootstrap — settings needed before the database is available.
# All other configuration is managed via the web UI or gobby-config MCP tools.
hub_backend: "postgres"
database_url: "postgresql://gobby:gobby_dev@localhost:60891/gobby"
postgres_install_mode: "docker"
daemon_port: 60887
bind_host: "localhost"
websocket_port: 60888
ui_port: 60889
