name: devteam
type: pipeline
version: "1.0"
description: |
  Launch a developer and an independent reviewer for one task in one registered
  worktree. The developer owns tests and implementation. Either seat may land
  and close when the selected evidence policy passes. No manager, separate test
  writer, automatic claim hop or fixed rejection count is involved.
tags: [runbook, development]
resume_on_restart: true
strict_inputs: true
inputs:
  parent_team_id:
    type: string
    default: null
  team_id:
    type: string
    default: null
  seats:
    type: string
    default: developer,code-reviewer
  task:
    type: string
    required: true
  workspace:
    type: string
    required: true
  report_to:
    type: string
    required: true
    description: Live session for readiness, completion and blockers.
  developer_provider:
    type: string
    default: null
  developer_model:
    type: string
    default: null
  developer_reasoning_effort:
    type: string
    default: null
  reviewer_provider:
    type: string
    default: null
  reviewer_model:
    type: string
    default: null
  reviewer_reasoning_effort:
    type: string
    default: null

steps:
  - id: guard
    mcp:
      server: gobby-agents
      tool: check_runbook_seats
      arguments:
        workspace: "${{ inputs.workspace }}"
        requested: "${{ inputs.seats }}"
        team_id: "${{ inputs.team_id }}"
        skip_live_seats: "${{ inputs.team_id is not none }}"
        report_to: "${{ inputs.report_to }}"
        require_report_to: true
        task: "${{ inputs.task }}"
        tab_title: Dev Pair
        seat_models:
          developer: "${{ inputs.developer_model }}"
          code-reviewer: "${{ inputs.reviewer_model }}"
        catalogue:
          - name: developer
            title: Developer
            agent: developer
          - name: code-reviewer
            title: Code Reviewer
            agent: code-reviewer

  - id: admit
    mcp:
      server: gobby-agents
      tool: admit_team
      arguments:
        task: "${{ inputs.task }}"
        tab_title: "${{ steps.guard.output.tab_title }}"
        parent_team_id: "${{ inputs.parent_team_id }}"
        team_id: "${{ inputs.team_id }}"

  - id: developer
    condition: "${{ 'developer' in steps.guard.output.launch }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: developer
        provider: "${{ inputs.developer_provider }}"
        model: "${{ inputs.developer_model }}"
        reasoning_effort: "${{ inputs.developer_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        project_path: "${{ steps.admit.output.project_path }}"
        task_id: "${{ steps.admit.output.task_id }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: >-
          Implement task ${{ inputs.task }} on branch ${{ steps.admit.output.branch }}
          in registered worktree ${{ steps.admit.output.worktree }} at
          ${{ steps.admit.output.project_path }}. Own tests, implementation,
          validation and self-review. The pipeline will send you the independent
          reviewer's session ID; keep your claim during review. Follow your
          installed definition and selected evidence policy. Coordinate one
          landing/closing owner with the reviewer, then personally clean up the
          merged worktree after the reviewer finishes. Report readiness,
          completion and blockers to ${{ inputs.report_to }}.
          Before removal inspect Git status; after all seats finish remove only
          known generated untracked isolation metadata owned by this team, preserving
          user-authored config and changes. Never force an unsafe deletion.
          ${{ 'This is an epic child pair. Before landing, request a held clean shared-epic-tree point from report_to and wait_for_coordination on it. Land only after the coordinator grants the landing permit while its static lane is paused. Send the landing outcome immediately so the coordinator can release the permit; retry checkout_dirty/checkout_busy after another grant. Resolve your own merge conflicts. Remove only this child worktree after its reviewer finishes.' if inputs.parent_team_id else '' }}
        placement: >-
          ${{ {'split': {'workspace': steps.guard.output.workspace_id,
          'tab_title': steps.guard.output.tab_title, 'axis': 'right',
          'title': 'Developer'}} if steps.guard.output.tab_exists else
          {'tab': {'workspace': steps.guard.output.workspace_id,
          'title': steps.guard.output.tab_title}} }}

  - id: reviewer
    condition: "${{ 'code-reviewer' in steps.guard.output.launch }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: code-reviewer
        task_id: "${{ steps.admit.output.task_id }}"
        claim: false
        provider: "${{ inputs.reviewer_provider }}"
        model: "${{ inputs.reviewer_model }}"
        reasoning_effort: "${{ inputs.reviewer_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        project_path: "${{ steps.admit.output.project_path }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: >-
          Independently review task ${{ inputs.task }} in registered worktree
          ${{ steps.admit.output.worktree }} at ${{ steps.admit.output.project_path }}.
          The developer session is ${{ steps.developer.output.child_session_id if steps.developer.output else steps.guard.output.live.get('developer') }}.
          Send it readiness and receive the exact candidate and evidence through
          ordinary messages. Keep its claim and files intact. Follow your
          installed definition and selected evidence policy. You or the author
          may land and close approved work; agree on one completion owner. Finish
          your run before the developer removes the shared worktree. Report
          readiness, completion and blockers to ${{ inputs.report_to }}.
        placement:
          split:
            workspace: "${{ steps.guard.output.workspace_id }}"
            tab_title: "${{ steps.guard.output.tab_title }}"
            axis: right
            title: Code Reviewer

  - id: connect
    mcp:
      server: gobby-agents
      tool: send_message
      arguments:
        target: session
        target_id: "${{ steps.developer.output.child_session_id if steps.developer.output else steps.guard.output.live.get('developer') }}"
        content: >-
          Your independent reviewer for ${{ inputs.task }} is
          ${{ steps.reviewer.output.child_session_id if steps.reviewer.output else steps.guard.output.live.get('code-reviewer') }}. Coordinate review,
          landing, closure and shared-worktree cleanup directly with that session.

  - id: arrange
    condition: "${{ steps.developer.output and steps.reviewer.output }}"
    mcp:
      server: gobby-workspaces
      tool: rebalance_tab
      on_refused: record
      arguments:
        workspace: "${{ steps.guard.output.workspace_id }}"
        tab: "${{ steps.guard.output.tab_title }}"
        seats: >-
          ${{ [{'name': 'developer', 'pane': steps.developer.output.pane_ref},
          {'name': 'code-reviewer', 'pane': steps.reviewer.output.pane_ref}] }}
        rows: 100
        layout: tiled
