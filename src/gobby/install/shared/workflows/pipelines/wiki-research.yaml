name: wiki-research
type: pipeline
version: "1.0"
description: |
  One wiki research pass: create a research task from a natural-language
  question, spawn the wiki-researcher agent against it, and wait for the
  agent to compile a cited topic page into the vault.

  Ad-hoc runs come from `gobby pipelines run wiki-research --input question=...`
  or the dynamic `pipeline:wiki-research` MCP tool. Standing queries are
  ordinary cron jobs with `action_type: pipeline` pointing here — cron owns
  the name, schedule, enablement, and history; there is no separate research
  registry.

expose_as_tool: true

inputs:
  question:
    type: string
    required: true
    description: >-
      Research question, free-form natural language. May embed a custom
      output contract; the question's contract overrides the wiki-research
      skill's default note/report format.
  topic_slug:
    type: string
    default: ""
    description: >-
      Explicit topic page slug (knowledge/topics/<slug>.md). Empty means the
      researcher derives one from the question.
  max_sources:
    type: integer
    default: 12
    description: "Hard discovery cap: stop discovering candidate sources at this count."
  max_items:
    type: integer
    default: 8
    description: "Hard curation cap: at most this many sources are ingested."
  create_tasks:
    type: string
    default: "true"
    description: "When 'true', the researcher files follow-up investigation tasks for open leads."
  provider:
    type: string
    default: "claude"
    description: "Agent provider passthrough for the researcher (claude, codex, ...)."
  model:
    type: string
    default: "sonnet"
    description: "Agent model passthrough; defaults to the wiki-researcher agent's model."

outputs:
  research_task_id: "${{ steps.create_research_task.output.id }}"
  run_id: "${{ steps.spawn_researcher.output.run_id }}"
  status: "${{ steps.wait_researcher.output.status }}"

steps:
  # --- RE-ENTRANCY GUARD ---
  # One research pass at a time per vault: concurrent passes would race on
  # the research checkpoint and the shared source manifest.
  - id: reentry_check
    mcp:
      server: gobby-workflows
      tool: list_pipeline_executions
      arguments:
        pipeline_name: "wiki-research"
        status: "running"

  - id: reentry_gate
    condition: "${{ len(reentry_check.output.executions) > 1 }}"
    mcp:
      server: gobby-workflows
      tool: fail_pipeline
      arguments:
        message: "Skipped: another wiki-research execution is already running"

  # --- RESEARCH TASK ---
  - id: create_research_task
    mcp:
      server: gobby-tasks
      tool: create_task
      arguments:
        title: "Wiki research: ${{ inputs.topic_slug or inputs.question }}"
        description: |
          Run one wiki research pass.

          Research question (any output contract embedded here overrides the
          wiki-research skill's default note/report format):

          ${{ inputs.question }}

          Topic slug: "${{ inputs.topic_slug }}" (empty = derive from the question)

          Hard budgets (never exceed):
          - max_sources: ${{ inputs.max_sources }} (discovery cap)
          - max_items: ${{ inputs.max_items }} (curation/ingest cap)
          - create_tasks: ${{ inputs.create_tasks }} (file follow-up investigation tasks only when 'true')
        task_type: "task"
        category: "research"
        validation_criteria: >-
          Cited topic page compiled with an explicit topic and the full
          source list; run report written; budgets respected.
        labels: ["wiki-research"]

  # --- RESEARCHER AGENT ---
  - id: spawn_researcher
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        prompt: "Run one wiki research pass for your assigned task: claim it, load the wiki-research skill, and follow it end to end."
        agent: "wiki-researcher"
        task_id: "${{ steps.create_research_task.output.id }}"
        provider: "${{ inputs.provider }}"
        model: "${{ inputs.model }}"
        timeout: 2700
        parent_session_id: "${{ session_id }}"

  - id: wait_researcher
    wait:
      completion_id: "${{ steps.spawn_researcher.output.run_id }}"
      timeout: 3600

  - id: researcher_failed
    condition: "${{ steps.wait_researcher.output.status != 'success' }}"
    mcp:
      server: gobby-workflows
      tool: fail_pipeline
      arguments:
        message: "wiki-researcher agent failed (status: ${{ steps.wait_researcher.output.status }})"
