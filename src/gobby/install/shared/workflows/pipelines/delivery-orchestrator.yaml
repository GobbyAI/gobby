name: delivery-orchestrator
type: pipeline
version: "1.0"
description: |
  Wrapper pipeline for the full delivery path.

  Runs the front-half conductor first. Once the front half is complete, hands
  the same parent task to the existing development/QA/merge orchestrator.

outputs:
  front_half_complete: "${{ steps.run_front_half.output.output.front_half_complete if (steps.run_front_half.output and steps.run_front_half.output.get('output')) else false }}"
  front_half_stage: "${{ steps.run_front_half.output.output.current_stage if (steps.run_front_half.output and steps.run_front_half.output.get('output')) else '' }}"
  front_half_next_action: "${{ steps.run_front_half.output.output.next_action if (steps.run_front_half.output and steps.run_front_half.output.get('output')) else '' }}"
  orchestration_complete: "${{ steps.run_delivery.output.output.orchestration_complete if (steps.run_delivery.output and steps.run_delivery.output.get('output')) else false }}"

inputs:
  task_id: null
  isolation: "worktree"
  merge_target: null
  developer_agent: "developer"
  qa_agent: "qa-reviewer"
  developer_provider: "claude"
  qa_provider: "claude"
  developer_model: null
  qa_model: "opus"
  agent_timeout: 1200
  max_concurrent: 5
  max_planning_rounds: 3
  auto_dispatch_requirements: false
  requirements_agent: "requirements-analyst"
  planner_agent: "planner"
  adversary_agent: "plan-adversary"
  test_architect_agent: "test-architect"
  requirements_provider: null
  requirements_model: null
  planner_provider: null
  planner_model: null
  adversary_provider: null
  adversary_model: null
  test_architect_provider: null
  test_architect_model: null
  expansion_provider: null
  expansion_model: null

steps:
  - id: reentry_check
    mcp:
      server: gobby-workflows
      tool: list_pipeline_executions
      arguments:
        pipeline_name: "delivery-orchestrator"
        status: "running"

  - id: reentry_gate
    condition: "${{ len(reentry_check.output.executions) > 1 }}"
    mcp:
      server: gobby-workflows
      tool: fail_pipeline
      arguments:
        message: "Skipped: another delivery-orchestrator execution is already running"

  - id: run_front_half
    invoke_pipeline:
      name: front-half-orchestrator
      arguments:
        task_id: "${{ inputs.task_id }}"
        max_planning_rounds: "${{ inputs.max_planning_rounds }}"
        auto_dispatch_requirements: "${{ inputs.auto_dispatch_requirements }}"
        requirements_agent: "${{ inputs.requirements_agent }}"
        planner_agent: "${{ inputs.planner_agent }}"
        adversary_agent: "${{ inputs.adversary_agent }}"
        test_architect_agent: "${{ inputs.test_architect_agent }}"
        requirements_provider: "${{ inputs.requirements_provider }}"
        requirements_model: "${{ inputs.requirements_model }}"
        planner_provider: "${{ inputs.planner_provider }}"
        planner_model: "${{ inputs.planner_model }}"
        adversary_provider: "${{ inputs.adversary_provider }}"
        adversary_model: "${{ inputs.adversary_model }}"
        test_architect_provider: "${{ inputs.test_architect_provider }}"
        test_architect_model: "${{ inputs.test_architect_model }}"
        expansion_provider: "${{ inputs.expansion_provider }}"
        expansion_model: "${{ inputs.expansion_model }}"

  - id: run_delivery
    condition: "${{ steps.run_front_half.output.output.front_half_complete }}"
    invoke_pipeline:
      name: orchestrator
      arguments:
        task_id: "${{ inputs.task_id }}"
        developer_agent: "${{ inputs.developer_agent }}"
        qa_agent: "${{ inputs.qa_agent }}"
        developer_provider: "${{ inputs.developer_provider }}"
        qa_provider: "${{ inputs.qa_provider }}"
        developer_model: "${{ inputs.developer_model }}"
        qa_model: "${{ inputs.qa_model }}"
        agent_timeout: "${{ inputs.agent_timeout }}"
        max_concurrent: "${{ inputs.max_concurrent }}"
        merge_target: "${{ inputs.merge_target }}"
        isolation: "${{ inputs.isolation }}"
