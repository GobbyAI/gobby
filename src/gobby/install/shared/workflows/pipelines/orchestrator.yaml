name: orchestrator
type: pipeline
version: "6.0"
description: |
  Tick-based orchestration pipeline. Each cron tick does one pass:
  scan task state, dispatch agents, exit. The cron schedule IS the loop.
  Idempotent — safe to fire repeatedly.

  Supports worktree, clone, and none isolation modes via the `isolation` input.
  One shared isolation env per epic, created on first tick, reused on subsequent ticks.

outputs:
  orchestration_complete: "${{ done_check.output.orchestration_complete if done_check.output else false }}"
  is_standalone: "${{ standalone_check.output.is_standalone if standalone_check.output else false }}"
  developer_queue_count: "${{ len(scan_developer_queue.output.tasks) if scan_developer_queue.output else 0 }}"
  active_claim_count: "${{ len(scan_active_claims.output.tasks) if scan_active_claims.output else 0 }}"
  needs_review_count: "${{ len(scan_needs_review.output.tasks) if scan_needs_review.output else 0 }}"
  merge_ready_count: "${{ len(scan_merge_ready.output.tasks) if scan_merge_ready.output else 0 }}"
  escalated_count: "${{ len(scan_escalated.output.tasks) if scan_escalated.output else 0 }}"

inputs:
  task_id: null
  developer_agent: "developer"
  qa_agent: "qa-reviewer"
  developer_provider: "claude"
  qa_provider: "claude"
  developer_model: null
  qa_model: "opus"
  agent_timeout: 1200
  max_concurrent: 5
  merge_target: null
  isolation: "worktree"

steps:
  # --- RE-ENTRANCY GUARD ---
  - id: reentry_check
    mcp:
      server: gobby-workflows
      tool: list_pipeline_executions
      arguments:
        pipeline_name: "orchestrator"
        status: "running"

  - id: reentry_gate
    condition: "${{ len(reentry_check.output.executions) > 1 }}"
    mcp:
      server: gobby-workflows
      tool: fail_pipeline
      arguments:
        message: "Skipped: another orchestrator execution is already running"

  # --- FETCH ORIGIN ---
  - id: fetch_origin
    exec: "git fetch origin"

  # --- SCAN CHILD TASKS ---
  - id: scan_children
    mcp:
      server: gobby-tasks
      tool: list_tasks
      arguments:
        parent_task_id: "${{ inputs.task_id }}"
        limit: 1

  - id: scan_developer_queue
    mcp:
      server: gobby-tasks
      tool: list_tasks
      arguments:
        parent_task_id: "${{ inputs.task_id }}"
        status: ["open", "in_progress"]
        claimed: false

  - id: scan_needs_review
    mcp:
      server: gobby-tasks
      tool: list_tasks
      arguments:
        parent_task_id: "${{ inputs.task_id }}"
        status: "needs_review"
        claimed: false

  - id: scan_merge_ready
    mcp:
      server: gobby-tasks
      tool: list_tasks
      arguments:
        parent_task_id: "${{ inputs.task_id }}"
        status: "review_approved"
        claimed: false

  - id: scan_escalated
    mcp:
      server: gobby-tasks
      tool: list_tasks
      arguments:
        parent_task_id: "${{ inputs.task_id }}"
        status: "escalated"
        claimed: false

  - id: scan_active_claims
    mcp:
      server: gobby-tasks
      tool: list_tasks
      arguments:
        parent_task_id: "${{ inputs.task_id }}"
        claimed: true
        closed: false

  - id: scan_ready_tasks
    mcp:
      server: gobby-tasks
      tool: list_ready_tasks
      arguments:
        parent_task_id: "${{ inputs.task_id }}"
        limit: "${{ inputs.max_concurrent }}"

  - id: select_ready_unclaimed
    mcp:
      server: gobby-workflows
      tool: pipeline_eval
      arguments:
        data:
          tasks: "${{ [t for t in (scan_ready_tasks.output.tasks if scan_ready_tasks.output else []) if not t.get('state', {}).get('is_claimed', False)] }}"

  # --- DETECT STANDALONE vs EPIC ---
  - id: standalone_check
    mcp:
      server: gobby-workflows
      tool: pipeline_eval
      arguments:
        data:
          is_standalone: "${{ len(scan_children.output.tasks) == 0 }}"

  - id: get_standalone_task
    condition: "${{ standalone_check.output.is_standalone }}"
    mcp:
      server: gobby-tasks
      tool: get_task
      arguments:
        task_id: "${{ inputs.task_id }}"

  # --- CHECK COMPLETION ---
  - id: done_check
    mcp:
      server: gobby-workflows
      tool: pipeline_eval
      arguments:
        data:
          orchestration_complete: >-
            ${{
              (standalone_check.output.is_standalone
               and get_standalone_task.output
               and (get_standalone_task.output.get('state', {}).get('is_closed', False)
                    or (get_standalone_task.output.get('state', {}).get('is_merge_ready', False)
                        and not get_standalone_task.output.get('state', {}).get('is_claimed', False))))
              or
              (not standalone_check.output.is_standalone
               and len(scan_developer_queue.output.tasks) == 0
               and len(scan_active_claims.output.tasks) == 0
               and len(scan_needs_review.output.tasks) == 0
               and len(scan_escalated.output.tasks) == 0)
            }}

  # --- ISOLATION: get existing worktree or clone ---
  - id: get_worktree
    condition: "${{ inputs.isolation == 'worktree' }}"
    mcp:
      server: gobby-worktrees
      tool: get_worktree_by_task
      arguments:
        task_id: "${{ inputs.task_id }}"

  - id: get_clone
    condition: "${{ inputs.isolation == 'clone' }}"
    mcp:
      server: gobby-clones
      tool: get_clone_by_task
      arguments:
        task_id: "${{ inputs.task_id }}"

  - id: has_isolation
    mcp:
      server: gobby-workflows
      tool: pipeline_eval
      arguments:
        data:
          exists: "${{ bool(get_worktree.output and get_worktree.output.worktree) or bool(get_clone.output and get_clone.output.clone) }}"

  - id: get_task_info
    condition: "${{ not done_check.output.orchestration_complete and not has_isolation.output.exists }}"
    mcp:
      server: gobby-tasks
      tool: get_task
      arguments:
        task_id: "${{ inputs.task_id }}"

  # --- ISOLATION: create worktree or clone ---
  - id: create_worktree
    condition: "${{ not done_check.output.orchestration_complete and inputs.isolation == 'worktree' and not has_isolation.output.exists }}"
    mcp:
      server: gobby-worktrees
      tool: create_worktree
      arguments:
        branch_name: "${{ 'epic-' + str(get_task_info.output.seq_num) if get_task_info.output.task_type == 'epic' else 'task-' + str(get_task_info.output.seq_num) }}"
        base_branch: "${{ inputs.merge_target or current_branch }}"
        task_id: "${{ inputs.task_id }}"
        use_local: true

  - id: create_clone
    condition: "${{ not done_check.output.orchestration_complete and inputs.isolation == 'clone' and not has_isolation.output.exists }}"
    mcp:
      server: gobby-clones
      tool: create_clone
      arguments:
        branch_name: "${{ 'epic-' + str(get_task_info.output.seq_num) if get_task_info.output.task_type == 'epic' else 'task-' + str(get_task_info.output.seq_num) }}"
        clone_path: "${{ '~/.gobby/clones/epic-' + str(get_task_info.output.seq_num) }}"
        base_branch: "${{ inputs.merge_target or current_branch }}"
        task_id: "${{ inputs.task_id }}"
        use_local: true

  # --- RESOLVE ISOLATION IDs ---
  - id: resolve_isolation_id
    mcp:
      server: gobby-workflows
      tool: pipeline_eval
      arguments:
        data:
          worktree_id: "${{ get_worktree.output.worktree.id if (get_worktree.output and get_worktree.output.worktree) else (create_worktree.output.worktree_id if create_worktree.output else '') }}"
          clone_id: "${{ get_clone.output.clone.id if (get_clone.output and get_clone.output.clone) else (create_clone.output.clone.id if create_clone.output else '') }}"

  # --- DISPATCH DEVS ---
  - id: count_active
    condition: "${{ not done_check.output.orchestration_complete }}"
    mcp:
      server: gobby-workflows
      tool: pipeline_eval
      arguments:
        data:
          active: "${{ len(scan_active_claims.output.tasks) }}"
          available_slots: "${{ inputs.max_concurrent - len(scan_active_claims.output.tasks) if inputs.max_concurrent > len(scan_active_claims.output.tasks) else 0 }}"

  - id: suggest_tasks
    condition: "${{ not done_check.output.orchestration_complete and count_active.output.available_slots > 0 and len(select_ready_unclaimed.output.tasks) > 0 }}"
    mcp:
      server: gobby-tasks
      tool: suggest_next_task
      arguments:
        parent_task_id: "${{ inputs.task_id }}"
        count: "${{ count_active.output.available_slots }}"

  - id: dispatch_devs
    condition: "${{ suggest_tasks.output and len(suggest_tasks.output.suggestions) > 0 }}"
    mcp:
      server: gobby-agents
      tool: dispatch_batch
      arguments:
        suggestions: "${{ suggest_tasks.output.suggestions }}"
        agent: "${{ inputs.developer_agent }}"
        clone_id: "${{ resolve_isolation_id.output.clone_id }}"
        worktree_id: "${{ resolve_isolation_id.output.worktree_id }}"
        provider: "${{ inputs.developer_provider }}"
        model: "${{ inputs.developer_model }}"
        timeout: "${{ inputs.agent_timeout }}"
        parent_session_id: "${{ session_id }}"

  # --- DISPATCH QA (for needs_review tasks) ---
  - id: check_qa_running
    condition: "${{ not done_check.output.orchestration_complete and len(scan_needs_review.output.tasks) > 0 }}"
    mcp:
      server: gobby-agents
      tool: list_running_agents
      arguments:
        parent_session_id: "${{ session_id }}"

  - id: qa_gate
    condition: "${{ check_qa_running.output and len(check_qa_running.output.agents) > 0 }}"
    mcp:
      server: gobby-workflows
      tool: pipeline_eval
      arguments:
        data:
          qa_already_running: "${{ len([a for a in check_qa_running.output.agents if a.get('provider', '') == inputs.qa_provider]) > 0 }}"

  - id: annotate_observed
    condition: "${{ not done_check.output.orchestration_complete and len(scan_needs_review.output.tasks) > 0 and not (qa_gate.output and qa_gate.output.qa_already_running) }}"
    mcp:
      server: gobby-tasks
      tool: update_observed_files
      arguments:
        task_id: "${{ scan_needs_review.output.tasks[0].id }}"
        require_commits: false

  - id: get_qa_task
    condition: "${{ not done_check.output.orchestration_complete and len(scan_needs_review.output.tasks) > 0 and not (qa_gate.output and qa_gate.output.qa_already_running) }}"
    mcp:
      server: gobby-tasks
      tool: get_task
      arguments:
        task_id: "${{ scan_needs_review.output.tasks[0].id }}"
        brief: false

  - id: dispatch_qa
    condition: "${{ not done_check.output.orchestration_complete and len(scan_needs_review.output.tasks) > 0 and not (qa_gate.output and qa_gate.output.qa_already_running) }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        prompt: "${{ 'Review task ' + scan_needs_review.output.tasks[0].ref + ': ' + scan_needs_review.output.tasks[0].title + ('\n\nDescription:\n' + get_qa_task.output.description if get_qa_task.output and get_qa_task.output.get('description') else '') }}"
        agent: "${{ inputs.qa_agent }}"
        task_id: "${{ scan_needs_review.output.tasks[0].id }}"
        clone_id: "${{ resolve_isolation_id.output.clone_id }}"
        worktree_id: "${{ resolve_isolation_id.output.worktree_id }}"
        provider: "${{ inputs.qa_provider }}"
        model: "${{ inputs.qa_model }}"
        timeout: "${{ inputs.agent_timeout }}"
        parent_session_id: "${{ session_id }}"

  # --- MERGE & CLOSE ---
  - id: merge_worktree
    condition: "${{ done_check.output.orchestration_complete and inputs.isolation == 'worktree' and resolve_isolation_id.output.worktree_id }}"
    mcp:
      server: gobby-worktrees
      tool: merge_worktree
      arguments:
        worktree_id: "${{ resolve_isolation_id.output.worktree_id }}"
        target_branch: "${{ inputs.merge_target }}"

  - id: merge_clone
    condition: "${{ done_check.output.orchestration_complete and inputs.isolation == 'clone' and resolve_isolation_id.output.clone_id }}"
    invoke_pipeline:
      name: merge-clone
      arguments:
        clone_id: "${{ resolve_isolation_id.output.clone_id }}"
        target_branch: "${{ inputs.merge_target }}"

  - id: close_epic
    condition: "${{ done_check.output.orchestration_complete and (standalone_check.output.is_standalone or len(scan_merge_ready.output.tasks) == 0) and ((merge_worktree.output and not merge_worktree.output.get('error')) or (merge_clone.output and not merge_clone.output.get('error'))) }}"
    mcp:
      server: gobby-tasks
      tool: close_task
      arguments:
        task_id: "${{ inputs.task_id }}"
        session_id: "${{ session_id }}"
        changes_summary: "Orchestration complete. All child work is closed and the isolation branch has been merged."

  # --- RESULT ---
  - id: tick_result
    mcp:
      server: gobby-workflows
      tool: pipeline_eval
      arguments:
        data:
          tick_complete: true
          orchestration_complete: "${{ done_check.output.orchestration_complete if done_check.output else false }}"
          is_standalone: "${{ standalone_check.output.is_standalone }}"
          developer_queue: "${{ len(scan_developer_queue.output.tasks) if scan_developer_queue.output else 0 }}"
          active_claims: "${{ len(scan_active_claims.output.tasks) if scan_active_claims.output else 0 }}"
          needs_review: "${{ len(scan_needs_review.output.tasks) if scan_needs_review.output else 0 }}"
          merge_ready: "${{ len(scan_merge_ready.output.tasks) if scan_merge_ready.output else 0 }}"
          escalated: "${{ len(scan_escalated.output.tasks) if scan_escalated.output else 0 }}"
          dispatched: "${{ dispatch_devs.output.dispatched if dispatch_devs.output else 0 }}"
