name: nightly-memory-cleanup
type: pipeline
version: "1.0"
description: |
  Nightly memory cleanup pipeline. Audits gobby-memory for stale, duplicate,
  code-derivable, and orphaned entries, then removes them. Designed to run on
  a nightly cron schedule (e.g., "0 3 * * *").

enabled: true

inputs:
  dry_run:
    type: boolean
    default: false
    description: "When true, audit only without deleting"
  max_stale_age_days:
    type: integer
    default: 30
    description: "Memories inactive longer than this are considered stale candidates"
  max_stale_access_count:
    type: integer
    default: 1
    description: "Maximum access_count still considered low-access for stale cleanup"
  stale_confidence_threshold:
    type: number
    default: 0.85
    description: "Minimum stale classifier confidence required before deletion"
  limit_per_category:
    type: integer
    default: 500
    description: "Maximum memories to scan per cleanup category"
  use_stale_classifier:
    type: boolean
    default: true
    description: "Require LLM classification for stale-memory deletion"

outputs:
  total_found: "${{ steps.audit.output.total_found }}"
  total_deleted: "${{ steps.cleanup.output.total_deleted if steps.cleanup.output else 0 }}"
  total_review: "${{ steps.audit.output.total_review }}"
  stale_delete_candidates: "${{ steps.audit.output.stale.delete_candidates }}"
  stale_review: "${{ steps.audit.output.stale.review }}"

steps:
  # --- RE-ENTRANCY GUARD ---
  - id: reentry_check
    mcp:
      server: gobby-workflows
      tool: list_pipeline_executions
      arguments:
        pipeline_name: "nightly-memory-cleanup"
        status: "running"

  - id: reentry_gate
    condition: "${{ len(reentry_check.output.executions) > 1 }}"
    mcp:
      server: gobby-workflows
      tool: fail_pipeline
      arguments:
        message: "Skipped: another nightly-memory-cleanup execution is already running"

  # --- AUDIT PHASE ---
  - id: audit
    mcp:
      server: gobby-memory
      tool: audit_memories
      arguments:
        max_stale_age_days: "${{ inputs.max_stale_age_days }}"
        max_stale_access_count: "${{ inputs.max_stale_access_count }}"
        stale_confidence_threshold: "${{ inputs.stale_confidence_threshold }}"
        limit_per_category: "${{ inputs.limit_per_category }}"
        use_stale_classifier: "${{ inputs.use_stale_classifier }}"

  # --- CLEANUP PHASE ---
  - id: cleanup
    condition: "${{ steps.audit.output.total_found > 0 and not inputs.dry_run }}"
    mcp:
      server: gobby-memory
      tool: cleanup_memories
      arguments:
        dry_run: "${{ inputs.dry_run }}"
        max_stale_age_days: "${{ inputs.max_stale_age_days }}"
        max_stale_access_count: "${{ inputs.max_stale_access_count }}"
        stale_confidence_threshold: "${{ inputs.stale_confidence_threshold }}"
        limit_per_category: "${{ inputs.limit_per_category }}"
        use_stale_classifier: "${{ inputs.use_stale_classifier }}"
