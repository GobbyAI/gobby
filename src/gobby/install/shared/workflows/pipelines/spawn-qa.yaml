name: spawn-qa
type: pipeline
description: |
  Thin dispatch pipeline: spawns a QA reviewer agent for a given task.
  Dispatch automation can invoke this via run_pipeline for tracked dispatch,
  or call spawn_agent directly for untracked dispatch.

version: "1.0"
enabled: true

inputs:
  task_id:
    type: string
    required: true
    description: "Task ID to review"
  provider:
    type: string
    default: "claude"
    description: "LLM provider (claude, gemini, qwen, codex, droid, etc.)"
  model:
    type: string
    default: ""
    description: "Model override (empty = provider default)"
  worktree_id:
    type: string
    default: ""
    description: "Worktree ID for isolation (empty = auto-create)"

steps:
  - id: spawn
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        prompt: "Review task ${{ inputs.task_id }}. Check the implementation, run tests, validate quality, and approve or reject."
        agent: qa-reviewer
        task_id: "${{ inputs.task_id }}"
        provider: "${{ inputs.provider }}"
        model: "${{ inputs.model }}"
        worktree_id: "${{ inputs.worktree_id }}"
        parent_session_id: "${{ session_id }}"
