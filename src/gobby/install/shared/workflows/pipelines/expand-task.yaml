name: expand-task
type: pipeline
version: "2.0"
description: |
  Canonical task-expansion pipeline.

  Flow:
    1. Start a background expansion run
    2. Wait for the run to complete
    3. Inspect the stored run result
    4. Fail immediately when the run failed
    5. Run deterministic validation on the compiled/applied output

  The expansion run itself owns compile/apply state. The task tree is the only
  state written back onto tasks.

inputs:
  task_id:
    type: string
    required: true
    description: "Task ID to expand"
  plan_file:
    type: string
    required: false
    description: "Relative path to a plan file for richer expansion context"
  provider: "claude"
  model: null
  wait_timeout: 600

outputs:
  run_id: "${{ steps.start_run.output.run_id }}"
  status: "${{ steps.wait_run.output.status }}"
  created_task_ids: "${{ steps.get_run.output.run.created_task_ids }}"
  validation: "${{ steps.validate_run.output }}"

steps:
  - id: start_run
    mcp:
      server: gobby-tasks-ops
      tool: start_expansion_run
      arguments:
        task_id: "${{ inputs.task_id }}"
        plan_file: "${{ inputs.plan_file }}"
        provider: "${{ inputs.provider }}"
        model: "${{ inputs.model }}"
        auto_apply: true

  - id: wait_run
    wait:
      completion_id: "${{ steps.start_run.output.run_id }}"
      timeout: "${{ inputs.wait_timeout }}"

  - id: get_run
    mcp:
      server: gobby-tasks-ops
      tool: get_expansion_run
      arguments:
        run_id: "${{ steps.start_run.output.run_id }}"

  - id: fail_run
    condition: "${{ steps.wait_run.output.status != 'completed' }}"
    mcp:
      server: gobby-workflows
      tool: fail_pipeline
      arguments:
        message: "Expansion run failed: ${{ steps.wait_run.output.error or steps.get_run.output.run.error or 'unknown error' }}"

  - id: validate_run
    mcp:
      server: gobby-tasks-ops
      tool: validate_expansion_run
      arguments:
        run_id: "${{ steps.start_run.output.run_id }}"

  - id: fail_validation
    condition: "${{ not steps.validate_run.output.compiled.valid or (steps.validate_run.output.applied and not steps.validate_run.output.applied.valid) }}"
    mcp:
      server: gobby-workflows
      tool: fail_pipeline
      arguments:
        message: "Expansion validation failed: ${{ steps.validate_run.output }}"
