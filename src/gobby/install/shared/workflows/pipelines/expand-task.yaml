name: expand-task
type: pipeline
version: "2.0"
description: |
  Canonical task-expansion pipeline.

  Flow:
    1. Start a background expansion run
    2. Wait for the run to complete
    3. Inspect the stored run result
    4. Fail immediately when the run failed
    5. Run deterministic validation on the compiled/applied output
    6. Run plan coverage (expansion-qa's mechanical gate) for every
       Plan-Coverage Contract run, or whenever run_coverage is set

  The expansion run itself owns compile/apply state. The task tree is the only
  state written back onto tasks. Contract-plan runs also create one task per
  placeholder `kind: deferred` section; the run checkpoint `deferral_task_map`
  names them so the coordinator can write the refs over the plan placeholders.

inputs:
  task_id:
    type: string
    required: true
    description: "Task ID to expand"
  plan_file:
    type: string
    required: false
    description: "Relative path to a plan file for richer expansion context"
  provider: "claude"
  model: null
  wait_timeout: 600
  run_coverage:
    type: boolean
    default: false
    description: "Force plan coverage after validation; contract-plan runs always get it"

outputs:
  run_id: "${{ steps.start_run.output.run_id }}"
  status: "${{ steps.wait_run.output.status }}"
  created_task_ids: "${{ steps.get_run.output.run.created_task_ids }}"
  validation: "${{ steps.validate_run.output }}"
  coverage: "${{ steps.coverage_check.output }}"

steps:
  - id: start_run
    mcp:
      server: gobby-tasks-ops
      tool: start_expansion_run
      arguments:
        task_id: "${{ inputs.task_id }}"
        plan_file: "${{ inputs.plan_file }}"
        provider: "${{ inputs.provider }}"
        model: "${{ inputs.model }}"
        auto_apply: true
        subscribe_caller: false

  - id: wait_run
    wait:
      completion_id: "${{ steps.start_run.output.run_id }}"
      timeout: "${{ inputs.wait_timeout }}"

  - id: get_run
    mcp:
      server: gobby-tasks-ops
      tool: get_expansion_run
      arguments:
        run_id: "${{ steps.start_run.output.run_id }}"

  - id: fail_run
    condition: "${{ steps.wait_run.output.status != 'completed' }}"
    mcp:
      server: gobby-workflows
      tool: fail_pipeline
      arguments:
        message: "Expansion run failed: ${{ steps.wait_run.output.error or steps.get_run.output.run.error or 'unknown error' }}"

  - id: validate_run
    condition: "${{ steps.wait_run.output.status == 'completed' }}"
    mcp:
      server: gobby-tasks-ops
      tool: validate_expansion_run
      arguments:
        run_id: "${{ steps.start_run.output.run_id }}"

  - id: fail_validation
    condition: "${{ not steps.validate_run.output.compiled.valid or (steps.validate_run.output.applied and not steps.validate_run.output.applied.valid) }}"
    mcp:
      server: gobby-workflows
      tool: fail_pipeline
      arguments:
        message: "Expansion validation failed: ${{ steps.validate_run.output }}"

  - id: coverage_check
    condition: "${{ inputs.run_coverage or (steps.wait_run.output.status == 'completed' and steps.get_run.output.run.compiled_spec.contract_plan) }}"
    mcp:
      server: gobby-tasks-ops
      tool: run_expansion_qa_coverage
      arguments:
        run_id: "${{ steps.start_run.output.run_id }}"
