name: research-team
type: pipeline
version: "4.0.1"
description: |
  Research runbook: admits a treeless team for the task and launches a Researcher, a Research
  Reviewer and a Research Team Lead into one 'Research Team - #<task>' tab in the shared checkout.
  The seats work in the main checkout with no branch or worktree, and there is no Dev Team Lead:
  the Researcher sends its candidate to the Research Reviewer, which answers LAND or BOUNCE, and
  the Research Team Lead relays the exchange and reports READY_TO_CLOSE to report_to. Each seat
  runs its own agent definition, and each seat pane takes its definition name
  (docs/contracts/seat-titles.md).
  Approved seats: research-team-lead, researcher, research-reviewer.

  Placement: the researcher opens the Research tab, or splits the seat_pane when one is supplied;
  the research reviewer splits right of the researcher, or of the seat_pane, and otherwise opens
  or splits the Research tab. The research team lead launches last and splits the team's tab. A
  seat relaunched into an existing tab splits that tab by title.
  Connection: the lead launches after its seats and receives their session refs. Each seat then
  gets a connect message naming the lead and its teammate. Until that message, a seat reports to
  report_to.
  Relaunch missing seats, including the lead, with a fresh run that names them in `seats`; a failed
  runbook execution is never resumed. Supply seat_pane to add seats to an existing tab across runs.
  A run connects every seat of the team, launched or already live for the same task, to the team's
  lead, and the lead to every seat, so a partial run reconnects the whole roster.
tags: [runbook]
resume_on_restart: true

inputs:
  workspace:
    type: string
    required: true
    description: "Existing target workspace UUID or ref"
  task:
    type: string
    required: true
    description: "Task the research run is for; its tab takes the task's sequence number"
  seat_pane:
    type: string
    default: null
    description: "Existing pane to split; omit to open the Research tab"
  project_path:
    type: string
    required: true
    description: "Shared project checkout; the treeless team's seats work here, no worktree is created"
  seats:
    type: string
    default: researcher,research-reviewer,research-team-lead
    description: "Comma-separated missing seats: research-team-lead, researcher, research-reviewer"
  report_to:
    type: string
    required: true
    description: "Live session ref of the seat this run reports readiness, verdicts and the final report to, and reports to until the connect message"
  research_team_lead_provider:
    type: string
    default: null
    description: "Seat provider; override to change the default"
  research_team_lead_model:
    type: string
    default: null
    description: "Seat model; override to change the default"
  research_team_lead_reasoning_effort:
    type: string
    default: null
    description: "Seat reasoning effort; override to change the default"
  researcher_provider:
    type: string
    default: null
    description: "Seat provider; override to change the default"
  researcher_model:
    type: string
    default: null
    description: "Seat model; override to change the default"
  researcher_reasoning_effort:
    type: string
    default: null
    description: "Seat reasoning effort; override to change the default"
  research_reviewer_provider:
    type: string
    default: null
    description: "Seat provider; override to change the default"
  research_reviewer_model:
    type: string
    default: null
    description: "Seat model; override to change the default"
  research_reviewer_reasoning_effort:
    type: string
    default: null
    description: "Seat reasoning effort; override to change the default"

steps:
  - id: guard
    mcp:
      server: gobby-agents
      tool: check_runbook_seats
      arguments:
        workspace: "${{ inputs.workspace }}"
        requested: "${{ inputs.seats }}"
        report_to: "${{ inputs.report_to }}"
        require_report_to: true
        skip_live_seats: true
        task: "${{ inputs.task }}"
        tab_title: "Research Team - ${{ inputs.task }}"
        catalogue:
          - name: research-team-lead
            title: Research Team Lead
            agent: research-team-lead
          - name: researcher
            title: Researcher
            agent: researcher
          - name: research-reviewer
            title: Research Reviewer
            agent: research-reviewer

  # The team is treeless: no branch or worktree, its seats work in the main checkout.
  - id: admit
    condition: "${{ len(steps.guard.output.launch) > 0 }}"
    mcp:
      server: gobby-agents
      tool: admit_team
      arguments:
        task: "${{ inputs.task }}"
        tab_title: "${{ steps.guard.output.tab_title }}"
        checkout_mode: none

  - id: researcher
    condition: "${{ 'researcher' in steps.guard.output.launch }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: researcher
        provider: "${{ inputs.researcher_provider }}"
        model: "${{ inputs.researcher_model }}"
        reasoning_effort: "${{ inputs.researcher_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        project_path: "${{ inputs.project_path }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: >-
          You are the researcher seat. Your task is ${{ inputs.task }}. Your current session ref is fresh; follow your installed agent definition for your research duties and authority, except where this run's routing below differs. Report your current session ref and every SRT denial you hit through gobby-agents:send_message(target="session", target_id="${{ inputs.report_to }}"). This run has no Dev Team Lead. Do not launch a DevTeam, another seat or a pipeline. Claim the task with gobby-tasks:claim_task, do the research in the main checkout, and record your implementation step. Your research reviewer names its session to you when it starts; once you have it, send EVENT=CANDIDATE TASK=${{ inputs.task }} TASK_TITLE= RUN= WT= COMMIT= NOTE= to that session and to your team lead, with the commit and the checks you ran. Until the pipeline's connect message names your team lead, send to report_to instead. Wait with gobby-agents:wait_for_coordination(owner_session="${{ inputs.report_to }}", reply=true) until the connect message, then with the team lead as owner. On BOUNCE, fix the findings and send a new CANDIDATE. On LAND, send EVENT=READY_TO_CLOSE TASK=${{ inputs.task }} to your team lead; the lead reports it to report_to, and the Orchestrator closes the task. Use that live session for bootstrap blockers and coordination; the pipeline parent may have ended.
        placement: >-
          ${{ {'split': {'pane': inputs.seat_pane, 'axis': 'right', 'title': 'Researcher'}}
          if inputs.seat_pane
          else {'split': {'workspace': inputs.workspace,
          'tab_title': steps.guard.output.tab_title, 'axis': 'right', 'title': 'Researcher'}}
          if steps.guard.output.get('tab_exists')
          else {'tab': {'workspace': inputs.workspace, 'title': steps.guard.output.tab_title}} }}

  - id: research-reviewer
    condition: "${{ 'research-reviewer' in steps.guard.output.launch }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: research-reviewer
        provider: "${{ inputs.research_reviewer_provider }}"
        model: "${{ inputs.research_reviewer_model }}"
        reasoning_effort: "${{ inputs.research_reviewer_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        project_path: "${{ inputs.project_path }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: >-
          You are the research reviewer seat. Your task is ${{ inputs.task }}. Your current session ref is fresh; follow your installed agent definition for your review duties and authority, except where this run's routing below differs. Report your current session ref and every SRT denial you hit through gobby-agents:send_message(target="session", target_id="${{ inputs.report_to }}"). This run has no Dev Team Lead. ${{ ('Name your session to your researcher seat, session ' + steps['researcher'].output.get('child_session_id') + ', with gobby-agents:send_message(target="session", target_id="' + steps['researcher'].output.get('child_session_id') + '"), so it can send you its candidate.') if 'researcher' in steps.guard.output.launch and steps['researcher'].output.get('child_session_id') else ('Name your session to your researcher seat, session ' + steps.guard.output.get('live')['researcher'] + ', with gobby-agents:send_message(target="session", target_id="' + steps.guard.output.get('live')['researcher'] + '"), so it can send you its candidate.') if steps.guard.output.get('live') and 'researcher' in steps.guard.output.get('live') else 'Your researcher seat is not in this launch; name your session to report_to so it can reach you.' }} Wait with gobby-agents:wait_for_coordination(owner_session="${{ inputs.report_to }}", reply=true) for the researcher's EVENT=CANDIDATE TASK=${{ inputs.task }}. Review that commit against the task's criteria, then send a CANDIDATE_VERDICT with VERDICT=LAND, or VERDICT=BOUNCE with its findings, to the researcher seat and to your team lead. Until the pipeline's connect message names your team lead, send to report_to instead, and wait on report_to. Record your review step. Do not launch other seats or pipelines.
        placement: >-
          ${{ {'split': {'pane': inputs.seat_pane or steps['researcher'].output.get('pane_ref'),
          'axis': 'right', 'title': 'Research Reviewer'}}
          if inputs.seat_pane or ('researcher' in steps.guard.output.launch and 'researcher' in steps and steps['researcher'].output.get('pane_ref'))
          else {'split': {'workspace': inputs.workspace,
          'tab_title': steps.guard.output.tab_title, 'axis': 'right', 'title': 'Research Reviewer'}}
          if steps.guard.output.get('tab_exists')
          else {'tab': {'workspace': inputs.workspace, 'title': steps.guard.output.tab_title}} }}

  # The team lead launches after its seats so the roster it receives is complete. It opens no tab
  # of its own: it splits the team's tab, which the seats above have opened or already hold.
  - id: research-team-lead
    condition: "${{ 'research-team-lead' in steps.guard.output.launch }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: research-team-lead
        provider: "${{ inputs.research_team_lead_provider }}"
        model: "${{ inputs.research_team_lead_model }}"
        reasoning_effort: "${{ inputs.research_team_lead_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        project_path: "${{ inputs.project_path }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: |
          You are the research team lead for task ${{ inputs.task }}.
          ${{ ('Researcher session: ' ~ (steps['researcher'].output.child_session_id if 'researcher' in steps and steps['researcher'].output else steps.guard.output.live.get('researcher')) ~ '.') if ('researcher' in steps.guard.output.launch or 'researcher' in steps.guard.output.live) else '' }}
          ${{ ('Research reviewer session: ' ~ (steps['research-reviewer'].output.child_session_id if 'research-reviewer' in steps and steps['research-reviewer'].output else steps.guard.output.live.get('research-reviewer')) ~ '.') if ('research-reviewer' in steps.guard.output.launch or 'research-reviewer' in steps.guard.output.live) else '' }}
          Stay in the main checkout; write no research and no code. Read project_policy and load your procedure through get_skill_file before work. Deliver the reviewed report to report_to session ${{ inputs.report_to }}. Report your current session ref and every SRT denial you hit through gobby-agents:send_message(target="session", target_id="${{ inputs.report_to }}"). With no assigned work, wait_for_coordination(owner_session="${{ inputs.report_to }}", reply=true). Use that live session for bootstrap blockers and coordination; the pipeline parent may have ended. Do not launch other seats or pipelines.
        placement: >-
          ${{ {'split': {'pane': inputs.seat_pane,
          'axis': 'right', 'title': 'Research Team Lead'}}
          if inputs.seat_pane
          else {'split': {'workspace': inputs.workspace,
          'tab_title': steps.guard.output.tab_title, 'axis': 'right', 'title': 'Research Team Lead'}}
          if steps.guard.output.get('tab_exists') or len(steps.guard.output.launch) > 1
          else {'tab': {'workspace': inputs.workspace, 'title': steps.guard.output.tab_title}} }}

  # Each seat learns its team lead and its teammate in one message. The team is every seat this
  # run launches or finds live for the task, so a seat live from an earlier run gets the same
  # message and a re-run reconnects it. The connect steps run only when the lead is on the team;
  # without a lead, seats keep reporting to report_to.
  - id: connect-researcher
    condition: "${{ ('researcher' in steps.guard.output.launch or 'researcher' in steps.guard.output.live) and ('research-team-lead' in steps.guard.output.launch or 'research-team-lead' in steps.guard.output.live) }}"
    mcp:
      server: gobby-agents
      tool: send_message
      arguments:
        target: session
        target_id: "${{ steps['researcher'].output.child_session_id if 'researcher' in steps and steps['researcher'].output else steps.guard.output.live.get('researcher') }}"
        content: |
          Your team lead for task ${{ inputs.task }} is session ${{ steps['research-team-lead'].output.child_session_id if 'research-team-lead' in steps and steps['research-team-lead'].output else steps.guard.output.live.get('research-team-lead') }}. Send EVENT=CANDIDATE to your reviewer and to it, and EVENT=READY_TO_CLOSE to it. ${{ ('Your research reviewer is session ' ~ (steps['research-reviewer'].output.child_session_id if 'research-reviewer' in steps and steps['research-reviewer'].output else steps.guard.output.live.get('research-reviewer')) ~ '.') if ('research-reviewer' in steps.guard.output.launch or 'research-reviewer' in steps.guard.output.live) else '' }}

  - id: connect-reviewer
    condition: "${{ ('research-reviewer' in steps.guard.output.launch or 'research-reviewer' in steps.guard.output.live) and ('research-team-lead' in steps.guard.output.launch or 'research-team-lead' in steps.guard.output.live) }}"
    mcp:
      server: gobby-agents
      tool: send_message
      arguments:
        target: session
        target_id: "${{ steps['research-reviewer'].output.child_session_id if 'research-reviewer' in steps and steps['research-reviewer'].output else steps.guard.output.live.get('research-reviewer') }}"
        content: |
          Your team lead for task ${{ inputs.task }} is session ${{ steps['research-team-lead'].output.child_session_id if 'research-team-lead' in steps and steps['research-team-lead'].output else steps.guard.output.live.get('research-team-lead') }}. Send each CANDIDATE_VERDICT to it and to the researcher. ${{ ('Your researcher is session ' ~ (steps['researcher'].output.child_session_id if 'researcher' in steps and steps['researcher'].output else steps.guard.output.live.get('researcher')) ~ '.') if ('researcher' in steps.guard.output.launch or 'researcher' in steps.guard.output.live) else '' }}

  # A lead that was already live gets every seat of the team, launched or live, since its launch
  # prompt cannot name them.
  - id: connect-lead
    condition: "${{ 'research-team-lead' in steps.guard.output.live and len(steps.guard.output.launch) > 0 }}"
    mcp:
      server: gobby-agents
      tool: send_message
      arguments:
        target: session
        target_id: "${{ steps.guard.output.live.get('research-team-lead') }}"
        content: |
          Seats on task ${{ inputs.task }} connected to you: ${{ ('Researcher session: ' ~ (steps['researcher'].output.child_session_id if 'researcher' in steps and steps['researcher'].output else steps.guard.output.live.get('researcher')) ~ '.') if ('researcher' in steps.guard.output.launch or 'researcher' in steps.guard.output.live) else '' }} ${{ ('Research reviewer session: ' ~ (steps['research-reviewer'].output.child_session_id if 'research-reviewer' in steps and steps['research-reviewer'].output else steps.guard.output.live.get('research-reviewer')) ~ '.') if ('research-reviewer' in steps.guard.output.launch or 'research-reviewer' in steps.guard.output.live) else '' }} Relay their exchange and report READY_TO_CLOSE and verdicts to report_to session ${{ inputs.report_to }}.

  # Tiles the tab the launched seats joined, by the tab_ref their placement returned. A supplied
  # seat_pane can sit in a tab with any title, so the tab is named by ref, not by title. A refused
  # layout is recorded and the run goes on.
  - id: arrange
    condition: "${{ len(steps.guard.output.launch) > 0 }}"
    mcp:
      server: gobby-workspaces
      tool: rebalance_tab
      on_refused: record
      arguments:
        workspace: >-
          ${{ none if (steps.researcher.output.get('tab_ref') if 'researcher' in steps.guard.output.launch else none)
          or (steps['research-reviewer'].output.get('tab_ref') if 'research-reviewer' in steps.guard.output.launch else none)
          or (steps['research-team-lead'].output.get('tab_ref') if 'research-team-lead' in steps.guard.output.launch else none)
          else inputs.workspace }}
        tab: >-
          ${{ (steps.researcher.output.get('tab_ref') if 'researcher' in steps.guard.output.launch else none)
          or (steps['research-reviewer'].output.get('tab_ref') if 'research-reviewer' in steps.guard.output.launch else none)
          or (steps['research-team-lead'].output.get('tab_ref') if 'research-team-lead' in steps.guard.output.launch else none)
          or steps.guard.output.tab_title }}
        # A seat's null pane_ref (its pane is gone) is reported as skipped, not tiled.
        seats: "${{ [{'name': s, 'pane': steps[s].output.pane_ref} for s in steps.guard.output.launch] }}"
        # Tiled ratios do not depend on the viewport height; rows only has to fit the tiers.
        rows: 100
        layout: tiled
