name: status-report-delivery
type: pipeline
version: "1.0.0"
description: |
  Delivers the operator status report to the operator channel at the project-policy cadence with
  no agent turn. The compose step builds the report from hub evidence, git and live agent runs,
  and writes it under the project's reports directory. The deliver step sends that file as an
  attachment. A failed compose step ends the run before anything is sent. Every step is an MCP call.
tags: [status, report]
resume_on_restart: false
# Lets this run's daemon-owned steps send operator attachments, limited to the reports directory.
operator_messaging: true

inputs:
  channel:
    type: string
    description: "Operator channel name, supplied by the status cron from project_policy.operator_channel"
  integration_branch:
    type: string
    description: "Branch that landed commits must reach, supplied from project_policy.integration_branch"
  operator_timezone:
    type: string
    description: "IANA timezone for report times, supplied from project_policy.operator_timezone"
  window_seconds:
    type: integer
    default: 1800
    description: "Report window in seconds, supplied from project_policy.report_cadence_seconds"

steps:
  - id: compose
    mcp:
      server: gobby-communications
      tool: compose_status_report
      arguments:
        integration_branch: "${{ inputs.integration_branch }}"
        operator_timezone: "${{ inputs.operator_timezone }}"
        window_seconds: "${{ inputs.window_seconds }}"

  - id: deliver
    mcp:
      server: gobby-communications
      tool: send_operator_attachment
      arguments:
        channel: "${{ inputs.channel }}"
        file_path: "${{ steps.compose.output.file_path }}"
        caption: "Status report"
