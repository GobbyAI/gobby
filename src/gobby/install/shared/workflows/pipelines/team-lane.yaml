name: team-lane
type: pipeline
version: "1.0"
description: |
  Relaunch selected seats into an existing workspace and worktree, as one lane team.
  Run with seats and lane; infer the lane manager, workspace, pane, unique idle worktree and
  tab size (from the gclient window showing the workspace).
  Workspace names, worktree branch names and tab sizes are accepted as explicit overrides.
  Approved seats: developer, code-reviewer, researcher and lane-manager.
  Launches fresh sessions; rerunning duplicates live seats.
tags: [runbook]
resume_on_restart: true

inputs:
  lane_columns:
    type: integer
    default: null
    description: "Tab content width override in cells; otherwise the gclient window showing the workspace"
  lane_rows:
    type: integer
    default: null
    description: "Tab content height override in cells; otherwise the gclient window showing the workspace"
  lane:
    type: string
    required: true
    description: "Lane for the tab and seat titles; the lane manager, pane and worktree are inferred from it"
  workspace:
    type: string
    default: null
    description: "Workspace name, UUID or ref override; otherwise infer from the lane"
  lane_pane:
    type: string
    default: null
    description: "Pane UUID or ref override; otherwise infer from the lane tab or its manager"
  worktree:
    type: string
    default: null
    description: "Worktree branch name or UUID override; otherwise require one idle lane worktree"
  seats:
    type: string
    default: developer
    description: "Comma-separated missing seat kinds: developer, code-reviewer, researcher, lane-manager"
  report_to:
    type: string
    default: null
    description: "Live report target override; otherwise the lane manager recorded for the lane"
  developer_provider:
    type: string
    default: codex
  developer_model:
    type: string
    default: gpt-6.1-sol
  developer_reasoning_effort:
    type: string
    default: medium
  reviewer_provider:
    type: string
    default: claude
  reviewer_model:
    type: string
    default: claude-opus-5-5
  reviewer_reasoning_effort:
    type: string
    default: xhigh
  researcher_provider:
    type: string
    default: codex
  researcher_model:
    type: string
    default: gpt-6.1-sol
  researcher_reasoning_effort:
    type: string
    default: medium
  manager_provider:
    type: string
    default: claude
  manager_model:
    type: string
    default: claude-sonnet-5-5
  manager_reasoning_effort:
    type: string
    default: medium

steps:
  - id: guard
    mcp:
      server: gobby-agents
      tool: check_runbook_seats
      arguments:
        lane: "${{ inputs.lane }}"
        workspace: "${{ inputs.workspace }}"
        lane_pane: "${{ inputs.lane_pane }}"
        worktree: "${{ inputs.worktree }}"
        lane_columns: "${{ inputs.lane_columns }}"
        lane_rows: "${{ inputs.lane_rows }}"
        requested: "${{ inputs.seats }}"
        report_to: "${{ inputs.report_to }}"
        require_report_to: true
        catalogue:
          - name: developer
            title: "${{ 'Lane ' + inputs.lane + ' developer' }}"
            agent: developer
          - name: code-reviewer
            title: "${{ 'Lane ' + inputs.lane + ' code reviewer' }}"
            agent: code-reviewer
          - name: researcher
            title: "${{ 'Lane ' + inputs.lane + ' researcher' }}"
            agent: researcher
          - name: lane-manager
            title: "${{ 'Lane ' + inputs.lane + ' manager' }}"
            agent: lane-manager

  - id: developer
    condition: "${{ 'developer' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: developer
        lane: "${{ inputs.lane }}"
        provider: "${{ inputs.developer_provider }}"
        model: "${{ inputs.developer_model }}"
        reasoning_effort: "${{ inputs.developer_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ steps.guard.output.worktree }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are the developer seat for lane ${{ inputs.lane }}. Your current session ref is fresh; follow your installed agent definition for your standing duties and authority. Report your current session ref and every SRT denial you hit through gobby-agents:send_message(target=\"session\", target_id=\"${{ steps.guard.output.report_to }}\"). With no assigned work, wait_for_coordination(owner_session=\"${{ steps.guard.output.report_to }}\", reply=true). Use that live session for bootstrap blockers and coordination; the pipeline parent may have ended. Do not launch other seats or pipelines."
        placement: >-
          ${{ {'split': {'pane': steps.guard.output.lane_pane, 'axis': 'balanced',
          'columns': steps.guard.output.lane_columns, 'rows': steps.guard.output.lane_rows,
          'title': 'Lane ' + inputs.lane + ' developer'}} }}

  - id: code-reviewer
    condition: "${{ 'code-reviewer' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: code-reviewer
        lane: "${{ inputs.lane }}"
        provider: "${{ inputs.reviewer_provider }}"
        model: "${{ inputs.reviewer_model }}"
        reasoning_effort: "${{ inputs.reviewer_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ steps.guard.output.worktree }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are the code reviewer seat for lane ${{ inputs.lane }}. Your current session ref is fresh; follow your installed agent definition for your standing duties and authority. Report your current session ref and every SRT denial you hit through gobby-agents:send_message(target=\"session\", target_id=\"${{ steps.guard.output.report_to }}\"). With no assigned work, wait_for_coordination(owner_session=\"${{ steps.guard.output.report_to }}\", reply=true). Use that live session for bootstrap blockers and coordination; the pipeline parent may have ended. Do not launch other seats or pipelines."
        placement: >-
          ${{ {'split': {'pane': steps.guard.output.lane_pane, 'axis': 'balanced',
          'columns': steps.guard.output.lane_columns, 'rows': steps.guard.output.lane_rows,
          'title': 'Lane ' + inputs.lane + ' code reviewer'}} }}

  - id: researcher
    condition: "${{ 'researcher' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: researcher
        lane: "${{ inputs.lane }}"
        provider: "${{ inputs.researcher_provider }}"
        model: "${{ inputs.researcher_model }}"
        reasoning_effort: "${{ inputs.researcher_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ steps.guard.output.worktree }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are the researcher seat for lane ${{ inputs.lane }}. Your current session ref is fresh; follow your installed agent definition for your standing duties and authority. Report your current session ref and every SRT denial you hit through gobby-agents:send_message(target=\"session\", target_id=\"${{ steps.guard.output.report_to }}\"). With no assigned work, wait_for_coordination(owner_session=\"${{ steps.guard.output.report_to }}\", reply=true). Use that live session for bootstrap blockers and coordination; the pipeline parent may have ended. Do not launch other seats or pipelines."
        placement: >-
          ${{ {'split': {'pane': steps.guard.output.lane_pane, 'axis': 'balanced',
          'columns': steps.guard.output.lane_columns, 'rows': steps.guard.output.lane_rows,
          'title': 'Lane ' + inputs.lane + ' researcher'}} }}

  - id: lane-manager
    condition: "${{ 'lane-manager' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: lane-manager
        lane: "${{ inputs.lane }}"
        provider: "${{ inputs.manager_provider }}"
        model: "${{ inputs.manager_model }}"
        reasoning_effort: "${{ inputs.manager_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ steps.guard.output.worktree }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are the lane manager seat for lane ${{ inputs.lane }}. Your current session ref is fresh; follow your installed agent definition for your standing duties and authority. Report your current session ref and every SRT denial you hit through gobby-agents:send_message(target=\"session\", target_id=\"${{ steps.guard.output.report_to }}\"). With no assigned work, wait_for_coordination(owner_session=\"${{ steps.guard.output.report_to }}\", reply=true). Use that live session for bootstrap blockers and coordination; the pipeline parent may have ended. Do not launch other seats or pipelines."
        placement: >-
          ${{ {'split': {'pane': steps.guard.output.lane_pane, 'axis': 'balanced',
          'columns': steps.guard.output.lane_columns, 'rows': steps.guard.output.lane_rows,
          'title': 'Lane ' + inputs.lane + ' manager'}} }}
