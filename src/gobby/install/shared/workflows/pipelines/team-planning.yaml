name: team-planning
type: pipeline
version: "1.0"
description: |
  Planning runbook: launches the plan writer and plan adversary seats into one lane tab
  in the shared checkout. Each seat runs its own agent definition.
  Approved seats: plan-writer, plan-adversary.

  Placement: the plan writer opens the lane tab, or splits the lane_pane when one is
  supplied; the plan adversary splits right of the plan writer. A seat requested without the
  plan writer splits from lane_pane when one is supplied and otherwise opens its own tab.
  Relaunch missing seats with a fresh run that names them in `seats`; a failed runbook
  execution is never resumed. Supply lane_pane to add seats to an existing tab across runs.
tags: [runbook]
resume_on_restart: true

inputs:
  lane:
    type: string
    required: true
    description: "Lane for the tab and seat titles"
  workspace:
    type: string
    required: true
    description: "Existing target workspace UUID or ref"
  lane_pane:
    type: string
    default: null
    description: "Existing lane pane to split; omit to open one lane tab"
  project_path:
    type: string
    required: true
    description: "Shared project checkout; no worktree is created"
  seats:
    type: string
    default: plan-writer
    description: "Comma-separated missing seats: plan-writer, plan-adversary"
  report_to:
    type: string
    required: true
    description: "Live operator session ref for readiness, blockers and unassigned waits"
  plan_writer_provider:
    type: string
    default: claude
    description: "Seat provider; override to change the default"
  plan_writer_model:
    type: string
    default: claude-opus-5-5
    description: "Seat model; override to change the default"
  plan_writer_reasoning_effort:
    type: string
    default: xhigh
    description: "Seat reasoning effort; override to change the default"
  plan_adversary_provider:
    type: string
    default: codex
    description: "Seat provider; override to change the default"
  plan_adversary_model:
    type: string
    default: gpt-6.1-sol
    description: "Seat model; override to change the default"
  plan_adversary_reasoning_effort:
    type: string
    default: medium
    description: "Seat reasoning effort; override to change the default"

steps:
  - id: guard
    mcp:
      server: gobby-agents
      tool: check_runbook_seats
      arguments:
        workspace: "${{ inputs.workspace }}"
        requested: "${{ inputs.seats }}"
        report_to: "${{ inputs.report_to }}"
        require_report_to: true
        catalogue:
          - name: plan-writer
            title: "${{ 'Lane ' + inputs.lane + ' plan writer' }}"
            agent: plan-writer
          - name: plan-adversary
            title: "${{ 'Lane ' + inputs.lane + ' plan adversary' }}"
            agent: plan-adversary

  - id: plan-writer
    condition: "${{ 'plan-writer' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: plan-writer
        initial_variables:
          _definition_title: "${{ 'Lane ' + inputs.lane + ' plan writer' }}"
        provider: "${{ inputs.plan_writer_provider }}"
        model: "${{ inputs.plan_writer_model }}"
        reasoning_effort: "${{ inputs.plan_writer_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        project_path: "${{ inputs.project_path }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are the plan writer seat. Your current session ref is fresh; follow your installed agent definition for your standing duties and authority. Report your current session ref and every SRT denial you hit through gobby-agents:send_message(target=\"session\", target_id=\"${{ inputs.report_to }}\"). With no assigned work, wait_for_coordination(owner_session=\"${{ inputs.report_to }}\", reply=true). Use that live session for bootstrap blockers and coordination; the pipeline parent may have ended. Do not launch other seats or pipelines."
        placement: >-
          ${{ {'split': {'pane': inputs.lane_pane,
          'axis': 'right', 'title': 'Lane ' + inputs.lane + ' plan writer'}}
          if inputs.lane_pane
          else {'tab': {'workspace': inputs.workspace, 'title': 'Lane ' + inputs.lane}} }}

  - id: plan-adversary
    condition: "${{ 'plan-adversary' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: plan-adversary
        initial_variables:
          _definition_title: "${{ 'Lane ' + inputs.lane + ' plan adversary' }}"
        provider: "${{ inputs.plan_adversary_provider }}"
        model: "${{ inputs.plan_adversary_model }}"
        reasoning_effort: "${{ inputs.plan_adversary_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        project_path: "${{ inputs.project_path }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are the plan adversary seat. Your current session ref is fresh; follow your installed agent definition for your standing duties and authority. Report your current session ref and every SRT denial you hit through gobby-agents:send_message(target=\"session\", target_id=\"${{ inputs.report_to }}\"). With no assigned work, wait_for_coordination(owner_session=\"${{ inputs.report_to }}\", reply=true). Use that live session for bootstrap blockers and coordination; the pipeline parent may have ended. Do not launch other seats or pipelines."
        placement: >-
          ${{ {'split': {'pane': inputs.lane_pane or (steps['plan-writer'].output.pane_ref),
          'axis': 'right', 'title': 'Lane ' + inputs.lane + ' plan adversary'}}
          if inputs.lane_pane or 'plan-writer' in inputs.seats.split(',')
          else {'tab': {'workspace': inputs.workspace, 'title': 'Lane ' + inputs.lane}} }}
