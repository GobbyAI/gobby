tags: [roles, seat, enforcement, gobby, default]

# Activation and spawn both set `_agent_type`, so seat identity matches it alone,
# with the catalogue inline as in inject-seat-common. A persona overlay
# (`apply_persona`) never matches a seat rule.
rules:
  seat-no-spawn:
    description: "Seats, the Plan Writer included, do not spawn agents; recovery seats may resume one"
    event: before_tool
    enabled: true
    priority: 10
    # Only a resume re-mints an expired seat capability, and these three seats
    # already recover stalled sessions, so they may resume an existing session.
    when: >
      variables.get('_agent_type') in ['assistant', 'orchestrator', 'lane-manager',
        'developer', 'code-reviewer', 'researcher', 'archivist', 'log-monitor',
        'plan-writer', 'plan-enhancer', 'plan-adversary', 'inbox-manager',
        'merge-manager']
      and not (
        variables.get('_agent_type') in ['assistant', 'orchestrator', 'lane-manager']
        and tool_input.get('server_name') == 'gobby-agents'
        and tool_input.get('tool_name') == 'spawn_agent'
        and ((tool_input.get('arguments') or tool_input) or {}).get('resume_session_id')
      )
    effects:
      - type: block
        mcp_tools: ["gobby-agents:spawn_agent", "gobby-agents:dispatch_batch"]
        reason: >-
          Seats do not spawn agents. The automated task-close reviewer is the only
          spawn path, and the Assistant, Orchestrator and Lane Managers may only
          resume an existing session with spawn_agent resume_session_id; send other
          work to the Orchestrator.

  # Josh (2026-10-09): "Orchestrator and Assistant can run pipelines, though
  # Orchestrator should be primary on that, and Assistant should only do it if
  # Orchestrator is down." The primary and backup split is a norm in the seat
  # guidance and definitions; these rules let both seats launch.
  seat-no-pipeline-launch:
    description: "Seats other than the Orchestrator and Assistant do not launch pipelines through MCP"
    event: before_tool
    enabled: true
    priority: 10
    # `block` mcp_tools matching is exact or `server:*`, and exposed pipelines are
    # named `pipeline:<name>`, so the condition alone selects the call.
    when: >
      variables.get('_agent_type') in ['assistant', 'orchestrator', 'lane-manager',
        'developer', 'code-reviewer', 'researcher', 'archivist', 'log-monitor',
        'plan-writer', 'plan-enhancer', 'plan-adversary', 'inbox-manager',
        'merge-manager']
      and variables.get('_agent_type') not in ['assistant', 'orchestrator']
      and tool_input.get('server_name') == 'gobby-workflows'
      and (tool_input.get('tool_name') == 'run_pipeline'
        or str(tool_input.get('tool_name') or '').startswith('pipeline:'))
    effects:
      - type: block
        reason: >-
          Only the Orchestrator launches pipelines, and the Assistant only while the
          Orchestrator is down: a pipeline's steps run outside seat rules. Runbooks
          launch from Josh's surfaces or the Orchestrator; send the request to the
          Orchestrator.

  # One block effect per rule, so the shell's pipeline and spawn launches are
  # separate rules: the pipeline half exempts the Orchestrator and Assistant.
  seat-no-pipeline-cli:
    description: "Seats other than the Orchestrator and Assistant do not launch pipelines through the gobby CLI"
    event: before_tool
    enabled: true
    priority: 10
    when: >
      variables.get('_agent_type') in ['assistant', 'orchestrator', 'lane-manager',
        'developer', 'code-reviewer', 'researcher', 'archivist', 'log-monitor',
        'plan-writer', 'plan-enhancer', 'plan-adversary', 'inbox-manager',
        'merge-manager']
      and variables.get('_agent_type') not in ['assistant', 'orchestrator']
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|(`\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?(uv\\s+run\\s+)?gobby\\s+(?:--config(?:=|\\s+)\\S+\\s+)?pipelines\\s+run\\b"
        reason: >-
          Only the Orchestrator launches pipelines, and the Assistant only while the
          Orchestrator is down: a pipeline's steps run outside seat rules. Runbooks
          launch from Josh's surfaces or the Orchestrator; send the request to the
          Orchestrator.

  seat-no-launch-cli:
    description: "Seats, the Orchestrator and Assistant included, do not spawn agents through the gobby CLI"
    event: before_tool
    enabled: true
    priority: 10
    when: >
      variables.get('_agent_type') in ['assistant', 'orchestrator', 'lane-manager',
        'developer', 'code-reviewer', 'researcher', 'archivist', 'log-monitor',
        'plan-writer', 'plan-enhancer', 'plan-adversary', 'inbox-manager',
        'merge-manager']
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|(`\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?(uv\\s+run\\s+)?gobby\\s+(?:--config(?:=|\\s+)\\S+\\s+)?agents\\s+spawn\\b"
        reason: >-
          Seats do not spawn agents from the shell. The automated task-close
          reviewer is the only spawn path; send the request to the Orchestrator.

  # Josh (2026-10-09): "All agents except assistant and orchestrator need a rule
  # preventing new project creation". Root sessions fall back to `_agent_type`
  # 'default' and stay open. A spawned session is blocked whatever its type, the
  # task-close reviewer and definition-less spawns included; the Assistant and
  # Orchestrator pass even when a runbook spawned them. Surfaces: the proxy's
  # init_project tool, `gobby init`, `gobby install --no-interactive` (it
  # initializes a git root with no project), and any shell request naming the
  # /api/projects/init route, which stays open for Josh's gclient and web flows.
  # A grep, rg or gcode search that only names the route passes.
  seat-no-project-create:
    description: "Only the Assistant, the Orchestrator and people's own sessions create projects"
    event: before_tool
    enabled: true
    priority: 10
    when: >
      variables.get('_agent_type') not in ['assistant', 'orchestrator']
      and (variables.get('is_spawned_agent')
        or (variables.get('_agent_type') or 'default') != 'default')
    effects:
      - type: block
        tools: [Bash]
        mcp_tools: ["gobby:init_project"]
        command_pattern: "(^|(?<=[;&|(`\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?(uv\\s+run\\s+)?gobby\\s+(?:--config(?:=|\\s+)\\S+\\s+)?(?:init\\b|install\\b[^;&|\\n]*--no-interactive\\b)|^(?!\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:[^\\s;&|]*/)?(?:grep|rg|gcode)\\b).*/api/projects/init\\b"
        reason: >-
          Agents do not create or register Gobby projects: project creation needs
          Josh's go through the Orchestrator. Send the request to the Orchestrator.
