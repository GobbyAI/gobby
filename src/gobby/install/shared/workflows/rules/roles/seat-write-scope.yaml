version: "2.1.1"
tags: [roles, enforcement, gobby]

# Writes with no resolvable target path fail closed: both helpers return False
# for an empty path set.
rules:
  reviewer-write-scope:
    description: Keep independent review read-only while permitting workspace notes and audits.
    event: before_tool
    enabled: true
    priority: 15
    when: >-
      (event.data.get('canonical_tool_kind') == 'write'
       or event.data.get('canonical_repo_mutation')
       or event.data.get('canonical_git_mutation')
       or event.data.get('canonical_formatter_mutation')
       or event.data.get('canonical_unresolved_execution'))
      and not write_paths_within(event.data, tool_input, agent_workspace_write_dirs(variables))
    effects:
      - type: block
        reason: >-
          Independent review permits repository reads and validation. Put notes in
          your session workspace and send implementation findings to the author.
          Integrate approved work through the managed landing tool.

  submitted-candidate-write-scope:
    description: "Keep a submitted candidate frozen while allowing reads and audits"
    event: before_tool
    enabled: true
    priority: 15
    when: >
      variables.get('current_step') == 'submit'
      and (
        event.data.get('canonical_tool_kind') == 'write'
        or event.data.get('canonical_repo_mutation')
        or event.data.get('canonical_git_mutation')
        or event.data.get('canonical_formatter_mutation')
        or event.data.get('canonical_unresolved_execution')
      )
    effects:
      - type: block
        reason: >-
          In submit, run reads and the required audits. Edits, formatting and Git
          mutations wait until the review returns you to implementation. Report
          a needed change to your Dev Team Lead. Run commands directly when a
          package runner's shell-command mode cannot be classified.

  research-artifact-write-scope:
    description: "Restrict writes to research artifacts and the session workspace"
    event: before_tool
    enabled: true
    priority: 15
    when: >
      event.data.get('canonical_tool_kind') == 'write'
      and not write_paths_within(event.data, tool_input, ['.gobby/plans/research/'])
      and not write_paths_within(event.data, tool_input, agent_workspace_write_dirs(variables))
    effects:
      - type: block
        reason: >-
          The Researcher writes only under `<project>/.gobby/plans/research/` or its
          agent workspace folder (named in your Agent Workspace section). Name the target
          with a literal path inside one of them. Source code remains read-only.

  documentation-write-scope:
    description: "Restrict writes to docs/ and the session workspace"
    event: before_tool
    enabled: true
    priority: 15
    when: >
      event.data.get('canonical_tool_kind') == 'write'
      and not write_paths_within(event.data, tool_input, ['docs/'])
      and not write_paths_within(event.data, tool_input, agent_workspace_write_dirs(variables))
    effects:
      - type: block
        reason: >-
          The Assistant writes only under `docs/` or its agent workspace folder (named
          in your Agent Workspace section). Name the target with a literal path inside
          one of them.

  digest-write-scope:
    description: "Restrict writes to dated reports and the session workspace"
    event: before_tool
    enabled: true
    priority: 15
    when: >
      event.data.get('canonical_tool_kind') == 'write'
      and not (
        write_paths_match(event.data, tool_input,
          './\\.gobby/reports/gobby-digest-[0-9]{4}-[0-9]{2}-[0-9]{2}\\.md(?:\\.tmp\\.[0-9]{1,10}\\.[0-9a-f]{12})?')
      )
      and not write_paths_within(event.data, tool_input, agent_workspace_write_dirs(variables))
    effects:
      - type: block
        reason: >-
          The Archivist writes only the dated digest at
          `<project>/.gobby/reports/gobby-digest-YYYY-MM-DD.md`, or its `.tmp.<pid>.<12 lowercase hex>`
          staging sibling, or files in its agent workspace folder (named in your Agent
          Workspace section). Name the target with a literal absolute path.

  team-lead-write-scope:
    description: "Keep the Dev Team Lead's file writes in its session and epic workspace folders"
    event: before_tool
    enabled: true
    priority: 15
    when: >
      event.data.get('canonical_tool_kind') == 'write'
      and not write_paths_within(event.data, tool_input, agent_workspace_write_dirs(variables))
    effects:
      - type: block
        reason: >-
          The Dev Team Lead writes only under its agent workspace folders (session and
          epic, named in your Agent Workspace section). Implementation belongs to the
          developers' task worktrees; the main checkout stays read-only to you. Name the
          target with a literal path inside one of them.
