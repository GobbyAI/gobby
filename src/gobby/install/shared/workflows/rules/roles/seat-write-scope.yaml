tags: [roles, seat, enforcement, gobby, default]

# Writes with no resolvable target path fail closed: both helpers return False
# for an empty path set.
rules:
  assistant-write-scope:
    description: "The Assistant writes only under docs/"
    event: before_tool
    enabled: true
    priority: 15
    when: >
      variables.get('_agent_type') == 'assistant'
      and event.data.get('canonical_tool_kind') == 'write'
      and not write_paths_within(event.data, tool_input, ['docs/'])
    effects:
      - type: block
        reason: >-
          The Assistant writes only under `docs/`. Name the target with a literal
          path inside it.

  archivist-write-scope:
    description: "The Archivist writes only dated workspace reports"
    event: before_tool
    enabled: true
    priority: 15
    when: >
      variables.get('_agent_type') == 'archivist'
      and event.data.get('canonical_tool_kind') == 'write'
      and not (
        write_paths_match(event.data, tool_input,
          './\\.gobby/reports/gobby-digest-[0-9]{4}-[0-9]{2}-[0-9]{2}\\.md(?:\\.tmp\\.[0-9]{1,10}\\.[0-9a-f]{12})?')
      )
    effects:
      - type: block
        reason: >-
          The Archivist writes only the dated digest at
          `<project>/.gobby/reports/gobby-digest-YYYY-MM-DD.md`, or its `.tmp.<pid>.<12 lowercase hex>`
          staging sibling. Name it with a literal absolute path.
