tags: [roles, seat, enforcement, gobby, default]

# Agent workspace scope (addendum P9.2). A write under the workspace root goes only to the
# caller's own session folder, epic folder or assigned registered task worktree.
# Git metadata and bare-seat `.gobby` config stay protected.
# A read there is allowed in those folders, in the project README, and, for a persistent seat,
# in the eligible predecessor folders of its own definition.
rules:
  agent-workspace-write-scope:
    description: "Agent workspace writes stay in the seat's folders and assigned task worktree"
    event: before_tool
    enabled: true
    priority: 15
    when: >
      agent_workspace_write_violation(event.data, tool_input, variables,
        event.metadata.get('_platform_session_id'))
    effects:
      - type: block
        reason: >-
          Agent workspace writes go only to this session's folder under the agent
          workspace, its epic folder, or its assigned registered task worktree.
          Name the target with a literal path inside one of them. Git metadata and
          `.gobby` config outside a repository checkout are not writable there.

  agent-workspace-read-scope:
    description: "Agent workspace reads stay within the seat's folders, assigned task worktree, project README and eligible predecessors; interpreter-inline code is not path-parsed"
    event: before_tool
    enabled: true
    priority: 15
    when: >
      agent_workspace_read_violation(event.data, tool_input, variables,
        event.metadata.get('_platform_session_id'))
    effects:
      - type: block
        reason: >-
          This agent workspace folder is outside what this seat may read. A seat reads
          its own session folder, its epic folder, its assigned registered task worktree
          and the project README; a persistent
          seat also reads the earlier session folders of its own definition. Read the
          path inside one of those.
