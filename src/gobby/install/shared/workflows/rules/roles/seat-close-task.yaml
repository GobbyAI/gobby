tags: [roles, seat, enforcement, gobby, default]

# Josh, 2026-10-27 (#25226): only the Dev Manager and the Orchestrator close tasks. Every
# other seat, spawned agent and persona overlay is refused; the operator's own unseated
# terminal stays open. A preview only computes the gates, so every seat may send one.
rules:
  seat-no-task-close:
    description: "Only the Dev Manager and the Orchestrator close tasks; every other seat and persona overlay is refused, and close_task preview stays open"
    event: before_tool
    enabled: true
    priority: 10
    when: >
      variables.get('_agent_type') not in ['dev-manager', 'orchestrator']
      and (variables.get('is_spawned_agent') or variables.get('_persona_name')
        or (variables.get('_agent_type') or 'default') != 'default')
      and not ((tool_input.get('arguments') or tool_input) or {}).get('preview')
    effects:
      - type: block
        mcp_tools: ["gobby-tasks:close_task"]
        reason: >-
          Only the Dev Manager and the Orchestrator close tasks. Your seat hands its work
          to the Dev Manager: send a CANDIDATE with the linked commit and the tests you
          ran, or a DISPOSITION for a task with no work. Check gates first with
          close_task(preview=true).
