version: "3.0.0"
tags: [roles, runbook, enforcement, gobby]

# The native question dialog freezes a seat's pane until someone answers it, and no
# seat can answer another seat's dialog. Every definition selects this rule through
# tag:default; only the default definition excludes it.
rules:
  seat-no-ask-user-question:
    description: "Definitions ask through send_message instead of the native question dialog"
    event: before_tool
    enabled: true
    priority: 10
    effects:
      - type: block
        tools: [AskUserQuestion]
        reason: >-
          Use `gobby-agents:send_message` to send your question to the seat you report to
          (your report_to session, Triage or your Dev Team Lead), then continue other work or
          wait for the reply. The question dialog freezes your pane until someone answers it.
