tags: [roles, seat, enforcement, gobby, seat-policy]

# The Assistant's attached AskUserQuestion prompts reach Telegram as buttons.
# Other seats route decisions through the Assistant. Unseated sessions keep the tool.
rules:
  seat-no-ask-user-question:
    description: "Selected definitions route questions through send_message"
    event: before_tool
    enabled: true
    priority: 10
    effects:
      - type: block
        tools: [AskUserQuestion]
        reason: >-
          Use `gobby-agents:send_message` to send your question to your Dev Manager
          or the Orchestrator. A decision for the operator goes through the Assistant, as
          Telegram buttons or plain text at the end of its turn.
