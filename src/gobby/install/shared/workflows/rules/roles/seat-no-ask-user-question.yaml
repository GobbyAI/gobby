tags: [roles, seat, enforcement, gobby, default]

# The Assistant's attached AskUserQuestion prompts reach Telegram as buttons.
# Other seats route decisions through the Assistant. Unseated sessions keep the tool.
rules:
  seat-no-ask-user-question:
    description: "Seats except the Assistant ask questions through send_message"
    event: before_tool
    enabled: true
    priority: 10
    when: >
      variables.get('_agent_type') in ['orchestrator', 'lane-manager',
        'developer', 'code-reviewer', 'researcher', 'archivist', 'log-monitor', 'metrics-monitor',
        'plan-writer', 'plan-enhancer', 'plan-adversary', 'inbox-manager',
        'release-manager', 'reporter', 'security-reviewer', 'debugger',
        'design-reviewer', 'recovery-steward', 'consolidator']
    effects:
      - type: block
        tools: [AskUserQuestion]
        reason: >-
          Use `gobby-agents:send_message` to send your question to your Lane Manager
          or the Orchestrator. A decision for the operator goes through the Assistant, as
          Telegram buttons or plain text at the end of its turn.
