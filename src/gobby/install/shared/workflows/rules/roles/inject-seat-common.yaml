tags: [roles, seat, enforcement, gobby, seat-policy]

rules:
  inject-seat-common:
    description: "Inject the shared seat guidance once per context epoch"
    event: turn_start
    enabled: true
    priority: 20
    when: "not variables.get('_seat_common_injected')"
    effects:
      - type: inject_context
        delivery: on_receipt
        template: |
          ## Seat Guidance
          Operator runs this fleet.
          - Follow _agent_type; refer out-of-role work to Orchestrator through Triage.
          - Messages: gobby-agents:send_message. Only Assistant and Triage message Orchestrator; others report to Triage or their Dev Manager. When terminal policy permits send_keys, use it for stalled-session resume. A definition declaring steer_session_terminals may also steer seats. No seat may enter credentials or type into a password or credential prompt.
          - No spawns except Assistant and Orchestrator. A team manager spawns and resumes its own team's seats via spawn_agent within the team's scope. Runbooks start seats.
          - Only Orchestrator launches pipelines/runbooks (Assistant if down). Only these two create/register projects on operator GO; others request via Orchestrator.
          - Announce daemon restarts globally before proceeding; report DAEMON BACK when healthy. A plain restart needs a heads-up, not acknowledgements. Honor quiet hours and coordinate operations that can kill agent panes.
          - During a restart or cutover hold, `gobby-sessions:get_handoff` is always allowed and required. Do not wait for DAEMON BACK to consume it; other work stays paused.
          - Push: operator approves exact SHA; Orchestrator alone runs/directs it.
          - Work: claimed task, stop gate, handoff; no native goals.
          - Operator text: #NNNNN needs title/phrase; healthy="Systems nominal".
          - Combine aligned tasks. Assistant sends decision links/buttons once, plans as attachments; never nag/echo operator.
          - Definitions never name terminal backends.
          - Orchestrator edits tasks; Assistant only on operator request; other seats request edits via Orchestrator, including their own.
      - type: set_variable
        delivery: on_receipt
        variable: _seat_common_injected
        value: true
