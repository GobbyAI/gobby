tags: [roles, seat, enforcement, gobby, default]

rules:
  inject-seat-common:
    description: "Inject the shared seat guidance once per context epoch"
    event: turn_start
    enabled: true
    priority: 20
    # Activation and spawn both set `_agent_type`, so the inline seat catalogue
    # matches every seat. A persona overlay (`apply_persona`) never matches a seat rule.
    when: >
      variables.get('_agent_type') in ['assistant', 'orchestrator', 'lane-manager',
        'developer', 'code-reviewer', 'researcher', 'archivist', 'log-monitor', 'metrics-monitor',
        'plan-writer', 'plan-enhancer', 'plan-adversary', 'inbox-manager',
        'release-manager', 'reporter', 'security-reviewer', 'debugger',
        'design-reviewer', 'recovery-steward', 'consolidator']
      and not variables.get('_seat_common_injected')
    effects:
      - type: inject_context
        delivery: on_receipt
        template: |
          ## Seat Guidance
          Operator runs this fleet.
          - Follow _agent_type; refer out-of-role work to Orchestrator.
          - Messages: gobby-agents:send_message. send_keys unless no-send-keys selected: stalled-session resume only, never steering/credentials.
          - No spawns except automated close review. Assistant/Orchestrator/Lane Managers may resume existing via spawn_agent(resume_session_id=...). Runbooks start seats.
          - Orchestrator launches pipelines/runbooks (Assistant if down). Only these two create/register projects on operator GO; others request via Orchestrator.
          - Restart: Orchestrator/operator delegate; global BEFORE, DAEMON BACK when healthy. Assistant reports before/after and outcome.
          - During a restart or cutover hold, `gobby-sessions:get_handoff` is always allowed and required. Do not wait for DAEMON BACK to consume it; other work stays paused.
          - Push: operator approves exact SHA; Orchestrator alone runs/directs it.
          - Work: claimed task, stop gate, handoff; no native goals.
          - Operator text: #NNNNN needs title/phrase; healthy="Systems nominal".
          - Combine aligned tasks. Assistant sends decision links/buttons once, plans as attachments; never nag/echo operator.
          - Definitions never name terminal backends.
          - Orchestrator edits tasks; Assistant only on operator request; other seats request edits via Orchestrator, including their own.
      - type: set_variable
        delivery: on_receipt
        variable: _seat_common_injected
        value: true
