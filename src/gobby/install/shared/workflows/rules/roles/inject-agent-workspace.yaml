tags: [roles, runbook, enforcement, gobby]
version: "3.1.0"

# The seat's workspace folder (addendum 9.3). Injected once per context epoch, with the
# predecessor-read note for persistent seats only. The reset re-arms it after clear or compact,
# the same epochs that re-arm the shared seat guidance.
rules:
  inject-agent-workspace:
    agent_scope: ["*", "!default"]
    description: "Inject the seat's agent workspace folder once per context epoch"
    event: turn_start
    enabled: true
    priority: 21
    when: >
      variables.get('_agent_workspace_dir')
      and not variables.get('_agent_workspace_injected')
    effects:
      - type: inject_context
        delivery: on_receipt
        template: |
          ## Agent Workspace
          Your writable workspace folder: {{ variables.get('_agent_workspace_dir') }}
          Write literal paths only, under that folder or your run's assigned registered task worktree. The worktree grant does not include its containing seat folder.
          The workspace folder holds working artifacts only. A handoff holds continuation state and points to files. Anything another seat needs goes in a message, a send_attachment or a task; durable outcomes go to tasks, memory, git or plans.
          {% if variables.get('_agent_workspace_epic_dir') %}
          Your epic folder, shared by your team: {{ variables.get('_agent_workspace_epic_dir') }}
          Write literal paths only, under that folder, one file per topic. Append to an existing file with Edit.
          {% endif %}
          {% if variables.get('_agent_workspace_persistent') %}
          This definition has one stable current folder. An independent owner takes over only after the previous owner ends; the previous owner's files move into the sibling history/session-<previous-session-ref> folder. Your own resume keeps current unchanged.
          The sibling history folder is readable only to recover from a crash or learn from mistakes in prior sessions. Write only in current; preserve archived files. An interrupted rotation is recovered by activation. Report an ownership refusal or archive collision rather than renaming or deleting either copy.
          {% endif %}
      - type: set_variable
        delivery: on_receipt
        variable: _agent_workspace_injected
        value: true

  reset-agent-workspace-on-context-loss:
    agent_scope: ["*", "!default"]
    description: "Re-arm the agent workspace folder after clear or compact"
    event: session_start
    enabled: true
    # Same epochs and priority as reset-seat-common-on-context-loss.
    priority: 8
    when: "event.data.get('source') in ['clear', 'compact'] or (event.data.get('source') == 'resume' and variables.get('pending_context_reset'))"
    effects:
      - type: set_variable
        variable: _agent_workspace_injected
        value: false
