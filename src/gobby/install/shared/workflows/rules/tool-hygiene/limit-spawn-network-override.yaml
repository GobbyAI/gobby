tags: [tool-hygiene, enforcement, gobby, default]

rules:
  limit-spawn-network-override:
    description: "Block an explicit spawn network profile from a caller without override authority"
    event: before_tool
    enabled: true
    priority: 10
    # The tool guard comes first so an evaluation error, which fails closed,
    # can only refuse a spawn that names a network profile.
    when: >
      tool_input.get('server_name') == 'gobby-agents'
      and tool_input.get('tool_name') == 'spawn_agent'
      and tool_input.get('network') is not None
      and not network_override_allowed(event.metadata.get('_platform_session_id'))
    effects:
      - type: block
        mcp_tools: ["gobby-agents:spawn_agent"]
        reason: >-
          Choosing a spawn's network profile requires the override_spawn_network
          capability or the operator terminal. A spawned caller's authority comes
          from its own agent run; a parent_session_id argument grants none. Omit network
          to spawn with the profile the agent definition sets.
