tags: [tool-hygiene, enforcement, python, testing, gobby, default]

rules:
  require-pytest-guard-env:
    description: >-
      Require the guard_tests env prefix (GOBBY_TEST_PROTECT=1 and a test
      DATABASE_URL) on agent pytest runs in the gobby repo. Scoped to the
      gobby project by UUID; inert everywhere else.
    event: before_tool
    enabled: true
    priority: 40
    when: "event.project_id == 'd45545c5-ded5-4335-b115-0245752edacf'"
    effect:
      type: block
      tools: [Bash]
      # Match pytest only in command position (shared segment-anchored idiom)
      # so prose mentions in commit messages or echoes don't trip it; env-var
      # prefixes still count as invocations.
      command_pattern: "(^|(?<=[;&|\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?(?:uv\\s+run\\s+|python3?\\s+-m\\s+)?pytest\\b"
      command_not_pattern: "(?s)(?=.*GOBBY_TEST_PROTECT=1)(?=.*DATABASE_URL=)"
      reason: >-
        Run pytest through the project's guard prefix (verification.custom.guard_tests
        in .gobby/project.json):
        DATABASE_URL="${DATABASE_URL:-postgresql://gobby_test:gobby_test@127.0.0.1:60892/gobby_test}"
        GOBBY_TEST_PROTECT=1 uv run pytest <targets>.
        Without GOBBY_TEST_PROTECT=1, DB-backed tests skip silently and read as
        passing; with it but no test DATABASE_URL, they fail loudly. The prefix
        makes both explicit.
