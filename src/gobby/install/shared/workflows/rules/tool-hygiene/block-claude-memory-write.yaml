tags: [tool-hygiene, enforcement, memory, gobby, default]

rules:
  block-claude-memory-write:
    description: "Block writes to Claude Code file-based memory — use gobby-memory MCP"
    event: before_tool
    enabled: true
    priority: 10
    when: >-
      event.data.get('canonical_tool_kind') == 'write'
      and touches_claude_memory_path(event.data, tool_input)
    effect:
      type: block
      tools: [Write, Edit, Bash]
      reason: |
        Use gobby-memory — your memories live there with full read/search/write
        access: search_memories(query), list_memories(), get_memory(id),
        create_memory(...).
