tags: [tool-hygiene, enforcement, python, gobby, default]

rules:
  require-uv:
    description: "Require uv for Python package management"
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('require_uv')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|]))\\s*(?:sudo\\s+)?(?:pip3?\\b|python(?:\\d+(?:\\.\\d+)?)?\\s+-m\\s+pip\\b)"
        reason: "Use `uv pip …` or `uv run python -m pip …` — uv manages this project's Python environment."
