tags: [tool-hygiene, enforcement, python, gobby, default]

rules:
  require-uv:
    description: "Block bare python/pip; require uv"
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('require_uv')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|]))\\s*(?:sudo\\s+)?(?:pip3?\\b|python(?:3(?:\\.\\d+)?)?\\b)"
        reason: "Bare python/pip is not permitted in this repo. Use uv instead."
