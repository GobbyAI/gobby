version: "1.4.1"
tags: [gobby, default, tool-hygiene]

# Operator ruling, 2026-11-10: direct database writes are allowed for the seats whose
# definition grants write_database_directly; every other seat is refused direct
# database access through CLI tools. The command matcher unwraps uv run, env
# assignments and shell wrappers before these patterns run. A PostgreSQL client
# session cannot be told read-only from its command line, so the client CLIs are
# refused whole; daemon reads go through query_readonly under its own policy.
# Regex matching is defense in depth: a Python file run by path, and a heredoc
# piped from a data sink such as cat into python, are not inspected.
rules:
  direct-database-client-authority:
    description: Refuse PostgreSQL client CLIs without write_database_directly
    event: before_tool
    enabled: true
    mandatory: true
    priority: 5
    when: &db_gate >
      not (operator_session(event.metadata.get('_platform_session_id'))
      or session_has_capability(
        event.metadata.get('_platform_session_id'), 'write_database_directly'))
    effects:
      - type: block
        tools: [Bash]
        mask_quoted: true
        # Launch wrappers (caffeinate, arch, script) may carry their own options and
        # operands before the client. Container launchers have their own rule below.
        command_pattern: '(^|(?<=[;&|(`\n]))\s*(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*(?:sudo\s+|command\s+|exec\s+|nohup\s+|time\s+|do\s+|then\s+|else\s+|env\s+(?:-\S+\s+|[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*)*(?:(?:[^\s;&|]*/)?(?:caffeinate|arch|script)\b[^;&|\n]*\s)?(?:[^\s;&|]*/)?(?:psql|pgcli|pgbench|pg_restore|createdb|dropdb|createuser|dropuser|vacuumdb|reindexdb|clusterdb)(?=\s|$|[;&|)])'
        reason: &db_reason >-
          Direct database access through CLI tools requires a definition that grants
          write_database_directly, or the operator's terminal. Use the governed MCP
          tools, or send the exact change you need to your report_to session through
          gobby-agents:send_message.

  container-database-client-authority:
    description: Refuse PostgreSQL clients run through a container launcher without write_database_directly
    event: before_tool
    enabled: true
    mandatory: true
    priority: 5
    when: *db_gate
    effects:
      - type: block
        tools: [Bash]
        # A docker or podman command in command position whose subcommand is exec or
        # run (after global options, a `container` or `compose` object and its
        # options) is refused when the rest of that pipeline stage names a client as a word, an
        # option value (--entrypoint=psql), a path, or quoted inner shell
        # (sh -c 'psql ...'). Quoted text stays visible here because the client runs
        # inside the container; other commands that merely mention docker are not
        # in command position.
        command_pattern: '(?:^|(?<=[;&|(`\n]))\s*(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*(?:sudo\s+|command\s+|exec\s+|nohup\s+|time\s+|do\s+|then\s+|else\s+|env\s+(?:-\S+\s+|[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*)*(?:[^\s;&|]*/)?(?:docker|podman)(?:-compose)?(?:\s+--?[\w-]+(?:=\S+|\s+(?!(?:exec|run|container|compose)\b)[^\s|;&-]\S*)?)*\s+(?:(?:container|compose)(?:\s+--?[\w-]+(?:=\S+|\s+(?!(?:exec|run)\b)[^\s|;&-]\S*)?)*\s+)?(?:exec|run)\b[^|\n]*?(?:[\s=''"/])(?:psql|pgcli|pgbench|pg_restore|createdb|dropdb|createuser|dropuser|vacuumdb|reindexdb|clusterdb)(?=[\s''";&|)]|$)'
        reason: *db_reason

  inline-database-driver-authority:
    description: Refuse inline Python database drivers without write_database_directly
    event: before_tool
    enabled: true
    mandatory: true
    priority: 5
    when: *db_gate
    effects:
      - type: block
        tools: [Bash]
        # The pattern selects only a Python command that runs inline code: a `-c`
        # body or a heredoc it consumes. The exemption then reads the executed text
        # (the matcher's unblanked command, heredoc bodies included) and passes the
        # call unless that code imports a driver, statically or by name. Driver names
        # in other commands' arguments are never selected. A command that pairs inline
        # Python with a separate segment mentioning a driver import reads as one text.
        command_pattern: '(?:^|(?<=[;&|(`\n]))\s*(?:[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*(?:sudo\s+|command\s+|exec\s+|nohup\s+|time\s+|do\s+|then\s+|else\s+|env\s+(?:-\S+\s+|[A-Za-z_][A-Za-z0-9_]*=\S*\s+)*)*(?:(?:[^\s;&|]*/)?uv\s+run\s+(?:-\S+\s+)*)?(?:[^\s;&|]*/)?python(?:3(?:\.\d+)?)?(?=\s|$)[^\n]*?(?:\s-[A-Za-z]*c(?=[\s''"]|$)|<<)'
        # Import syntax is bounded to one statement (backslash continuations
        # included): a driver module (psycopg*, asyncpg*) must be named by
        # `import a[ as b], ...`, as the module of `from ... import`, or as the first
        # a string literal anywhere in the argument list of a by-name import, up to
        # its first closing parenthesis (keywords, nested parens, continuations). Driver
        # words elsewhere in the code pass. The executed code is also refused when a
        # string starts with a client name (os.system('psql ...'),
        # subprocess.run(['psql', ...])), since the client rule cannot see quoted text.
        command_not_pattern: '^(?![\s\S]*(?:\bimport(?:[ \t]|\\\n)+(?:[\w.]+(?:(?:[ \t]|\\\n)+as(?:[ \t]|\\\n)+\w+)?(?:[ \t]|\\\n)*,(?:[ \t]|\\\n)*)*(?:psycopg|asyncpg)|\bfrom(?:[ \t]|\\\n)+(?:psycopg|asyncpg)|\b(?:__import__|import_module)\s*\([^)]*?[''"](?:psycopg|asyncpg)|[''"](?:[^''"\s]*/)?(?:psql|pgcli|pgbench|pg_restore|createdb|dropdb|createuser|dropuser|vacuumdb|reindexdb|clusterdb)(?=[\s''"])))'
        reason: *db_reason
