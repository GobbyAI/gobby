version: "1.1.0"
tags: [gobby, default, tool-hygiene]

rules:
  agent-activation-authority:
    description: Require a declared capability to change an active agent definition or persona
    event: before_tool
    enabled: true
    mandatory: true
    priority: 5
    when: >
      event.data.get('mcp_server') == 'gobby-agents'
      and event.data.get('mcp_tool') in ['apply_agent_definition', 'apply_persona', 'cold_start_admin']
      and not (
        operator_session(event.metadata.get('_platform_session_id'))
        or session_has_capability(
          event.metadata.get('_platform_session_id'), 'activate_agent_definitions'))
    effects:
      - type: block
        mcp_tools:
          - gobby-agents:apply_agent_definition
          - gobby-agents:apply_persona
          - gobby-agents:cold_start_admin
        reason: >-
          apply_agent_definition, apply_persona and cold_start_admin require the
          activate_agent_definitions capability or the operator's terminal.
          Ask an authorized default session to change the definition or persona.
