tags: [send-keys, gobby]

# Terminal control is opt-in per agent definition: a definition that must not
# type into or read another session's terminal selects this rule with
# "name:no-send-keys" in workflows.rule_selectors.include. It carries no
# default tag, so a definition that omits the selector keeps both tools.
#
# Unresolved definitions use the baseline tags and therefore never select this
# opt-in rule. Every definition that selects it receives the same restriction.
rules:
  no-send-keys:
    description: "Block send_keys and capture_output for agents whose definition selects this rule"
    event: before_tool
    enabled: true
    priority: 10
    effects:
      - type: block
        mcp_tools: ["gobby-sessions:send_keys", "gobby-sessions:capture_output"]
        reason: >-
          Your agent definition does not grant terminal control, so send_keys and
          capture_output are unavailable. Use gobby-agents:send_message for
          cross-session communication.
