version: "1.0.0"
tags: [send-keys, gobby, default]

# send_keys is withheld from every caller except the operator's own unspawned
# terminal and a definition that grants the send_keys capability. The tool guard
# comes first, so an evaluation error, which fails closed, refuses the call. The
# target's composer and foreground checks run in the send_keys handler.
# capture_output stays governed by block-cross-project-send-keys alone.
rules:
  no-send-keys:
    description: "Block send_keys for callers other than the operator terminal and definitions granting the send_keys capability"
    event: before_tool
    enabled: true
    priority: 10
    when: >
      tool_input.get('server_name') == 'gobby-sessions'
      and tool_input.get('tool_name') == 'send_keys'
      and not (
        operator_session(event.metadata.get('_platform_session_id'))
        or session_has_capability(event.metadata.get('_platform_session_id'), 'send_keys'))
    effects:
      - type: block
        mcp_tools: ["gobby-sessions:send_keys"]
        reason: >-
          send_keys is reserved for the operator's terminal and definitions granting the
          send_keys capability. Use gobby-agents:send_message for cross-session communication.
