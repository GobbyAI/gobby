tags: [restraint, gobby, default]

rules:
  opt-out-restraint:
    description: "Allow exact user prompts to disable restraint for the session"
    event: turn_start
    enabled: true
    priority: 19
    when: >
      ((event.data.get('prompt') or event.data.get('user_prompt') or '').strip().lower())
      == 'stop restraint'
    effects:
      - type: set_variable
        variable: restraint_disabled
        value: true

  require-restraint-skill:
    description: "Block first code write/edit until restraint is loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('restraint')
      and not variables.get('restraint_disabled')
      and event.data.get('canonical_tool_kind') == 'write'
      and event.data.get('canonical_file_path', '').endswith(('.py', '.pyi', '.ts', '.tsx', '.js', '.jsx', '.rs', '.go', '.java', '.kt', '.swift', '.rb', '.php', '.c', '.h', '.cpp', '.hpp', '.cs', '.ex', '.exs', '.dart', '.css', '.sql', '.sh'))
    effects:
      - type: block
        reason: '{{ skill_fetch_directive("restraint") }}'

  remind-restraint-on-turn-start:
    description: "Reinforce restraint once per context epoch and every 5 turns"
    event: turn_start
    enabled: true
    priority: 23
    # turns_since_compact resets to 0 on compact, so a stored marker above the
    # current counter means a new context epoch began — re-remind once, then
    # every 5 turns within the epoch.
    when: >
      skill_loaded('restraint') and not variables.get('restraint_disabled')
      and (not variables.get('restraint_reminder_turn')
      or (variables.get('turns_since_compact') or 0)
      < (variables.get('restraint_reminder_turn') or 0)
      or (variables.get('turns_since_compact') or 0)
      - (variables.get('restraint_reminder_turn') or 0) >= 5)
    effects:
      - type: inject_context
        template: "Restraint reminder ({{ restraint_level }}): least mechanism that fully solves the problem; ladder before new code."
      - type: set_variable
        variable: restraint_reminder_turn
        value: "variables.get('turns_since_compact') or 0"
