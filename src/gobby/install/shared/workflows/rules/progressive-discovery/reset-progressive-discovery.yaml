tags: [progressive-discovery, enforcement, mcp, gobby, default]

rules:
  reset-progressive-discovery:
    description: "Clear schema leases on context loss"
    event: session_start
    enabled: true
    priority: 80
    when: "event.data.get('source') in ['clear', 'compact'] or (event.data.get('source') == 'resume' and variables.get('pending_context_reset'))"
    effects:
      - type: set_variable
        variable: unlocked_tools
        value: []
