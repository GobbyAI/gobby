tags: [progressive-discovery, enforcement, mcp, gobby, default]

rules:
  require-current-context-schema-before-call:
    description: "Block call_tool until the current context has seen this tool's schema"
    event: before_tool
    enabled: true
    priority: 22
    when: "event.data.get('tool_name') in ('call_tool', 'mcp__gobby__call_tool') and variables.get('enforce_tool_schema_check') and not is_discovery_tool(tool_input.get('tool_name')) and not is_operator_tool(tool_input.get('tool_name')) and not is_argumentless_proxy_tool(tool_input) and not is_tool_unlocked(tool_input) and source != 'pipeline'"
    effects:
      - type: block
        reason: >-
          Run {% if schema_lease_key(tool_input) %}get_tool_schema(server_name='{{ tool_input.get('server_name') }}', tool_name='{{ tool_input.get('tool_name') }}') first.
          The lease remains valid until context is cleared or compacted.{% else %}call_tool again with server_name and tool_name as top-level parameters beside arguments.
          The blocked payload has no complete target route, so no schema lease can match it.{% endif %}
