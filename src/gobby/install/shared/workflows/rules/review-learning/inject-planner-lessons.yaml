tags: [review-learning, plan-review, gobby, default]

rules:
  inject-planner-lessons:
    description: "Inject fixer-induced-defect lessons for planners"
    event: turn_start
    enabled: true
    priority: 24
    group: review-learning
    agent_scope: [planner]
    when: "True"
    effect:
      type: mcp_call
      server: gobby-review-learning
      tool: recall_review_lessons_by_class
      arguments:
        lesson_domain: plan
        lesson_types: [fixer-induced-defect]
        limit: 3
      background: false
      inject_result: true
