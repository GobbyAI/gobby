tags: [review-learning, gobby, default]

rules:
  inject-review-lessons-for-touched-files:
    description: "Inject compact confirmed review lessons before touching matching files"
    event: before_tool
    enabled: true
    priority: 24
    group: review-learning
    when: >
      event.data.get('canonical_file_paths')
      and (
        event.data.get('canonical_repo_mutation')
        or (
          event.data.get('canonical_tool_kind') == 'read'
          and event.data.get('canonical_code_navigation_broad')
        )
      )
    effects:
      - type: mcp_call
        server: gobby-review-learning
        tool: recall_review_lessons_for_files
        arguments:
          file_paths_json: "{{ event.data.get('canonical_file_paths', []) | tojson }}"
          session_id: "{{ event.metadata.get('_platform_session_id') or event.session_id }}"
          limit: 3
        background: false
        inject_result: true
