tags: [review-learning, code-review, gobby, default]

rules:
  inject-qa-reviewer-lessons:
    description: "Inject QA-miss lessons for QA reviewers"
    event: turn_start
    enabled: true
    priority: 24
    group: review-learning
    agent_scope: [qa-reviewer]
    effects:
      - type: mcp_call
        server: gobby-review-learning
        tool: recall_review_lessons_by_class
        arguments:
          lesson_domain: code
          lesson_types: [qa-miss]
          limit: 3
        background: false
        inject_result: true
