tags: [plan-review-lessons-policy]

rules:
  inject-plan-reviewer-lessons:
    description: "Inject reviewer-miss lessons for selected plan reviewers"
    event: turn_start
    enabled: true
    priority: 24
    group: review-learning
    when: >-
      not variables.get('handoff_pull_pending')
    effect:
      type: mcp_call
      server: gobby-review-learning
      tool: recall_review_lessons_by_class
      arguments:
        lesson_domain: plan
        lesson_types: [reviewer-miss]
        limit: 3
      background: false
      inject_result: true
