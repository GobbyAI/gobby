tags: [worker-safety, enforcement, default, gobby]

rules:
  no-remote-exec:
    description: "Block executing fetched output while allowing proven data captures."
    event: before_tool
    enabled: true
    priority: 40
    when: "remote_fetch_execution(tool_input.get('command', ''))"
    effects:
      - type: block
        tools: [Bash]
        # The parser condition owns execution and per-capture data exemptions.
        # A whole-command regex exemption could hide an executable sibling.
        command_pattern: "(?s)."
        reason: "Executing fetched output as code is never allowed."
