tags: [worker-safety, enforcement, default, gobby]

rules:
  no-remote-exec:
    description: "Block piping remote scripts to shell."
    event: before_tool
    enabled: true
    priority: 40
    effects:
      - type: block
        tools: [Bash]
        # Fetch output may be captured as data. Match substitutions only when
        # their owner executes the output or opens it as shell source.
        command_pattern: "(^|(?<=[;&|(`\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|exec\\s+|env\\s+|do\\s+|then\\s+|else\\s+)*(?:(?:[^\\s;&|]*/)?(curl|wget)\\s+.*\\|\\s*(ba)?sh|[\\\" ]*\\$\\(\\s*(curl|wget)\\b|(?:[^\\s;&|]*/)?(?:sh|bash|zsh|dash|ksh|eval|source|\\.)\\s+[^;\\n]*?(?:\\$\\(|<\\()\\s*(curl|wget)\\b)"
        reason: "Piping remote scripts to shell is never allowed."
