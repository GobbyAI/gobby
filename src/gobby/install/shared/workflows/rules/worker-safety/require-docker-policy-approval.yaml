tags: [worker-safety, enforcement, default, gobby]

rules:
  set-docker-policy-approval-for-turn:
    description: "Accept an exact interactive user approval for Docker policy edits this turn."
    event: turn_start
    enabled: true
    priority: 8
    effects:
      - type: set_variable
        variable: docker_policy_user_approved_this_turn
        value: >-
          not variables.get('is_spawned_agent')
          and ((event.data.get('prompt') or event.data.get('user_prompt') or '').strip().lower())
          == '/approve-docker-policy'

  require-docker-policy-approval:
    description: "Block Docker and Compose policy edits without explicit user approval."
    event: before_tool
    enabled: true
    priority: 15
    when: >-
      not variables.get('docker_policy_user_approved_this_turn')
      and event.data.get('canonical_tool_kind') == 'write'
      and touches_docker_policy_path(event.data, tool_input)
    effects:
      - type: block
        reason: >-
          Docker and Compose policy edits require explicit user approval. Explain the exact
          proposed change and ask the user to reply with `/approve-docker-policy`. Never add or
          simulate that approval prompt yourself. Approval applies to one interactive user turn;
          spawned agents remain blocked.
