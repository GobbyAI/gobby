tags: [worker-safety, enforcement, gobby]

rules:
  block-git-worktree-mutations:
    description: "Block unmanaged Git worktree lifecycle mutations for spawned agents."
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?git(?:\\s+(?:-C\\s+\\S+|-c\\s+\\S+|--git-dir(?:=|\\s+)\\S+|--work-tree(?:=|\\s+)\\S+|--namespace(?:=|\\s+)\\S+|--exec-path(?:=|\\s+)\\S+|--no-pager|--paginate|-p|--bare|--literal-pathspecs|--no-optional-locks))*\\s+worktree\\s+(?:add|remove|move|prune|repair)(?=\\s|$|&&|;|\\|)"
        reason: "Use gobby-worktrees.create_worktree to create a managed worktree. Use gobby-worktrees.delete_worktree with worktree_path to remove or clean up an existing worktree."
