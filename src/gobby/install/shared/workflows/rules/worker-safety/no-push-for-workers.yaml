tags: [worker-safety, enforcement, agents, gobby]

rules:
  no-push-for-workers:
    description: "Block git push for developer and review agents"
    event: before_tool
    enabled: true
    agent_scope: [developer, qa-reviewer, doc-reviewer]
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?git(?:\\s+(?:-C\\s+\\S+|-c\\s+\\S+|--git-dir(?:=|\\s+)\\S+|--work-tree(?:=|\\s+)\\S+|--namespace(?:=|\\s+)\\S+|--exec-path(?:=|\\s+)\\S+|--no-pager|--paginate|-p|--bare|--literal-pathspecs|--no-optional-locks))*\\s+push\\b"
        reason: "Push is blocked. Remote publication is handled only by explicit PR delivery."
