version: "1.0.0"
tags: [worker-safety, enforcement, gobby]

rules:
  credential-file-protection:
    description: "Protect local credential files in every non-default session and its native subagents."
    event: before_tool
    enabled: true
    mandatory: true
    priority: 5
    # Native subagent hooks retain their authenticated parent's session binding.
    # Provider-supplied persona names never grant an exemption.
    agent_scope: ["*", "!default"]
    when: "credential_file_access(event.data, tool_input)"
    effects:
      - type: block
        reason: >-
          credential-file-protection: Credential files are off-limits to agents.
          Use ordinary Gobby CLI or MCP operations that access credentials internally.
