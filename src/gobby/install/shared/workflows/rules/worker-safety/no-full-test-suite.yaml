tags: [worker-safety, enforcement, gobby]

rules:
  no-full-pytest-suite:
    description: "Block spawned agents from running the full pytest suite."
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|(`\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?(?:uv\\s+run\\s+|python3?\\s+-m\\s+)?pytest\\b"
        command_not_pattern: "\\bpytest\\s+\\S+\\.py\\b|\\bpytest\\s+\\S*tests/\\w+[/\\s]|\\bpytest\\s.*-k\\s"
        reason: >-
          Run targeted tests: `GOBBY_TEST_PROTECT=1 pytest tests/path/test_file.py`
          or `GOBBY_TEST_PROTECT=1 pytest -k 'pattern'`
          — full-suite runs are reserved for the user.

  no-full-vitest-suite:
    description: "Block spawned agents from running the full vitest suite."
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|(`\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?(?:npx\\s+|pnpm\\s+(?:exec\\s+)?|yarn\\s+|npm\\s+exec\\s+)?(vitest|jest)\\b"
        command_not_pattern: "\\b(vitest|jest)\\b[^;&|]*(?:__tests__/\\S+\\.(ts|js|tsx|jsx)|\\S+\\.(test|spec)\\.(ts|js|tsx|jsx))\\b|\\b(vitest|jest)\\b[^;&|]*(-t|--testNamePattern|--testPathPattern)(\\s+|=)"
        reason: >-
          Run targeted tests: name specific test files or use `-t` /
          `--testNamePattern` filters.

  no-full-cargo-test:
    description: "Block spawned agents from running the full Cargo test suite."
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|(`\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?cargo\\s+(?:\\+\\S+\\s+)?test\\b"
        command_not_pattern: "\\bcargo\\s+(?:\\+\\S+\\s+)?test\\b[^;&|]*(?:\\s(?:-p|--package|--test|--bin)\\s+\\S+|\\s(?!-)[^\\s;&|]+)"
        reason: >-
          Run targeted tests: `cargo test <name>` or `cargo test -p <package>`.

  no-full-go-test:
    description: "Block spawned agents from running the full go test suite."
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|(`\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?go\\s+test\\s+\\./\\.\\.\\.(?=\\s|$|[;&|])"
        reason: >-
          Run targeted tests: `go test ./pkg/...`.
