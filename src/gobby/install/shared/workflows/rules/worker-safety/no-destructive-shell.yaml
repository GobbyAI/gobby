tags: [worker-safety, enforcement, gobby]

rules:
  no-recursive-rm:
    description: "Block recursive delete for spawned agents."
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?rm\\s+(-\\w*r|--recursive)"
        reason: "Recursive delete is not allowed. Do not recursively delete files or directories."

  no-secure-delete:
    description: "Block secure/permanent delete for spawned agents."
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?(shred|srm)\\b"
        reason: "Secure/permanent delete is not allowed."

  no-truncate:
    description: "Block file truncation for spawned agents."
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(?:^|&&|;|\\|\\|)\\s*truncate\\b|(?:^|&&|;|\\|\\|)\\s*>\\s*['\"]?/(?!dev/null)"
        reason: "File truncation is not allowed."

  no-force-kill:
    description: "Block force-killing processes for spawned agents."
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?kill\\s+(-\\w*9|-KILL)|(^|(?<=[;&|\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?killall\\b"
        reason: "Force-killing processes is not allowed. Use graceful signals."

  no-recursive-permissions:
    description: "Block recursive permission changes for spawned agents."
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?(chmod|chown)\\s+.*-R\\b"
        reason: "Recursive permission changes are not allowed."

  no-dd:
    description: "Block low-level disk operations for spawned agents."
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?dd\\s+"
        reason: "Low-level disk operations are not allowed."

  no-npm-publish:
    description: "Block npm publish for spawned agents."
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*npm\\s+publish\\b"
        reason: "Package publishing is not allowed."

  no-twine-upload:
    description: "Block twine upload for spawned agents."
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*twine\\s+upload\\b"
        reason: "Package publishing is not allowed."

  no-cargo-publish:
    description: "Block cargo publish invoked as a command (including --dry-run) for spawned agents."
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*cargo\\s+(?:\\+\\S+\\s+)?publish\\b"
        reason: "Package publishing is not allowed."

  no-gem-push:
    description: "Block gem push for spawned agents."
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*gem\\s+push\\b"
        reason: "Package publishing is not allowed."
