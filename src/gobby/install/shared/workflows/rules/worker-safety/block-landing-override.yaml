tags: [worker-safety, enforcement, default, gobby]

rules:
  block-landing-override:
    description: "Block agent use of the protected-branch guard's operator override."
    event: before_tool
    enabled: true
    priority: 40
    when: command_sets_environment(event.data.get('command'), 'GOBBY_LAND_COMMIT')
    effects:
      - type: block
        tools: [Bash]
        reason: "The landing override is operator-only; code reaches the protected branch only through gobby-tasks-ops:land_commit."
