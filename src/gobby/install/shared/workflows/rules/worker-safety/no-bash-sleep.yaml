tags: [worker-safety, gobby]

rules:
  no-bash-sleep:
    description: "Block bash sleep commands. Use event-driven patterns instead."
    event: before_tool
    enabled: true
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|(`\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?sleep\\s+"
        reason: "Use wait steps or completion events — Gobby resumes you when the condition is met."
