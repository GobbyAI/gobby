tags: [worker-safety, enforcement, gobby]

rules:
  no-destructive-git:
    description: "Block destructive git operations."
    event: before_tool
    enabled: true
    priority: 50
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "git\\s+(reset\\s+--hard|clean\\s+-[fdx]+|checkout\\s+(--\\s+)?\\.|restore\\s+\\.|branch\\s+-D|stash(?!\\s+(?:list|show|--help|-h)(?=\\s|$|&&|;|\\|))(?=\\s|$|&&|;|\\|))"
        reason: "Call gobby-agents.send_message to coordinate with the file owner when shared-worktree changes conflict. Git stash and other destructive operations are blocked; use scoped staging or an isolated worktree."
