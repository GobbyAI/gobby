tags: [skill-discovery, context, gobby, default]

rules:
  require-python-skill:
    description: "Block first Python write/edit until python coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('python')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith(('.py', '.pyi'))
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('pyproject.toml', 'setup.cfg', 'setup.py', 'tox.ini', 'noxfile.py', 'pytest.ini', 'mypy.ini', 'ruff.toml', '.python-version', 'Pipfile', 'py.typed')
        or (
          event.data.get('canonical_file_path', '').rpartition('/')[2].startswith('requirements')
          and event.data.get('canonical_file_path', '').rpartition('/')[2].endswith(('.txt', '.in'))
        )
      )
    effects:
      - type: block
        reason: 'Load the skill: call_tool("gobby-skills", "get_skill", {"name":"python"}). Then continue.'
