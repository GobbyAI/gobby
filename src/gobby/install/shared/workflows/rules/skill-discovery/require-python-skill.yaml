tags: [skill-discovery, context, gobby, default]

rules:
  require-python-skill:
    description: "Block first Python write/edit until python coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('python')
      and event.data.get('canonical_tool_kind') == 'write'
      and event.data.get('canonical_file_path', '').endswith('.py')
    effects:
      - type: block
        reason: 'Call get_skill(name="python") on gobby-skills through mcp__gobby__ progressive discovery: list_mcp_servers -> list_tools("gobby-skills") -> get_tool_schema("gobby-skills", "get_skill") -> call_tool("gobby-skills", "get_skill", {"name": "python"}). Then continue.'
