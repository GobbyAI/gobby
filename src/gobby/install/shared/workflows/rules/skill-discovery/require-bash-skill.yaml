tags: [skill-discovery, context, gobby, default]

rules:
  require-bash-skill:
    description: "Block first Bash write/edit until bash coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('bash')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith((
          '.sh', '.bash', '.bats',
          '.sh.j2', '.bash.j2', '.sh.tpl', '.bash.tpl',
          '.sh.tmpl', '.bash.tmpl', '.sh.template', '.bash.template'
        ))
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in (
          '.bashrc', '.bash_profile', '.bash_login', '.bash_logout',
          '.bash_aliases', '.bash_completion', '.shellcheckrc', 'Bashfile', 'PKGBUILD'
        )
      )
    effects:
      - type: block
        reason: 'Call get_skill(name="bash") on gobby-skills through mcp__gobby__ progressive discovery: list_mcp_servers -> list_tools("gobby-skills") -> get_tool_schema("gobby-skills", "get_skill") -> call_tool("gobby-skills", "get_skill", {"name": "bash"}). Then continue.'
