tags: [skill-discovery, context, gobby, default]

rules:
  require-go-skill:
    description: "Block first Go write/edit until go coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('go')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith('.go')
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('go.mod', 'go.sum', 'go.work', 'go.work.sum')
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('.golangci.yml', '.golangci.yaml', 'golangci.yml', 'golangci.yaml')
      )
    effects:
      - type: block
        reason: 'Call get_skill(name="go") on gobby-skills directly through mcp__gobby__call_tool: call_tool("gobby-skills", "get_skill", {"name": "go"}). Then continue.'
