tags: [skill-discovery, context, gobby, default]

rules:
  inject-python-skill:
    description: "Inject python coding standards on first .py file read"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      'python' not in variables.get('injected_skills', [])
      and event.data.get('canonical_tool_kind') == 'read'
      and event.data.get('canonical_file_path', '').endswith('.py')
    effects:
      - type: mcp_call
        server: gobby-skills
        tool: get_skill
        arguments:
          name: python
        inject_result: true
      - type: set_variable
        variable: injected_skills
        value: "variables.get('injected_skills', []) + ['python']"
