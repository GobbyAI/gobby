tags: [skill-discovery, context, gobby, default]

rules:
  inject-python-skill:
    description: "Block first Python write/edit, require python coding standards"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('python')
      and event.data.get('canonical_tool_kind') == 'write'
      and event.data.get('canonical_file_path', '').endswith('.py')
    effects:
      - type: block
        reason: >
          One-time nudge: this Python edit should follow the repo's Python conventions.
          Call get_skill(name="python") on gobby-skills, then continue.
