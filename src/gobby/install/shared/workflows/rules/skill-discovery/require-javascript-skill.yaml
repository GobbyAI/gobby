tags: [skill-discovery, context, gobby, default]

rules:
  require-javascript-skill:
    description: "Block first JavaScript write/edit until javascript coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('javascript')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith(('.js', '.jsx', '.mjs', '.cjs'))
        or event.data.get('canonical_file_path', '').rpartition('/')[2] == 'package.json'
        or event.data.get('canonical_file_path', '').rpartition('/')[2] == 'jsconfig.json'
        or (
          event.data.get('canonical_file_path', '').rpartition('/')[2].startswith('jsconfig.')
          and event.data.get('canonical_file_path', '').rpartition('/')[2].endswith('.json')
        )
      )
    effects:
      - type: block
        reason: 'Call get_skill(name="javascript") on gobby-skills through mcp__gobby__ progressive discovery: list_mcp_servers -> list_tools("gobby-skills") -> get_tool_schema("gobby-skills", "get_skill") -> call_tool("gobby-skills", "get_skill", {"name": "javascript"}). Then continue.'
