tags: [skill-discovery, context, gobby, default]

rules:
  bootstrap-default-agent-core-skills:
    description: "Request ordered core guidance once per context epoch"
    event: turn_start
    enabled: true
    priority: 9
    when: >
      not variables.get('handoff_pull_pending')
      and (
        not skill_loaded('gobby:references/skills/loading.md')
        or (
          not skill_loaded('gobby:references/memory/overview.md')
          and not has_open_tool_error(
            "gobby-skills/get_skill_file",
            {"name": "gobby", "path": "references/memory/overview.md"}
          )
        )
        or (
          not variables.get('restraint_disabled')
          and not skill_loaded('restraint')
        )
        or (
          not variables.get('brevity_disabled')
          and not skill_loaded('brevity')
        )
      )
    effects:
      - type: load_skill
        skill: gobby:references/skills/loading.md
        when: "not skill_loaded('gobby:references/skills/loading.md')"
      - type: load_skill
        skill: gobby:references/memory/overview.md
        when: >
          not skill_loaded('gobby:references/memory/overview.md')
          and not has_open_tool_error(
            "gobby-skills/get_skill_file",
            {"name": "gobby", "path": "references/memory/overview.md"}
          )
      - type: load_skill
        skill: brevity
        when: >
          not variables.get('brevity_disabled')
          and not skill_loaded('brevity')
      - type: load_skill
        skill: restraint
        when: >
          not variables.get('restraint_disabled')
          and not skill_loaded('restraint')
