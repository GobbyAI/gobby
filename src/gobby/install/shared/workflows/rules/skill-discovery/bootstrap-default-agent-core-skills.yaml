tags: [skill-discovery, context, gobby, default]

rules:
  bootstrap-default-agent-core-skills:
    description: "Request ordered core guidance once per context epoch"
    event: turn_start
    enabled: true
    priority: 9
    when: >
      not variables.get('handoff_pull_pending')
      and (
        (
          not skill_loaded('memory')
          and not has_open_tool_error(
            "gobby-skills/get_skill",
            {"name": "memory"}
          )
        )
        or not skill_loaded('loading-skills')
        or (
          not variables.get('brevity_disabled')
          and not skill_loaded('brevity')
        )
      )
    effects:
      - type: load_skill
        skill: memory
        when: >
          not skill_loaded('memory')
          and not has_open_tool_error(
            "gobby-skills/get_skill",
            {"name": "memory"}
          )
      - type: load_skill
        skill: loading-skills
        when: "not skill_loaded('loading-skills')"
      - type: load_skill
        skill: brevity
        when: >
          not variables.get('brevity_disabled')
          and not skill_loaded('brevity')
