tags: [skill-discovery, context, gobby, default]

rules:
  inject-rust-skill:
    description: "Block first Rust write/edit, require rust coding standards"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('rust')
      and event.data.get('canonical_tool_kind') == 'write'
      and event.data.get('canonical_file_path', '').endswith('.rs')
    effects:
      - type: block
        reason: >
          One-time nudge: this Rust edit should follow the repo's Rust conventions.
          Call get_skill(name="rust") on gobby-skills, then continue.
