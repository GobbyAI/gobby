tags: [skill-discovery, context, gobby, default]

rules:
  inject-rust-skill:
    description: "Inject rust coding standards on first .rs file read"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      'rust' not in variables.get('injected_skills', [])
      and event.data.get('canonical_tool_kind') == 'read'
      and event.data.get('canonical_file_path', '').endswith('.rs')
    effects:
      - type: mcp_call
        server: gobby-skills
        tool: get_skill
        arguments:
          name: rust
        inject_result: true
      - type: set_variable
        variable: injected_skills
        value: "variables.get('injected_skills', []) + ['rust']"
