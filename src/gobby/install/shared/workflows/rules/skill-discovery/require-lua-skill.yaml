tags: [skill-discovery, context, gobby, default]

rules:
  require-lua-skill:
    description: "Block first Lua write/edit until lua coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('lua')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith(('.lua', '.rockspec'))
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('.busted', '.lua-format', '.luacheckrc', '.luacov', '.luarc.json', '.luarc.jsonc', '.stylua.toml', 'stylua.toml', 'selene.toml')
      )
    effects:
      - type: block
        reason: 'Load the skill: call_tool("gobby-skills", "get_skill", {"name":"lua"}). Then continue.'
