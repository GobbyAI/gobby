tags: [skill-discovery, context, gobby, default]

rules:
  require-java-skill:
    description: "Block first Java write/edit until java coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('java')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith('.java')
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('pom.xml', 'build.gradle', 'build.gradle.kts', 'settings.gradle', 'settings.gradle.kts', 'gradle.properties')
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('maven.config', 'jvm.config', 'checkstyle.xml', 'pmd.xml', 'spotbugs-exclude.xml', 'lombok.config')
      )
    effects:
      - type: block
        reason: 'Call get_skill(name="java") on gobby-skills directly through mcp__gobby__call_tool: call_tool("gobby-skills", "get_skill", {"name": "java"}). Then continue.'
