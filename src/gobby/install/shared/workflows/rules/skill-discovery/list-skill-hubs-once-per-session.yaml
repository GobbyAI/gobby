tags: [skill-discovery, hubs, gobby, default]

rules:
  list-skill-hubs-once-per-session:
    description: "List available skill hubs once per session"
    event: turn_start
    enabled: true
    priority: 15
    when: >
      not variables.get('skill_discovery_instructions_shown')
      and not variables.get('handoff_pull_pending')
    effects:
      - type: mcp_call
        delivery: on_receipt
        server: gobby-skills
        tool: list_hubs
        arguments: {}
        background: false
        inject_result: true
        timeout_seconds: 2.0
        success_variable: skill_discovery_instructions_shown
