tags: [skill-discovery, context, gobby, default]

rules:
  require-json-skill:
    description: "Block first JSON write/edit until json coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('json')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith(('.json', '.jsonc', '.json5'))
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in (
            '.babelrc',
            '.eslintrc',
            '.firebaserc',
            '.hintrc',
            '.prettierrc',
            '.stylelintrc',
            '.swcrc',
          )
      )
    effects:
      - type: block
        reason: '{{ skill_fetch_directive("json") }}'
