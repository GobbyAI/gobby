tags: [skill-discovery, context, gobby, default]

rules:
  require-plan-skill:
    description: "Block plan-artifact writes until a plan skill is loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('plan')
      and not skill_loaded('plan-draft')
      and not skill_loaded('plan-review')
      and not skill_loaded('plan-enhance')
      and event.data.get('canonical_tool_kind') == 'write'
      and '.gobby/plans/' in normalize_path(event.data.get('canonical_file_path', ''))
    effects:
      - type: block
        reason: |
          {{ skill_fetch_directive("plan") }}
          `.gobby/plans/` is the canonical file authority for dependent multi-deliverable plans. Write the complete draft there when permissions allow, or materialize the complete conversational draft staged in the session handoff before file-based validation. Atomic deliverables stay in the task workflow, and plan registration waits for a real expansion root.
