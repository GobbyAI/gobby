tags: [skill-discovery, context, gobby, default]

rules:
  require-plan-skill:
    description: "Block plan-artifact writes until a plan skill is loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('plan')
      and not skill_loaded('plan-draft')
      and not skill_loaded('plan-review')
      and not skill_loaded('plan-enhance')
      and event.data.get('canonical_tool_kind') == 'write'
      and '.gobby/plans/' in normalize_path(event.data.get('canonical_file_path', ''))
    effects:
      - type: block
        reason: |
          {{ skill_fetch_directive("plan") }}
          `.gobby/plans/` is written by `gobby plans register`, never by copying a plan-mode file; Lightweight planning does not create a `.gobby/plans/` file at all.
