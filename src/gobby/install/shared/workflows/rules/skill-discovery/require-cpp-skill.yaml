tags: [skill-discovery, context, gobby, default]

rules:
  require-cpp-skill:
    description: "Block first C++ write/edit until cpp coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('cpp')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith(('.cpp', '.cc', '.cxx', '.c++', '.hpp', '.hh', '.hxx', '.h++', '.ipp', '.ixx', '.tpp', '.inl', '.cu', '.cuh', '.C'))
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('CMakeLists.txt', 'CMakePresets.json', 'CMakeUserPresets.json', 'meson.build', 'meson_options.txt', 'conanfile.txt', 'conanfile.py', 'vcpkg.json', 'vcpkg-configuration.json')
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('compile_flags.txt', 'compile_commands.json', 'BUILD', 'BUILD.bazel', 'WORKSPACE', 'MODULE.bazel')
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('.clang-format', '.clang-tidy', '.clangd')
      )
    effects:
      - type: block
        reason: 'Call get_skill(name="cpp") on gobby-skills through mcp__gobby__ progressive discovery: list_mcp_servers -> list_tools("gobby-skills") -> get_tool_schema("gobby-skills", "get_skill") -> call_tool("gobby-skills", "get_skill", {"name": "cpp"}). Then continue.'
