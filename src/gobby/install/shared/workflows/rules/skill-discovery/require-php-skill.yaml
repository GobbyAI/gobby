tags: [skill-discovery, context, gobby, default]

rules:
  require-php-skill:
    description: "Block first PHP write/edit until php coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('php')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith('.php')
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('composer.json', 'composer.lock', 'symfony.lock', 'phpunit.xml', 'phpunit.xml.dist', 'pest.php', 'phpstan.neon', 'phpstan.neon.dist', 'psalm.xml', 'psalm.xml.dist')
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('rector.php', 'ecs.php', 'pint.json', 'phpcs.xml', 'phpcs.xml.dist', 'infection.json', '.php-cs-fixer.php', '.php-cs-fixer.dist.php')
      )
    effects:
      - type: block
        reason: 'Call get_skill(name="php") on gobby-skills directly through mcp__gobby__call_tool: call_tool("gobby-skills", "get_skill", {"name": "php"}). Then continue.'
