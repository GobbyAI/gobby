tags: [skill-discovery, context, gobby, default]

rules:
  require-ruby-skill:
    description: "Block first Ruby write/edit until ruby coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('ruby')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith(('.rb', '.rake', '.gemspec', '.ru', '.erb', '.rbs', '.jbuilder', '.builder', '.haml', '.slim'))
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('Gemfile', 'Gemfile.lock', 'gems.rb', 'gems.locked', 'Rakefile', 'Guardfile', 'Capfile', 'Dangerfile', 'Podfile', 'Brewfile', 'Fastfile', 'Appfile', 'Pluginfile', 'Deliverfile', 'Matchfile', 'Snapfile', 'Scanfile', 'Gymfile', 'config.ru', '.ruby-version', '.ruby-gemset', '.rspec', '.rubocop.yml', '.rubocop_todo.yml', '.standard.yml', 'Steepfile')
        or event.data.get('canonical_file_path', '').endswith('sorbet/config')
      )
    effects:
      - type: block
        reason: 'Load the skill: call_tool("gobby-skills", "get_skill", {"name":"ruby"}). Then continue.'
