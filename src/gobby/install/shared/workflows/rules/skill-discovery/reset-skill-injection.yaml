tags: [skill-discovery, context, gobby, default]

rules:
  reset-skill-injection:
    description: "Clear skill loading tracking on context loss"
    event: session_start
    enabled: true
    # Session-start reset must beat turn_start skill-load rules so a compact
    # or clear epoch starts with an empty loaded_skills ledger. Meta skill
    # loads themselves wait on handoff_pull_pending until get_handoff runs.
    priority: 8
    when: "event.data.get('source') in ['clear', 'compact'] or (event.data.get('source') == 'resume' and variables.get('pending_context_reset'))"
    effects:
      - type: set_variable
        variable: suggested_skill_names
        value: []
      - type: set_variable
        variable: loaded_skills
        value: []
      - type: set_variable
        variable: workflow_requested_skills
        value: []
