version: "1.1.0"
tags: [skill-discovery, context, gobby, default]

rules:
  reset-skill-injection:
    description: "Clear skill loading tracking on context loss"
    event: session_start
    enabled: true
    # Session-start reset must beat turn_start skill-load rules so a compact
    # or clear epoch starts with an empty loaded_skills ledger. The core
    # bootstrap fires on the pull turn; its loads run after get_handoff.
    priority: 8
    when: "event.data.get('source') in ['clear', 'compact'] or (event.data.get('source') == 'resume' and variables.get('pending_context_reset'))"
    effects:
      - type: set_variable
        variable: suggested_skill_names
        value: []
      - type: set_variable
        variable: loaded_skills
        value: []
      - type: set_variable
        variable: loaded_skill_references
        value: []
      - type: set_variable
        variable: unavailable_instructions
        value: []
      # A stale true here would let the first commit after a compact through on
      # a review from before the reset, since reloading the skill satisfies
      # require-code-review-skill but not require-code-review-self-review.
      - type: set_variable
        variable: code_review_fresh
        value: false
