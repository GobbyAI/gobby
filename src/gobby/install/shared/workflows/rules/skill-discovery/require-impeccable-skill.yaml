tags: [skill-discovery, context, gobby, default]

# UI predicate shared with impeccable/design-detector.yaml: component, style,
# and markup extensions match anywhere; bare .ts/.js/.mjs/.cjs match only under
# a web/ segment so skill scripts and Node tooling stay out of design
# enforcement. Paths may arrive absolute or repo-relative, hence both the
# '/web/' segment check and the 'web/' prefix check.

rules:
  require-impeccable-skill:
    description: "Block first UI file write/edit until the impeccable design contract is loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('impeccable')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith(('.tsx', '.jsx', '.vue', '.svelte', '.astro', '.css', '.scss', '.html'))
        or (
          event.data.get('canonical_file_path', '').endswith(('.ts', '.js', '.mjs', '.cjs'))
          and (
            '/web/' in event.data.get('canonical_file_path', '')
            or event.data.get('canonical_file_path', '').startswith('web/')
          )
        )
      )
    effects:
      - type: block
        reason: '{{ skill_fetch_directive("impeccable") }}'
