tags: [skill-discovery, context, gobby, default]

rules:
  require-scala-skill:
    description: "Block first Scala write/edit until scala coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('scala')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith(('.scala', '.sc', '.sbt'))
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('.scala-version', '.scalafmt.conf', '.scalafix.conf', '.sbtopts')
      )
    effects:
      - type: block
        reason: 'Call get_skill(name="scala") on gobby-skills through mcp__gobby__ progressive discovery: list_mcp_servers -> list_tools("gobby-skills") -> get_tool_schema("gobby-skills", "get_skill") -> call_tool("gobby-skills", "get_skill", {"name": "scala"}). Then continue.'
