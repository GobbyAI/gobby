tags: [skill-discovery, context, gobby, default]

rules:
  require-swift-skill:
    description: "Block first Swift write/edit until swift coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('swift')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith('.swift')
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('Package.swift', 'Package.resolved', '.swift-version', '.swiftlint.yml', '.swiftlint.yaml', 'swiftlint.yml', 'swiftlint.yaml', '.swiftformat', '.swift-format', 'swift-format.json', '.swift-format.json')
        or (
          '.xcodeproj/' in event.data.get('canonical_file_path', '')
          and event.data.get('canonical_file_path', '').rpartition('/')[2] == 'project.pbxproj'
        )
      )
    effects:
      - type: block
        reason: 'Call get_skill(name="swift") on gobby-skills directly through mcp__gobby__call_tool: call_tool("gobby-skills", "get_skill", {"name": "swift"}). Then continue.'
