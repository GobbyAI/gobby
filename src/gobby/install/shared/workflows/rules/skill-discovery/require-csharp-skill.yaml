tags: [skill-discovery, context, gobby, default]

rules:
  require-csharp-skill:
    description: "Block first C#/.NET write/edit until csharp coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('csharp')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith(('.cs', '.csx', '.csproj', '.sln', '.slnx', '.razor', '.cshtml', '.cake'))
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('global.json', 'nuget.config', 'NuGet.Config', 'packages.lock.json', 'dotnet-tools.json', 'omnisharp.json', 'stylecop.json')
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('Directory.Build.props', 'Directory.Build.targets', 'Directory.Packages.props')
      )
    effects:
      - type: block
        reason: 'Call get_skill(name="csharp") on gobby-skills directly through mcp__gobby__call_tool: call_tool("gobby-skills", "get_skill", {"name": "csharp"}). Then continue.'
