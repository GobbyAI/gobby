tags: [skill-discovery, context, gobby, default]

rules:
  require-typescript-skill:
    description: "Block first TypeScript write/edit until typescript coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('typescript')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith(('.ts', '.tsx', '.mts', '.cts'))
        or event.data.get('canonical_file_path', '').rpartition('/')[2] == 'tsconfig.json'
        or (
          event.data.get('canonical_file_path', '').rpartition('/')[2].startswith('tsconfig.')
          and event.data.get('canonical_file_path', '').rpartition('/')[2].endswith('.json')
        )
      )
    effects:
      - type: block
        reason: 'Call get_skill(name="typescript") on gobby-skills directly through mcp__gobby__call_tool: call_tool("gobby-skills", "get_skill", {"name": "typescript"}). Then continue.'
