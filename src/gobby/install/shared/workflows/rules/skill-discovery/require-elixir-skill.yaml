tags: [skill-discovery, context, gobby, default]

rules:
  require-elixir-skill:
    description: "Block first Elixir write/edit until elixir coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('elixir')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith(('.ex', '.exs', '.eex', '.heex', '.leex', '.sface', '.livemd'))
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('mix.exs', 'mix.lock', '.formatter.exs', '.credo.exs', '.dialyzer_ignore.exs', '.iex.exs')
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in ('config.exs', 'runtime.exs', 'dev.exs', 'test.exs', 'prod.exs', 'releases.exs', 'seeds.exs')
      )
    effects:
      - type: block
        reason: '{{ skill_fetch_directive("elixir") }}'
