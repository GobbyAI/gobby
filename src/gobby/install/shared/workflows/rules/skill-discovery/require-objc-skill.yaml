tags: [skill-discovery, context, gobby, default]
rules:
  require-objc-skill:
    description: "Block first Objective-C write/edit until objc coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('objc')
      and event.data.get('canonical_tool_kind') == 'write'
      and event.data.get('canonical_file_path', '').endswith(('.m', '.mm', '.h', '.pch'))
    effects:
      - type: block
        reason: 'Call get_skill(name="objc") on gobby-skills through mcp__gobby__ progressive discovery: list_mcp_servers -> list_tools("gobby-skills") -> get_tool_schema("gobby-skills", "get_skill") -> call_tool("gobby-skills", "get_skill", {"name": "objc"}). Then continue.'
