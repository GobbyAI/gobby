tags: [skill-discovery, context, gobby, default]

rules:
  require-rust-skill:
    description: "Block first Rust write/edit until rust coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('rust')
      and event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith('.rs')
        or event.data.get('canonical_file_path', '').rpartition('/')[2] in (
          'Cargo.toml',
          'Cargo.lock',
          'rust-toolchain',
          'rust-toolchain.toml',
          'rustfmt.toml',
          '.rustfmt.toml',
          'clippy.toml',
          '.clippy.toml'
        )
        or event.data.get('canonical_file_path', '') in ('.cargo/config', '.cargo/config.toml')
        or event.data.get('canonical_file_path', '').endswith(('/.cargo/config', '/.cargo/config.toml'))
      )
    effects:
      - type: block
        reason: 'Load the skill: call_tool("gobby-skills", "get_skill", {"name":"rust"}). Then continue.'
