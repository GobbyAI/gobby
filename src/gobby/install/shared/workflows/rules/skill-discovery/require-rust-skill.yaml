tags: [skill-discovery, context, gobby, default]

rules:
  require-rust-skill:
    description: "Block first Rust write/edit until rust coding standards are loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('rust')
      and event.data.get('canonical_tool_kind') == 'write'
      and event.data.get('canonical_file_path', '').endswith('.rs')
    effects:
      - type: block
        reason: 'Call get_skill(name="rust") on gobby-skills, then continue. Use the Gobby MCP proxy path exactly: list_mcp_servers -> list_tools("gobby-skills") -> get_tool_schema("gobby-skills", "get_skill") -> call_tool("gobby-skills", "get_skill", {"name": "rust"}). Use only mcp__gobby__* proxy tools while loading the skill; do not use native Skill, GitHub/app connector, or Computer Use tools.'
