tags: [task-enforcement, enforcement, tasks, gobby, default]

rules:
  block-gobby-tasks-cli:
    description: "Block mutating `gobby tasks` CLI subcommands in Bash — use the gobby-tasks MCP server instead. Read-only subcommands are allowed."
    event: before_tool
    enabled: true
    priority: 30
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|(`\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?(uv\\s+run\\s+)?gobby\\s+tasks\\s+(create|update|close|reopen|delete|de_escalate|claim|sync|compact|import|clean)\\b"
        reason: |
          Use the MCP equivalents (create_task, claim_task, update_task, close_task)
          so validation gates, discovery, and hook policy remain active. For a
          known unleased task tool, call get_tool_schema(server_name='gobby-tasks',
          tool_name='<tool>') directly, then call_tool(server_name='gobby-tasks',
          tool_name='<tool>', args={...}). Use list_tools only if the task tool
          name is unknown.

          Read-only `gobby tasks` subcommands remain available:
            - `gobby tasks list`, `ready`, `blocked`, `stats`, `show`
            - `gobby tasks expand validate-plan <path>`
            - `gobby tasks validation_history`, `doctor`
