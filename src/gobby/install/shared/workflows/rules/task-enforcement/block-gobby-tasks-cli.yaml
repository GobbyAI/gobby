tags: [task-enforcement, enforcement, tasks, gobby, default]

rules:
  block-gobby-tasks-cli:
    description: "Block the `gobby tasks` CLI in Bash — use the gobby-tasks MCP server instead."
    event: before_tool
    enabled: true
    priority: 30
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "\\b(uv\\s+run\\s+)?gobby\\s+tasks\\b"
        reason: |
          The `gobby tasks` CLI is for humans. Use the gobby-tasks MCP server instead:
            - list_mcp_servers() → confirm gobby-tasks is available
            - list_tools(server_name='gobby-tasks') → see task tools
            - get_tool_schema(server_name='gobby-tasks', tool_name='<tool>') → fetch params
            - call_tool(server_name='gobby-tasks', tool_name='<tool>', args={...})
          Common equivalents: create_task, claim_task, update_task, close_task,
          list_ready_tasks, get_task, list_tasks.
