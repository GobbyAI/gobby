tags: [task-enforcement, enforcement, tasks, gobby, default]

rules:
  require-claimed-task-required-skills:
    description: "Block source-code writes until claimed-task required skills are loaded"
    event: before_tool
    enabled: true
    priority: 29
    when: >-
      event.data.get('canonical_tool_kind') == 'write'
      and claimed_task_source_code_write(tool_input, event.data)
      and missing_claimed_task_required_skills(tool_input, event.data) != []
    effects:
      - type: block
        reason: '{{ skill_fetch_batch_directive(missing_claimed_task_required_skills(tool_input, event.data)) }}'
