tags: [task-enforcement, enforcement, tasks, gobby, default]

rules:
  block-needs-review-interactive:
    description: "Block review lifecycle tools for interactive sessions"
    event: before_tool
    enabled: true
    priority: 32
    when: "not variables.get('is_spawned_agent')"
    effects:
      - type: block
        mcp_tools:
          - "gobby-tasks-ops:submit_for_review"
          - "gobby-tasks-ops:approve_review"
          - "gobby-tasks-ops:reject_review"
        reason: |
          Interactive sessions should use close_task directly — the user is already present.
          Review status transitions (needs_review, review_approved, review_rejected) are for spawned/pipeline
          agents where a separate QA step reviews. Interactive agents can: open, claim,
          escalate, de_escalate, reopen, close, and delete tasks when the user explicitly
          wants that lifecycle transition.
