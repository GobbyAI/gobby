tags: [task-enforcement, enforcement, shared-worktree, gobby, default]

rules:
  block-dirty-path-approval-cli:
    description: "Block agent use of `gobby sessions approve-dirty-paths`; approving unowned dirt is the operator's decision. The second effect refuses an unquoted brace, `$` or backtick in a gobby command word, global option value, group or subcommand, in an executable word after leading assignments or launcher options, or in a uv run or env option value; quoted and escaped braces stay literal. Nested interpreters (eval, sh -c, bash -c, xargs) and aliases are out of scope for this rule: the daemon operator-key check (401 to the agent bearer) is the boundary there."
    event: before_tool
    enabled: true
    priority: 30
    effects:
      - type: block
        tools: [Bash]
        # The approval subcommand blocks only where it fills the subcommand slot
        # right after `sessions` (flags aside), whatever launcher, wrapper, global
        # option or variable names the CLI. A quoted or read-only mention, such as
        # a search term, is not an invocation and stays allowed. A segment that
        # names `sessions` and expands a variable or runs a substitution unquoted
        # also blocks: the subcommand can then be assembled at run time, so the
        # literal name never appears. An unquoted brace, `$` or backtick in a gobby
        # command, global option value, group or subcommand word, or in an executable
        # word, is refused by the second effect below, so a brace spelling cannot reach
        # the subcommand slot; quoted braces are literal.
        # `gobby sessions list` is exempt when its arguments hold no command
        # substitution or separator: list takes no operator-only subcommand, so a
        # variable in its arguments cannot reach approve-dirty-paths. Quoted data
        # is not an invocation, so a refusal relaying the command to the user stays
        # sendable. Managed executions are also denied the session tables at the
        # database, so this rule is not the only boundary.
        mask_quoted: true
        command_pattern: "(?<![\\w.-])sessions(?![\\w-])(?:\\s+-[\\w-]+)*\\s+approve-dirty-paths(?![\\w-])|^(?!\\s*(?:uv\\s+run\\s+)?gobby\\s+sessions\\s+list(?![\\w-])(?:[^;&|\\n`$]|\\$(?!\\())*$)(?=[\\s\\S]*(?<![\\w./-])sessions(?![\\w-]))(?=[\\s\\S]*[$`])"
        reason: |
          Approving unowned dirty paths is operator-only. Relay the exact
          `gobby sessions approve-dirty-paths ...` command from the refusal to
          the user, who runs it in their own shell, then retry.
      - type: block
        tools: [Bash]
        # Raw text on purpose: quoted spans stay visible, so a quoted command word
        # such as `"gobby"` still names gobby, and a quoted brace stays literal. Four
        # shapes are refused, flags and wrappers aside. An unquoted `{` or `}` in a
        # gobby group or subcommand word is refused. So is one in the value of a
        # global option (`--config VALUE`, `--config=VALUE`), because the brace can
        # expand into the group slot. A gobby command word with an unquoted brace is
        # refused, with or without the brace (`gobb{y..y}`, `g{o..o}bby`, `g{obby,}`).
        # The executable word is refused when it holds an unquoted `{`, `}`, `$` or
        # backtick (`$x tasks list`, `${x}by tasks list`, `g`x`obby tasks list`,
        # `{bash,} -c 'echo hi'`). It follows any leading shell assignments (`X=1`,
        # several, quoted or escaped values; the shell does not split their values) and
        # the optional uv run, uvx or env prefixes with their options. Each value-taking
        # uv run or env option (`--project`, `--directory`, `--python`, `-p`, `--with`,
        # env `-u`, `-C`, `-P`, `-S`, in `OPT VALUE` and `OPT=VALUE` forms) and each env
        # NAME=VALUE argument is skipped only while literal: a value holding an unquoted
        # brace, `$` or backtick is refused, because it can split or expand into the
        # executable. A lone `{` or `}` followed by whitespace is the group reserved
        # word, not an executable. Braces in later arguments, and quoted or escaped
        # braces, stay allowed. Nested interpreters, aliases and the `command` wrapper
        # are out of scope; see the rule description.
        mask_quoted: false
        command_pattern: "(?:^|[;&|(\\n`]|\\$\\(|\\{(?=\\s))\\s*(?:[A-Za-z_]\\w*=(?:[^\\s;&|()'\\\"\\\\]|\\\\.|'[^']*'|\\\"[^\\\"]*\\\")*\\s+)*(?:(?:uv\\s+run\\s+(?:(?:(?:--(?:allow-insecure-host|cache-dir|color|config-file|config-setting|config-settings-package|default-index|directory|env-file|exclude-newer|exclude-newer-package|extra|extra-index-url|find-links|fork-strategy|group|index|index-strategy|index-url|keyring-provider|link-mode|no-binary-package|no-build-isolation-package|no-build-package|no-editable-package|no-extra|no-group|no-sources-package|only-group|package|prerelease|prerelease-package|project|python|python-platform|refresh-package|reinstall-package|resolution|upgrade-group|upgrade-package|with|with-editable|with-requirements)|-[abcdeghjklmnoqrstuvxyzABDEFGHIJKLMNOQRSTUVWXYZ0123456789]*[CPfipw])(?:=(?:[^\\s;&|()'\\\"\\\\{}$`]|\\\\.|'[^']*'|\\\"[^\\\"]*\\\")*|\\s+(?:[^\\s;&|()'\\\"\\\\{}$`]|\\\\.|'[^']*'|\\\"[^\\\"]*\\\")+)|(?!(?:--(?:allow-insecure-host|cache-dir|color|config-file|config-setting|config-settings-package|default-index|directory|env-file|exclude-newer|exclude-newer-package|extra|extra-index-url|find-links|fork-strategy|group|index|index-strategy|index-url|keyring-provider|link-mode|no-binary-package|no-build-isolation-package|no-build-package|no-editable-package|no-extra|no-group|no-sources-package|only-group|package|prerelease|prerelease-package|project|python|python-platform|refresh-package|reinstall-package|resolution|upgrade-group|upgrade-package|with|with-editable|with-requirements)|-[abcdeghjklmnoqrstuvxyzABDEFGHIJKLMNOQRSTUVWXYZ0123456789]*[CPfipw])(?=[=\\s;&|()]|$))-(?:[^\\s;&|()'\\\"\\\\{}$`]|\\\\.|'[^']*'|\\\"[^\\\"]*\\\")*)\\s+)*|env\\s+(?:(?:-[abcdefghijklmnopqrstvwxyzABDEFGHIJKLMNOQRTUVWXYZ0123456789]*[uCPS]\\s+(?:[^\\s;&|()'\\\"\\\\{}$`]|\\\\.|'[^']*'|\\\"[^\\\"]*\\\")+|(?!-[abcdefghijklmnopqrstvwxyzABDEFGHIJKLMNOQRTUVWXYZ0123456789]*[uCPS](?=\\s|$|[;&|()]))-(?:[^\\s;&|()'\\\"\\\\{}$`]|\\\\.|'[^']*'|\\\"[^\\\"]*\\\")*|[A