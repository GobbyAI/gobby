  block-gobby-cli-expansion:
    description: "Block agent shell commands that name the operator-only approval subcommand inside a substitution, or build a gobby sessions subcommand from a variable or substitution."
    event: before_tool
    enabled: true
    priority: 30
    effects:
      - type: block
        tools: [Bash]
        # Raw text on purpose: quoting or escaping the subcommand does not stop a
        # shell from running it, so two shapes block. A literal approval name in a
        # substitution or backtick runs it. A gobby sessions call whose subcommand
        # slot holds a variable or substitution, through quote and backslash noise,
        # can assemble the approval subcommand at run time. The slot must sit
        # before any quote, so quoted arguments such as JSON pass. Braces and globs
        # pass here; one that would name the approval is refused by the operator
        # route's credential check, not by this rule.
        mask_quoted: false
        command_pattern: "(?:\\$\\(|`)[^;&|\\n]*?(?<![\\w./-])approve-dirty-paths(?![\\w-])|(?<![\\w./-])gobby(?![\\w-])[^;&|\\n'\"]*?(?<![\\w./-])['\"]?s['\"\\\\]*e['\"\\\\]*s['\"\\\\]*s['\"\\\\]*i['\"\\\\]*o['\"\\\\]*n['\"\\\\]*s['\"\\\\]*\\s+['\"]*[^\\s;&|]*[$`]"
        reason: |
          The operator-only approval subcommand is named inside a substitution, or a
          gobby sessions subcommand is built from a variable or substitution. Use the
          gobby MCP tools, or pass the literal subcommand name.
