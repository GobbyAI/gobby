tags: [task-enforcement, enforcement, shared-worktree, gobby, default]

rules:
  block-dirty-path-approval-cli:
    description: "Block agent use of `gobby sessions approve-dirty-paths`; approving unowned dirt is the operator's decision."
    event: before_tool
    enabled: true
    priority: 30
    effects:
      - type: block
        tools: [Bash]
        # The subcommand name is unique, so any unquoted occurrence in an
        # executable segment blocks, whatever launcher, wrapper, global option
        # or variable names the CLI. A segment that names `sessions` and expands
        # a variable or runs a substitution unquoted also blocks: the subcommand
        # can then be assembled at run time, so the literal name never appears.
        # `gobby sessions list` is exempt when its arguments hold no command
        # substitution or separator: list takes no operator-only subcommand, so a
        # variable in its arguments cannot reach approve-dirty-paths. Quoted data
        # is not an invocation, so a refusal relaying the command to the user stays
        # sendable. Managed executions are also denied the session tables at the
        # database, so this rule is not the only boundary.
        mask_quoted: true
        command_pattern: "(?<![\\w./-])approve-dirty-paths(?![\\w-])|^(?!\\s*(?:uv\\s+run\\s+)?gobby\\s+sessions\\s+list(?![\\w-])(?:[^;&|\\n`$]|\\$(?!\\())*$)(?=[\\s\\S]*(?<![\\w./-])sessions(?![\\w-]))(?=[\\s\\S]*[$`])"
        reason: |
          Approving unowned dirty paths is operator-only. Relay the exact
          `gobby sessions approve-dirty-paths ...` command from the refusal to
          the user, who runs it in their own shell, then retry.

  block-gobby-cli-expansion:
    description: "Block agent gobby CLI calls that expand a variable, substitution, brace or glob, since the operator-only approval subcommand can be assembled that way."
    event: before_tool
    enabled: true
    priority: 30
    effects:
      - type: block
        tools: [Bash]
        # Raw text on purpose: quoting or escaping the subcommand does not stop a
        # shell from expanding a variable or substitution inside a gobby CLI
        # call, which is how the subcommand gets assembled at run time. Braces
        # and globs expand unquoted too (`gobby sessions {approve-dirty-path"s",s7}`).
        # `gobby sessions list` with a clean argument tail is the one exemption.
        # Agents pass literal arguments to the CLI.
        mask_quoted: false
        command_pattern: "(?<![\\w./-])gobby(?![\\w-])(?![ \\t]+sessions[ \\t]+list(?![\\w-])(?:[^;&|\\n`$]|\\$(?!\\())*(?=[;&|\\n]|$))[^;&|\\n]*[$`{*?\\[]"
        reason: |
          A gobby CLI call from an agent shell takes literal arguments. A variable,
          `$(...)`, backtick, brace or glob in the command can assemble an
          operator-only subcommand at run time. Use the gobby MCP tools, or pass
          the literal text.
