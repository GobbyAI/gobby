tags: [task-enforcement, enforcement, tasks, gobby, default]

rules:
  track-task-claim:
    description: "Log task claim events (state managed by detect_task_claim observer)"
    event: after_tool
    enabled: true
    priority: 30
    when: "event.data.get('mcp_tool') in ['claim_task', 'create_task'] and not event.data.get('error')"
    effects:
      - type: observe

  nudge-native-tracker-after-claim:
    description: "Define Gobby and provider-native task ownership after a successful claim"
    event: after_tool
    enabled: true
    priority: 28
    when: >
      event.data.get('mcp_server') == 'gobby-tasks'
      and event.data.get('mcp_tool') in ('claim_task', 'create_task')
      and isinstance(event.data.get('tool_output'), dict)
      and (
        event.data.get('tool_output', {}).get('task_id')
          in (variables.get('claimed_tasks') or {})
        or event.data.get('tool_output', {}).get('id')
          in (variables.get('claimed_tasks') or {})
        or (
          isinstance(event.data.get('tool_output', {}).get('result'), dict)
          and (
            event.data.get('tool_output', {}).get('result', {}).get('task_id')
              in (variables.get('claimed_tasks') or {})
            or event.data.get('tool_output', {}).get('result', {}).get('id')
              in (variables.get('claimed_tasks') or {})
          )
        )
      )
    effects:
      - type: inject_context
        template: >-
          Gobby task = deliverable; implementation substeps go in your CLI's native
          tracker if it offers one, otherwise in your working plan. Track every owned
          finding there until it is fixed, and name it in the close summary.
