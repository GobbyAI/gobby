tags: [task-enforcement, enforcement, tasks, gobby, default]

rules:
  strip-skip-validation-with-commit:
    description: "Warn when skip_validation is used with commits; close_task enforces override policy"
    event: before_tool
    enabled: true
    priority: 33
    when: >
      tool_input.get('skip_validation')
      and (variables.get('task_has_commits') or tool_input.get('commit_sha'))
      and (
        (event.data.get('tool_name') in ('call_tool', 'mcp__gobby__call_tool')
         and tool_input.get('server_name') == 'gobby-tasks'
         and tool_input.get('tool_name') == 'close_task')
        or event.data.get('tool_name') == 'close_task'
      )
    effects:
      - type: inject_context
        template: |
          close_task will enforce the skip_validation override policy. With attached
          commits, skip_validation requires override_justification plus successful
          current-session verification evidence, and the override reason is audited.
