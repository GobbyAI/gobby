tags: [task-enforcement, enforcement, lifecycle, gobby, default, task-skill-gates]

rules:
  require-task-transitions-skill-loaded:
    description: "Require task-transitions skill before task lifecycle transition calls"
    event: before_tool
    enabled: true
    priority: 24
    when: >
      (
        (
          event.data.get('mcp_server') == 'gobby-tasks'
          and event.data.get('mcp_tool') in ('close_task', 'reopen_task',
            'escalate_task', 'de_escalate_task')
        )
        or (
          event.data.get('mcp_server') == 'gobby-tasks-ops'
          and event.data.get('mcp_tool') in ('submit_for_review',
            'approve_review', 'reject_review')
        )
        or (
          event.data.get('tool_name') in ('call_tool', 'mcp__gobby__call_tool')
          and (tool_input.get('server_name') or tool_input.get('server')) == 'gobby-tasks'
          and (tool_input.get('tool_name') or tool_input.get('tool')) in ('close_task',
            'reopen_task', 'escalate_task', 'de_escalate_task')
        )
        or (
          event.data.get('tool_name') in ('call_tool', 'mcp__gobby__call_tool')
          and (tool_input.get('server_name') or tool_input.get('server')) == 'gobby-tasks-ops'
          and (tool_input.get('tool_name') or tool_input.get('tool')) in (
            'submit_for_review', 'approve_review', 'reject_review')
        )
      )
      and not skill_loaded('task-transitions')
    effects:
      - type: block
        reason: 'Call get_skill(name="task-transitions") on gobby-skills, then continue. Use the Gobby MCP proxy path exactly: list_mcp_servers -> list_tools("gobby-skills") -> get_tool_schema("gobby-skills", "get_skill") -> call_tool("gobby-skills", "get_skill", {"name": "task-transitions"}). Use only mcp__gobby__* proxy tools while loading the skill; do not use native Skill, GitHub/app connector, or Computer Use tools.'
