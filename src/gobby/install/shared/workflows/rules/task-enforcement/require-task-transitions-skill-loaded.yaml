tags: [task-enforcement, enforcement, lifecycle, gobby, default]

rules:
  require-task-transitions-skill-loaded:
    description: "Require task-transitions skill before task lifecycle transition calls"
    event: before_tool
    enabled: true
    priority: 24
    when: >
      (
        (
          event.data.get('mcp_server') == 'gobby-tasks'
          and event.data.get('mcp_tool') in ('close_task', 'mark_task_needs_review',
            'mark_task_review_approved', 'mark_task_review_rejected', 'reopen_task',
            'escalate_task', 'de_escalate_task')
        )
        or (
          event.data.get('tool_name') in ('call_tool', 'mcp__gobby__call_tool')
          and (tool_input.get('server_name') or tool_input.get('server')) == 'gobby-tasks'
          and (tool_input.get('tool_name') or tool_input.get('tool')) in ('close_task',
            'mark_task_needs_review', 'mark_task_review_approved',
            'mark_task_review_rejected', 'reopen_task', 'escalate_task',
            'de_escalate_task')
        )
      )
      and not skill_loaded('task-transitions')
    effects:
      - type: block
        reason: |
          Load the task-transitions workflow before changing task lifecycle state.
          Call get_skill(name="task-transitions") on gobby-skills, then continue.
