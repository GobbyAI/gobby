tags: [task-enforcement, enforcement, tasks, git, shared-worktree, default, guardrail]

rules:
  block-cross-session-foreign-dirty-edit:
    description: "Rule 3: block writes to dirty paths this session does not own"
    event: before_tool
    enabled: true
    priority: 26
    when: foreign_dirty_edit_conflict
    effects:
      - type: block
        reason: "{{ foreign_dirty_edit_conflict }}"
