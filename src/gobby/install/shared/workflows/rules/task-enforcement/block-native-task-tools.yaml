tags: [task-enforcement, enforcement, tasks, gobby, default]

rules:
  block-spawned-agent-create-task:
    description: "Keep spawned findings inside the assigned deliverable"
    event: before_tool
    enabled: true
    priority: 5
    when: "variables.get('is_spawned_agent')"
    effects:
      - type: block
        mcp_tools: ["gobby-tasks:create_task"]
        reason: >-
          Spawned workers cannot create Gobby tasks. Keep assigned-task claim, update,
          validation, review, and close operations on the current deliverable. Route
          findings to the parent coordinator via send_message(target='parent') with the
          failing command,
          diagnostics, paths, and impact.

  block-native-task-tracker-unclaimed:
    description: "Gate every CLI's native task tracker on a claimed Gobby task"
    event: before_tool
    enabled: true
    priority: 30
    when: "not variables.get('is_subagent') and not variables.get('task_claimed')"
    effects:
      - type: block
        tools: [TaskCreate, TaskUpdate, TaskGet, TaskList, TodoWrite, todo_write, update_plan]
        reason: |
          Use create_task(title, category, claim=True) or claim_task(task_id) to
          unlock the native task tracker for sub-step tracking until the task closes.
          The gobby-task tracks the deliverable; the native tracker tracks its sub-steps.
