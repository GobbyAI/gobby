tags: [task-enforcement, enforcement, tasks, gobby, default]

rules:
  block-native-task-tools-unclaimed:
    description: "Block CC native task tools when no Gobby task is claimed"
    event: before_tool
    enabled: true
    priority: 30
    when: "not variables.get('is_subagent') and not variables.get('task_claimed')"
    effects:
      - type: block
        tools: [TaskCreate, TaskUpdate, TaskGet, TaskList]
        reason: |
          Native task tools (TaskCreate, TaskUpdate, TaskGet, TaskList) require a claimed Gobby task — they're for sub-step tracking within a claimed task. Create or claim a task first:
          - create_task(title, description, category, claim=True)
          - claim_task(task_id)
          Once claimed, the gobby-task tracks the deliverable (commits, review, close) and native task tools track sub-steps to get there.

  block-native-todo-write:
    description: "Block TodoWrite - use gobby-tasks instead"
    event: before_tool
    enabled: true
    priority: 30
    when: "not variables.get('is_subagent')"
    effects:
      - type: block
        tools: [TodoWrite]
        reason: |
          TodoWrite is disabled by Gobby. For sub-step tracking within a claimed task, use TaskCreate / TaskUpdate / TaskGet / TaskList — they become available once you claim a gobby-task. The gobby-task tracks the deliverable (what gets committed, reviewed, and closed); native task tools track sub-steps along the way.
