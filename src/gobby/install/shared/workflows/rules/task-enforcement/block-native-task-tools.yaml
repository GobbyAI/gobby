tags: [task-enforcement, enforcement, tasks, gobby, default]

rules:
  block-native-task-tools-unclaimed:
    description: "Block CC native task tools when no Gobby task is claimed"
    event: before_tool
    enabled: true
    priority: 30
    when: "not variables.get('is_subagent') and not variables.get('task_claimed')"
    effects:
      - type: block
        tools: [TaskCreate, TaskUpdate, TaskGet, TaskList]
        reason: |
          Use create_task(title, description, category, claim=True) or
          claim_task(task_id) to unlock native task tools for sub-step tracking.
          The gobby-task tracks the deliverable; native tools track its sub-steps.

  block-native-todo-write:
    description: "Block TodoWrite - use gobby-tasks instead"
    event: before_tool
    enabled: true
    priority: 30
    when: "not variables.get('is_subagent')"
    effects:
      - type: block
        tools: [TodoWrite]
        reason: |
          Use create_task(title, category, claim=True) or claim_task(task_id) to
          unlock TaskCreate / TaskUpdate / TaskGet / TaskList for sub-step tracking.
          The gobby-task tracks the deliverable; native tools track its sub-steps.
