tags: [task-enforcement, enforcement, tasks, git, default, guardrail]

rules:
  require-task-before-commit:
    description: "Block explicit repository commits without a claimed task"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      variables.get('require_task_before_edit')
      and source != 'pipeline'
      and not variables.get('task_claimed')
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "\\bgit\\s+commit\\b"
        reason: |
          Use create_task(title, category, claim=True) or claim_task(task_id) to
          claim the task that authorizes this repository commit — then retry it.
