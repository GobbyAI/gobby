tags: [task-skill-gates]

rules:
  require-tasks-skill-for-mutations:
    description: "Require tasks guidance before interactive task mutations"
    event: before_tool
    enabled: true
    priority: 24
    when: >
      (
        not skill_loaded('gobby:references/tasks/overview.md')
        or (
          (
            event.data.get('mcp_tool') == 'close_task'
            or (tool_input.get('tool_name') or tool_input.get('tool')) == 'close_task'
          )
          and not skill_loaded('gobby:references/tasks/closing.md')
        )
      )
      and task_mutation_requires_tasks_skill(tool_input, event.data)
    effects:
      - type: block
        reason: >-
          {{ skill_fetch_directive("gobby:references/tasks/overview.md"
             if not skill_loaded('gobby:references/tasks/overview.md')
             else "gobby:references/tasks/closing.md") }}
