version: "1.1.0"
tags: [task-enforcement, enforcement, tasks, gobby, default]

rules:
  disclose-claimed-task-extra-skills:
    description: "Request the claimed task's extras and every other owed instruction in one call"
    event: after_tool
    enabled: true
    priority: 29
    when: >
      event.data.get('mcp_server') == 'gobby-tasks'
      and event.data.get('mcp_tool') in ('claim_task', 'create_task')
      and isinstance(event.data.get('tool_output'), dict)
      and (
        event.data.get('tool_output', {}).get('task_id')
        in (variables.get('claimed_tasks') or {})
        or event.data.get('tool_output', {}).get('id')
        in (variables.get('claimed_tasks') or {})
        or (
          isinstance(event.data.get('tool_output', {}).get('result'), dict)
          and (
            event.data.get('tool_output', {}).get('result', {}).get('task_id')
            in (variables.get('claimed_tasks') or {})
            or event.data.get('tool_output', {}).get('result', {}).get('id')
            in (variables.get('claimed_tasks') or {})
          )
        )
      )
      and context_instructions(['gobby:references/development/obligations.md'] if variables.get('claimed_task_is_source_work') else []) != []
    effects:
      - type: inject_context
        template: |
          {{ skill_fetch_batch_directive(context_instructions(['gobby:references/development/obligations.md'] if variables.get('claimed_task_is_source_work') else [])) }}
