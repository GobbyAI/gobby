tags: [task-enforcement, enforcement, tasks, gobby, default]

rules:
  require-commit-before-status:
    description: "Block status transitions when no commit is linked to the task"
    event: before_tool
    enabled: true
    priority: 32
    when: >
      variables.get('require_commit_before_status') and
      tool_input.get('reason', '') not in ['already_implemented', 'obsolete', 'duplicate', 'wont_fix', 'out_of_repo'] and
      not variables.get('task_has_commits') and not tool_input.get('commit_sha') and
      variables.get('target_task_has_edits')
    effects:
      - type: block
        mcp_tools:
          - "gobby-tasks:close_task"
          - "gobby-tasks:de_escalate_task"
          - "gobby-tasks-ops:submit_for_review"
          - "gobby-tasks-ops:approve_review"
          - "gobby-tasks-ops:reject_review"
        reason: |
          Retry the status change after committing — Gobby auto-detects commits
          from Bash `git commit` and `link_commit()`. If detection misses the commit,
          pass `commit_sha` explicitly to `close_task()`.
          No commit linked to the task is available for this status transition.

          For a task with no code changes, pass a reason to skip the commit requirement:
          close_task(task_id="#N", reason="obsolete")
          Valid reasons: obsolete, duplicate, wont_fix, already_implemented, out_of_repo
