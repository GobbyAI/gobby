tags: [task-enforcement, enforcement, lifecycle, gobby, default, task-skill-injection]

rules:
  inject-transition-skill:
    description: "Prompt for task-transitions skill when agent fetches schema for lifecycle tools"
    event: after_tool
    enabled: true
    priority: 25
    when: >
      (event.data.get('mcp_tool') == 'get_tool_schema'
       or event.data.get('tool_name') in ('get_tool_schema', 'mcp__gobby__get_tool_schema'))
      and (
        (
          (tool_input.get('server_name') or tool_input.get('server')) == 'gobby-tasks'
          and (tool_input.get('tool_name') or tool_input.get('tool')) in (
            'close_task', 'reopen_task', 'escalate_task', 'de_escalate_task')
        )
        or (
          (tool_input.get('server_name') or tool_input.get('server')) == 'gobby-tasks-ops'
          and (tool_input.get('tool_name') or tool_input.get('tool')) in (
            'submit_for_review', 'approve_review', 'reject_review')
        )
      )
      and not skill_loaded('task-transitions')
    effects:
      - type: inject_context
        template: 'Call get_skill(name="task-transitions") on gobby-skills, then continue.'
