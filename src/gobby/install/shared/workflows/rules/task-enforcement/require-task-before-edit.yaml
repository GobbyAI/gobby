tags: [task-enforcement, enforcement, tasks, gobby, default]

rules:
  require-task-before-edit:
    description: "Block file edits and opaque shell scripts without active task"
    event: before_tool
    enabled: true
    priority: 31
    when: >
      variables.get('require_task_before_edit')
      and (not variables.get('task_claimed') or claims_without_edit_target(variables))
      and (
        event.data.get('canonical_script_execution')
        or (
          event.data.get('canonical_repo_mutation')
          and requires_task_for_any_touched_file(tool_input, source, variables.get('plan_mode'), event.data)
        )
      )
    effects:
      - type: block
        reason: |
          Use create_task(title, category, claim=True) or claim_task(task_id) to
          unlock file edits — then retry this edit. If you already hold claims
          that wait on review, landing or close and none is active, reclaim the
          one this edit belongs to with claim_task(task_id), then retry.

          A shell script file (`bash x.sh`, or a path-invoked script without a
          non-shell #! interpreter) is classified by its body like a literal
          sh -c or bash -c string. It requires an active claim wherever it lives
          when its body cannot be read in full (missing, over 64 KiB, not UTF-8),
          runs a program unknown before it runs, or may write its own file, or
          when another part of the same command writes files. Programs read from
          stdin or by source/. always require a claim.

          Scratchpad and temp paths are exempt, but only when the command names
          them literally. A shell variable or substitution in the operand
          (`mkdir -p "$SP"`, `mkdir -p "$(dirname "$SOCK")"`) leaves no path to
          classify, and unknown scope counts as a repository write on purpose. If
          this command only touches your scratchpad, use the literal path and retry.
