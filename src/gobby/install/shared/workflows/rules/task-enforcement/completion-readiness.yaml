tags: [task-enforcement, enforcement, lifecycle, completion-readiness, gobby, default]

rules:
  require-completion-readiness-evidence:
    description: "Gate lifecycle success transitions until fresh verification evidence is ready"
    event: before_tool
    enabled: true
    priority: 50
    when: >
      not variables.get('plan_mode')
      and not tool_input.get('preview', False)
      and not completion_evidence_ready(variables, tool_input.get('task_id'))
      and (variables.get('target_task_has_edits') or variables.get('task_has_commits'))
    effects:
      - type: block
        mcp_tools:
          - "gobby-tasks:close_task"
          - "gobby-tasks-ops:complete_stage"
          - "gobby-tasks-ops:submit_for_review"
          - "gobby-tasks-ops:approve_review"
          - "gobby-tasks-ops:record_pr_opened"
          - "gobby-tasks-ops:open_delivery_pr"
          - "gobby-tasks-ops:record_pr_verdict"
          - "gobby-tasks-ops:record_merge_result"
          - "gobby-tasks-ops:close_linked_github_issue"
          - "gobby-merge:merge_apply"
        reason: |
          {{ completion_evidence_diagnostic(variables, tool_input.get('task_id')) }}

          Run project-appropriate verification commands for the changed work, such as tests, linters, formatting checks, type checks, builds, or other project-defined checks.
          Every terminal command is recorded automatically as a durable shell_command receipt.
          Readiness requires at least one successful verification receipt; failed and unknown
          receipts stay ranked first in the evidence packet for the semantic close gate.

          For batched Codex validation, emit every nested result as structured
          {cmd, ...result} output. Human summaries and text(result.output) do not
          expose a definitive shell exit code.

          For genuinely non-command evidence, call:
          record_verification_evidence(summary="...", evidence_type="manual_diff_review",
          supports="task_id:#123", command="...", scope="...", task_id="#123")
          Manual evidence must not restate or replace a shell command's exit code.

  block-direct-verification-evidence-variable-set:
    description: "Protect verification evidence variables from direct set_variable writes"
    event: before_tool
    enabled: true
    priority: 20
    when: >
      event.data.get('tool_name') in ('set_variable', 'mcp__gobby__set_variable')
      and tool_input.get('name') in ('verification_evidence_recorded', 'verification_evidence')
    effects:
      - type: block
        tools:
          - "set_variable"
          - "mcp__gobby__set_variable"
        reason: |
          verification_evidence_recorded and verification_evidence are managed by Gobby.
          Run a validation command or use gobby-sessions:record_verification_evidence.
