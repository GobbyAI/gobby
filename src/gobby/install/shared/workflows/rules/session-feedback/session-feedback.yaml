tags: [session-feedback, lifecycle, gobby, default]

rules:
  reset-gobby-session-feedback-on-context-reset:
    description: "Rearm the bounded Gobby-experience survey for a fresh context epoch"
    event: session_start
    enabled: true
    priority: 8
    when: >
      event.data.get('source') in ['clear', 'compact']
      or (
        event.data.get('source') == 'resume'
        and variables.get('pending_context_reset')
      )
    effects:
      - type: set_variable
        variable: _gobby_feedback_epoch_reviewed
        value: false

  mark-gobby-session-feedback-submitted:
    description: "Treat a successful gobby-sessions:feedback call as this epoch's survey response"
    event: after_tool
    enabled: true
    priority: 10
    when: >
      event.data.get('mcp_server') == 'gobby-sessions'
      and event.data.get('mcp_tool') == 'feedback'
      and tool_call_succeeded()
    effects:
      - type: set_variable
        variable: _gobby_feedback_epoch_reviewed
        value: true

  review-gobby-session-feedback-before-handoff:
    description: "Request one bounded Gobby-experience survey before set_handoff"
    event: before_tool
    enabled: true
    priority: 2
    when: >
      variables.get('_gobby_feedback_survey_active')
      and event.data.get('mcp_server') == 'gobby-sessions'
      and event.data.get('mcp_tool') == 'set_handoff'
      and (
        variables.get('task_claimed')
        or not variables.get('session_task')
      )
      and not variables.get('_gobby_feedback_epoch_reviewed')
    effects:
      - type: block
        delivery: on_receipt
        mcp_tools:
          - "gobby-sessions:set_handoff"
        acknowledge_variable: _gobby_feedback_epoch_reviewed
        reason: |
          Before handing off, perform one bounded Gobby-experience survey using
          only first-hand evidence from this context epoch. Call
          `gobby-sessions:feedback` with at most 3 observations. Required
          fields: source, kind (friction | bug | noise | surprise |
          missing-affordance | useful | other), evidence, impact, frequency
          (once | repeated | always). Optional: suggestion, disposition
          (worked-around | filed-task | fixed | escalated | noted). kind
          'other' requires kind_other_label and is only for observations no
          listed kind fits. Most epochs should send `observations: []`; that
          is valid and writes no rows.

          This survey is about Gobby (the daemon, rules, tools, and harness),
          not the current repository's product. Concrete defects in the current
          repo remain Found Work, as does an actionable Gobby defect you observed.
          'fixed' means you created the task claimed and closed it, or it remains
          claimed and in progress; put its #N ref in evidence. 'escalated' means
          you handed it to its active owner via send_message; put the owner session
          ref in evidence. 'filed-task' is rung 3 only: the #N task carries
          needs-decision or clean-window and its description explains why rungs 1
          and 2 do not apply. An unlabeled or unclaimed filing is shirked found
          work: the stop gate blocks on it and the nightly digest flags it. Every
          other disposition for a defect is shirked. Then retry
          `gobby-sessions:set_handoff` without duplicating the same
          observations in `gobby_feedback`.

  review-gobby-session-feedback-on-stop:
    description: "Request one bounded Gobby-experience survey after completed work"
    event: turn_end
    enabled: true
    priority: 3
    when: >
      variables.get('_gobby_feedback_survey_active')
      and bool(variables.get('_memory_pending_task_reviews'))
      and not variables.get('_gobby_feedback_epoch_reviewed')
    effects:
      - type: block
        delivery: on_receipt
        acknowledge_variable: _gobby_feedback_epoch_reviewed
        reason: |
          Perform one bounded Gobby-experience survey using only first-hand
          evidence from this session. Call `gobby-sessions:feedback` with at
          most 3 observations: source, kind (friction | bug | noise | surprise
          | missing-affordance | useful | other; 'other' needs
          kind_other_label), evidence, impact, frequency (once | repeated |
          always); optional suggestion and disposition (worked-around |
          filed-task | fixed | escalated | noted). Most sessions should send
          `observations: []`; that is valid and writes no rows.

          This survey is about Gobby, not the current repository's product.
          Concrete defects in the current repo remain Found Work, as does an
          actionable Gobby defect you observed. 'fixed' means you created the task
          claimed and closed it, or it remains claimed and in progress; put its
          #N ref in evidence. 'escalated' means you handed it to its active owner
          via send_message; put the owner session ref in evidence. 'filed-task'
          is rung 3 only: the #N task carries needs-decision or clean-window and
          its description explains why rungs 1 and 2 do not apply. An unlabeled
          or unclaimed filing is shirked found work: the stop gate blocks on it
          and the nightly digest flags it. Every other disposition for a defect
          is shirked. Omit secrets, private user content, and transcript dumps.
