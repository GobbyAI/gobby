tags: [memory-lifecycle, memory, daemon-recall, gobby, default]

rules:
  increment-parent-turn-seq:
    description: "Increment per-parent monotonic turn counter on each turn_start for memory recall freshness"
    event: turn_start
    enabled: true
    priority: 1
    when: >
      not variables.get('is_spawned_agent')
      and variables.get('parent_turn_seq') is not none
    effects:
      - type: set_variable
        variable: parent_turn_seq
        value: "{{ (variables.parent_turn_seq | int) + 1 }}"
