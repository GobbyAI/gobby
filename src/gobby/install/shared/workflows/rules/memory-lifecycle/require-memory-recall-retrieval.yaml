tags: [memory-lifecycle, memory, enforcement, gobby, default]

rules:
  require-memory-recall-before-tool:
    description: "Block all other tools until the oldest pending memory recall is retrieved"
    event: before_tool
    enabled: true
    priority: 10
    when: >
      pending_memory_recall_request_id()
      and not is_pending_memory_recall_call(tool_input)
    effects:
      - type: block
        reason: >-
          call_tool("gobby-memory", "get_recall_memories",
          {"recall_request_id":"{{ pending_memory_recall_request_id() }}"})
          to retrieve the pending memories, then continue.

  require-memory-recall-before-turn-end:
    description: "Block turn completion until the oldest pending memory recall is retrieved"
    event: turn_end
    enabled: true
    priority: 10
    when: "pending_memory_recall_request_id()"
    effects:
      - type: block
        reason: >-
          Retrieve the pending memories before finishing:
          call_tool("gobby-memory", "get_recall_memories",
          {"recall_request_id":"{{ pending_memory_recall_request_id() }}"}).
