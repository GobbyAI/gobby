tags: [memory-lifecycle, memory, lifecycle, gobby, default]

rules:
  memory-capture-nudge:
    description: "Nudge agent to save user preferences or facts as memories (once per session)"
    event: turn_start
    enabled: true
    priority: 50
    # Taskless spawned agents get daemon-composed prompts, not user preferences
    # worth capturing; skip the nudge for them until they hold task work.
    when: >
      not variables.get('memory_nudge_fired')
      and len((event.data.get('prompt') or '').strip()) >= 10
      and not (event.data.get('prompt') or '').strip().startswith('/')
      and not (variables.get('is_spawned_agent')
      and not variables.get('task_claimed') and not variables.get('auto_task_ref'))
    effects:
      - type: inject_context
        template: |
          If the user just told you something worth remembering across sessions
          (a preference, fact, convention, or instruction), save it with
          create_memory on gobby-memory. If not, carry on.

          Do NOT generalize one-time instructions into conventions. Only save
          if the user explicitly asked you to remember, or the fact would
          require multi-step exploration to rediscover. It's fine to save nothing.

          Do NOT create memories for bugs, errors, or issues you encounter.
          Create tasks instead so they get fixed.

          Draft direction, enhancement suggestions, and review findings are plan
          content. Keep them in the plan artifact or evidence. Reserve memory for
          explicit durable user preferences and finalized decisions.
      - type: set_variable
        variable: memory_nudge_fired
        value: true
