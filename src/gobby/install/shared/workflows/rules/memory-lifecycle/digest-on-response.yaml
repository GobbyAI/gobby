tags: [memory-lifecycle, memory, lifecycle, digest, gobby, default]

rules:
  digest-on-response:
    description: "Build turn record and append to digest after agent response"
    event: turn_end
    enabled: true
    priority: 11
    effects:
      - type: mcp_call
        server: gobby-memory
        tool: build_turn_and_digest
        background: true

  digest-prior-codex-turn-on-start:
    description: "Catch up the prior interrupted Codex turn at the next prompt"
    event: turn_start
    enabled: true
    priority: 10
    when: "event.source == 'codex'"
    effects:
      - type: mcp_call
        server: gobby-memory
        tool: build_turn_and_digest
        arguments:
          prior_turn_only: true
        background: true
