tags: [memory-lifecycle, memory, lifecycle, digest, gobby, default]

rules:
  digest-on-response:
    description: "Build turn record and append to digest after agent response"
    event: turn_end
    enabled: true
    priority: 11
    effects:
      - type: mcp_call
        server: gobby-memory
        tool: build_turn_and_digest
        background: true

  digest-catch-up-on-turn-start:
    description: "Catch up undigested prior turn at the next prompt (e.g. after daemon restart)"
    event: turn_start
    enabled: true
    priority: 10
    effects:
      - type: mcp_call
        server: gobby-memory
        tool: build_turn_and_digest
        arguments:
          prior_turn_only: true
        background: true
