tags: [memory-lifecycle, memory, lifecycle, tasks, gobby, default]

rules:
  search-memories-on-claim:
    description: "Nudge one memory search for the task subject after each successful claim"
    # after_tool is required: the nudge keys off the claim result, and the
    # claimed_tasks variable both claim tools merge before returning is the
    # proof the claim happened (a create_task without claim=true, a claim
    # conflict, or a "claim=true ignored" warning leaves the id out of it).
    # The proxy wraps call_tool results as {success, result}; native MCP
    # callers deliver the bare payload, so both shapes are read.
    event: after_tool
    enabled: true
    priority: 13
    when: >
      event.data.get('mcp_server') == 'gobby-tasks'
      and event.data.get('mcp_tool') in ('claim_task', 'create_task')
      and isinstance(event.data.get('tool_output'), dict)
      and (
        event.data.get('tool_output', {}).get('task_id')
          in (variables.get('claimed_tasks') or {})
        or event.data.get('tool_output', {}).get('id')
          in (variables.get('claimed_tasks') or {})
        or (
          isinstance(event.data.get('tool_output', {}).get('result'), dict)
          and (
            event.data.get('tool_output', {}).get('result', {}).get('task_id')
              in (variables.get('claimed_tasks') or {})
            or event.data.get('tool_output', {}).get('result', {}).get('id')
              in (variables.get('claimed_tasks') or {})
          )
        )
      )
    effects:
      - type: inject_context
        template: >
          Task claimed. Before editing, search project memory for its subject:
          `gobby-memory:search_memories(query="{{ tool_input.get('title') or '<task title>' }}")`.
          Judge each hit by its `rationale`, `similarity`, and `memory_type`;
          search results are evidence, not authority.
