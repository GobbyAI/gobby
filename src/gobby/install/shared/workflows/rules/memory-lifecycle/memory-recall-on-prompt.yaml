tags: [memory-lifecycle, memory, lifecycle, gobby, default]

rules:
  memory-recall-on-prompt:
    description: "Neutralized legacy raw memory recall rule; daemon-owned recall handles turn_start"
    event: turn_start
    enabled: true
    priority: 10
    when: "false"
    effects:
      - type: set_variable
        variable: legacy_memory_recall_rule_disabled
        value: true
