tags: [memory-lifecycle, memory, lifecycle, digest, gobby, default]

rules:
  digest-on-plan-turn-end:
    description: "Build digest when a provider-specific plan mode turn ends"
    event: after_tool
    enabled: true
    priority: 11
    when: "event.data.get('tool_name') in ('ExitPlanMode', 'AskUserQuestion', 'request_user_input', 'ExitSpecMode', 'AskUser')"
    effects:
      - type: mcp_call
        server: gobby-memory
        tool: build_turn_and_digest
        background: true
