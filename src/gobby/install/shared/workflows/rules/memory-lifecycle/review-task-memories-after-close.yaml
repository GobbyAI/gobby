tags: [memory-lifecycle, memory, lifecycle, tasks, gobby, default]

rules:
  queue-task-memory-review-after-close:
    description: "Queue completed worked leaves for one post-close memory review"
    event: after_tool
    enabled: true
    priority: 13
    when: >
      event.data.get('mcp_server') == 'gobby-tasks'
      and event.data.get('mcp_tool') == 'close_task'
      and tool_call_succeeded()
      and isinstance(event.data.get('tool_output'), dict)
    effects:
      - type: set_variable
        variable: _memory_pending_task_reviews
        value: "queue_memory_review_close(event.data, tool_input)"

  review-closed-task-memories-on-stop:
    description: "Consume pending closures and request one bounded memory review continuation"
    event: stop
    enabled: true
    priority: 2
    when: "bool(variables.get('_memory_pending_task_reviews'))"
    effects:
      - type: set_variable
        variable: _memory_pending_task_reviews
        value: []
      - type: block
        reason: >
          Task(s) closed. Review related memories with
          `gobby-memory:review_task_memories`; update/delete stale entries or record
          durable knowledge only when warranted. Most tasks need no memory write. Use
          the returned `source_task_id` for any new memory.
