tags: [auto-task, task, autonomous, lifecycle, gobby, default]

rules:
  inject-autonomous-mode:
    description: "Inject autonomous task execution context once per context epoch and every 5 turns"
    event: turn_start
    enabled: true
    priority: 60
    # turns_since_compact resets to 0 on compact, so a stored marker above the
    # current counter means a new context epoch began — re-inject once, then
    # every 5 turns within the epoch. The guide-task-continuation turn_end gate
    # re-states the mode event-driven whenever the agent tries to stop early.
    when: >
      variables.get('auto_task_ref')
      and (variables.get('autonomous_mode_reminder_turn') is None
      or (variables.get('turns_since_compact') or 0)
      < (variables.get('autonomous_mode_reminder_turn') or 0)
      or (variables.get('turns_since_compact') or 0)
      - (variables.get('autonomous_mode_reminder_turn') or 0) >= 5)
    effects:
      - type: inject_context
        template: |
          You are in autonomous task execution mode.

          Auto-task: {{ variables.auto_task_ref or '(unknown)' }}
          {% if variables.get('goal_file') %}
          Goal doc: {{ variables.goal_file }} — this file defines the loop
          procedure, budgets, and stop conditions. Read it before continuing
          if it is not in context, and follow its procedure for this task
          tree.
          {% else %}
          Work on this task and its subtasks until completion.
          Use suggest_next_task() to find available work.
          {% endif %}
          When {{ variables.auto_task_ref or '(unknown)' }} is completed, you may stop.
      - type: set_variable
        variable: autonomous_mode_reminder_turn
        value: "variables.get('turns_since_compact') or 0"
