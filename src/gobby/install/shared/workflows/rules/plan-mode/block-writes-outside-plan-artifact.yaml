tags: [plan-mode, enforcement, gobby, default]

rules:
  block-writes-outside-plan-artifact:
    description: "Limit planning-session file edits to the current artifact and provider scratch paths"
    event: before_tool
    enabled: true
    priority: 21
    when: >
      (
        (
          variables.get('_agent_type') == 'planner'
          and not task_state_in(
            variables.get('assigned_task_id'),
            'review_approved', 'escalated', 'closed'
          )
        )
        or (
          variables.get('plan_review_mode') == 'delegated'
          and variables.get('interactive_lock_label')
        )
      )
      and not plan_write_paths_allowed(
        tool_input,
        source,
        variables.get('artifact_path'),
        True
      )
    effects:
      - type: block
        tools: [Edit, Write, NotebookEdit]
        reason: |
          Use the writable surfaces (plan file, provider user directory, OS temp)
          while planning. Every target must qualify; a missing artifact_path still
          permits approved scratch paths. Other edits resume after ExitPlanMode.
