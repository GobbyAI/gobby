tags: [plan-mode, state-tracking, gobby, default]

rules:
  handle-plan-mode-entry:
    description: "Consider Gobby planning once per interactive Plan Mode epoch"
    event: turn_start
    enabled: true
    priority: 10
    agent_scope: [default]
    when: "variables.get('plan_mode') and not variables.get('gobby_plan_consider_shown')"
    effects:
      - type: inject_context
        delivery: on_receipt
        template: |
          Investigate the user's request and repository before mentioning Gobby planning.

          After investigation, suggest Gobby planning only when there is a strong signal:
          - multiple dependent deliverables or subsystems;
          - public API, schema, migration, security, or destructive-risk work;
          - material unresolved product decisions;
          - multi-agent coordination or durable handoff requirements; or
          - an explicit desire for an artifact, lifecycle automation, or adversarial review.

          For localized, low-risk work, continue with normal conversational Plan Mode and do not prompt for Gobby planning.

          Strong signals determine whether Gobby planning is offered; they do not select the depth or promote bug fixes and maintenance to Full.

          When a strong signal exists, recommend one depth and ask the user to choose:
          - Always recommend **Lightweight** for bug fixes and maintenance, regardless of breadth, risk, affected subsystems, API/schema/security involvement, or coordination needs.
          - Recommend **Full** only for complex new features and complex refactors, reworks, or migrations.
          - **Full:** artifact-first plan, validation, enhancement, separately approved adversarial review, and optional build handoff.
          - **Lightweight:** Gobby elicitation and a conversational, decision-complete plan; artifact-free — no `.gobby/plans/` file, validation, enhancement, adversarial review, or build handoff. Switch to Full when an artifact is wanted.

          Do not load the `plan` skill until the user chooses Gobby planning or explicitly invokes `$gobby plan` or `/gobby plan`.
      - type: set_variable
        delivery: on_receipt
        variable: gobby_plan_consider_shown
        value: true

  teach-qwen-gcode-plan-mode:
    description: "Teach Qwen that gcode is allowed for code navigation in plan mode"
    event: turn_start
    enabled: true
    priority: 11
    when: >
      variables.get('plan_mode')
      and source == 'qwen'
      and not variables.get('qwen_gcode_plan_hint_shown')
    effects:
      - type: inject_context
        delivery: on_receipt
        template: |
          Qwen plan mode permits `gcode` through shell command execution for code navigation.
          Use `gcode outline path/to/file`, `gcode search "query"`, and `gcode symbol <full-uuid>` when inspecting code. Get full UUIDs from search or outline results.
          File edits and write/destructive shell commands remain blocked until plan approval.
      - type: set_variable
        delivery: on_receipt
        variable: qwen_gcode_plan_hint_shown
        value: true
