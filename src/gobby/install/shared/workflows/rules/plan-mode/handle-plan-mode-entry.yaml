tags: [plan-mode, state-tracking, gobby, default]

rules:
  handle-plan-mode-entry:
    description: "Request the plan reference once per interactive Plan Mode period"
    event: turn_start
    enabled: true
    priority: 10
    agent_scope: [default]
    when: "variables.get('plan_mode') and not variables.get('plan_skill_directive_delivered')"
    effects:
      - type: load_skill
        delivery: on_receipt
        skill: gobby:references/plan/overview.md
      - type: set_variable
        delivery: on_receipt
        variable: plan_skill_directive_delivered
        value: true
