tags: [plan-mode, state-tracking, gobby, default]

rules:
  handle-plan-mode-exit:
    description: "Clear plan_mode when ExitPlanMode succeeds (agent-initiated exit)"
    event: after_tool
    enabled: true
    priority: 10
    when: >
      event.data.get('tool_name') == 'ExitPlanMode'
      and not event.metadata.get('is_failure')
    effects:
      - type: set_variable
        variable: plan_mode
        value: false
      - type: set_variable
        variable: qwen_gcode_plan_hint_shown
        value: false
      - type: set_variable
        variable: gobby_plan_consider_shown
        value: false

  reset-plan-consider-on-resolved-mode-exit:
    description: "Reset the Consider epoch after authoritative Plan Mode exit"
    event: turn_start
    enabled: true
    priority: 9
    agent_scope: [default]
    when: "not variables.get('plan_mode') and variables.get('gobby_plan_consider_shown')"
    effects:
      - type: set_variable
        variable: gobby_plan_consider_shown
        value: false
