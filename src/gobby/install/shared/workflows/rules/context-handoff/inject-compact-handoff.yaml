tags: [context-handoff, context, handoff, lifecycle, gobby, default]

rules:
  inject-compact-handoff:
    description: "Inject session summary context after compaction"
    event: session_start
    enabled: true
    priority: 11
    when: "event.data.get('source') == 'compact'"
    effects:
      - type: inject_context
        template: |
          ## Continuation Context
          *Injected by Gobby session handoff*

          {{ session_summary }}
          {% set resume_skills = variables.get('compact_resume_required_skills') or [] %}
          {% if resume_skills %}

          ## Required Skill Reload
          Reload these required skills with progressive discovery before continuing:

          {% for skill in resume_skills %}
          {{ skill_fetch_directive(skill) }}
          {% endfor %}
          {% endif %}
      - type: set_variable
        variable: compact_resume_required_skills
        value: []
