tags: [context-handoff, context, handoff, lifecycle, gobby, default]

rules:
  preserve-context-on-compact:
    description: "Reset tracking and extract context before compaction"
    event: pre_compact
    enabled: true
    priority: 5
    when: "True"
    effects:
      - type: set_variable
        variable: injected_memory_ids
        value: []
      - type: set_variable
        variable: pending_context_reset
        value: true
      - type: set_variable
        variable: handoff_source
        value: "compact"
      - type: set_variable
        variable: last_compacted_turn_seq
        value: "variables.get('parent_turn_seq') or 0"
      - type: set_variable
        variable: turns_since_compact
        value: 0
      - type: set_variable
        variable: context_compact_mid_turn_pressure_band
        value: "none"
      - type: set_variable
        variable: context_compact_guidance_shown_kinds
        value: []
      - type: set_variable
        variable: context_compact_soft_nudge_tools
        value: 0
      - type: set_variable
        variable: context_compact_handoff_result
        value: null
      - type: set_variable
        variable: gobby_plan_consider_shown
        value: false
      - type: set_variable
        variable: brevity_reminder_turn
        value: null
      - type: set_variable
        variable: restraint_reminder_turn
        value: null
      - type: set_variable
        variable: autonomous_mode_reminder_turn
        value: null
