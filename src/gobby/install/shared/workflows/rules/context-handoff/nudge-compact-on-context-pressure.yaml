tags: [context-handoff, context, compact, lifecycle, gobby, default]

rules:
  nudge-compact-on-context-pressure:
    description: "Repeat context-pressure warnings every turn until the configured block limit"
    event: turn_start
    enabled: true
    priority: 30
    when: "variables.get('context_compact_guidance_message')"
    effects:
      - type: load_skill
        skill: gobby:references/sessions/handoffs.md
        when: >-
          not variables.get('handoff_pull_pending')
          and variables.get('context_compact_guidance_kind') in ('warn', 'block', 'unknown')
          and not skill_loaded('gobby:references/sessions/handoffs.md')
      - type: inject_context
        template: |
          {{ variables.get('context_compact_guidance_message') }}
          Warnings repeat every turn start and at the configured tool-call cadence; reaching the block limit restricts tool use to handoff prerequisites.
          `gobby-sessions:set_handoff` persists the handoff, then compacts the current session in place. Planning, review, and ongoing task work use this compact path; pass `clear_session=true` only between tasks after the current task closes.

  nudge-compact-on-context-pressure-mid-turn:
    description: "Repeat context-pressure warnings at the configured mid-turn cadence"
    event: after_tool
    enabled: true
    priority: 30
    when: "variables.get('context_compact_guidance_message')"
    effects:
      - type: load_skill
        skill: gobby:references/sessions/handoffs.md
        when: >-
          not variables.get('handoff_pull_pending')
          and variables.get('context_compact_guidance_kind') in ('warn', 'block', 'unknown')
          and not skill_loaded('gobby:references/sessions/handoffs.md')
      - type: inject_context
        template: |
          {{ variables.get('context_compact_guidance_message') }}
          Warnings repeat every turn start and at the configured tool-call cadence; reaching the block limit restricts tool use to handoff prerequisites.
          `gobby-sessions:set_handoff` persists the handoff, then compacts the current session in place. Planning, review, and ongoing task work use this compact path; pass `clear_session=true` only between tasks after the current task closes.
