tags: [context-handoff, context, wiki, overview, lifecycle, gobby, default]

rules:
  inject-wiki-overview:
    description: "Inject the project wiki overview once per context epoch at first prompt"
    event: turn_start
    enabled: true
    priority: 13
    # Taskless spawned agents (reviewers, adversaries) never query the wiki;
    # skip the block for them until they claim a task or run an auto-task tree.
    when: >
      variables.get('wiki_overview') and not variables.get('wiki_overview_injected')
      and not (variables.get('is_spawned_agent')
      and not variables.get('task_claimed') and not variables.get('auto_task_ref'))
    effects:
      - type: inject_context
        template: |
          <!-- gobby:injected-context:begin -->
          ## Project Wiki
          *Injected by Gobby wiki overview*

          {{ wiki_overview }}

          Query the wiki through the gobby-wiki MCP server (`wiki_search`, `wiki_read`).
          <!-- gobby:injected-context:end -->
      - type: set_variable
        variable: wiki_overview_injected
        value: true
