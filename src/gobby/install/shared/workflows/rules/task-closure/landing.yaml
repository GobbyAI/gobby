version: "3.0.0"
tags: [task-closure-general]

rules:
  landing-requires-implementation:
    description: Coding delivery preserves the author's exact-candidate implementation proof.
    event: task_land
    priority: 20
    when: >-
      task.get('category') in ['code', 'config', 'docs', 'refactor', 'test'] and
      'epic-devteam' not in (task.get('labels') or []) and
      (latest_attestation('implementation').get('result') != 'approved' or
       (latest_attestation('implementation').get('reference') or {}).get('scheme') != 'git' or
       (latest_attestation('implementation').get('reference') or {}).get('value') != facts.get('candidate_commit_sha'))
    attestation_shape:
      kinds: [implementation]
      result: approved
      reference: {scheme: git, value_pattern: '[0-9a-f]{40}'}
      applies_when: >-
        task.get('category') in ['code', 'config', 'docs', 'refactor', 'test'] and
        'epic-devteam' not in (task.get('labels') or [])
    effects:
      - type: block
        reason: Record approved implementation evidence for this exact Git candidate before landing.

  landing-requires-path-grant-or-independent-review:
    description: A declared integration path grant permits self-delivery; other delivery needs independent review.
    event: task_land
    priority: 30
    when: >-
      not holds_capability(caller.get('capabilities', []), 'waive_review_gates') and
      not facts.get('integration_path_grant', False) and
      not any(record.get('kind') == 'independent-review' and record.get('result') == 'approved' and
        record.get('id') == latest_attestation('independent-review').get('id') and
        (record.get('reference') or {}).get('scheme') == 'git' and
        (record.get('reference') or {}).get('value') == facts.get('candidate_commit_sha') and
        all(record.get('session_id') != maker.get('session_id') for maker in attestations
          if maker.get('kind') in ['test-before', 'implementation', 'test-after'])
        for record in attestations)
    effects:
      - type: block
        reason: Delivery requires a declared integration path grant or independent review of this candidate.
