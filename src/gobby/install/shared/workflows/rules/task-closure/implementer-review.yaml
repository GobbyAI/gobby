version: "3.0.0"
tags: [task-closure-implementer-review]

# No implementer of a task may attest review of that task's work. A definition holding
# waive_review_gates (the "*" wildcard holds it) is exempt at gate and record time. Each rule's `attestation_authorship`
# is enforced at record time; its `when` is the closure and landing gate. The gate reads
# the latest record of each review kind, so a later independent review supersedes an
# earlier implementer review. The gate does not read self-review: record time still refuses
# a new self-review from an implementer, but a legacy self-review never blocks closure.
rules:
  closure-review-by-implementer-refused:
    description: A review an implementer of this task recorded cannot satisfy closure.
    event: task_close
    priority: 30
    when: &implementer_review_refused >-
      not holds_capability(caller.get('capabilities', []), 'waive_review_gates') and
      reason == 'done' and facts.get('closure_intent', 'explicit') != 'ancestor' and
      any(latest_attestation(a.get('kind')).get('session_id') in
          [i.get('session_id') for i in all_attestations if i.get('kind') == 'implementation']
          for a in attestations if a.get('kind') not in ['test-before', 'implementation', 'test-after', 'self-review'])
    attestation_authorship:
      implementation_kind: implementation
      maker_kinds: [test-before, implementation, test-after]
    effects:
      - type: block
        reason: An implementer of this task cannot attest its review. Route the review to an independent seat.

  landing-review-by-implementer-refused:
    description: A review an implementer of this task recorded cannot satisfy landing.
    event: task_land
    priority: 30
    when: *implementer_review_refused
    effects:
      - type: block
        reason: An implementer of this task cannot attest its review. Route the review to an independent seat.
