tags: [stop-gates, enforcement, lifecycle, found-work, gobby, default]

rules:
  block-found-work-permission-deferral:
    description: "Alert once per session on permission-seeking deferral of an actionable defect"
    event: turn_end
    enabled: true
    priority: 42
    when: >
      found_work_shirk
      and not variables.get('found_work_shirk_alerted')
      and not variables.get('plan_mode')
      and not variables.get('is_spawned_agent')
      and not has_active_agent_wait()
      and variables.get('stop_attempts', 0) < variables.get('max_stop_attempts', 8)
    effects:
      - type: set_variable
        delivery: on_receipt
        variable: found_work_shirk_alerted
        value: true
      - type: set_variable
        variable: found_work_shirk_confirmed
        value: "{{ found_work_shirk_confirmed }}"
      - type: block
        delivery: on_receipt
        reason: >-
          Found-work ladder: add it to the claimed task's native tracker and fix it now,
          hand it to its active owner via
          send_message, or — edge case — file it labeled needs-decision/clean-window with the
          reason. Don't ask, and don't go silent. This alert fires once per session — act on
          it, or stop again to proceed.

  block-terminal-validation-failure:
    description: "Block stop while a validation failure has no covering green run or disposition"
    event: turn_end
    enabled: true
    priority: 43
    when: >
      terminal_validation_failure
      and not variables.get('plan_mode')
      and not variables.get('is_spawned_agent')
      and not has_active_agent_wait()
      and variables.get('stop_attempts', 0) < variables.get('max_stop_attempts', 8)
    effects:
      - type: block
        reason: |
          Found-work ladder: terminal validation failure remains unresolved:
          {{ terminal_validation_failure_commands | join('\n') }}
          Fix it inside the claimed task, hand a confined foreign failure to its active
          owner via send_message after a scoped green rerun, or file the edge case with a
          needs-decision/clean-window label and reason.

  block-unclaimed-found-work:
    description: "Block stop while this session's found-work filings remain unclaimed"
    event: turn_end
    enabled: true
    priority: 44
    when: >
      unclaimed_found_work
      and not variables.get('plan_mode')
      and not variables.get('is_spawned_agent')
      and not has_active_agent_wait()
      and variables.get('stop_attempts', 0) < variables.get('max_stop_attempts', 8)
    effects:
      - type: block
        reason: >-
          Found-work ladder: this session filed {{ unclaimed_found_work_tasks | join(', ') }} and
          left them unclaimed. Claim and finish each one now (claim_task, fix, close), hand it to
          its active owner via send_message, or — edge case only — label it
          needs-decision/clean-window with the reason in its description. Filing is not a terminal
          state.
