tags: [stop-gates, enforcement, lifecycle, found-work, gobby, default]

rules:
  block-found-work-permission-deferral:
    description: "Block permission-seeking deferral of an actionable defect"
    event: turn_end
    enabled: true
    priority: 42
    when: >
      found_work_shirk
      and not variables.get('plan_mode')
      and not variables.get('is_spawned_agent')
      and not has_active_agent_wait()
    effects:
      - type: block
        reason: >-
          Rule 4 ladder: fix it now (create_task claim=true), hand it to its active owner via
          send_message, or — edge case — file it labeled needs-decision/clean-window with the
          reason. Don't ask, and don't go silent.

  block-terminal-validation-failure:
    description: "Block stop while a validation failure has no covering green run or disposition"
    event: turn_end
    enabled: true
    priority: 43
    when: >
      terminal_validation_failure
      and not variables.get('plan_mode')
      and not variables.get('is_spawned_agent')
      and not has_active_agent_wait()
    effects:
      - type: block
        reason: |
          Rule 4 ladder: terminal validation failure remains unresolved:
          {{ terminal_validation_failure_commands | join('\n') }}
          Fix it now (create_task claim=true), hand a confined foreign failure to its active
          owner via send_message after a scoped green rerun, or file the edge case with a
          needs-decision/clean-window label and reason.

  remind-found-work-after-close:
    description: "Prompt one Rule-4 sweep after each successful task close"
    event: after_tool
    enabled: true
    priority: 42
    when: >
      event.data.get('mcp_server') == 'gobby-tasks'
      and event.data.get('mcp_tool') == 'close_task'
      and tool_call_succeeded()
      and isinstance(event.data.get('tool_output'), dict)
      and (
        event.data.get('tool_output', {}).get('closed') is True
        or (
          isinstance(event.data.get('tool_output', {}).get('result'), dict)
          and event.data.get('tool_output', {}).get('result', {}).get('closed') is True
        )
      )
    effects:
      - type: inject_context
        template: >-
          Task closed. Rule 4 sweep before you stop: anything you noticed this session and didn't
          act on? Fix it now (new claimed task), hand it to its active owner via send_message, or —
          edge case only — file it labeled needs-decision/clean-window with the reason. Don't end
          with should-I-fix.
