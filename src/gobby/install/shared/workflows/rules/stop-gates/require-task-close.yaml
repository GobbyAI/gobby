tags: [stop-gates, enforcement, lifecycle, gobby, default]

rules:
  require-task-close:
    description: "Block stop if active claimed task work is still open"
    event: turn_end
    enabled: true
    priority: 50
    when: "not variables.get('plan_mode') and not variables.get('is_spawned_agent') and not has_durable_stop_wait() and variables.get('mode_level', 2) >= 1 and variables.get('task_claimed')"
    effects:
      - type: block
        reason: |
          This session has claimed tasks: {{ claimed_tasks.values() | list | join(', ') or '(unknown)' }}. Each one needs a legal exit before the turn can end:
          - Done: commit its files, clear any gates, then call gobby-tasks:close_task with the commit_sha.
          - Waiting on a running agent or close review: call gobby-agents:wait_for_agent, then end the turn.
          - Waiting on a restart, landing or reply from another session: call gobby-agents:wait_for_coordination, then end the turn.
          - Blocked by another open task: record it with gobby-tasks:add_dependency (task_id=<claimed>, depends_on=<blocker>).
          - Stuck or needing a human decision: call gobby-tasks:escalate_task with the reason.
          Restating status without taking one of these exits keeps this gate firing.
