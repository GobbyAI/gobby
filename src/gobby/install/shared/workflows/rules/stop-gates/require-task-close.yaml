tags: [stop-gates, enforcement, lifecycle, gobby, default]

rules:
  require-task-close:
    description: "Block stop if active claimed task work is still open"
    event: turn_end
    enabled: true
    priority: 50
    when: "not variables.get('plan_mode') and not variables.get('is_spawned_agent') and not variables.get('waiting_on_user_input') and not has_active_agent_wait() and variables.get('mode_level', 2) >= 1 and variables.get('task_claimed') and not all_tasks_have_label(list((variables.get('claimed_tasks') or {}).keys()), 'live-session') and variables.get('stop_attempts', 0) < variables.get('max_stop_attempts', 8)"
    effects:
      - type: block
        reason: |
          This session has claimed tasks: {{ claimed_tasks.values() | list | join(', ') or '(unknown)' }}. You must commit and clear any gates before closing the task(s).
