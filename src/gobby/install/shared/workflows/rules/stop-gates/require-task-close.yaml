tags: [stop-gates, enforcement, lifecycle, gobby, default]

rules:
  require-task-close:
    description: "Block stop if active claimed task work is still open"
    event: turn_end
    enabled: true
    priority: 50
    when: "not variables.get('plan_mode') and not variables.get('is_spawned_agent') and variables.get('mode_level', 2) >= 1 and variables.get('task_claimed') and variables.get('stop_attempts', 0) < variables.get('max_stop_attempts', 8)"
    effects:
      - type: block
        reason: |
          Active claimed tasks still require explicit handoff or closure: {{ claimed_tasks.values() | list | join(', ') or '(unknown)' }}.
          Close the task, de-escalate it if human intervention already resolved the blocker, or explicitly release the claim before stopping.
