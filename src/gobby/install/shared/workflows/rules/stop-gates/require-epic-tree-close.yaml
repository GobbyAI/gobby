tags: [stop-gates, enforcement, lifecycle, gobby, default]

rules:
  require-epic-tree-close:
    description: "Block stop if epic or any subtask is not closed"
    event: turn_end
    enabled: true
    priority: 51
    agent_scope: [default]
    when: >-
      not variables.get('plan_mode')
      and variables.get('task_claimed')
      and not has_durable_stop_wait()
      and not task_tree_complete(list((variables.get('claimed_tasks') or {}).keys()))
    effects:
      - type: block
        reason: |
          Epic tree not complete: a claimed task or a task in its own subtree is still open. Claimed tasks: {{ claimed_tasks.values() | list | join(', ') or '(unknown)' }}.
          Close each claimed task and every open task in its own subtree; the claimed task's parent epic can stay open. Use gobby-tasks:list_tasks(parent_task_id=...) to find the open subtasks, and gobby-tasks:close_task to close each one.
          To end the turn while that work waits instead: gobby-agents:wait_for_agent for a running agent or close review, gobby-agents:wait_for_coordination for a restart, landing or reply from another session, gobby-tasks:add_dependency when a claimed task is blocked by another open task, or gobby-tasks:escalate_task with the reason.
