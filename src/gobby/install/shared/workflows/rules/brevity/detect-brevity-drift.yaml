tags: [brevity, gobby, default]

rules:
  detect-brevity-literal-drift:
    description: "Persist banned brevity literal matches after an assistant response"
    event: turn_end
    enabled: true
    priority: 30
    when: >
      skill_loaded('brevity')
      and not variables.get('brevity_disabled')
      and assistant_response_matches_any([
        'Great question',
        "I'd be happy to",
        'Certainly',
        'Of course',
        'Let me break this down',
        "It's worth noting",
        'In summary',
        'In conclusion',
        'Hope this helps',
        'Feel free to ask',
        'If you want, I can also',
        'If you tell me',
        'My next step could be',
        'in other words',
      ])
    effects:
      - type: set_variable
        variable: brevity_last_violation
        value: >
          assistant_response_matches_any([
            'Great question',
            "I'd be happy to",
            'Certainly',
            'Of course',
            'Let me break this down',
            "It's worth noting",
            'In summary',
            'In conclusion',
            'Hope this helps',
            'Feel free to ask',
            'If you want, I can also',
            'If you tell me',
            'My next step could be',
            'in other words',
          ])
      - type: set_variable
        variable: brevity_last_violation_rule
        value: "banned literal phrase"

  detect-brevity-contrastive-drift:
    description: "Persist conservative negation-contrastive matches after an assistant response"
    event: turn_end
    enabled: true
    priority: 31
    when: >
      skill_loaded('brevity')
      and not variables.get('brevity_disabled')
      and not variables.get('brevity_last_violation')
      and assistant_response_matches_any([
        r'\bnot\b\s+[^.!?\n,;:]{1,80}?,\s*\bnot\b\s+[^.!?\n,;:]{1,80}?,\s*\bbut\b\s+[^.!?\n]{1,120}',
        r'\bnot\b\s+[^.!?\n,;:]{1,120}?,\s*\bbut\b\s+[^.!?\n]{1,120}',
        r'\b(?!not\b)[A-Z0-9][^.!?\n,;:]{1,120}?,\s*\bnot\b\s+[^.!?\n]{1,120}',
      ], regex=true)
    effects:
      - type: set_variable
        variable: brevity_last_violation
        value: >
          assistant_response_matches_any([
            r'\bnot\b\s+[^.!?\n,;:]{1,80}?,\s*\bnot\b\s+[^.!?\n,;:]{1,80}?,\s*\bbut\b\s+[^.!?\n]{1,120}',
            r'\bnot\b\s+[^.!?\n,;:]{1,120}?,\s*\bbut\b\s+[^.!?\n]{1,120}',
            r'\b(?!not\b)[A-Z0-9][^.!?\n,;:]{1,120}?,\s*\bnot\b\s+[^.!?\n]{1,120}',
          ], regex=true)
      - type: set_variable
        variable: brevity_last_violation_rule
        value: "contrastive framing"
