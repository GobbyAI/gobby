tags: [brevity, gobby, default]

rules:
  opt-out-brevity:
    description: "Allow exact user prompts to disable brevity for the session"
    event: turn_start
    enabled: true
    priority: 18
    when: >
      ((event.data.get('prompt') or event.data.get('user_prompt') or '').strip().lower())
      == 'stop brevity'
    effects:
      - type: set_variable
        variable: brevity_disabled
        value: true

  load-brevity-on-turn-start:
    description: "Load brevity while it is enabled"
    event: turn_start
    enabled: true
    priority: 20
    when: >
      not variables.get('brevity_disabled')
      and not skill_loaded('brevity')
      and not variables.get('handoff_pull_pending')
    effects:
      - type: load_skill
        skill: brevity

  inject-brevity-drift-feedback:
    description: "Carry the last brevity drift match into the next turn"
    event: turn_start
    enabled: true
    priority: 21
    when: >
      skill_loaded('brevity')
      and not variables.get('brevity_disabled')
      and variables.get('brevity_last_violation')
    effects:
      - type: inject_context
        template: >
          Brevity drift detected last turn: {{ brevity_last_violation_rule }}
          matched `{{ brevity_last_violation }}`. Answer directly; remove filler
          and contrastive framing.
      - type: set_variable
        variable: brevity_last_violation
        value: ""
      - type: set_variable
        variable: brevity_last_violation_rule
        value: ""

  remind-brevity-on-turn-start:
    description: "Reinforce brevity once per context epoch and every 5 turns"
    event: turn_start
    enabled: true
    priority: 22
    # turns_since_compact resets to 0 on compact, so a stored marker above the
    # current counter means a new context epoch began — re-remind once, then
    # every 5 turns within the epoch.
    when: >
      skill_loaded('brevity') and not variables.get('brevity_disabled')
      and (variables.get('brevity_reminder_turn') is None
      or (variables.get('turns_since_compact') or 0)
      < (variables.get('brevity_reminder_turn') or 0)
      or (variables.get('turns_since_compact') or 0)
      - (variables.get('brevity_reminder_turn') or 0) >= 5)
    effects:
      - type: inject_context
        template: "Brevity reminder ({{ brevity_level }}): answer first; keep context tight."
      - type: set_variable
        variable: brevity_reminder_turn
        value: "variables.get('turns_since_compact') or 0"
