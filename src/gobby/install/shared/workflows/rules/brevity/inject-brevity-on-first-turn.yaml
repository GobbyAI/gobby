tags: [brevity, gobby, default]

rules:
  inject-brevity-on-first-turn:
    description: "Prompt the agent to load brevity on the first user turn of each session"
    event: turn_start
    enabled: true
    priority: 20
    when: "not skill_loaded('brevity')"
    effects:
      - type: inject_context
        template: 'Call get_skill(name="brevity") on gobby-skills, then continue.'
