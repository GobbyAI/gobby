tags: [impeccable, design, gobby, default, enforcement]

# Gobby rules own Impeccable edit-time enforcement (see the bundled impeccable
# skill's references/hooks.md). The detector scripts live in the project's
# installed skill root; when that root is absent the run_command effect
# fail-opens and the rules are inert. The detector reads the raw hook event
# JSON on stdin and routes on hook_event_name (Claude-style names). The
# run_command boundary preserves provider fields and synthesizes PostToolUse or
# Stop only when the provider omitted that envelope field.

rules:
  impeccable-edit-pass:
    description: "Run the Impeccable immediate-tier design detector after UI file edits"
    event: after_tool
    enabled: true
    priority: 60
    # UI predicate shared with skill-discovery/require-impeccable-skill.yaml:
    # component/style/markup extensions match anywhere; bare .ts/.js/.mjs/.cjs
    # match only under a web/ segment so skill scripts and Node tooling stop
    # counting as UI edits.
    when: >
      event.data.get('canonical_tool_kind') == 'write'
      and (
        event.data.get('canonical_file_path', '').endswith(('.tsx', '.jsx', '.vue', '.svelte', '.astro', '.css', '.scss', '.html'))
        or (
          event.data.get('canonical_file_path', '').endswith(('.ts', '.js', '.mjs', '.cjs'))
          and (
            '/web/' in event.data.get('canonical_file_path', '')
            or event.data.get('canonical_file_path', '').startswith('web/')
          )
        )
      )
    effects:
      - type: set_variable
        variable: impeccable_ui_edited_this_turn
        value: true
      - type: run_command
        command: ["node"]
        skill: impeccable
        script: hook.mjs
        timeout_seconds: 5
        inject_result: true

  impeccable-deep-pass:
    description: "Run the Impeccable full-rule deep pass at turn end; findings arrive next turn"
    event: turn_end
    enabled: true
    priority: 60
    when: "variables.get('impeccable_ui_edited_this_turn', False)"
    effects:
      - type: set_variable
        variable: impeccable_ui_edited_this_turn
        value: false
      - type: run_command
        command: ["node"]
        skill: impeccable
        script: hook.mjs
        timeout_seconds: 30
        background: true
