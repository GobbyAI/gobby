tags: [code-index, gobby, default]

rules:
  block-and-teach-code-index:
    description: "Block first code file read/grep, require code-index skill to teach gcode"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('code-index')
      and (
        (event.data.get('canonical_tool_kind') == 'read'
         and event.data.get('canonical_file_path', '').rpartition('.')[2]
             in ('py', 'rs', 'ts', 'tsx', 'js', 'jsx', 'go', 'java', 'rb',
                 'c', 'cpp', 'h', 'hpp', 'cs', 'kt', 'swift', 'scala'))
        or event.data.get('canonical_tool_kind') == 'search'
      )
    effects:
      - type: block
        reason: >
          This project is indexed with gcode. Use gcode for code navigation:
          - `gcode outline path/to/file` — symbol map (much cheaper than Read)
          - `gcode search "query"` — find symbols by name
          - `gcode symbol <id>` — retrieve just the source you need
          Call get_skill(name="code-index") on gobby-skills, then continue.
