tags: [code-index, gobby, default]

rules:
  reset-code-index-navigation:
    description: "Clear per-turn gcode navigation state"
    event: turn_start
    enabled: true
    priority: 5
    effects:
      - type: set_variable
        variable: code_index_navigation_used_this_turn
        value: false

  track-code-index-navigation:
    description: "Remember successful gcode navigation for follow-up line context"
    event: after_tool
    enabled: true
    priority: 20
    when: >
      variables.get('code_index_available')
      and event.data.get('canonical_code_index_navigation')
      and not event.data.get('is_error')
    effects:
      - type: set_variable
        variable: code_index_navigation_used_this_turn
        value: true
      - type: set_variable
        variable: gcode_fail_open
        value: false

  track-gcode-fail-open:
    description: "Fail open on gcode errors: stop preferring a tool that is failing"
    event: after_tool
    enabled: true
    priority: 20
    when: >
      variables.get('code_index_available')
      and event.data.get('canonical_code_index_navigation')
      and event.data.get('is_error')
    effects:
      - type: set_variable
        variable: gcode_fail_open
        value: true

  require-code-index-skill:
    description: "Block first code navigation until code-index skill is loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      variables.get('code_index_available')
      and not skill_loaded('code-index')
      and not variables.get('gcode_fail_open')
      and not has_open_tool_error(
        "gobby-skills/get_skill",
        {"name": "code-index"}
      )
      and not variables.get('code_index_preflight_warning')
      and not event.data.get('canonical_code_index_navigation')
      and not shell_command_invokes_gcode(tool_input.get('command'))
      and event.data.get('canonical_code_navigation_broad')
      and event.data.get('canonical_code_navigation_repo_scope') is not False
    effects:
      - type: block
        reason: '{{ skill_fetch_directive("code-index") }} If that call fails, its recorded failure fails this rule open — re-run the search command that was just blocked, not the failing fetch. After loading, use compact `gcode grep "pattern" [PATH...] -m 50` (supports -F -i -w -l -A/-B/-C -g), `gcode search-content "query" [PATH...]`, `gcode outline path/to/file`, or `gcode symbol-at path/to/file:line`; run printed continuation commands exactly.'

  prefer-gcode-for-code-search:
    description: "Block broad shell search in indexed projects after code-index is loaded"
    event: before_tool
    enabled: true
    priority: 31
    when: >
      variables.get('code_index_available')
      and skill_loaded('code-index')
      and not variables.get('gcode_fail_open')
      and not event.data.get('canonical_code_index_navigation')
      and not shell_command_invokes_gcode(tool_input.get('command'))
      and event.data.get('canonical_code_navigation_action') == 'search'
      and event.data.get('canonical_code_navigation_broad')
      and event.data.get('canonical_code_navigation_repo_scope') is not False
    effects:
      - type: block
        reason: 'Use compact `gcode grep "pattern" -m 50` (supports -F -i -w -l -g; exit 0 even with no matches) or `gcode search-content "query"` — the code index has full access to this repo and returns ranked, token-cheap pages. Run any printed continuation command exactly. If gcode errors, read its one-line JSON and follow the `recovery` directive; do NOT re-run the failing gcode call — its recorded failure fails this rule open, so re-run the grep/rg command that was blocked instead.'

  prefer-gcode-for-source-read:
    description: "Block broad source reads in indexed projects after code-index is loaded"
    event: before_tool
    enabled: true
    priority: 31
    when: >
      variables.get('code_index_available')
      and skill_loaded('code-index')
      and not variables.get('gcode_fail_open')
      and not event.data.get('canonical_code_index_navigation')
      and not shell_command_invokes_gcode(tool_input.get('command'))
      and event.data.get('canonical_code_navigation_action') == 'read'
      and event.data.get('canonical_code_navigation_broad')
      and event.data.get('canonical_code_navigation_repo_scope') is not False
      and (
        event.data.get('canonical_source_read_scope') == 'full_file'
        or not variables.get('code_index_navigation_used_this_turn')
      )
    effects:
      - type: block
        reason: 'Use `gcode outline <file>`, then `gcode symbol-at <file>:<line>` for the relevant result. Request `--format json` or `--verbose` only when an ID is required. Ranged Read (offset/limit, ≤40 lines) is always available. If gcode errors, read its one-line JSON and follow the `recovery` directive; do NOT re-run the failing gcode call — its recorded failure fails this rule open, so use Read on the file instead.'
