tags: [code-index, gobby, default]

# Observation-shape classification (task #21614):
# | Shape | Decision | Replacement or exception rationale |
# | grep/rg over indexed project text | redirect | gcode grep/search-content |
# | same-repo primary/linked-worktree search | redirect | gcode indexes each checkout |
# | simple find path/name/type/depth navigation | redirect | gcode tree |
# | find live metadata/format/action predicates | allow | gcode must not emulate filesystem state/actions |
# | sed/head/tail source range | teach | load reference once, then allow |
# | wc byte/line counts | allow | exact current filesystem aggregate |
# | read/search of a path written this turn | allow | verify current bytes before refresh |
# | session scratchpad navigation | allow | scratchpads are never indexed |
# | ~/.gobby state/log navigation | allow | daemon state and logs are never indexed |

rules:
  reset-code-index-navigation:
    description: "Clear per-turn gcode navigation state"
    event: turn_start
    enabled: true
    priority: 5
    effects:
      - type: set_variable
        variable: code_index_navigation_used_this_turn
        value: false
      - type: set_variable
        variable: turn_written_paths
        value: []
      - type: set_variable
        variable: code_index_recoveries
        value: []

  track-turn-written-paths:
    description: "Remember paths written during the current turn"
    event: after_tool
    enabled: true
    priority: 20
    when: >
      event.data.get('canonical_tool_kind') == 'write'
      and event.data.get('canonical_file_paths')
      and not event.data.get('is_error')
    effects:
      - type: set_variable
        variable: turn_written_paths
        value: "(variables.get('turn_written_paths') or []) + event.data.get('canonical_file_paths')"

  track-code-index-navigation:
    description: "Remember successful gcode navigation for follow-up line context"
    event: after_tool
    enabled: true
    priority: 20
    when: >
      variables.get('code_index_available')
      and event.data.get('canonical_code_index_navigation')
      and not event.data.get('is_error')
      and not event.data.get('canonical_code_index_error')
    effects:
      - type: set_variable
        variable: code_index_navigation_used_this_turn
        value: true

  track-gcode-fail-open:
    description: "Remember path- and operation-scoped gcode recovery"
    event: after_tool
    enabled: true
    priority: 20
    when: >
      variables.get('code_index_available')
      and event.data.get('canonical_code_index_recovery')
    effects:
      - type: set_variable
        variable: code_index_recoveries
        value: "(variables.get('code_index_recoveries') or []) + event.data.get('canonical_code_index_recovery')"

  note-code-index-preflight-fail-open:
    description: "Explain why indexed-checkout navigation is allowed after preflight failure"
    event: before_tool
    enabled: true
    priority: 29
    when: >
      variables.get('code_index_preflight_warning')
      and not variables.get('code_index_preflight_note_shown')
      and not event.data.get('canonical_code_index_navigation')
      and event.data.get('canonical_code_navigation_broad')
      and event.data.get('canonical_code_navigation_repo_scope') is not False
      and (
        event.data.get('canonical_code_navigation_action') != 'enumerate'
        or event.data.get('canonical_code_navigation_gcode_supported')
      )
    effects:
      # One-shot note: the guard variable and its payload must land together, or
      # a suppressed delivery marks the note shown without ever showing it.
      - type: set_variable
        variable: code_index_preflight_note_shown
        value: true
        delivery: on_receipt
      - type: inject_context
        delivery: on_receipt
        template: >-
          Code-index preflight reported this checkout unavailable or stale; raw filesystem navigation is allowed for this session.

  require-code-index-skill:
    description: "Teach preferred code navigation once per session epoch"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      variables.get('code_index_available')
      and not skill_loaded('gobby:references/code-index/overview.md')
      and not has_open_tool_error(
        "gobby-skills/get_skill_file",
        {"name": "gobby", "path": "references/code-index/overview.md"}
      )
      and not variables.get('code_index_preflight_warning')
      and navigation_requires_index(event.data)
    effects:
      - type: block
        reason: '{{ skill_fetch_directive("gobby:references/code-index/overview.md") }} If that call fails, its recorded failure fails this rule open — re-run the search command that was just blocked, not the failing fetch. After loading, reconsider the blocked command using the guidance. Use `gcode` for supported search, navigation, and source retrieval. Use raw tools when `gcode` cannot adequately serve the operation, and state the reason before falling back. The teaching gate resets only after clear or compact. Prefer gcode by query shape: known symbol `gcode search-symbol "name"`; exact identifier `gcode grep -w "identifier" -m 50`; exact literal `gcode grep -F "literal" -m 50`; repository text/docs/config `gcode search-content "text"`; fuzzy code concept `gcode search "concept"` (hybrid symbol search); parser-backed structure `gcode outline path/to/file`. After irrelevant or empty results, switch lanes instead of paraphrasing the same search or paging noise. For Markdown headings use `gcode grep ''^#{1,6} '' path/to/file.md -m 200`. Run printed continuation commands exactly.'
