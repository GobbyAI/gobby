tags: [code-index, gobby, default]

rules:
  require-code-index-skill:
    description: "Block first code navigation until code-index skill is loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      not skill_loaded('code-index')
      and not variables.get('code_index_preflight_warning')
      and (
        (event.data.get('canonical_tool_kind') == 'read'
         and event.data.get('canonical_file_path', '').rpartition('.')[2]
             in ('py', 'rs', 'ts', 'tsx', 'js', 'jsx', 'go', 'java', 'rb',
                 'c', 'cpp', 'h', 'hpp', 'cs', 'kt', 'swift', 'scala'))
        or event.data.get('canonical_tool_kind') == 'search'
      )
    effects:
      - type: block
        reason: 'Call get_skill(name="code-index") on gobby-skills, then continue. Use the Gobby MCP proxy path exactly: list_mcp_servers -> list_tools("gobby-skills") -> get_tool_schema("gobby-skills", "get_skill") -> call_tool("gobby-skills", "get_skill", {"name": "code-index"}). Use only mcp__gobby__* proxy tools while loading the skill; do not use native Skill, GitHub/app connector, or Computer Use tools.'
