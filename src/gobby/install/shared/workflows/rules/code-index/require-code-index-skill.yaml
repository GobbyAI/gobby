tags: [code-index, gobby, default]

rules:
  reset-code-index-navigation:
    description: "Clear per-turn gcode navigation state"
    event: turn_start
    enabled: true
    priority: 5
    effects:
      - type: set_variable
        variable: code_index_navigation_used_this_turn
        value: false

  track-code-index-navigation:
    description: "Remember successful gcode navigation for follow-up line context"
    event: after_tool
    enabled: true
    priority: 20
    when: >
      variables.get('code_index_available')
      and event.data.get('canonical_code_index_navigation')
      and not event.data.get('is_error')
    effects:
      - type: set_variable
        variable: code_index_navigation_used_this_turn
        value: true
      - type: set_variable
        variable: gcode_fail_open
        value: false

  track-gcode-fail-open:
    description: "Fail open on gcode errors: stop preferring a tool that is failing"
    event: after_tool
    enabled: true
    priority: 20
    when: >
      variables.get('code_index_available')
      and event.data.get('canonical_code_index_navigation')
      and event.data.get('is_error')
    effects:
      - type: set_variable
        variable: gcode_fail_open
        value: true

  require-code-index-skill:
    description: "Block first code navigation until code-index skill is loaded"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      variables.get('code_index_available')
      and not skill_loaded('code-index')
      and not variables.get('gcode_fail_open')
      and not has_open_tool_error(
        "gobby-skills/get_skill",
        {"name": "code-index"}
      )
      and not variables.get('code_index_preflight_warning')
      and not event.data.get('canonical_code_index_navigation')
      and not shell_command_invokes_gcode(tool_input.get('command'))
      and event.data.get('canonical_code_navigation_broad')
      and event.data.get('canonical_code_navigation_repo_scope') is not False
    effects:
      - type: block
        reason: '{{ skill_fetch_directive("code-index") }} If that call fails, retry the code search; its recorded failure activates fail-open behavior. After loading, retry with `gcode grep "pattern" [PATH...] -m 50`, `gcode search-content "query" [PATH...]`, `gcode outline path/to/file`, or `gcode symbol <id>`.'

  prefer-gcode-for-code-search:
    description: "Block broad shell search in indexed projects after code-index is loaded"
    event: before_tool
    enabled: true
    priority: 31
    when: >
      variables.get('code_index_available')
      and skill_loaded('code-index')
      and not variables.get('gcode_fail_open')
      and not event.data.get('canonical_code_index_navigation')
      and not shell_command_invokes_gcode(tool_input.get('command'))
      and event.data.get('canonical_code_navigation_action') == 'search'
      and event.data.get('canonical_code_navigation_broad')
      and event.data.get('canonical_code_navigation_repo_scope') is not False
    effects:
      - type: block
        reason: 'Use `gcode grep "pattern" -m 50` or `gcode search-content "query"` — the code index has full access to this repo and returns ranked, token-cheap results. If gcode itself errors, retry your original command: recorded gcode failures deactivate this rule.'

  prefer-gcode-for-source-read:
    description: "Block broad source reads in indexed projects after code-index is loaded"
    event: before_tool
    enabled: true
    priority: 31
    when: >
      variables.get('code_index_available')
      and skill_loaded('code-index')
      and not variables.get('gcode_fail_open')
      and not event.data.get('canonical_code_index_navigation')
      and not shell_command_invokes_gcode(tool_input.get('command'))
      and event.data.get('canonical_code_navigation_action') == 'read'
      and event.data.get('canonical_code_navigation_broad')
      and event.data.get('canonical_code_navigation_repo_scope') is not False
      and (
        event.data.get('canonical_source_read_scope') == 'full_file'
        or not variables.get('code_index_navigation_used_this_turn')
      )
    effects:
      - type: block
        reason: 'Use `gcode outline <file>` then `gcode symbol <id>` — ranged Read (offset/limit, ≤40 lines) is always available. If gcode itself errors, retry your original command: recorded gcode failures deactivate this rule.'
