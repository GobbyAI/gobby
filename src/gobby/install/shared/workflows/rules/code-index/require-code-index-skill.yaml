tags: [code-index, gobby, default]

# Observation-shape classification (task #21614):
# | Shape | Decision | Replacement or exception rationale |
# | grep/rg over indexed project text | redirect | gcode grep/search-content |
# | same-repo primary/linked-worktree search | redirect | gcode indexes each checkout |
# | simple find path/name/type/depth navigation | redirect | gcode tree |
# | find live metadata/format/action predicates | allow | gcode must not emulate filesystem state/actions |
# | source range of 40 lines or fewer | teach | load reference once, then allow |
# | broad source read after reference load | redirect | gcode outline, then gcode symbol-at |
# | whole-file read of a 40-line-or-fewer source file | allow | bounded by the file itself (#22413) |
# | head/tail byte window of 4096 bytes or fewer | allow | bounded byte peek, no gcode equivalent (#22413) |
# | fully redirected copy/concatenation of source files | allow | stdout never reaches the model (#22413) |
# | pipeline final stage bounding output to 40 lines | allow | head -n N or a literal sed window (#22413) |
# | committed third_party/ trees | allow | vendored upstream code, like vendor/ (#22413) |
# | read after an unverified gcode attempt on that file | allow | hooks cannot report every failure |
# | any navigation after a typed gcode outage | allow | the checkout cannot be served this turn |
# | wc byte/line counts | allow | exact current filesystem aggregate |
# | read/search of a path written this turn | allow | verify current bytes before refresh |
# | session scratchpad navigation | allow | scratchpads are never indexed |
# | ~/.gobby state/log navigation | allow | daemon state and logs are never indexed |

rules:
  reset-code-index-navigation:
    description: "Clear per-turn gcode navigation state"
    event: turn_start
    enabled: true
    priority: 5
    effects:
      - type: set_variable
        variable: code_index_navigation_used_this_turn
        value: false
      - type: set_variable
        variable: turn_written_paths
        value: []
      - type: set_variable
        variable: code_index_recoveries
        value: []
      - type: set_variable
        variable: code_index_attempts
        value: []
      - type: set_variable
        variable: code_index_verified
        value: []

  track-turn-written-paths:
    description: "Remember paths written during the current turn"
    event: after_tool
    enabled: true
    priority: 20
    when: >
      event.data.get('canonical_tool_kind') == 'write'
      and event.data.get('canonical_file_paths')
      and not event.data.get('is_error')
    effects:
      - type: set_variable
        variable: turn_written_paths
        value: "(variables.get('turn_written_paths') or []) + event.data.get('canonical_file_paths')"

  track-code-index-attempts:
    description: "Remember gcode scopes before execution, since some providers never report failure"
    event: before_tool
    enabled: true
    # After every before_tool block rule (max 100): a blocked gcode call suppresses this effect.
    priority: 101
    when: >
      variables.get('code_index_available')
      and event.data.get('canonical_code_index_attempts')
    effects:
      - type: set_variable
        variable: code_index_attempts
        value: "(variables.get('code_index_attempts') or []) + event.data.get('canonical_code_index_attempts')"

  track-code-index-navigation:
    description: "Remember gcode navigation that produced verified output"
    event: after_tool
    enabled: true
    priority: 20
    when: >
      variables.get('code_index_available')
      and event.data.get('canonical_code_index_verified')
    effects:
      - type: set_variable
        variable: code_index_navigation_used_this_turn
        value: true
      - type: set_variable
        variable: code_index_verified
        value: "(variables.get('code_index_verified') or []) + event.data.get('canonical_code_index_verified')"

  track-gcode-fail-open:
    description: "Remember gcode outages, failed scopes, and zero-symbol outline scopes"
    event: after_tool
    enabled: true
    priority: 20
    when: >
      variables.get('code_index_available')
      and event.data.get('canonical_code_index_recovery')
    effects:
      - type: set_variable
        variable: code_index_recoveries
        value: "(variables.get('code_index_recoveries') or []) + event.data.get('canonical_code_index_recovery')"

  note-code-index-preflight-fail-open:
    description: "Explain why indexed-checkout navigation is allowed after preflight failure"
    event: before_tool
    enabled: true
    priority: 29
    when: >
      variables.get('code_index_preflight_warning')
      and not variables.get('code_index_preflight_note_shown')
      and not event.data.get('canonical_code_index_navigation')
      and event.data.get('canonical_code_navigation_broad')
      and event.data.get('canonical_code_navigation_repo_scope') is not False
      and (
        event.data.get('canonical_code_navigation_action') != 'enumerate'
        or event.data.get('canonical_code_navigation_gcode_supported')
      )
    effects:
      # One-shot note: the guard variable and its payload must land together, or
      # a suppressed delivery marks the note shown without ever showing it.
      - type: set_variable
        variable: code_index_preflight_note_shown
        value: true
        delivery: on_receipt
      - type: inject_context
        delivery: on_receipt
        template: >-
          Code-index preflight reported this checkout unavailable or stale; raw filesystem navigation is allowed for this session.

  require-code-index-skill:
    description: "Teach preferred code navigation once per session epoch"
    event: before_tool
    enabled: true
    priority: 30
    when: >
      variables.get('code_index_available')
      and not skill_loaded('gobby:references/code-index/overview.md')
      and not has_open_tool_error(
        "gobby-skills/get_skill_file",
        {"name": "gobby", "path": "references/code-index/overview.md"}
      )
      and not variables.get('code_index_preflight_warning')
      and navigation_requires_index(event.data)
    effects:
      - type: block
        reason: '{{ skill_fetch_directive("gobby:references/code-index/overview.md") }} If that call fails, its recorded failure fails this rule open — re-run the search command that was just blocked, not the failing fetch. After loading, reconsider the blocked command using the guidance. Use `gcode` for supported search, navigation, and source retrieval. Use raw tools when `gcode` cannot adequately serve the operation, and state the reason before falling back. The teaching gate resets only after clear or compact. Prefer gcode by query shape: known symbol `gcode search-symbol "name"`; exact identifier `gcode grep -w "identifier" -m 50`; exact literal `gcode grep -F "literal" -m 50`; repository text/docs/config `gcode search-content "text"`; fuzzy code concept `gcode search "concept"` (hybrid symbol search); parser-backed structure `gcode outline path/to/file`; source body `gcode symbol-at path/to/file:line`. After irrelevant or empty results, switch lanes instead of paraphrasing the same search or paging noise. For Markdown headings use `gcode grep ''^#{1,6} '' path/to/file.md -m 200`. Run printed continuation commands exactly.'

  prefer-gcode-for-source-read:
    description: "Redirect broad source reads to gcode after the code-index reference loads"
    event: before_tool
    enabled: true
    priority: 31
    when: >
      variables.get('code_index_available')
      and skill_loaded('gobby:references/code-index/overview.md')
      and not variables.get('code_index_preflight_warning')
      and navigation_requires_index(event.data, 'read', broad_only=True)
    effects:
      - type: block
        reason: 'Use `gcode outline <file>`, then `gcode symbol-at <file>:<line>` for the symbol you need. Reads of 40 lines or fewer stay available. If a gcode call on that file fails, or a standalone `gcode outline <file>` finds no symbols, retry this read; it stays allowed for the rest of the turn. A typed gcode outage error opens every read in the checkout for the turn.'
