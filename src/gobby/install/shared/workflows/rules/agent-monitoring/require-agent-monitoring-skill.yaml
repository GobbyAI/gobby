tags: [agent-monitoring, enforcement, gobby, default]

rules:
  require-agent-monitoring-skill:
    description: "Require monitoring guidance before inspecting agent progress"
    event: before_tool
    enabled: true
    priority: 23
    when: >
      not (
        skill_loaded('agent-monitoring')
        or skill_loaded('build-coordinator')
      )
      and (
        (
          (
            event.data.get('mcp_tool') == 'get_tool_schema'
            or event.data.get('tool_name') in ('get_tool_schema', 'mcp__gobby__get_tool_schema')
          )
          and (
            (
              (tool_input.get('server_name') or tool_input.get('server')) == 'gobby-agents'
              and (tool_input.get('tool_name') or tool_input.get('tool')) in (
                'list_running_agents', 'get_running_agent', 'list_agent_runs',
                'get_agent_result')
            )
            or (
              (tool_input.get('server_name') or tool_input.get('server')) == 'gobby-sessions'
              and (tool_input.get('tool_name') or tool_input.get('tool')) in (
                'get_session', 'get_session_messages', 'capture_output')
            )
          )
        )
        or (
          event.data.get('mcp_server') == 'gobby-agents'
          and event.data.get('mcp_tool') in (
            'list_running_agents', 'get_running_agent', 'list_agent_runs',
            'get_agent_result')
        )
        or (
          event.data.get('mcp_server') == 'gobby-sessions'
          and event.data.get('mcp_tool') in (
            'get_session', 'get_session_messages', 'capture_output')
        )
        or (
          event.data.get('tool_name') in ('call_tool', 'mcp__gobby__call_tool')
          and (
            (
              (tool_input.get('server_name') or tool_input.get('server')) == 'gobby-agents'
              and (tool_input.get('tool_name') or tool_input.get('tool')) in (
                'list_running_agents', 'get_running_agent', 'list_agent_runs',
                'get_agent_result')
            )
            or (
              (tool_input.get('server_name') or tool_input.get('server')) == 'gobby-sessions'
              and (tool_input.get('tool_name') or tool_input.get('tool')) in (
                'get_session', 'get_session_messages', 'capture_output')
            )
          )
        )
        or (
          event.data.get('canonical_tool_kind') == 'execute'
          and (
            'tmux capture-pane' in (tool_input.get('command') or '').lower()
            or 'tmux list-panes' in (tool_input.get('command') or '').lower()
            or 'tmux list-sessions' in (tool_input.get('command') or '').lower()
            or 'tmux display-message' in (tool_input.get('command') or '').lower()
            or (
              'sqlite3' in (tool_input.get('command') or '').lower()
              and 'gobby-hub.db' in (tool_input.get('command') or '').lower()
            )
          )
        )
      )
    effects:
      - type: block
        reason: 'Call get_skill(name="agent-monitoring") or get_skill(name="build-coordinator") on gobby-skills, then continue.'
