tags: [monolith-enforcement, enforcement, gobby, optional]

rules:
  require-decompose-monolith-before-threshold-write:
    description: "Require decomposition guidance before touching a threshold-crossing source file"
    event: before_tool
    enabled: true
    priority: 27
    when: >
      event.data.get('canonical_tool_kind') == 'write' and
      bool(projected_monolith_paths(tool_input, event.data)) and
      not skill_loaded('decompose-monolith')
    effects:
      - type: block
        reason: |
          {{ skill_fetch_directive("decompose-monolith") }}
          Use its required `code-index` dependency. Complete the decomposition in
          the current claimed task and session; deferred refactor tasks are prohibited.
          Threshold path(s): {{ projected_monolith_paths(tool_input, event.data) | join(', ') }}.

  require-monolith-resolution-before-commit:
    description: "Block commits while a session-owned production source file is over budget"
    event: before_tool
    enabled: true
    priority: 25
    when: "bool(outstanding_monolith_paths())"
    effects:
      - type: block
        tools: [Bash]
        command_pattern: "(^|(?<=[;&|(`\\n]))\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:sudo\\s+|command\\s+|do\\s+|then\\s+|else\\s+)*(?:[^\\s;&|]*/)?git(?:\\s+(?:-C\\s+\\S+|-c\\s+\\S+|--git-dir(?:=|\\s+)\\S+|--work-tree(?:=|\\s+)\\S+|--namespace(?:=|\\s+)\\S+|--exec-path(?:=|\\s+)\\S+|--no-pager|--paginate|-p|--bare|--literal-pathspecs|--no-optional-locks))*\\s+commit\\b"
        reason: |
          Use `decompose-monolith` with its required `code-index` dependency.
          Finish the structural work in the current claimed task and session; deferred
          refactor tasks are prohibited. Resolve: {{ outstanding_monolith_paths() | join(', ') }}.

  require-monolith-resolution-before-task-transition:
    description: "Block task completion and review transitions while owned source is over budget"
    event: before_tool
    enabled: true
    priority: 25
    when: "bool(outstanding_monolith_paths())"
    effects:
      - type: block
        mcp_tools:
          - "gobby-tasks:close_task"
          - "gobby-tasks:de_escalate_task"
          - "gobby-tasks-ops:submit_for_review"
          - "gobby-tasks-ops:approve_review"
          - "gobby-tasks-ops:reject_review"
        reason: |
          Use `decompose-monolith` with its required `code-index` dependency.
          Finish the structural work in the current claimed task and session; deferred
          refactor tasks are prohibited. Resolve: {{ outstanding_monolith_paths() | join(', ') }}.

  require-monolith-resolution-before-turn-end:
    description: "Block turn end while a session-owned production source file is over budget"
    event: turn_end
    enabled: true
    priority: 20
    when: "bool(outstanding_monolith_paths())"
    effects:
      - type: block
        reason: |
          Use `decompose-monolith` with its required `code-index` dependency.
          Finish the structural work in the current claimed task and session; deferred
          refactor tasks are prohibited. Resolve: {{ outstanding_monolith_paths() | join(', ') }}.
