tags: [tdd-enforcement, enforcement, gobby, default]

rules:
  enforce-tdd-block:
    description: "Block production source writes until a qualifying test is written"
    event: before_tool
    enabled: true
    priority: 32
    when: >-
      (variables.get('enforce_tdd') or variables.get('claimed_task_requires_tdd'))
      and event.data.get('canonical_tool_kind') == 'write'
      and first_tdd_code_path(event.data, tool_input)
      and not tdd_gate_open(variables)
    effects:
      - type: block
        tools: [Write, Bash]
        reason: |
          Use a test-first flow. Write {% if variables.get('claimed_task_acceptance_test_paths') %}one of the claimed task's acceptance tests: {{ variables.get('claimed_task_acceptance_test_paths') | join(', ') }}{% else %}any test-convention file under the task's targets{% endif %}, then retry writing {{ first_tdd_code_path(event.data, tool_input) }}.
          For Rust, follow the `test-driven-development` skill's `Rust Stub-First RED` sequence.
