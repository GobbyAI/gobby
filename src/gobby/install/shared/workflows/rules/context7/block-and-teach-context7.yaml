tags: [context7, documentation, gobby, default]

rules:
  block-and-teach-context7:
    description: "Block first code file write/edit, require context7 skill for library doc lookup"
    event: before_tool
    enabled: true
    priority: 31
    when: >
      variables.get('context7_available', true)
      and not skill_loaded('context7')
      and event.data.get('canonical_tool_kind') == 'write'
      and event.data.get('canonical_file_path', '').rpartition('.')[2]
          in ('py', 'rs', 'ts', 'tsx', 'js', 'jsx', 'go', 'java', 'rb',
              'c', 'cpp', 'h', 'hpp', 'cs', 'kt', 'swift', 'scala')
    effects:
      - type: block
        reason: >
          One-time nudge: if this edit touches third-party library APIs or an unfamiliar
          framework surface, use context7 to check the current docs before writing.
          For internal changes (type annotations, refactors, stdlib usage, pure logic
          fixes), you can proceed without checking — context7 is only valuable at
          external library boundaries.
          Call get_skill(name="context7") on gobby-skills, then continue.
          Use the Gobby MCP proxy path exactly: list_mcp_servers ->
          list_tools("gobby-skills") ->
          get_tool_schema("gobby-skills", "get_skill") ->
          call_tool("gobby-skills", "get_skill", {"name": "context7"}).
          Use only mcp__gobby__* proxy tools while loading the skill; do not
          use native Skill, GitHub/app connector, or Computer Use tools.
