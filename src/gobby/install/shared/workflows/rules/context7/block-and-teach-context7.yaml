tags: [context7, documentation, gobby, default]

rules:
  block-and-teach-context7:
    description: "Block first code file write/edit with an optional context7 library doc nudge"
    event: before_tool
    enabled: true
    priority: 31
    when: >
      variables.get('context7_available', true)
      and not variables.get('context7_nudge_fired')
      and not skill_loaded('context7')
      and event.data.get('canonical_tool_kind') == 'write'
      and event.data.get('canonical_file_path', '').rpartition('.')[2]
          in ('py', 'rs', 'ts', 'tsx', 'js', 'jsx', 'go', 'java', 'rb',
              'c', 'cpp', 'h', 'hpp', 'cs', 'kt', 'swift', 'scala')
    effects:
      - type: block
        acknowledge_variable: context7_nudge_fired
        reason: >
          One-time nudge: if this edit touches third-party APIs or an unfamiliar
          framework surface, use context7 to check the current docs before writing.
          For internal, pure logic, type-only, stdlib-only, or refactor-only edits,
          retry after this nudge without loading context7.
          When docs are relevant, call get_skill(name="context7") on gobby-skills,
          then continue.
          Call it directly through mcp__gobby__call_tool:
          call_tool("gobby-skills", "get_skill", {"name": "context7"}).
          Use only mcp__gobby__call_tool while loading the skill; do not
          use native Skill, GitHub/app connector, or Computer Use tools.
