tags: [session-defaults, initialization]

variables:
  require_uv:
    value: true
    description: Default require_uv to true
  chat_mode:
    value: bypass
    description: Default chat_mode to bypass
  mode_level:
    value: 2
    description: Default mode_level to 2 (YOLO)
  stop_attempts:
    value: 0
    description: Default stop_attempts to 0
  max_stop_attempts:
    value: 8
    description: Default max_stop_attempts to 8
  max_consecutive_blocked_tool_attempts:
    value: 5
    description: Default max_consecutive_blocked_tool_attempts to 5
  task_claimed:
    value: false
    description: Default task_claimed to false
  claimed_tasks:
    value: {}
    description: "Map of claimed task UUIDs to refs ({uuid: '#N'}) for this session"
  require_task_before_edit:
    value: true
    description: Default require_task_before_edit to true
  require_commit_before_status:
    value: true
    description: Default require_commit_before_status to true
  verification_evidence_recorded:
    value: false
    description: Default verification_evidence_recorded to false
  verification_evidence:
    value: []
    description: Structured verification evidence recorded for completion readiness; newest 50 entries retained
  enforce_tdd:
    value: false
    description: "Enable TDD enforcement (block new code files until test is written first)"
  tdd_nudged_files:
    value: []
    description: "Files that have been TDD-nudged this session (internal)"
  tdd_tests_written:
    value: []
    description: "Test files written during TDD this session (internal)"
  enforce_tool_schema_check:
    value: true
    description: Default enforce_tool_schema_check to true
  auto_inject_handoff:
    value: true
    description: Default auto_inject_handoff to true (populate session_summary/full_session_summary template vars on session start)
  servers_listed:
    value: true
    description: "Pre-seed servers_listed (internal servers are known at startup)"
  listed_servers:
    value:
      - gobby-tasks
      - gobby-tasks-ops
      - gobby-plans
      - gobby-sessions
      - gobby-memory
      - gobby-workflows
      - gobby-canvas
      - gobby-metrics
      - gobby-agents
      - gobby-worktrees
      - gobby-clones
      - gobby-merge
      - gobby-hub
      - gobby-config
      - gobby-voice
      - gobby-skills
      - gobby-cron
    description: "Pre-seed listed_servers with internal server names"
  unlocked_tools:
    value: []
    description: Default unlocked_tools to empty list
  is_subagent:
    value: false
    description: "True while a native Claude Code subagent is active (toggled by SUBAGENT_START/STOP hooks)"
  loaded_skills:
    value: []
    description: "Skill names the agent has fetched with gobby-skills:get_skill this session"
  memory_nudge_fired:
    value: false
    description: "True after memory-capture-nudge has fired once this session"
  skill_discovery_instructions_shown:
    value: false
    description: "True after skill hub discovery instructions have been shown once this session"
  brevity_disabled:
    value: false
    description: "True after the user opts out of brevity reinforcement for the session"
  brevity_last_violation:
    value: ""
    description: "Last assistant response fragment that violated brevity rules"
  brevity_last_violation_rule:
    value: ""
    description: "Brevity rule violated by the last matched response fragment"
  _agent_context_injected:
    value: false
    description: "True after agent identity and instructions have been sent on first before_agent"
  _agent_identity_reinject:
    value: false
    description: "True when the next before_agent should re-inject role/goal/personality after a persona switch"
  edit_write_pending:
    value: false
    description: "True when an Edit/Write tool call is pending (pre-tool fired, post-tool not yet succeeded)"
  edit_write_stop_blocks:
    value: 0
    description: "Circuit breaker counter for edit-write stop gate"
  context7_available:
    value: true
    description: "True when context7 MCP server is configured and available"
