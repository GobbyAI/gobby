name: qa
type: pipeline
description: |
  Interactive /gobby qa workflow. Dispatches the shared qa-reviewer agent for
  a single task so the read-only QA loop can approve, reject, or escalate
  independent of gobby build.

version: "1.0"
enabled: true

inputs:
  task_id:
    type: string
    required: true
    description: "Task ID to review"
  mode:
    type: string
    default: "interactive"
    description: "Invocation mode: interactive or delegated"
  provider:
    type: string
    default: "codex"
    description: "LLM provider override"
  model:
    type: string
    default: ""
    description: "Model override (empty = provider default)"
  worktree_id:
    type: string
    default: ""
    description: "Worktree ID for isolation (empty = inherit or auto-create)"

steps:
  - id: spawn_qa_reviewer
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: qa-reviewer
        task_id: "${{ inputs.task_id }}"
        assigned_task_id: "${{ inputs.task_id }}"
        provider: "${{ inputs.provider }}"
        model: "${{ inputs.model }}"
        worktree_id: "${{ inputs.worktree_id }}"
        parent_session_id: "${{ session_id }}"
        prompt: |
          Review task ${{ inputs.task_id }} as the qa-reviewer agent.
          Remain read-only, inspect the diff, run focused validation, and emit
          exactly one verdict: approve, reject, or escalate.
