name: expansion-qa
description: |
  Expansion QA agent: validates the created task tree after an expansion run.
  It repairs residual structural drift and stores findings on the expansion run.

version: "1.1"
enabled: true
priority: 20

instructions: |
  You are an expansion QA agent for the run-based expansion system.
  Your job is to compare the applied task tree with the compiled expansion run,
  repair structural drift when safe, and save findings on the run.

  LIFECYCLE MODEL:
  - Rules are authored against semantic workflow events such as `turn_start` and `turn_end`.
  - Raw `before_agent`, `after_agent`, and `stop` are provider/runtime details, not the main authoring API.
  - End-of-turn gates may keep the current turn alive until required run state is saved.
  - The terminate step is explicit shutdown after saving QA results, not stop-hook completion.

  CRITICAL RULES:
  - Do NOT use deprecated spec-on-task tools.
  - Do NOT create, close, claim, reopen, escalate, or delete tasks.
  - Only repair metadata or dependencies that clearly diverge from the compiled run.
  - Always use progressive discovery for MCP tools.

step_variables:
  qa_result_saved: false

steps:
  - name: qa_check
    description: "Validate expansion output: structural deps + plan comparison"
    status_message: |
      Validate the applied task tree against the compiled expansion run,
      repair deterministic structural drift, and save findings on the run.
    allowed_tools: "all"
    blocked_mcp_tools:
      - "gobby-tasks:claim_task"
      - "gobby-tasks:close_task"
      - "gobby-tasks:create_task"
      - "gobby-tasks:de_escalate_task"
      - "gobby-tasks:delete_task"
      - "gobby-tasks:escalate_task"
      - "gobby-tasks:mark_task_needs_review"
      - "gobby-tasks:mark_task_review_approved"
      - "gobby-tasks:reopen_task"
      - "gobby-agents:spawn_agent"
      - "gobby-agents:kill_agent"
    on_mcp_success:
      - server: gobby-tasks-ops
        tool: save_expansion_qa_result
        action: set_variable
        variable: qa_result_saved
        value: true
    on_mcp_error:
      - server: gobby-tasks-ops
        tool: save_expansion_qa_result
        action: set_variable
        variable: qa_result_failed
        value: true
    transitions:
      - to: terminate
        when: "vars.qa_result_saved"
      - to: terminate
        when: "vars.qa_result_failed"

  - name: terminate
    description: "Self-terminate by calling kill_agent"
    status_message: "QA result saved. Call kill_agent to terminate."
    allowed_tools:
      - mcp__gobby__call_tool
      - mcp__gobby__list_mcp_servers
      - mcp__gobby__list_tools
      - mcp__gobby__get_tool_schema
    allowed_mcp_tools:
      - "gobby-agents:kill_agent"

exit_condition: "current_step == 'terminate'"
