name: expansion-qa
description: |
  Expansion QA agent, spawnable from a runbook after an expansion run. It checks
  the created task tree and its dependencies, repairs structural drift, saves
  findings, and reports to its spawner.

version: "1.4"
enabled: true
priority: 20
# Launch configuration selects the provider and model for this role.
provider: inherit
blocked_mcp_tools:
  - "gobby-agents:kill_agent"

prompts:
  agent: |
    You are an expansion QA agent for the run-based expansion system.
    Your job is to compare the applied task tree with the compiled expansion run,
    repair structural drift when safe, save findings on the run, and hand off
    the result to Triage, or to the planning team that spawned you.

    Plan-coverage contract:
    - The contract reference is docs/contracts/plan-coverage.md.
    - Leaves must carry structured covers:<plan-id>:<section-id>:<item-id> labels.
    - Free-form plan-ref: labels are not honored.
    - First run `gobby-tasks-ops:run_expansion_qa_coverage` with
      run_id, plan_path, plan_id, plan_hash, root_task, project_id, and task_tree="db".
    - That tool invokes the A4 library equivalent of:
      `gobby plan coverage --plan <plan_path> --plan-id <plan_id> --plan-hash <plan_hash> --root-task <root_task> --project-id <project_id> --task-tree db`.
    - It writes the manifest to coverage_manifest_path, saves QA results on the
      expansion run, and stores artifact pointers through task_artifacts
      (plan_file_path, plan_file_hash, expansion_run_id; preserving base_commit_sha).
    - If recomputed plan content differs from the active registered plan's hash
      (task_artifacts.plan_file_hash for an unregistered plan), the run fails
      mechanically with reason plan_hash_drift. gobby-plans:update_plan_hash is
      the authorized refresh after a narrative change; a passing rerun then
      rewrites the artifact pointer from the registry.
    - Any deliverable item with status missing or invalid rejects the run
      mechanically. Rejection notes must cite section_id, item_id, status, detail,
      and any leaves that claimed but failed coverage.
    - In the QA check step, use gobby-tasks tools to fix dependency issues and
      task metadata or coverage labels that diverge from the plan and compiled run.
      Rerun coverage after repairs so the saved evidence describes the final tree.
    - Save the QA report with gobby-tasks-ops:save_expansion_qa_result, including
      the manifest path, repairs made, unresolved findings, and the final coverage result.
    - After saving, send the report and next steps to your spawner with
      gobby-agents:send_message(target="parent"). Report missing or invalid
      coverage explicitly; a completed QA check does not mean the tree passed.

    Lifecycle model:
    - Rules are authored against semantic workflow events such as `turn_start` and `turn_end`.
    - Raw `before_agent`, `after_agent`, and `stop` are provider/runtime details, not the main authoring API.
    - End-of-turn gates may keep the current turn alive until required run state is saved.
    - Save the QA results and deliver the parent handoff before termination.
      Failed saves or handoff sends keep the workflow in the current step.

    Boundaries:
    - Use the run-based expansion tools; the deprecated spec-on-task tools write
      state the run system no longer reads.
    - Leave task lifecycle (create, close, claim, reopen, escalate, delete) to
      your spawner. Your gobby-tasks writes repair metadata or dependencies
      that clearly diverge from the plan and compiled run.
    - Use progressive discovery for MCP tools.
step_workflow:
  variables:
    coverage_result_saved: false
    coverage_result_failed: false
    qa_result_saved: false
    qa_result_failed: false
    handoff_sent: false

  exit_condition: "current_step == 'terminate'"
  steps:
    - name: coverage_check
      description: "Run deterministic plan coverage for the expansion task tree"
      status_message: |
        Call run_expansion_qa_coverage with --plan, --plan-id, --plan-hash,
        --root-task, --project-id, and --task-tree db equivalents. Carry the
        coverage findings and manifest path into the QA report.
      allowed_tools: "all"
      blocked_mcp_tools:
        - "gobby-tasks:claim_task"
        - "gobby-tasks:close_task"
        - "gobby-tasks:create_task"
        - "gobby-tasks:de_escalate_task"
        - "gobby-tasks:delete_task"
        - "gobby-tasks:escalate_task"
        - "gobby-tasks:reopen_task"
        - "gobby-agents:spawn_agent"
        - "gobby-agents:kill_agent"
      on_mcp_success:
        - server: gobby-tasks-ops
          tool: run_expansion_qa_coverage
          action: set_variable
          variable: coverage_result_saved
          value: true
      on_mcp_error:
        - server: gobby-tasks-ops
          tool: run_expansion_qa_coverage
          action: set_variable
          variable: coverage_result_failed
          value: true
      transitions:
        - to: qa_check
          when: "vars.coverage_result_saved"

    - name: qa_check
      mcp_error_policy: stay
      description: "Validate expansion output: structural deps + plan comparison"
      status_message: |
        Validate the applied task tree against the compiled expansion run,
        repair metadata and dependencies with gobby-tasks, rerun coverage after
        repairs, and save the QA report with save_expansion_qa_result.
      allowed_tools: "all"
      blocked_mcp_tools:
        - "gobby-tasks:claim_task"
        - "gobby-tasks:close_task"
        - "gobby-tasks:create_task"
        - "gobby-tasks:de_escalate_task"
        - "gobby-tasks:delete_task"
        - "gobby-tasks:escalate_task"
        - "gobby-tasks:reopen_task"
        - "gobby-agents:spawn_agent"
        - "gobby-agents:kill_agent"
      on_mcp_success:
        - server: gobby-tasks-ops
          tool: save_expansion_qa_result
          action: set_variable
          variable: qa_result_saved
          value: true
      on_mcp_error:
        - server: gobby-tasks-ops
          tool: save_expansion_qa_result
          action: set_variable
          variable: qa_result_failed
          value: true
      transitions:
        - to: handoff
          when: "vars.qa_result_saved"

    - name: handoff
      mcp_error_policy: stay
      description: "Deliver the saved QA report to the spawner"
      status_message: >-
        Call gobby-agents:send_message with target="parent". Include the expansion
        run and root task, manifest path, final coverage result, repairs made,
        unresolved findings, and the Orchestrator or planning team's next steps.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-agents:send_message"
      on_mcp_success:
        - server: gobby-agents
          tool: send_message
          when: "tool_input.get('target') == 'parent'"
          action: set_variable
          variable: handoff_sent
          value: true
      transitions:
        - to: terminate
          when: "vars.handoff_sent"

    - name: terminate
      description: "Self-terminate via gobby-agents:end_agent_run"
      status_message: >-
        QA result saved and parent handoff delivered. Call mcp__gobby__call_tool
        with server_name="gobby-agents" and tool_name="end_agent_run". Pass
        current_state summarizing the QA result and next_steps naming the
        coordinator's next action, with relevant findings in optional fields.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-agents:end_agent_run"

workflows:
  rule_selectors:
    include:
      - "tag:default"
      - "tag:worker-safety"
      - "name:no-send-keys"
    exclude:
      - "tag:task-skill-gates"
