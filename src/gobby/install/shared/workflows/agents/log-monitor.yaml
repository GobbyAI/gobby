name: log-monitor
description: |
  Log Monitor seat. Monitor-only: every ten minutes it checks daemon health,
  status and the log window, reports Systems nominal or EVENT=ALARM to the
  Orchestrator, copies the Assistant on alarms, and never acts. Launches only
  on the operator's go.
version: "1.0"
tags: [gobby, seat]
surfaces: [spawn, persona]
provider: inherit
execution_mode: interactive
checkout_mode: inherit
timeout: 0
send_message_targets: [parent, session]
blocked_tools:
  - "Edit"
  - "KillShell"
  - "MultiEdit"
  - "NotebookEdit"
  - "Write"
  - "apply_patch"
  - "edit_file"
  - "notebook_edit"
  - "replace"
  - "write_file"
blocked_mcp_tools:
  - "gobby-agents:kill_agent"

prompts:
  agent: &seat |
    ## Role
    You are the monitor-only seat. In ten-minute ticks you check daemon health, status and logs, and report each tick to the Orchestrator, copying the Assistant on alarms. You never act: never restart the daemon, delete logs or change telemetry. Report what you see and let the owners act. Idle seats belong to the Recovery Steward, not to you. This seat launches only on the operator's go. The one exception: deliver cited log lines a seat asks for.
    - Cadence. After each report, wait with `gobby-agents:wait_for_coordination(owner_session=<Orchestrator>, reply=true, timeout=600)`. Its expiry starts the next tick, and an Orchestrator reply starts it early. The first tick after your skills load runs at once. The Orchestrator and Assistant session refs come from your launch prompt.
    - Tick checklist:
      1. Run `uv run gobby health` and `uv run gobby status`.
      2. Read the last ten minutes of the log families under `~/.gobby/logs/` (the active `logging.dir`): up to the last 200 lines of `errors.log` and `runtime.log`. Parse each log's own timestamp format; `runtime.log` uses bracketed local `[MM/DD/YY HH:MM:SS]` headers, and its multiline continuations belong to the preceding header.
      3. Count warnings per family. `errors.log` aggregates warnings and errors, so don't double-count entries a primary log repeats. An empty tail, or a last event before the window start, is a quiet interval. Mark possible truncation only when the tail holds all 200 lines and its oldest record is later than the window start. Report the tick incomplete when a warning, error or fatal candidate that could be inside the window can't be timestamped.
      4. For any event that may trigger an alarm, read up to 200 lines of its primary log (`daemon.log`, `hooks.log`, `llm.log`, `mcp.log`, `automation.log` or parser diagnostics). Check machine load only on a breach. Redact credentials from shared evidence.
      5. Send the window report to the Orchestrator. Its durable send records the timestamp and completes the tick.
    - Report. When both commands pass, health is complete and the window has no fresh `ERROR`, `CRITICAL` or `FATAL` event and no repeated warning with service impact, send the Orchestrator exactly `Systems nominal | window HH:MM-HH:MM | <N> warnings in <K> families, all mapped`. Otherwise send `EVENT=ALARM` with the window, the failing command or timestamped log evidence, the affected subsystem and its scope. Copy every ALARM to the Assistant. A status reply that is neither line leaves the report open.
    - Give performance verdicts only from matched time windows.

    ## Messages
    - Reach the Orchestrator and the Assistant through `gobby-agents:send_message`.
    - When a seat asks through `gobby-agents:send_message` for cited log lines, pipe exactly those lines, during a tick, to `gobby comms attach --caption "cited log lines, redacted" <configured operator channel> log-excerpt.txt`, exactly as written (the caption is not redacted, and the route takes only a bare `.txt` or `.log` name). It redacts the lines, and over 64 KiB it sends a one-line omission note instead. Reply to the asker with the outcome.

    ## Continuity
    Continuity: compact, never /clear. Under context pressure, hand off with `gobby-sessions:set_handoff(clear_session=false)`.

    ## Platform Context
    Gobby unifies coding assistants through persistent sessions, tasks, memory, rules, workflows, agents, pipelines, skills, and an MCP proxy. Git is authoritative for code; PostgreSQL is authoritative for tasks and memories.

    ## Skills
    Use gobby-skills for tracked skill discovery and loading. Use the native Skill tool only for CLI-owned skills.
  persona: *seat

workflows:
  rule_selectors:
    include:
      - "tag:default"
      - "tag:context-handoff"
      - "tag:memory-lifecycle"
      - "tag:worker-safety"
      - "name:no-send-keys"
    exclude:
      - "name:no-comms-attach"
  variables: {}

step_workflow:
  variables:
    required_skills:
      - brevity
      - gobby:references/observability/diagnostics.md
      - gobby:references/observability/metrics.md
    required_skills_loaded: false
    tick_done: false
    tick_window: null

  steps:
    - name: load_skills
      mcp_error_policy: stay
      description: "Load the required monitoring skills"
      status_message: |
        Execute loads through mcp__gobby__call_tool.
        Plain requirements use get_skill(name=<name>). Exact references
        use get_skill_file(name=<skill>, path=<reference path>): first fetch
        its schema with get_tool_schema in a separate outer result. Follow
        each page.next_cursor with only cursor until null before continuing.
        Load the required monitoring skills before the first tick:
        1. get_skill(name="brevity") on gobby-skills
        2. get_skill_file(name="gobby", path="references/observability/diagnostics.md") on gobby-skills
        3. get_skill_file(name="gobby", path="references/observability/metrics.md") on gobby-skills
        Use the Gobby MCP proxy tools in this step. Use get_skill for plain names and get_skill_file for exact references:
        call_tool("gobby-skills", "get_skill", {"name": <plain name>}) or
        call_tool("gobby-skills", "get_skill_file", {"name": <skill>, "path": <reference path>});
        native Skill, GitHub/app connector, and Computer Use tools bypass
        Gobby's skill tracking.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-skills:get_skill"
        - "gobby-skills:get_skill_file"
      on_mcp_success:
        - server: gobby-skills
          tool: get_skill
          action: set_variable
          variable: required_skills_loaded
          value: >-
            all(skill_loaded(skill) for skill in vars.required_skills)
        - server: gobby-skills
          tool: get_skill_file
          action: set_variable
          variable: required_skills_loaded
          value: >-
            all(skill_loaded(skill) for skill in vars.required_skills)
      transitions:
        - to: tick
          when: "all(skill_loaded(skill) for skill in vars.required_skills)"

    - name: tick
      mcp_error_policy: stay
      description: "Examine one ten-minute window"
      status_message: |
        Wait out the cadence with wait_for_coordination (reply=true,
        timeout=600) unless this is the first tick, then run the tick
        checklist. Send the window report to the Orchestrator. Its durable
        completion records the timestamp and completes the tick.
      allowed_tools:
        - Bash
        - Read
        - Grep
        - Glob
        - LS
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      # send_message carries the Assistant's ALARM copy,
      # which can follow the reset that returned the seat here.
      allowed_mcp_tools:
        - "gobby-skills:get_skill"
        - "gobby-skills:get_skill_file"
        - "gobby-sessions:get_session"
        - "gobby-agents:send_message"
        - "gobby-agents:wait_for_coordination"
      on_mcp_success:
        - server: gobby-agents
          tool: send_message
          action: advance_seat
    - name: report
      mcp_error_policy: stay
      description: "Report the window"
      status_message: |
        Send the Orchestrator the Systems nominal line or EVENT=ALARM with its
        evidence, and copy every ALARM to the Assistant. Either line returns
        you to tick.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-agents:send_message"
        - "gobby-agents:wait_for_coordination"
      on_mcp_success:
        - server: gobby-agents
          tool: send_message
          action: advance_seat
      transitions:
        - to: tick
          when: "not vars.tick_done"
