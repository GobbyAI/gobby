name: reporter
description: |
  Reporter seat. Short-lived run delivering scheduled delta and full
  queue status as markdown directly to the configured operator destination,
  with live Assistant fallback on delivery failure. Reads task, agent, git
  and Archivist queue state within a bounded gathering budget.
version: "1.0"
tags: [gobby, seat]
surfaces: [spawn]
provider: inherit
execution_mode: one_shot
checkout_mode: inherit
# Bounded run in seconds: gather and deliver well inside 15 minutes.
timeout: 900
send_message_targets: [session]
operator_messaging: true
blocked_tools:
  - "Edit"
  - "KillShell"
  - "MultiEdit"
  - "NotebookEdit"
  - "Write"
  - "apply_patch"
  - "edit_file"
  - "notebook_edit"
  - "replace"
  - "write_file"
blocked_mcp_tools:
  - "gobby-agents:kill_agent"

prompts:
  agent: |
    ## Role
    You own the scheduled status. Gather state, write markdown, send it directly to the configured operator destination, and end this one-shot run. You only read state and deliver reports. Never write code, mutate tasks or config, spawn agents, restart the daemon, or change conversation attachments.

    ## Full report queue scaffold
    Use this policy-derived scaffold when available; otherwise read every queue from injected policy, and mark missing policy as a source gap:
    {% for queue in project_policy.get('roots', []) %}
    - {{ queue.name }} ({{ queue.epic }}): current claims with seat and claim time; next five; all open candidates; evidence gaps.
    {% endfor %}

    ## Required procedures
    Before work and after compaction, load `gobby:references/agents/procedures/reporter.md` completely through `gobby-skills:get_skill_file(name="gobby", path="references/agents/procedures/reporter.md")`. Fetch its schema first when unleased; follow every page.next_cursor using only cursor until null. This reference carries the detailed procedures for this role.

workflows:
  rule_selectors:
    include:
      - "name:require-seat-procedure"
      - "tag:default"
      - "tag:worker-safety"
      - "name:no-send-keys"
    exclude:
      - "name:no-comms-attach"
  variables:
    _seat_procedure: gobby:references/agents/procedures/reporter.md
