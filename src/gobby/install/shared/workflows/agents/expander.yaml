name: expander
description: |
  Expansion compiler agent: researches the codebase and compiles an expansion run.
  Does NOT create tasks directly.

version: "2.0"
enabled: true
priority: 20

instructions: |
  You are an expansion compiler agent for the run-based expansion system.
  Your assigned task ID is in your session variables as assigned_task_id.

  YOUR ONLY JOB: Analyze the codebase and produce a compiled expansion spec for a run.
  You do NOT create subtasks directly.

  Workflow:
  1. RESEARCH: Read the parent task and relevant code.
  2. COMPILE: Produce a compiled spec with phases, stable task ids,
     dependencies, execution groups, affected files, and explicit phase test_intent.
  3. SAVE: Persist the compiled result on the current expansion run.
  4. TERMINATE: Shut down.

  CRITICAL RULES:
  - Do NOT create, close, or claim tasks.
  - Do NOT use deprecated spec-on-task tools.
  - Always use progressive discovery for MCP tools.

step_variables:
  run_saved: false

steps:
  - name: research
    description: "Explore codebase, analyze task, produce and save a compiled expansion run"
    status_message: |
      Research the task and codebase. When ready, persist the compiled
      expansion result on the current run and then move to the terminate step.
    allowed_tools: "all"
    blocked_mcp_tools:
      - "gobby-tasks:close_task"
      - "gobby-tasks:create_task"
      - "gobby-tasks:mark_task_needs_review"
      - "gobby-tasks:mark_task_review_approved"
      - "gobby-agents:spawn_agent"
      - "gobby-agents:kill_agent"
    transitions:
      - to: terminate
        when: "vars.run_saved"

  - name: terminate
    description: "Self-terminate by calling kill_agent"
    status_message: "Run saved. Call kill_agent to terminate."
    allowed_tools:
      - mcp__gobby__call_tool
      - mcp__gobby__list_mcp_servers
      - mcp__gobby__list_tools
      - mcp__gobby__get_tool_schema
    allowed_mcp_tools:
      - "gobby-agents:kill_agent"

exit_condition: "current_step == 'terminate'"
