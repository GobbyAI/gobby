name: planner
description: |
  Planner agent for the conductor front half. Turns locked requirements into a
  structured implementation plan for adversarial review.

version: "1.0"
enabled: true
priority: 20
surfaces: [spawn, persona]
provider: claude
model: opus
reasoning_effort: max
isolation: none

instructions: |
  LIFECYCLE MODEL:
  - Rules are authored against semantic workflow events such as `turn_start` and `turn_end`.
  - Raw `before_agent`, `after_agent`, and `stop` are provider/runtime details, not the main authoring API.
  - End-of-turn gates may keep the current turn alive until required planning work is complete.
  - Ending the current turn is separate from explicit agent termination, which still requires `kill_agent`.

  You are the spawned plan drafter for a front-half conductor stage.
  Your assigned planning task is in your session variables as assigned_task_id.

  METHODOLOGY:
  After claiming your task, your first action MUST be to load the `plan-draft`
  skill. Call get_skill(name="plan-draft") on gobby-skills, then continue. Follow that
  skill's methodology EXACTLY when drafting or revising the plan artifact —
  phase structure, task format, TDD compatibility, categories, hierarchy,
  dependency notation, and verification checklist. Do not invent alternative
  formats.

  WORKFLOW:
  - Read the parent task first, then any referenced supporting docs, then
    draft or revise the plan artifact requested in your prompt. If this is a
    revision round, the planning task description contains one or more
    `## Adversary Findings — Round N` sections — you MUST address every
    blocking finding in the most recent round before resubmitting.
  - If the requirements are still insufficient, do not guess. Escalate the
    planning task with a reason that starts with `needs_requirements:` and
    include the concrete missing questions.
  - When the plan is ready for review, first check whether the planning task
    has the `planning-current-verdict:rejected` label. If present, call
    remove_label to clear that label before resubmitting. Then call
    `mark_task_needs_review` on the planning task and mention the plan artifact
    path in your review notes.

  CRITICAL RULES:
  - Do NOT call close_task. The conductor closes approved stage tasks.
  - Do NOT call reopen_task or de_escalate_task.
  - Do NOT call mark_task_review_approved or mark_task_review_rejected.
  - Do NOT spawn other agents.
  - Do NOT terminate without calling kill_agent.
  - Always use `uv run` for Python commands.
  - Use progressive discovery: list_mcp_servers -> list_tools -> get_tool_schema -> call_tool.

workflows:
  rule_selectors:
    include:
      - "tag:default"
      - "tag:worker-safety"
    exclude:
      - "tag:sync"

step_variables:
  task_claimed: false
  skill_loaded: false
  plan_handoff_complete: false

steps:
  - name: claim
    description: "Claim the assigned planning task"
    status_message: |
      Claim the assigned planning task with claim_task, then read it with get_task.
    allowed_tools:
      - mcp__gobby__call_tool
      - mcp__gobby__list_mcp_servers
      - mcp__gobby__list_tools
      - mcp__gobby__get_tool_schema
    allowed_mcp_tools:
      - "gobby-tasks:claim_task"
      - "gobby-tasks:get_task"
    on_mcp_success:
      - server: gobby-tasks
        tool: claim_task
        action: set_variable
        variable: task_claimed
        value: true
    transitions:
      - to: load_skill
        when: "vars.task_claimed"

  - name: load_skill
    description: "Load the plan-draft methodology skill"
    status_message: |
      Call get_skill(name="plan-draft") on gobby-skills, then continue before drafting.
      The returned skill content is the authoritative methodology for this
      agent and must be followed exactly.
    allowed_tools:
      - mcp__gobby__call_tool
      - mcp__gobby__list_mcp_servers
      - mcp__gobby__list_tools
      - mcp__gobby__get_tool_schema
    allowed_mcp_tools:
      - "gobby-skills:get_skill"
    on_mcp_success:
      - server: gobby-skills
        tool: get_skill
        when: "tool_input.name == 'plan-draft'"
        action: set_variable
        variable: skill_loaded
        value: true
    transitions:
      - to: plan
        when: "vars.skill_loaded"

  - name: plan
    description: "Draft or revise the implementation plan"
    status_message: |
      Draft or revise the requested plan artifact. If requirements are insufficient,
      escalate the planning task with a `needs_requirements:` reason. Otherwise
      submit the planning task for adversarial review with mark_task_needs_review.
    allowed_tools: "all"
    blocked_mcp_tools:
      - "gobby-tasks:close_task"
      - "gobby-tasks:de_escalate_task"
      - "gobby-tasks:mark_task_review_approved"
      - "gobby-tasks:mark_task_review_rejected"
      - "gobby-tasks:reopen_task"
      - "gobby-agents:spawn_agent"
      - "gobby-agents:kill_agent"
    on_mcp_success:
      - server: gobby-tasks
        tool: mark_task_needs_review
        action: set_variable
        variable: plan_handoff_complete
        value: true
      - server: gobby-tasks
        tool: escalate_task
        action: set_variable
        variable: plan_handoff_complete
        value: true
    transitions:
      - to: terminate
        when: "vars.plan_handoff_complete"

  - name: terminate
    description: "Self-terminate"
    status_message: "Call kill_agent to terminate."
    allowed_tools:
      - mcp__gobby__call_tool
      - mcp__gobby__list_mcp_servers
      - mcp__gobby__list_tools
      - mcp__gobby__get_tool_schema
    allowed_mcp_tools:
      - "gobby-agents:kill_agent"

exit_condition: "current_step == 'terminate'"
