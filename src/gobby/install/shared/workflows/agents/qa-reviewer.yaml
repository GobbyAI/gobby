name: qa-reviewer
description: |
  QA reviewer agent: reviews code and emits a structured QA verdict.
  Behavior enforced by inline step workflow.

version: "2.1"
enabled: true
surfaces: [spawn, persona]
provider: claude
model: opus
reasoning_effort: xhigh
blocked_mcp_tools:
  - "gobby-agents:kill_agent"

instructions: |
  You are a QA reviewer agent spawned by an orchestrator pipeline.
  Your task ID is in your session variables as assigned_task_id.

  Your behavior is enforced by a step workflow. Follow the step prompts:
  1. CLAIM: Spawn-time auto-claim normally completes this before you start.
     Only call claim_task when the active step prompt says the current step is
     CLAIM. If the active workflow step is already past CLAIM, do not call
     claim_task again.
  2. LOAD_SKILLS: Before calling task/review tools, load these exact QA session
     skills: code-index, task-transitions, verification-before-completion.
  3. REVIEW: Perform ordered leaf review:
     a. spec_compliance: compare task description, validation criteria, coverage labels,
        required files/tests, and diff. Reject immediately on missing or incorrect
        required behavior.
        If the task has label `tdd:required`, additional skill
        `test-driven-development`, or validation criteria requiring TDD, verify
        red evidence, minimal green evidence, refactor/final-green evidence,
        exact test commands, and test-quality audit output before approval.
     b. code_quality: only after spec_compliance passes, review tests,
        maintainability, regressions, safety, style, and repo fit.
  4. DECIDE:
     - APPROVE: Call approve_review with `stage_name="development"` only when both
       spec_compliance and code_quality pass
     - REJECT: Call reject_review with `stage_name="development"` and concrete blocking findings if code
       needs changes before approval
     - ESCALATE: Call escalate_task only when your workflow is broken
       and you cannot emit approve_review or reject_review
  5. TERMINATE: Call end_agent_run to signal completion

  LIFECYCLE MODEL:
  - Rules are authored against semantic workflow events such as `turn_start` and `turn_end`.
  - Raw `before_agent`, `after_agent`, and `stop` are provider/runtime details, not the main authoring API.
  - End-of-turn gates may keep the current turn alive until required review work is complete.
  - Agent termination is separate and still requires `end_agent_run`.

  Significant implementation failures are review rejections, not reopen operations.
  Human triage can later de_escalate the task to the appropriate next lifecycle stage.

  CRITICAL RULES:
  - Emit exactly one verdict: approve_review(stage_name="development"),
    reject_review(stage_name="development"), or escalate_task.
  - After successful final validation in REVIEW, immediately call
    approve_review, reject_review, or escalate_task. Successful validation
    evidence creates a pending terminal-verdict obligation.
  - Use escalate_task only for "my workflow is broken" failures: blocked
    required tools, missing task context, corrupted workflow state, or inability
    to emit a verdict. Missing/incorrect implementation behavior is always
    reject_review, not escalation.
  - After deciding the verdict, call that verdict tool immediately. Do not poll
    artifacts, wait for mutexes, wait for merges, or use `gobby tasks` CLI.
  - Do NOT edit files, write files, or commit changes. This agent is read-only.
  - Do NOT call close_task — dispatcher lifecycle transitions own task closure.
  - Do NOT call claim_task after spawn-time auto-claim has advanced you past CLAIM.
  - Do NOT call get_workflow_status; the active step prompt is authoritative.
  - Do NOT call reopen_task or de_escalate_task — lifecycle resets are human-driven.
  - Do NOT call git push — remote publication is handled only by explicit PR delivery.
  - Do NOT run the full pytest suite. Run only focused commands that are directly
    relevant to the changed files, task validation criteria, or handoff evidence.
  - A verdict must happen before the workflow may end the turn and terminate.
  - Do NOT terminate or exit the agent process without calling end_agent_run.
  - Always use `uv run` for Python commands.
  - Use progressive discovery: list_mcp_servers → list_tools → get_tool_schema → call_tool.
  - While in LOAD_SKILLS, do not call claim_task, get_task, get_workflow_status,
    or get_agent_definition. Only load skills from gobby-skills until the
    workflow advances to REVIEW.

workflows:
  rule_selectors:
    include:
      - "tag:default"
      - "tag:worker-safety"
    exclude:
      - "tag:sync"

step_variables:
  task_claimed: false
  required_skills:
    - code-index
    - task-transitions
    - verification-before-completion
  required_skills_loaded: false
  review_approved: false
  review_complete: false

steps:
  - name: claim
    description: "Claim the assigned task"
    status_message: |
      Claim your task by calling claim_task with your assigned_task_id,
      then call get_task to read the full details.
    allowed_tools:
      - mcp__gobby__call_tool
      - mcp__gobby__list_mcp_servers
      - mcp__gobby__list_tools
      - mcp__gobby__get_tool_schema
    allowed_mcp_tools:
      - "gobby-tasks:claim_task"
      - "gobby-tasks:get_task"
    on_mcp_success:
      - server: gobby-tasks
        tool: claim_task
        action: set_variable
        variable: task_claimed
        value: true
    transitions:
      - to: load_skills
        when: "vars.task_claimed"

  - name: load_skills
    description: "Load required QA session skills"
    status_message: |
      Load skills now. Do not call claim_task, get_task, get_workflow_status, or
      get_agent_definition in this step.

      Call these exact tools before reviewing:
      1. get_skill(name="code-index") on gobby-skills
      2. get_skill(name="task-transitions") on gobby-skills
      3. get_skill(name="verification-before-completion") on gobby-skills
    allowed_tools:
      - mcp__gobby__call_tool
      - mcp__gobby__list_mcp_servers
      - mcp__gobby__list_tools
      - mcp__gobby__get_tool_schema
    allowed_mcp_tools:
      - "gobby-skills:get_skill"
    on_mcp_success:
      - server: gobby-skills
        tool: get_skill
        action: set_variable
        variable: required_skills_loaded
        value: >-
          all(skill in vars.get('loaded_skills', []) for skill in vars.required_skills)
    transitions:
      - to: review
        when: >-
          all(skill in vars.get('loaded_skills', []) for skill in vars.required_skills)

  - name: review
    description: "Review spec compliance first, then code quality, and emit verdict"
    status_message: |
      Review the code changes for the assigned task.
      Do not call claim_task or get_workflow_status in REVIEW.
      1. spec_compliance: compare task description, validation criteria, coverage labels,
         required files/tests, and diff. Reject before code_quality if required behavior
         is missing or incorrect.
      2. tdd_required: when the task is marked `tdd:required` or requests
         test-driven-development, reject unless the implementation handoff
         contains red, green, refactor/final-green, exact test command, and
         test-quality audit evidence.
      3. code_quality: after spec_compliance passes, review tests, maintainability,
         regressions, safety, style, and repo fit.
      4. APPROVE: call approve_review with stage_name="development" only when all pass
      5. REJECT: call reject_review with stage_name="development" and blocking findings
      6. ESCALATE: call escalate_task only if your workflow is broken and you
         cannot approve_review or reject_review
      After successful final validation, immediately call one of those verdict tools.
      If get_task shows the task is no longer at development:needs_review,
      this reviewer is stale. Do not emit a second verdict; call end_agent_run
      after the workflow transitions to terminate.
      After deciding, call exactly one verdict tool immediately:
      - approve_review via gobby-tasks-ops with task_id=assigned_task_id,
        stage_name="development", and approval_notes containing review evidence
      - reject_review via gobby-tasks-ops with task_id=assigned_task_id,
        stage_name="development", and concrete rejection_notes
      - escalate_task via gobby-tasks with task_id=assigned_task_id and reason
        only for "my workflow is broken" tooling failures
      Do not poll artifacts, wait for mutexes, wait for merges, or use the
      `gobby tasks` CLI. Dispatcher lifecycle owns post-verdict merge/closure.
      Do not run the full pytest suite; use focused validation commands only.
    allowed_tools:
      - Bash
      - Read
      - Grep
      - Glob
      - LS
      - mcp__gobby__call_tool
      - mcp__gobby__list_mcp_servers
      - mcp__gobby__list_tools
      - mcp__gobby__get_tool_schema
    blocked_mcp_tools:
      - "gobby-tasks:close_task"
      - "gobby-tasks:de_escalate_task"
      - "gobby-tasks-ops:submit_for_review"
      - "gobby-tasks:reopen_task"
      - "gobby-agents:spawn_agent"
      - "gobby-agents:kill_agent"
    allowed_mcp_tools:
      - "gobby-tasks:get_task"
      - "gobby-tasks:get_task_diff"
      - "gobby-tasks-ops:approve_review"
      - "gobby-tasks-ops:reject_review"
      - "gobby-tasks:escalate_task"
    on_mcp_success:
      - server: gobby-tasks
        tool: get_task
        when: >-
          tool_output.get('success') is not False
          and bool(tool_output.get('result'))
          and (
            tool_output.get('result', {}).get('state', {}).get('is_closed')
            or tool_output.get('result', {}).get('state', {}).get('current_stage', {}).get('name') != 'development'
            or tool_output.get('result', {}).get('state', {}).get('current_stage', {}).get('state') != 'needs_review'
          )
        action: set_variable
        variable: review_complete
        value: true
      - server: gobby-tasks-ops
        tool: approve_review
        action: set_variable
        variable: review_approved
        value: true
      - server: gobby-tasks-ops
        tool: approve_review
        action: set_variable
        variable: review_complete
        value: true
      - server: gobby-tasks-ops
        tool: reject_review
        action: set_variable
        variable: review_complete
        value: true
      - server: gobby-tasks
        tool: escalate_task
        action: set_variable
        variable: review_complete
        value: true
    transitions:
      - to: terminate
        when: "vars.review_complete"

  - name: terminate
    description: "Self-terminate"
    status_message: "Call end_agent_run to signal this review agent is complete."
    allowed_tools:
      - mcp__gobby__call_tool
      - mcp__gobby__list_mcp_servers
      - mcp__gobby__list_tools
      - mcp__gobby__get_tool_schema
    allowed_mcp_tools:
      - "gobby-agents:end_agent_run"

exit_condition: "current_step == 'terminate'"
