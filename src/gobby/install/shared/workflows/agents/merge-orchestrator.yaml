name: merge-orchestrator
description: |
  Bounded PR and merge delivery coordinator. In the pr stage it probes
  branch protection, opens or updates GitHub PRs, records PR gate state,
  and submits the stage verdict. In the merge stage it either lands the PR
  through GitHub or runs the existing direct merge-worker campaign.
  Operates within a single coordinating task — does not spawn cross-task
  campaigns. Loads merge-expert and build-coordinator skills on start.

version: "1.1"
enabled: true
priority: 20
surfaces: [spawn, persona]
provider: codex
model: gpt-5.6-sol
reasoning_effort: xhigh
isolation: none
blocked_mcp_tools:
  - "gobby-agents:kill_agent"

prompts:
  persona: |
    Guide merge and integration decisions by inspecting branch relationships, dependency order, validation evidence, and conflict risk. Keep repository state and recovery paths explicit.
  agent: |
    Lifecycle model:
    - Rules are authored against semantic workflow events such as `turn_start` and `turn_end`.
    - Raw `before_agent`, `after_agent`, and `stop` are provider/runtime details, not the main authoring API.
    - End-of-turn gates may keep the current turn alive until the campaign report is written.
    - Ending the current turn is separate from explicit agent termination, which this workflow performs with `end_agent_run`.

    You are the delivery orchestrator for both `pr` and `merge` stages. Your
    assigned task is in assigned_task_id and the active stage is in stage_name.
    The task description lists the worktrees (or selection criteria) and the
    target branch.

    Methodology:
    After claiming the task, load the `merge-expert` and `build-coordinator`
    skills before anything else. Call
    get_skill(name="merge-expert") and get_skill(name="build-coordinator") on
    gobby-skills, then continue. Follow merge-expert exactly:
    Survey -> Plan -> Execute -> Recover -> Verify -> Output (campaign report).

    PR stage workflow:
    - Claim the assigned task and load merge-expert plus build-coordinator.
    - Survey the relevant worktrees and target branch.
    - For each delivery unit, call gobby-merge:probe_branch_protection and
      record the result with gobby-tasks-ops:record_pr_state.
    - If a unit does not require a PR, record pr_required=false and pr_state
      "direct_merge"; then submit the pr stage for review and call
      record_pr_verdict(verdict="approve"). The merge stage will run the
      direct-merge path.
    - If a unit requires a PR, read the delivery campaign state and call
      gobby-tasks-ops:open_delivery_pr. The tool pushes the source branch,
      reuses or opens the GitHub PR, and persists task_delivery_units PR
      metadata. Then post a COMMENT review summarizing the epic QA notes;
      approval stays with external reviewers.
    - Poll github:get_pull_request_status, github:get_pull_request, and
      github:get_pull_request_reviews. Record snapshots with record_pr_state
      and end the run while waiting; dispatcher heartbeat will respawn you.
    - If GitHub reports conflicts, call github:update_pull_request_branch
      first. If that fails, perform one local AI-assisted update using the
      existing merge tools, push with --force-with-lease, and record
      local_update_attempts=1. Escalate on a second conflict event.
    - When CI/review/mergeability are ready, submit the pr stage for review
      and call record_pr_verdict(verdict="approve", ...). The dispatcher then
      advances to merge.

    Merge stage workflow:
    - Claim the assigned campaign task and read its description.
    - Load merge-expert and build-coordinator before doing anything else.
    - Read gobby-tasks-ops:get_delivery_state. If PR URLs are present and
      ready, land them with github:merge_pull_request using the recorded
      merge_strategy (default squash), then call record_merge_result.
    - If delivery state says no PR is required, run the existing direct merge
      campaign: analyze_merge_landscape, predict_conflicts, and inspect
      merge_state for any worktree with non-null merge_state. Use each
      worktree's base_branch as the target branch unless the task explicitly
      names a different target.
    - Plan: emit an ordered merge_plan into your session (variable
      merge_plan). Each step picks an action: merge | cherry-pick |
      merge_subset | abort.
    - Execute: for each step, dispatch merge-worker via spawn_agent (or
      dispatch_batch for parallel-safe steps), include the step's verify command
      in the worker prompt when one exists, and capture every successful run id.
      For a single worker, call gobby-agents:wait_for_agent once to subscribe once.
      If it returns completed=false, end the turn. On the daemon wake, re-call
      `gobby-agents:wait_for_agent` first with the saved run id so the terminal
      payload updates workflow state. For dispatch_batch, use
      current_batch_run_ids: subscribe once for every captured id, then end the
      turn. On each wake, re-call `gobby-agents:wait_for_agent` first for the woken
      id, then sweep every id still in current_batch_run_ids. Inspect merge
      state and spawn replacement workers only once that list is empty. Workers run
      verify_in_worktree before
      recording a successful merge result when a verify command is supplied. Use
      final=true only on the last campaign-level verification. Append a lifecycle
      event per step.
      Preserve any required environment guards in verify commands, including
      `GOBBY_TEST_PROTECT=1` prefixes or `env GOBBY_TEST_PROTECT=1` wrappers.
      TDD red-phase tasks are different: when the task is a test-writing task
      whose entry criteria or review notes say the new tests are expected to
      fail before implementation, do not pass that expected-failing pytest command
      as a green verify command. For those tasks, merge cleanly, cite the QA red
      evidence in the report, and verify only the merge/worktree state unless the
      plan provides a non-red structural check.
    - For ordinary clean worktree delivery, worker prompts must instruct the
      merge-worker to call gobby-worktrees:merge_worktree with the worktree_id
      and the worktree's base_branch target_branch, run verify_in_worktree before
      recording success when a verify command is supplied, then record the
      merge_sha returned by merge_worktree.
      Tell the worker to pass any guarded verify command through unchanged; do
      not convert `GOBBY_TEST_PROTECT=1 uv run pytest ...` to unguarded pytest.
      Do not instruct a clean worker to use merge_start/merge_apply as the
      landing path; merge_apply resolves the source/worktree branch and is not
      the final target branch merge SHA.
    - Worker prompts must stay inside the merge-worker MCP surface. For active
      conflict resolution, instruct the worker to call merge_status, then resolve
      exactly one pending conflict_id at a time with
      merge_resolve(conflict_id=..., use_ai=true), call merge_status again, and
      only then continue to the next pending conflict. After merge_apply
      resolves all conflicts, instruct the worker to call merge_worktree exactly
      once and record merge_worktree's merge_sha as the final delivery SHA. Tell
      workers not to issue multiple merge_resolve calls in the same assistant
      turn or parallel tool batch. Do not instruct merge-workers to use
      Read/Bash or to synthesize manual resolved_content from file inspection.
      If retries are exhausted or conflicts remain unresolved, instruct the
      worker to call gobby-tasks-ops:record_merge_result with failure_reason;
      the merge-worker workflow will transition to terminate before
      end_agent_run.
    - When checking for already-running merge work, list only child runs of
      this orchestrator session. Treat a run as an active worker only when
      agent_name is exactly `merge-worker`. Never wait on this orchestrator's
      own run_id, and never treat another `merge-orchestrator` run as a
      merge-worker.
    - After every completed merge-worker wait, inspect merge state before any
      additional spawn_agent call. If inspect_merge_state exposes an
      active_resolution_id, call merge_status for that resolution before
      spawning another worker. If the resolved_count/pending_count signature is unchanged
      for the resolution and pending_count is still non-zero, another redispatch
      would repeat the stall — apply the no-progress cap. If inspect_merge_state
      has no active_resolution_id, merge_status has nothing to query. Treat clean
      state as having no resumable worker-owned resolution; treat resumable git
      state without an active resolution as failed execution and record a failed
      merge result or escalate. This no-progress cap is scoped to workers this orchestrator run actually
      waited for; historical delivery campaign failures
      and last_error text are evidence for the report, but are not by themselves
      a redispatch blocker.
    - If a worker returns success but inspect_merge_state or merge_status still
      shows unresolved merge state, treat that as a failed execution, record a
      failed merge result with the stale worker run id and unresolved files —
      the campaign is not clean.
    - Recover orphaned merge state before scheduling fresh work in the same
      worktree. If inspect_merge_state exposes an active_resolution_id with
      pending conflicts and can_resume=true, continue the active resolution with
      merge_status plus a merge-worker before considering merge_abort. Use
      merge_abort only when there is no resumable active resolution or recovery
      is explicitly unsafe.
    - Report: record the campaign result with
      gobby-tasks-ops:record_merge_result. If the merge survey/plan is empty
      because the campaign work is already landed, call
      gobby-tasks:close_task(reason="already_implemented", preview=true) and repair
      any blocker until that call closes the task instead of recording a failed
      merge result.
    - After a successful merge result is recorded, call
      gobby-tasks-ops:close_linked_github_issue with the assigned task id and
      merge_sha. The tool comments on the linked issue, applies `gobby:resolved`,
      and closes it when the task has github_repo and github_issue_number.
    - Record a clean merge, record a failed merge with failure_reason, close an
      empty/no-op campaign with reason="already_implemented", or escalate_task
      when human intervention is required. Terminate only by calling
      end_agent_run.

    Boundaries:
    - Post PR reviews with event=COMMENT only — external review remains the
      approval gate, and a bot APPROVE would bypass it.
    - Do NOT close_task on the campaign task except for the explicit
      already_implemented no-op path when survey/plan finds no merge work.
    - Survey, dispatch, and verify only — code edits belong to merge-workers,
      where they stay attributed and reviewable.
    - Terminate with end_agent_run in the terminate step; kill_agent on your
      own run leaves the campaign state unresolved.
    - Workers cannot spawn workers — the depth-5 cap is enforced by the
      runtime. Plan accordingly.
    - Do NOT use Bash sleep loops, tmux polling loops, or provider Monitor for
      worker waits. Use gobby-agents:wait_for_agent to subscribe once, end the
      turn while the run is active, and on wake re-call
      `gobby-agents:wait_for_agent` first. Use get_agent_result only if you need
      to re-read the final report.
    - Run Python through `uv run` in any command that ends up inside
      verify_in_worktree; the system Python lacks the project deps.
    - Use context-aware progressive discovery: call leased known tools directly; fetch schemas directly for known unleased tools; use list_tools only for unknown tool names and list_mcp_servers only for unknown servers or registries.
workflows:
  rule_selectors:
    include:
      - "tag:default"
      - "tag:worker-safety"
    exclude:
      - "tag:task-skill-gates"

step_workflow:
  variables:
    task_claimed: false
    skill_loaded: false
    build_coordinator_skill_loaded: false
    survey_complete: false
    execution_complete: false
    report_complete: false
    merge_worker_completed: false
    post_worker_merge_status_checked: false
    last_merge_status_signature: ""
    no_progress_merge_status_count: 0
    new_status_signature: ""
    pending_count_int: 0
    merge_status_made_no_progress: false
    current_batch_run_ids: []
    last_worker_run_id: ""

  exit_condition: "current_step == 'terminate'"
  steps:
    - name: claim
      mcp_error_policy: stay
      description: "Claim the assigned campaign task"
      status_message: |
        Claim the assigned campaign task with claim_task(task_id=assigned_task_id),
        then read it with get_task to load worktree IDs and target branch.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-tasks:claim_task"
        - "gobby-tasks:get_task"
      on_mcp_success:
        - server: gobby-tasks
          tool: claim_task
          action: set_variable
          variable: task_claimed
          value: true
      transitions:
        - to: load_skill
          when: "vars.task_claimed"

    - name: load_skill
      mcp_error_policy: stay
      description: "Load required merge and build coordinator skills"
      status_message: |
        Call get_skill(name="merge-expert") and
        get_skill(name="build-coordinator") on gobby-skills, then continue.
        Use only mcp__gobby__call_tool in this step. Call get_skill directly:
        call_tool("gobby-skills", "get_skill", {"name": <skill>});
        native Skill, GitHub/app connector, and Computer Use tools bypass
        Gobby's skill tracking.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-skills:get_skill"
        - "gobby-skills:get_skill_file"
      on_mcp_success:
        - server: gobby-skills
          tool: get_skill
          when: "tool_input.name == 'merge-expert'"
          action: set_variable
          variable: skill_loaded
          value: true
        - server: gobby-skills
          tool: get_skill
          when: "tool_input.name == 'build-coordinator'"
          action: set_variable
          variable: build_coordinator_skill_loaded
          value: true
      transitions:
        - to: survey
          when: "vars.skill_loaded and vars.build_coordinator_skill_loaded"

    - name: survey
      mcp_error_policy: stay
      description: "Survey unmerged worktrees and predict conflicts"
      status_message: |
        Run analyze_merge_landscape, predict_conflicts, and inspect_merge_state
        to build a complete picture. Refuse to plan if the landscape is empty —
        close the campaign task with reason=already_implemented instead. Use each
        worktree's base_branch as target_branch unless the task explicitly
        names another — defaulting to main mis-targets stacked worktrees.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
        - mcp__gobby__set_variable
        - mcp__gobby__get_variable
      allowed_mcp_tools:
        - "gobby-merge:analyze_merge_landscape"
        - "gobby-merge:predict_conflicts"
        - "gobby-merge:inspect_merge_state"
        - "gobby-merge:probe_branch_protection"
        - "gobby-worktrees:list_worktrees"
        - "gobby-worktrees:get_worktree"
        - "gobby-tasks:get_task"
        - "gobby-tasks:close_task"
        - "gobby-tasks-ops:get_artifacts"
        - "gobby-tasks-ops:get_delivery_state"
      on_mcp_success:
        - server: gobby-merge
          tool: predict_conflicts
          action: set_variable
          variable: survey_complete
          value: true
        - server: gobby-tasks
          tool: close_task
          when: >-
              (
                tool_output.get('closed') is True
                or tool_output.get('result', {}).get('closed') is True
              )
              and tool_input.get('reason') == 'already_implemented'
          action: set_variable
          variable: report_complete
          value: true
      transitions:
        - to: terminate
          when: "vars.report_complete"
        - to: plan
          when: "vars.survey_complete"

    - name: plan
      mcp_error_policy: stay
      description: "Emit an ordered merge_plan based on the survey"
      status_message: |
        Apply the merge-expert ordering rubric (recover orphans -> toposort by
        task deps -> fewest predicted conflicts -> smallest diff -> freshness).
        Pick an action per step (merge | cherry-pick | merge_subset | abort).
        Store the plan as session variable merge_plan, then transition. If a
        provider emits merge_plan_json instead, treat it as the same plan.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
        - mcp__gobby__set_variable
        - mcp__gobby__get_variable
      allowed_mcp_tools:
        - "gobby-merge:analyze_merge_landscape"
        - "gobby-merge:predict_conflicts"
        - "gobby-merge:inspect_merge_state"
        - "gobby-merge:probe_branch_protection"
        - "gobby-worktrees:list_worktrees"
        - "gobby-worktrees:get_worktree"
        - "gobby-tasks:get_task"
        - "gobby-tasks:list_tasks"
        - "gobby-tasks:close_task"
        - "gobby-tasks-ops:get_artifacts"
        - "gobby-tasks-ops:get_delivery_state"
        - "gobby-agents:list_agent_runs"
        - "gobby-agents:list_running_agents"
        - "gobby-agents:get_running_agent"
      on_mcp_success:
        - server: gobby-tasks
          tool: close_task
          when: >-
              (
                tool_output.get('closed') is True
                or tool_output.get('result', {}).get('closed') is True
              )
              and tool_input.get('reason') == 'already_implemented'
          action: set_variable
          variable: report_complete
          value: true
      transitions:
        - to: terminate
          when: "vars.report_complete"
        - to: execute
          when: "vars.get('merge_plan') or vars.get('merge_plan_json')"

    - name: execute
      mcp_error_policy: stay
      description: "Execute PR gating or direct merge steps"
      status_message: |
        If stage_name is pr, call open_delivery_pr, post COMMENT
        review summaries, poll CI/review/mergeability, update stale PRs once,
        record delivery state, and submit/approve the pr stage only when gates
        are ready. If stage_name is merge, land ready PRs via GitHub or run the
        direct merge-worker campaign, then verify before reporting.
      allowed_tools: "all"
      allowed_mcp_tools:
        - "gobby-tasks-ops:get_delivery_state"
        - "gobby-tasks-ops:record_pr_state"
        - "gobby-tasks-ops:record_pr_opened"
        - "gobby-tasks-ops:open_delivery_pr"
        - "gobby-tasks-ops:submit_for_review"
        - "gobby-tasks-ops:record_pr_verdict"
        - "gobby-tasks-ops:record_merge_result"
        - "gobby-tasks-ops:close_linked_github_issue"
        - "gobby-tasks-ops:append_description_section"
        - "gobby-tasks:close_task"
        - "gobby-tasks:escalate_task"
        - "gobby-skills:get_skill"
        - "gobby-skills:get_skill_file"
        - "gobby-worktrees:push_branch"
        - "gobby-worktrees:merge_worktree"
        - "gobby-worktrees:mark_worktree_merged"
        - "gobby-worktrees:delete_worktree"
        - "gobby-worktrees:list_worktrees"
        - "gobby-merge:analyze_merge_landscape"
        - "gobby-merge:predict_conflicts"
        - "gobby-merge:inspect_merge_state"
        - "gobby-merge:merge_start"
        - "gobby-merge:merge_status"
        - "gobby-merge:merge_resolve"
        - "gobby-merge:merge_apply"
        - "gobby-merge:merge_abort"
        - "gobby-merge:cherry_pick_into_worktree"
        - "gobby-merge:merge_subset"
        - "gobby-merge:verify_in_worktree"
        - "gobby-agents:can_spawn_agent"
        - "gobby-agents:evaluate_spawn"
        - "gobby-agents:spawn_agent"
        - "gobby-agents:dispatch_batch"
        - "gobby-agents:wait_for_agent"
        - "gobby-agents:list_agent_runs"
        - "gobby-agents:get_agent_result"
        - "gobby-agents:get_agent_capture"
        - "gobby-agents:list_running_agents"
        - "gobby-agents:get_running_agent"
        - "gobby-agents:running_agent_stats"
        - "github:create_pull_request_review"
        - "github:get_pull_request"
        - "github:get_pull_request_status"
        - "github:get_pull_request_reviews"
        - "github:update_pull_request_branch"
        - "github:merge_pull_request"
      blocked_mcp_tools:
        - "gobby-tasks:reopen_task"
        - "gobby-agents:kill_agent"
      on_mcp_success:
        - server: gobby-agents
          tool: spawn_agent
          action: set_variable
          variable: merge_worker_completed
          value: false
        - server: gobby-agents
          tool: spawn_agent
          action: set_variable
          variable: post_worker_merge_status_checked
          value: false
        - server: gobby-agents
          tool: spawn_agent
          when: "bool(tool_output.get('run_id') or tool_output.get('result', {}).get('run_id'))"
          action: set_variable
          variable: last_worker_run_id
          value: "str(tool_output.get('run_id') or tool_output.get('result', {}).get('run_id'))"
        - server: gobby-agents
          tool: spawn_agent
          when: "bool(tool_output.get('run_id') or tool_output.get('result', {}).get('run_id'))"
          action: set_variable
          variable: current_batch_run_ids
          value: "(vars.get('current_batch_run_ids') or []) + [rid for rid in [str(tool_output.get('run_id') or tool_output.get('result', {}).get('run_id'))] if rid and rid not in (vars.get('current_batch_run_ids') or [])]"
        - server: gobby-agents
          tool: dispatch_batch
          action: set_variable
          variable: merge_worker_completed
          value: false
        - server: gobby-agents
          tool: dispatch_batch
          action: set_variable
          variable: post_worker_merge_status_checked
          value: false
        - server: gobby-agents
          tool: dispatch_batch
          action: set_variable
          variable: current_batch_run_ids
          value: "(vars.get('current_batch_run_ids') or []) + [r.get('run_id') for r in ((tool_output.get('result') or tool_output).get('results') or []) if r.get('success') and r.get('run_id') and r.get('run_id') not in (vars.get('current_batch_run_ids') or [])]"
        - server: gobby-agents
          tool: wait_for_agent
          when: "tool_output.get('completed') is True or (tool_output.get('completed') is None and tool_output.get('result', {}).get('completed') is True)"
          action: set_variable
          variable: merge_worker_completed
          value: true
        - server: gobby-agents
          tool: wait_for_agent
          when: "tool_output.get('completed') is True or (tool_output.get('completed') is None and tool_output.get('result', {}).get('completed') is True)"
          action: set_variable
          variable: post_worker_merge_status_checked
          value: false
        - server: gobby-agents
          tool: wait_for_agent
          when: "tool_output.get('completed') is True or (tool_output.get('completed') is None and tool_output.get('result', {}).get('completed') is True)"
          action: set_variable
          variable: last_worker_run_id
          value: "str(tool_output.get('run_id') or tool_output.get('result', {}).get('run_id'))"
        - server: gobby-agents
          tool: wait_for_agent
          when: "tool_output.get('completed') is True or (tool_output.get('completed') is None and tool_output.get('result', {}).get('completed') is True)"
          action: set_variable
          variable: current_batch_run_ids
          value: "[r for r in (vars.get('current_batch_run_ids') or []) if r != str(tool_output.get('run_id') or tool_output.get('result', {}).get('run_id'))]"
        - server: gobby-merge
          tool: inspect_merge_state
          when: "vars.get('merge_worker_completed') is True and not vars.get('current_batch_run_ids') and not tool_output.get('active_resolution_id')"
          action: set_variable
          variable: post_worker_merge_status_checked
          value: true
        - server: gobby-merge
          tool: inspect_merge_state
          when: "vars.get('merge_worker_completed') is True and not vars.get('current_batch_run_ids') and not tool_output.get('active_resolution_id')"
          action: set_variable
          variable: last_merge_status_signature
          value: "'no-active-resolution:' + str(tool_output.get('state')) + ':' + str(tool_output.get('conflicted_files'))"
        - server: gobby-merge
          tool: inspect_merge_state
          when: "vars.get('merge_worker_completed') is True and not vars.get('current_batch_run_ids') and not tool_output.get('active_resolution_id') and tool_output.get('can_resume')"
          action: set_variable
          variable: no_progress_merge_status_count
          value: 1
        - server: gobby-merge
          tool: merge_status
          action: set_variable
          variable: new_status_signature
          value: "str(tool_input.get('resolution_id', '')) + ':' + str((tool_output.get('result') or tool_output).get('resolved_count')) + '/' + str((tool_output.get('result') or tool_output).get('pending_count'))"
        - server: gobby-merge
          tool: merge_status
          action: set_variable
          variable: pending_count_int
          value: "int((tool_output.get('result') or tool_output).get('pending_count', 0))"
        - server: gobby-merge
          tool: merge_status
          action: set_variable
          variable: merge_status_made_no_progress
          value: "not vars.get('current_batch_run_ids') and vars.get('merge_worker_completed') is True and vars.get('last_merge_status_signature') == vars.get('new_status_signature') and vars.get('pending_count_int', 0) > 0"
        - server: gobby-merge
          tool: merge_status
          when: "vars.get('merge_status_made_no_progress') is True"
          action: set_variable
          variable: no_progress_merge_status_count
          value: "vars.get('no_progress_merge_status_count', 0) + 1"
        - server: gobby-merge
          tool: merge_status
          when: "vars.get('merge_status_made_no_progress') is not True"
          action: set_variable
          variable: no_progress_merge_status_count
          value: 0
        - server: gobby-merge
          tool: merge_status
          action: set_variable
          variable: last_merge_status_signature
          value: "vars.get('new_status_signature', '')"
        - server: gobby-merge
          tool: merge_status
          action: set_variable
          variable: post_worker_merge_status_checked
          value: true
        - server: gobby-merge
          tool: verify_in_worktree
          when: "tool_input.final is True"
          action: set_variable
          variable: execution_complete
          value: true
        - server: gobby-tasks-ops
          tool: record_merge_result
          action: set_variable
          variable: execution_complete
          value: true
        - server: gobby-tasks-ops
          tool: record_merge_result
          action: set_variable
          variable: report_complete
          value: true
        - server: gobby-tasks
          tool: close_task
          when: >-
              (
                tool_output.get('closed') is True
                or tool_output.get('result', {}).get('closed') is True
              )
              and tool_input.get('reason') == 'already_implemented'
          action: set_variable
          variable: execution_complete
          value: true
        - server: gobby-tasks
          tool: close_task
          when: >-
              (
                tool_output.get('closed') is True
                or tool_output.get('result', {}).get('closed') is True
              )
              and tool_input.get('reason') == 'already_implemented'
          action: set_variable
          variable: report_complete
          value: true
        - server: gobby-tasks
          tool: escalate_task
          action: set_variable
          variable: execution_complete
          value: true
        - server: gobby-tasks
          tool: escalate_task
          action: set_variable
          variable: report_complete
          value: true
      on_mcp_before:
        - server: gobby-agents
          tool: spawn_agent
          action: block
          when: "bool(vars.get('current_batch_run_ids')) or (vars.get('merge_worker_completed') is True and not vars.get('post_worker_merge_status_checked', False))"
          reason: |
            A merge-worker batch is still outstanding, or
            merge_status has not been checked for a completed worker. For an
            outstanding batch,
            re-call wait_for_agent for the woken run first and sweep every run id
            still in current_batch_run_ids; spawn again only once the list is empty.
            Otherwise, call gobby-merge:inspect_merge_state before spawning. If it
            returns active_resolution_id, call gobby-merge:merge_status for that
            resolution and compare resolved_count/pending_count. If it returns no
            active_resolution_id, merge_status has nothing to query;
            verify clean state, record a failed merge result, or escalate instead
            of redispatching blindly.
        - server: gobby-agents
          tool: spawn_agent
          action: block
          when: "vars.get('no_progress_merge_status_count', 0) >= 1"
          reason: |
            NO_PROGRESS_MERGE_WORKER_REDISPATCH_CAP reached. The last completed
            merge-worker in this orchestrator run did not change the active
            merge_status resolved_count/pending_count signature, and conflicts
            remain pending. Historical failed campaign state alone does not trip
            this cap. Another merge-worker on the same resolution would
            repeat the stall. Call
            gobby-tasks-ops:record_merge_result with failure_reason,
            including last_worker_run_id, unchanged counts, and unresolved
            conflict ids/files.
      transitions:
        - to: report
          when: "vars.execution_complete"

    - name: report
      mcp_error_policy: stay
      description: "Write the campaign report and transition the campaign task"
      status_message: |
        Call gobby-tasks-ops:record_merge_result with report_ref and either
        merge_sha for clean success or failure_reason for unresolved failures.
        Use escalate_task only when human intervention is required.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-tasks-ops:record_merge_result"
        - "gobby-tasks-ops:close_linked_github_issue"
        - "gobby-tasks:close_task"
        - "gobby-tasks:escalate_task"
        - "gobby-tasks-ops:append_description_section"
      on_mcp_success:
        - server: gobby-tasks-ops
          tool: record_merge_result
          action: set_variable
          variable: report_complete
          value: true
        - server: gobby-tasks-ops
          tool: close_linked_github_issue
          action: set_variable
          variable: report_complete
          value: true
        - server: gobby-tasks
          tool: close_task
          when: >-
              (
                tool_output.get('closed') is True
                or tool_output.get('result', {}).get('closed') is True
              )
              and tool_input.get('reason') == 'already_implemented'
          action: set_variable
          variable: report_complete
          value: true
        - server: gobby-tasks
          tool: escalate_task
          action: set_variable
          variable: report_complete
          value: true
      transitions:
        - to: terminate
          when: "vars.report_complete"

    - name: terminate
      description: "Self-terminate"
      status_message: >-
        Call mcp__gobby__call_tool with server_name="gobby-agents",
        tool_name="end_agent_run", and arguments={} to finish the run.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-agents:end_agent_run"

