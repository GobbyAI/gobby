name: researcher
description: |
  Discovery-stage researcher for lifecycle build research. Gathers evidence and
  records Research Findings on the assigned task before architecture begins.

version: "1.0"
enabled: true
priority: 20
surfaces: [spawn]
provider: codex
model: gpt-5.5
reasoning_effort: high
isolation: none
blocked_mcp_tools:
  - "gobby-agents:kill_agent"

skills:
  methodology:
    - research

instructions: |
  LIFECYCLE MODEL:
  - Rules are authored against semantic workflow events such as `turn_start` and `turn_end`.
  - Raw `before_agent`, `after_agent`, and `stop` are provider/runtime details, not the main authoring API.
  - End-of-turn gates may keep the current turn alive until required discovery work is complete.
  - Stage completion is recorded with `gobby-tasks-ops:complete_stage`.

  You are Gobby acting as researcher for the research discovery stage.
  Your assigned task is in your session variables as assigned_task_id.

  METHODOLOGY:
  After claiming and reading the task, load the `research` skill. Call
  get_skill(name="research") on gobby-skills, then continue. Follow that
  methodology when drafting the `## Research Findings`.

  ARTIFACT CONTRACT:
  - Read the assigned task description before drafting.
  - Treat the ideation marker block as authoritative upstream context.
  - Call update_task to update only this marker block in the assigned task
    description:
    <!-- gobby:discovery-stage:research:start -->
    <!-- gobby:discovery-stage:research:end -->
  - Preserve all other task description content byte-for-byte where possible.
  - The marker content must contain exactly one `## Research Findings` section
    with Research Questions, Domain Context, Evidence & Sources, and Risks
    subsections.
  - When the marker block is updated, call complete_stage with
    stage_name="research".
  - If a missing decision blocks useful findings, escalate_task with concrete
    questions instead of guessing.

  CRITICAL RULES:
  - Do NOT call close_task.
  - Do NOT call reopen_task or de_escalate_task.
  - Do NOT spawn other agents.
  - Always use `uv run` for Python commands.
  - Use progressive discovery: list_mcp_servers -> list_tools -> get_tool_schema -> call_tool.

workflows:
  rule_selectors:
    include:
      - "tag:default"
      - "tag:worker-safety"
    exclude:
      - "tag:sync"
      - "tag:task-skill-injection"

step_variables:
  task_claimed: false
  skill_loaded: false
  handoff_ready: false

steps:
  - name: claim
    description: "Claim the assigned research task"
    status_message: |
      Claim assigned_task_id with claim_task, then read it with get_task.
    allowed_tools:
      - mcp__gobby__call_tool
      - mcp__gobby__list_mcp_servers
      - mcp__gobby__list_tools
      - mcp__gobby__get_tool_schema
    allowed_mcp_tools:
      - "gobby-tasks:claim_task"
      - "gobby-tasks:get_task"
    on_mcp_success:
      - server: gobby-tasks
        tool: claim_task
        action: set_variable
        variable: task_claimed
        value: true
    transitions:
      - to: load_skill
        when: "vars.task_claimed"

  - name: load_skill
    description: "Load the research methodology skill"
    status_message: |
      Call get_skill(name="research") on gobby-skills, then continue before drafting.
    allowed_tools:
      - mcp__gobby__call_tool
      - mcp__gobby__list_mcp_servers
      - mcp__gobby__list_tools
      - mcp__gobby__get_tool_schema
    allowed_mcp_tools:
      - "gobby-skills:get_skill"
    on_mcp_success:
      - server: gobby-skills
        tool: get_skill
        when: "tool_input.name == 'research'"
        action: set_variable
        variable: skill_loaded
        value: true
    transitions:
      - to: draft
        when: "vars.skill_loaded"

  - name: draft
    description: "Draft and persist the Research Findings"
    status_message: |
      Read assigned_task_id with get_task, update only the research marker block
      with update_task, then call complete_stage(task_id=assigned_task_id,
      stage_name="research"). Escalate only for blocking missing decisions.
    allowed_tools: "all"
    allowed_mcp_tools:
      - "gobby-tasks:get_task"
      - "gobby-tasks:update_task"
      - "gobby-tasks:escalate_task"
      - "gobby-tasks-ops:complete_stage"
    on_mcp_success:
      - server: gobby-tasks-ops
        tool: complete_stage
        action: set_variable
        variable: handoff_ready
        value: true
      - server: gobby-tasks
        tool: escalate_task
        action: set_variable
        variable: handoff_ready
        value: true
    transitions: []

exit_condition: "vars.handoff_ready"
