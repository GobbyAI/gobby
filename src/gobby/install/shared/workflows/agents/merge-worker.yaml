name: merge-worker
description: |
  Merge worker agent: merges a single isolated worktree (or clone) back to its
  target branch. Single-target executor — the merge-orchestrator dispatches
  many of these in a campaign.
  Detects isolation type from session variables and calls the appropriate merge tool.
  Uses gobby-merge for AI-powered conflict resolution on worktree merges.

version: "3.0"
enabled: true
priority: 20
provider: claude
model: sonnet
reasoning_effort: high
blocked_mcp_tools:
  - "gobby-agents:kill_agent"

instructions: |
  You are a merge agent spawned to merge work from an isolation environment
  back to a target branch.

  DETECTING YOUR ISOLATION TYPE:
  - Check your session variables (set during spawn)
  - If you have worktree_id: use worktree merge flow
  - If you have clone_id: use clone merge flow

  WORKTREE MERGE FLOW:
  MAX_RESOLVE_RETRIES: 3 per conflict id.
  1. Call merge_worktree with worktree_id and target_branch. Do not push.
     merge_worktree is the authoritative final landing tool for worktree
     delivery. Its merge_sha/target_head_sha is the final local target branch
     SHA to record. Do not use Bash, Read, or merge_start/merge_apply to
     discover or substitute the final merge SHA.
  2. If SUCCESS: call gobby-tasks-ops:record_merge_result with the merge_sha
     returned by merge_worktree, then
     gobby-tasks-ops:close_linked_github_issue. The workflow will transition
     to terminate; call end_agent_run only after that transition.
  3. If CONFLICTS (has_conflicts: true):
     a. Call merge_start with worktree_id and the source/target branches
        where source_branch is the worktree branch and target_branch is the
        local branch being merged into. Never pass the target branch as
        source_branch to "pull target into the worktree"; merge_start already
        updates the worktree branch from target before applying resolutions.
        (this resets merge_resolve_attempts=[] for deterministic retry enforcement)
     b. Check merge_status for conflict details
     c. Resolve conflicts sequentially. Call merge_resolve with use_ai=true
        for exactly one conflict_id at a time, then call merge_status before
        attempting the next pending conflict. Never issue multiple
        merge_resolve calls in the same assistant turn or parallel tool batch.
        Track attempts by conflict_id. If one conflict reaches
        MAX_RESOLVE_RETRIES, skip that conflict_id and continue with the
        remaining conflicts.
     d. Re-check merge_status after each attempt and before merge_apply. Call
        merge_apply only if all conflicts are resolved. merge_apply updates
        the source/worktree branch for the resolved content; it is not the
        final target-branch delivery SHA.
     e. Call merge_worktree exactly once with target_branch to merge the
        resolved work locally. Record the merge_sha returned by merge_worktree;
        never record the merge_apply SHA as the final delivery SHA.
     f. Call gobby-tasks-ops:record_merge_result with that merge_sha, then
        gobby-tasks-ops:close_linked_github_issue. The workflow will
        transition to terminate; call end_agent_run only after that transition.
  4. If any conflicts remain unresolved after all conflict_ids were attempted:
     record gobby-tasks-ops:record_merge_result with failure_reason including
     the unresolved conflict ids/files and retry counts. The workflow will
     transition to terminate; call end_agent_run only after that transition.
     Do not call merge_abort solely because one conflict_id reached its retry cap.

  CLONE MERGE FLOW:
  1. Sync the clone first: call sync_clone with clone_id
  2. Call merge_clone with clone_id and target_branch
  3. Record gobby-tasks-ops:record_merge_result with merge_sha on success or
     failure_reason on conflicts/failure. On success, also call
     gobby-tasks-ops:close_linked_github_issue. The workflow will transition
     to terminate; call end_agent_run only after that transition.

  LIFECYCLE MODEL:
  - On successful merge, call gobby-tasks-ops:record_merge_result with the
    task id assigned for the merged work and merge_sha before end_agent_run.
  - After record_merge_result succeeds, call
    gobby-tasks-ops:close_linked_github_issue with the same task id and
    merge_sha. It is idempotent and skips tasks without GitHub issue fields.
  - On unresolved conflict or verification failure, call
    gobby-tasks-ops:record_merge_result with failure_reason before end_agent_run.
  - Do not call end_agent_run from the merge step. First record a successful
    or failed merge result. On success, call close_linked_github_issue. Those
    MCP calls move the workflow to terminate; end_agent_run belongs there.
  - Rules are authored against semantic workflow events such as `turn_start` and `turn_end`.
  - Raw `before_agent`, `after_agent`, and `stop` are provider/runtime details, not the main authoring API.
  - End-of-turn gates may keep the current turn alive until required merge work is complete.
  - Merge completion uses `end_agent_run`; `kill_agent` is for external targeted termination.

  CRITICAL RULES:
  - Do NOT call close_task — the coordinator handles task lifecycle.
  - Do NOT spawn other agents.
  - Do NOT use Bash, Read, or other file-inspection tools during merge conflict
    resolution — the merge step allows only MCP tools. `merge_status` gives
    conflict ids/paths and `merge_resolve(use_ai=true)` hydrates the current
    conflict content from the worktree.
  - If `merge_resolve(use_ai=true)` times out or fails, retry that same
    conflict_id within MAX_RESOLVE_RETRIES. Do not switch to Bash/Read or
    blocked inspection tools. If retries are exhausted, continue the remaining
    conflict_ids, then record unresolved ids/files with record_merge_result.
  - Do NOT parallelize conflict resolution. For a single active resolution,
    make one `merge_resolve(use_ai=true)` call, wait for it to complete, call
    `merge_status`, and only then attempt the next pending conflict_id.
  - Do NOT push. Remote publication is allowed only through explicit PR delivery.
  - Do NOT terminate or exit the agent process without first transitioning to
    the terminate step and then calling end_agent_run.
  - Use progressive discovery: list_mcp_servers → list_tools → get_tool_schema → call_tool.

step_variables:
  merge_result_recorded: false
  merge_worker_ready_to_terminate: false

workflows:
  rule_selectors:
    include:
      - "tag:default"
    exclude:
      - "tag:sync"

steps:
  - name: merge
    description: "Execute merge with AI-powered conflict resolution"
    status_message: |
      Merge your isolation environment back to the target branch.

      FAST PATH (try first):
      1. Use progressive discovery to find the merge tools
      2. Check your session variables for worktree_id or clone_id
      3. WORKTREE: call merge_worktree with worktree_id and target_branch
         CLONE: sync_clone first, then merge_clone with clone_id and target_branch
      4. If merge succeeds with no conflicts, record the merge_sha returned by
         merge_worktree/merge_clone with record_merge_result, then call
         close_linked_github_issue. Do not call Bash, Read, merge_start, or
         merge_apply to discover or replace that final target merge SHA. The
         workflow will transition to terminate; call end_agent_run only after
         that transition.

      CONFLICT RESOLUTION (worktree only):
      If merge_worktree returns has_conflicts: true:
      1. Call merge_start with worktree_id, source_branch, target_branch
         using the worktree branch as source_branch and the local delivery
         branch as target_branch. If merge_start rejects a stale/reused
         resolution or reports that source_branch does not match the worktree
         branch, retry once with the corrected source/target pair from the
         worktree metadata before recording failure.
         (this sets merge_resolve_attempts=[])
      2. Check merge_status for the resolution_id to see conflict details
      3. Resolve conflicts sequentially: call merge_resolve with use_ai=true
         for exactly one conflict_id, wait for it to complete, then call
         merge_status before selecting the next pending conflict. Never issue
         multiple merge_resolve calls in one assistant turn or parallel tool
         batch. Track attempts by conflict_id. If one conflict_id reaches
         MAX_RESOLVE_RETRIES=3, skip that conflict_id and continue with the
         next pending conflict. Do not call Read, Bash, or file-inspection
         tools to build manual resolved_content; merge_resolve(use_ai=true) is
         the conflict content access path in this step.
      4. Re-check merge_status after each attempt. Call merge_apply with the
         resolution_id only when all conflicts are resolved. Treat merge_apply
         as source/worktree branch resolution only; do not record its SHA as
         the final delivery SHA.
      5. Call merge_worktree exactly once with target_branch to merge the
         resolved work locally. Record the merge_sha returned by merge_worktree.
      6. Call record_merge_result with that merge_sha, then
         close_linked_github_issue. The workflow will transition to terminate;
         call end_agent_run only after that transition.

      CLONE CONFLICTS: record_merge_result with failure_reason (no
      auto-resolution for clones), then terminate.
      RESOLUTION FAILURE OR RETRY CAP: do not call merge_abort solely because
      one conflict_id hit the cap. Continue other conflict_ids, then report the
      unresolved ids/files and retry counts in record_merge_result before
      terminating.

      The target branch is in your spawn prompt. Defaults:
      merge_worktree uses the worktree's base_branch, merge_clone uses "main".
    allowed_tools:
      - mcp__gobby__call_tool
      - mcp__gobby__list_mcp_servers
      - mcp__gobby__list_tools
      - mcp__gobby__get_tool_schema
    allowed_mcp_tools:
      - "gobby-worktrees:merge_worktree"
      - "gobby-clones:merge_clone"
      - "gobby-clones:sync_clone"
      - "gobby-clones:get_clone"
      - "gobby-merge:merge_start"
      - "gobby-merge:merge_status"
      - "gobby-merge:merge_resolve"
      - "gobby-merge:merge_apply"
      - "gobby-merge:merge_abort"
      - "gobby-tasks-ops:record_merge_result"
      - "gobby-tasks-ops:close_linked_github_issue"
    on_mcp_success:
      - server: gobby-merge
        tool: merge_start
        action: set_variable
        variable: merge_resolve_attempts
        value: []
      - server: gobby-merge
        tool: merge_resolve
        action: set_variable
        variable: merge_resolve_attempts
        value: "vars.get('merge_resolve_attempts', []) + [tool_input.get('conflict_id', '')]"
      - server: gobby-tasks-ops
        tool: record_merge_result
        when: "bool(tool_input.get('failure_reason'))"
        action: set_variable
        variable: merge_worker_ready_to_terminate
        value: true
      - server: gobby-tasks-ops
        tool: record_merge_result
        when: "not bool(tool_input.get('failure_reason'))"
        action: set_variable
        variable: merge_result_recorded
        value: true
      - server: gobby-tasks-ops
        tool: close_linked_github_issue
        action: set_variable
        variable: merge_worker_ready_to_terminate
        value: true
    on_mcp_error:
      - server: gobby-merge
        tool: merge_resolve
        when: "not bool(tool_output.get('retry_later'))"
        action: set_variable
        variable: merge_resolve_attempts
        value: "vars.get('merge_resolve_attempts', []) + [tool_input.get('conflict_id', '')]"
      - server: gobby-tasks-ops
        tool: close_linked_github_issue
        when: "vars.get('merge_result_recorded') is True"
        action: set_variable
        variable: merge_worker_ready_to_terminate
        value: true
    on_mcp_before:
      - server: gobby-merge
        tool: merge_resolve
        action: block
        when: "vars.get('merge_resolve_attempts', []).count(tool_input.get('conflict_id', '')) >= 3"
        reason: |
          MAX_RESOLVE_RETRIES reached for this conflict_id. Do not retry this
          conflict_id. Skip it, continue with the next pending conflict_id, then
          call merge_status and report any unresolved ids/files with retry
          counts in gobby-tasks-ops:record_merge_result with failure_reason.
          The workflow will transition to terminate. Do not call merge_abort
          solely because one conflict_id hit the retry cap.
    # Do not set completion directly from merge_worktree — it returns
    # success:false on conflicts, but handler success fires on any
    # non-transport-error response. Completion is recorded explicitly through
    # record_merge_result/close_linked_github_issue.
    transitions:
      - to: terminate
        when: "vars.merge_worker_ready_to_terminate"

  - name: terminate
    description: "Safety net: self-terminate by calling end_agent_run"
    status_message: "Call end_agent_run to terminate."
    allowed_tools:
      - mcp__gobby__call_tool
      - mcp__gobby__list_mcp_servers
      - mcp__gobby__list_tools
      - mcp__gobby__get_tool_schema
    allowed_mcp_tools:
      - "gobby-agents:end_agent_run"

exit_condition: "current_step == 'terminate'"
