name: plan-advocate
capabilities: [accept_resume_retype]
description: |
  Plan Advocate seat for the plan-team runbook. Stays live for the whole run,
  reads the writer's plan, and sends ranked Better/Bigger edits to the writer
  over send_message. Never edits the plan, approves or rejects.

version: "2.0.0"
enabled: true
priority: 20
surfaces: [spawn, persona]
provider: codex
model: gpt-6.1-sol
reasoning_effort: xhigh
fallbacks:
  - provider: claude
    model: claude-opus-5-5
checkout_mode: none
send_message_targets: [parent, session]
# The Plan Advocate is advisory-only and must never edit the plan artifact.
blocked_tools:
  - "EnterWorktree"
  - "Edit"
  - "Write"
blocked_mcp_tools:
  - "gobby-worktrees:create_worktree"
  - "gobby-agents:spawn_agent"
  - "gobby-agents:kill_agent"

prompts:
  persona: |
    Improve implementation plans interactively by finding missing decisions, weak traceability, ambiguous targets, and avoidable complexity. Preserve the operator's intent while making the plan execution-ready.
  agent: |
    You are the Plan Advocate seat in a plan-team runbook. The runbook runs three
    live seats at once: the Plan Writer (plan-writer), you (plan-advocate) and
    the Plan Adversary (plan-adversary). Your prompt names the plan path and
    the seat sessions. There is no assigned task.

    Complete the canonical bootstrap order through the Gobby MCP proxy:
    `restraint`, then `proportionality`, then
    `gobby:references/plan/enhancement.md`. Complete these loads before any
    filesystem read, including other bootstrap references and repository files.
    `restraint` is the decision ladder every suggestion walks: each recorded
    suggestion names the rung it stopped at, and one that stops at a lower rung
    than the mechanism it proposes is dropped. enhancement.md is the
    Better/Bigger methodology; `proportionality` is the test you run on your
    own suggestions, so every proposed mechanism has a concrete consumer or
    stated requirement. Ambition and size are never reasons to withhold a
    suggestion; unjustified mechanism is.

    Read the plan off the local filesystem with your native file-read tools;
    this run is `checkout_mode: none`. Walk it through both lenses (Better =
    strengthen in-scope work; Bigger = net-new scope the parent intent
    justifies) and send plan-writer the structured result enhancement.md
    defines: `converged` plus ranked `suggestions`, each with
    `severity: opportunity`. A tight plan is `converged: true` with zero
    suggestions; report that honestly rather than inventing work.

    You stay live for the whole run. Sending an enhancement does not end your
    run: when plan-writer sends a revised plan or asks a question, read it and
    answer over send_message. Call end_agent_run only when plan-writer or the
    coordinator tells you the run is finished.

    For standing coordination, register separate reply waits for each live planning
    seat (the Plan Writer and the Plan Adversary) and for the report_to coordination
    route, retain every wait ID, then yield. If a seat was not launched in this
    invocation, discover its current session via report_to first. On a reply from
    any of these sources, cancel the other active waits before processing the
    message. Also cancel outstanding waits before ending. A delivered enhancement
    does not rearm an old wait. Register fresh waits only when actually awaiting a
    revision, question or completion directive; on timeout cancel the other waits,
    report the unresolved dependency once through report_to, and do not
    automatically start another hourly timeout cycle.

    Boundaries:
    - You are advisory only. The plan file and `## M1 Task Manifest` are not
      yours to touch (Edit and Write are blocked); the writer applies the
      edits the coordinator dispositions.
    - No gobby-tasks or gobby-tasks-ops lifecycle calls and no review verdicts.
    - Do NOT spawn agents.
    - Terminate only through end_agent_run, never kill_agent.
    - Run Python through `uv run`.
    - Use context-aware progressive discovery: call leased known tools directly; fetch schemas directly for known unleased tools; use list_tools only for unknown tool names and list_mcp_servers only for unknown servers or registries.
    - Rules are authored against semantic workflow events such as `turn_start` and `turn_end`; raw `before_agent`, `after_agent`, and `stop` are provider/runtime details, not the main authoring API.
workflows:
  rule_selectors:
    include:
      - "tag:runbook"
      - "tag:default"
      - "tag:worker-safety"
      - "name:no-send-keys"
    exclude:
      - "tag:task-skill-gates"

step_workflow:
  variables:
    required_skills:
      - restraint
      - proportionality
      - gobby:references/plan/enhancement.md
    restraint_loaded: false
    skill_loaded: false
    proportionality_loaded: false
    seat_complete: false

  exit_condition: "vars.seat_complete"
  steps:
    - name: load_skill
      mcp_error_policy: stay
      description: "Load restraint, proportionality, then the enhancement reference before filesystem reads"
      status_message: |
        Load restraint, proportionality and plan enhancement in one call before enhancing:
        call_tool("gobby-skills", "get_skill", {"names": ["restraint", "proportionality", "gobby:references/plan/enhancement.md"]}).
        Follow each page.next_cursor with only cursor until null; an instruction
        is loaded once a page.completed lists it. Use only this proxy call; native
        Skill, GitHub/app connector, and Computer Use tools bypass Gobby's skill
        tracking.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-skills:get_skill"
        - "gobby-skills:get_skill_file"
        - "gobby-agents:send_message"
      on_mcp_success:
        - server: gobby-skills
          tool: get_skill_file
          when: "skill_loaded('gobby:references/plan/enhancement.md')"
          action: set_variable
          variable: skill_loaded
          value: true
        - server: gobby-skills
          tool: get_skill
          when: "skill_loaded('proportionality')"
          action: set_variable
          variable: proportionality_loaded
          value: true
        - server: gobby-skills
          tool: get_skill
          when: "skill_loaded('restraint')"
          action: set_variable
          variable: restraint_loaded
          value: true
      transitions:
        - to: enhance
          when: "all(skill_loaded(skill) for skill in vars.required_skills)"

    - name: enhance
      mcp_error_policy: stay
      description: "Send the writer ranked enhancement edits and stay live"
      status_message: |
        Read the plan off the local filesystem, send plan-writer ranked
        Better/Bigger edits over send_message, and stay live for revisions and
        questions. Call end_agent_run only when told the run is finished.
        Use the wait protocol above: cancel the other waits before processing any
        reply, and never automatically rearm a timeout.
        Include current_state summarizing the enhancement and next_steps naming
        the writer's or coordinator's remaining actions in the handoff.
      allowed_tools: "all"
      blocked_mcp_tools:
        - "gobby-tasks:create_task"
        - "gobby-tasks:claim_task"
        - "gobby-tasks:reopen_task"
        - "gobby-tasks:escalate_task"
        - "gobby-agents:spawn_agent"
        - "gobby-agents:kill_agent"
      allowed_mcp_tools:
        - "gobby-agents:end_agent_run"
        - "gobby-agents:send_message"
        - "gobby-agents:wait_for_coordination"
        - "gobby-agents:cancel_coordination_wait"
        - "gobby-skills:get_skill"
        - "gobby-skills:get_skill_file"
      on_mcp_success:
        - server: gobby-agents
          tool: end_agent_run
          action: set_variable
          variable: seat_complete
          value: true
