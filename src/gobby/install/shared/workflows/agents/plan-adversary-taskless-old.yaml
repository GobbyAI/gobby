name: plan-adversary-taskless-old
description: |
  Taskless adversarial plan reviewer for /gobby plan. Reviews a plan artifact,
  returns structured findings to the parent session, and never claims or mutates
  Gobby tasks. Inherits provider and model choices from launch configuration.

version: "1.6"
enabled: true
priority: 20
surfaces: [spawn, persona]
provider: inherit
reasoning_required: false
checkout_mode: none
blocked_tools:
  - "EnterWorktree"
blocked_mcp_tools:
- "gobby-worktrees:create_worktree"
- "gobby-agents:spawn_agent"
- "gobby-agents:kill_agent"
- "gobby-plans:derive_plan_handoff_manifest"
- "gobby-plans:apply_plan_handoff_manifest"
- "gobby-plans:apply_plan_review_repairs"

prompts:
  persona: |
    Review implementation plans skeptically for coverage, feasibility, proportionality, and traceability. Every finding should identify the triggering plan section and a concrete repair.

    ## Required procedures
    Before work and after compaction, load `gobby:references/agents/procedures/plan-adversary-taskless-old.md` completely through `gobby-skills:get_skill_file(name="gobby", path="references/agents/procedures/plan-adversary-taskless-old.md")`. Fetch its schema first when unleased; follow every page.next_cursor using only cursor until null. This reference carries the detailed procedures for this role.

  agent: |
    You are the taskless adversarial reviewer for an interactive /gobby plan run.
    The prompt or variables provide artifact_path, round_number,
    max_review_rounds, and parent_session_id. There is no assigned task.

    Boundaries:
    - No gobby-tasks or gobby-tasks-ops lifecycle calls, and no
      `gobby-agents:spawn_agent`; the three internal lane subagents are the only
      subagent use.
    - Terminate only through end_agent_run, never kill_agent.
    - Run Python through `uv run`.
    - In zsh commands, single-quote CSS/Tailwind payloads containing `@theme`,
      `@custom-variant`, parenthesized glob forms, or `#`.

    ## Required procedures
    Before work and after compaction, load `gobby:references/agents/procedures/plan-adversary-taskless-old.md` completely through `gobby-skills:get_skill_file(name="gobby", path="references/agents/procedures/plan-adversary-taskless-old.md")`. Fetch its schema first when unleased; follow every page.next_cursor using only cursor until null. This reference carries the detailed procedures for this role.

workflows:
  variables:
    _seat_procedure: gobby:references/agents/procedures/plan-adversary-taskless-old.md
  rule_selectors:
    include:
      - "name:require-seat-procedure"
      - "tag:default"
      - "tag:worker-safety"
      - "name:no-send-keys"
    exclude:
      - "tag:task-skill-gates"

step_workflow:
  variables:
    required_skills:
      - gobby:references/agents/procedures/plan-adversary-taskless-old.md
      - restraint
      - gobby:references/plan/review.md
      - proportionality
    restraint_loaded: false
    skill_loaded: false
    proportionality_loaded: false
    review_complete: false

  exit_condition: "vars.review_complete"
  steps:
    - name: load_skill
      mcp_error_policy: stay
      description: "Load the restraint, gobby:references/plan/review.md, and proportionality methodology skills"
      status_message: |
        Execute loads through mcp__gobby__call_tool.
        Plain requirements use get_skill(name=<name>). Exact references
        use get_skill_file(name=<skill>, path=<reference path>): first fetch
        its schema with get_tool_schema in a separate outer result. Follow
        each page.next_cursor with only cursor until null before continuing.
        Load all three methodology skills with the Gobby proxy tools before
        reviewing: call get_skill(name="restraint"), get_skill_file(name="gobby", path="references/plan/review.md"),
        and get_skill(name="proportionality") on gobby-skills.
        Use the Gobby MCP proxy tools in this step. Use get_skill for plain names and get_skill_file for exact references:
        call_tool("gobby-skills", "get_skill", {"name": "restraint"}),
        call_tool("gobby-skills", "get_skill_file", {"name": "gobby", "path": "references/plan/review.md"}), and
        call_tool("gobby-skills", "get_skill", {"name": "proportionality"});
        native Skill, GitHub/app connector, and Computer Use tools bypass
        Gobby's skill tracking.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-skills:get_skill"
        - "gobby-skills:get_skill_file"
        # The spawn prompt directs the reviewer to read the prepared evidence
        # snapshot immediately; allow that read here so an eager first fetch
        # does not burn identical-denial strikes. Skills still gate the
        # transition to review.
        - "gobby-plans:get_plan_review_snapshot"
      on_mcp_success:
        - server: gobby-skills
          tool: get_skill_file
          when: "skill_loaded('gobby:references/plan/review.md')"
          action: set_variable
          variable: skill_loaded
          value: true
        - server: gobby-skills
          tool: get_skill
          when: "tool_input.name == 'proportionality'"
          action: set_variable
          variable: proportionality_loaded
          value: true
        - server: gobby-skills
          tool: get_skill
          when: "tool_input.name == 'restraint'"
          action: set_variable
          variable: restraint_loaded
          value: true
      transitions:
        - to: review
          when: "all(skill_loaded(skill) for skill in vars.required_skills)"

    - name: review
      mcp_error_policy: stay
      description: "Review the plan artifact and return structured findings"
      status_message: |
        Review artifact_path. When validate_plan_review_coverage succeeds, return
        verdict approved or needs_review to the parent. When validation fails,
        omit verdict and return the canonical protocol_failure with the exact tool
        error and draft findings.
        Send that exact JSON with send_message(target="parent") using `message_type: "plan_review"`,
        then call end_agent_run with current_state summarizing the verdict and
        next_steps naming the parent's review action.
      allowed_tools: "all"
      blocked_mcp_tools:
        - "gobby-tasks:create_task"
        - "gobby-tasks:claim_task"
        - "gobby-tasks:close_task"
        - "gobby-tasks:reopen_task"
        - "gobby-tasks:escalate_task"
        - "gobby-tasks-ops:submit_for_review"
        - "gobby-tasks-ops:approve_review"
        - "gobby-tasks-ops:reject_review"
        - "gobby-agents:spawn_agent"
        - "gobby-agents:kill_agent"
        - "gobby-plans:derive_plan_handoff_manifest"
        - "gobby-plans:apply_plan_handoff_manifest"
        - "gobby-plans:apply_plan_review_repairs"
      allowed_mcp_tools:
        - "gobby-agents:end_agent_run"
        - "gobby-agents:send_message"
        - "gobby-tasks:get_task"
        - "gobby-tasks:list_tasks"
        - "gobby-plans:get_plan_review_snapshot"
        - "gobby-plans:derive_plan_review_manifest"
        - "gobby-plans:validate_plan_review_coverage"
        - "gobby-plans:expire_plan_review_evidence"
        - "gobby-skills:get_skill"
        - "gobby-skills:get_skill_file"
      on_mcp_success:
# Delivering the verdict completes the round. `end_agent_run` requires a
# structured handoff, but the full result must still go out first; if the provider process
        # then exits without that second call, no turn_end fires and the
        # stop gate cannot ask for it, which would record a delivered round as
        # a failed run. The message_type gate keeps mid-run messages (status
        # updates, questions to the parent) from latching completion early.
        - server: gobby-agents
          tool: send_message
          when: "tool_input.message_type == 'plan_review'"
          action: set_variable
          variable: review_complete
          value: true
        - server: gobby-agents
          tool: end_agent_run
          action: set_variable
          variable: review_complete
          value: true
