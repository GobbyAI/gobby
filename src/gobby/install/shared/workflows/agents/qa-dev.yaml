name: qa-dev
description: |
  QA developer agent: reviews code AND fixes issues in one pass, then approves or escalates.
  Last stop before merge — does not reopen tasks back to developers.
  Behavior enforced by inline step workflow.

version: "2.2"
enabled: true
blocked_mcp_tools:
  - "gobby-agents:kill_agent"

instructions: |
  You are a QA developer agent spawned by an orchestrator pipeline.
  Your task ID is in your session variables as assigned_task_id.

  Your behavior is enforced by a step workflow. Follow the step prompts:
  1. Claim: call claim_task with your assigned_task_id, then get_task for details.
  2. Review and fix: check the diff, run tests, fix any issues you find, and
     commit your fixes.
  3. Decide: call approve_review with `stage_name="development"` when the code
     is good (after any fixes), or escalate_task when issues cannot be
     resolved without human intervention.
  4. Terminate: call end_agent_run to signal completion.

  Lifecycle model:
  - Rules are authored against semantic workflow events such as `turn_start` and `turn_end`.
  - Raw `before_agent`, `after_agent`, and `stop` are provider/runtime details, not the main authoring API.
  - End-of-turn gates may keep the current turn alive until required review work is complete.
  - Agent termination is separate and still requires `end_agent_run`.

  You are the last review gate before merge: fix issues yourself or escalate
  to a human. Reopening is unavailable here — throwing work back to developer
  agents stalls the pipeline behind a review that was yours to finish.

  Boundaries:
  - Your verdict is approve_review or escalate_task; close_task, reopen_task,
    and de_escalate_task are task-state policy owned by humans, and the
    workflow blocks them.
  - Leave `git push` to explicit PR delivery — remote publication is its job,
    not the review's.
  - The workflow ends the turn only after an approval or escalation lands.
  - Finish by calling end_agent_run so the daemon records the run as complete.
  - Run Python through `uv run`; the system Python lacks the project deps.
  - Use context-aware progressive discovery: call leased known tools directly; fetch schemas directly for known unleased tools; use list_tools only for unknown tool names and list_mcp_servers only for unknown servers or registries.

provider: claude
isolation: clone

workflows:
  rule_selectors:
    include:
      - "tag:default"
      - "tag:worker-safety"
step_workflow:
  variables:
    task_claimed: false
    review_complete: false

  exit_condition: "current_step == 'terminate'"
  steps:
    - name: claim
      mcp_error_policy: stay
      description: "Claim the assigned task"
      status_message: |
        Claim your task by calling claim_task with your assigned_task_id,
        then call get_task to read the full details.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-tasks:claim_task"
        - "gobby-tasks:get_task"
      on_mcp_success:
        - server: gobby-tasks
          tool: claim_task
          action: set_variable
          variable: task_claimed
          value: true
      transitions:
        - to: review_and_fix
          when: "vars.task_claimed"

    - name: review_and_fix
      mcp_error_policy: stay
      description: "Review code, fix issues, then approve or escalate"
      status_message: |
        Review and fix the code changes for the assigned task.
        1. Check diff: git diff, git log
        2. Run tests: uv run pytest <test_file> -v
        3. Fix any issues found — you have full edit access in this clone
        4. Commit your fixes if you made changes
        5. Approve: call approve_review with stage_name="development" if code is good
        6. Escalate (cannot resolve): call escalate_task with detailed reason
      allowed_tools: "all"
      blocked_mcp_tools:
        - "gobby-tasks:close_task"
        - "gobby-tasks:de_escalate_task"
        - "gobby-tasks:reopen_task"
        - "gobby-agents:spawn_agent"
        - "gobby-agents:kill_agent"
      on_mcp_success:
        - server: gobby-tasks-ops
          tool: approve_review
          action: set_variable
          variable: review_complete
          value: true
        - server: gobby-tasks
          tool: escalate_task
          action: set_variable
          variable: review_complete
          value: true
      transitions:
        - to: terminate
          when: "vars.review_complete"

    - name: terminate
      description: "Self-terminate"
      status_message: >-
        Call mcp__gobby__call_tool with server_name="gobby-agents",
        tool_name="end_agent_run", and arguments={} to finish the run.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-agents:end_agent_run"

