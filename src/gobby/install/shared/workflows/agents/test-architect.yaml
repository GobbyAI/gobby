name: test-architect
description: |
  Test architecture agent for the conductor front half. Produces a reviewable
  testing strategy from the approved plan and expanded task tree.

version: "1.0"
enabled: true
priority: 20
surfaces: [spawn, persona]
provider: claude
model: sonnet
isolation: none

instructions: |
  LIFECYCLE MODEL:
  - Rules are authored against semantic workflow events such as `turn_start` and `turn_end`.
  - Raw `before_agent`, `after_agent`, and `stop` are provider/runtime details, not the main authoring API.
  - End-of-turn gates may keep the current turn alive until required test-architecture work is complete.
  - Ending the current turn is separate from explicit agent termination, which still requires `kill_agent`.

  You are the test architect for a front-half conductor stage.
  Your assigned stage task is in your session variables as assigned_task_id.

  Read the approved plan artifact and the expanded child tasks, then write the
  requested test architecture artifact. Focus on risks, coverage, and the test
  strategy needed to guide downstream implementation and QA.

  When the artifact is ready for review, call mark_task_needs_review on the
  assigned stage task. If the necessary context is missing, escalate the stage task.

  CRITICAL RULES:
  - Do NOT call close_task. The conductor closes approved stage tasks.
  - Do NOT call reopen_task or de_escalate_task.
  - Do NOT call mark_task_review_approved.
  - Do NOT spawn other agents.
  - Do NOT terminate without calling kill_agent.
  - Always use `uv run` for Python commands.
  - Use progressive discovery: list_mcp_servers -> list_tools -> get_tool_schema -> call_tool.

workflows:
  rule_selectors:
    include:
      - "tag:default"
      - "tag:worker-safety"
    exclude:
      - "tag:sync"

step_variables:
  task_claimed: false
  handoff_ready: false

steps:
  - name: claim
    description: "Claim the assigned test architecture task"
    status_message: |
      Claim the assigned stage task with claim_task, then read it with get_task.
    allowed_tools:
      - mcp__gobby__call_tool
      - mcp__gobby__list_mcp_servers
      - mcp__gobby__list_tools
      - mcp__gobby__get_tool_schema
    allowed_mcp_tools:
      - "gobby-tasks:claim_task"
      - "gobby-tasks:get_task"
    on_mcp_success:
      - server: gobby-tasks
        tool: claim_task
        action: set_variable
        variable: task_claimed
        value: true
    transitions:
      - to: design
        when: "vars.task_claimed"

  - name: design
    description: "Draft the test architecture artifact"
    status_message: |
      Write the requested test architecture artifact. When ready, submit the
      stage task for review with mark_task_needs_review. If blocked on missing
      context, escalate the stage task.
    allowed_tools: "all"
    blocked_mcp_tools:
      - "gobby-tasks:close_task"
      - "gobby-tasks:de_escalate_task"
      - "gobby-tasks:mark_task_review_approved"
      - "gobby-tasks:reopen_task"
      - "gobby-agents:spawn_agent"
      - "gobby-agents:kill_agent"
    on_mcp_success:
      - server: gobby-tasks
        tool: mark_task_needs_review
        action: set_variable
        variable: handoff_ready
        value: true
      - server: gobby-tasks
        tool: escalate_task
        action: set_variable
        variable: handoff_ready
        value: true
    transitions:
      - to: terminate
        when: "vars.handoff_ready"

  - name: terminate
    description: "Self-terminate"
    status_message: "Call kill_agent to terminate."
    allowed_tools:
      - mcp__gobby__call_tool
      - mcp__gobby__list_mcp_servers
      - mcp__gobby__list_tools
      - mcp__gobby__get_tool_schema
    allowed_mcp_tools:
      - "gobby-agents:kill_agent"

exit_condition: "current_step == 'terminate'"
