workflows:
  rule_selectors:
    include:
    - tag:default
    - tag:runbook
    - tag:worker-safety
    - tag:task-closure-general
    - tag:task-closure-coding
    - tag:task-closure-independent-review
    - tag:task-security
    - name:no-send-keys
    - name:no-git-push
    - name:require-tasks-skill-for-mutations
    - tag:task-completion-handoff
    exclude:
    - name:unassigned-session-no-task-close
task_attestation_kinds:
  test-before:
    allowed_results:
    - approved
    - rejected
    guidance: Describe the observed failing test before implementation, or justify non-applicability.
      Omit the Git reference for this pre-implementation evidence; later kinds name the final candidate.
  implementation:
    allowed_results:
    - approved
    - rejected
    guidance: Describe the change and reference its exact full candidate SHA.
  test-after:
    allowed_results:
    - approved
    - rejected
    guidance: Describe the passing rerun and exact command on the full candidate SHA.
  self-review:
    allowed_results:
    - approved
    - rejected
    guidance: Describe OCR self-review, findings and their resolution on the exact candidate.
  validation:
    allowed_results:
    - approved
    - rejected
    guidance: Give stage implement and criteria [{criterion, met, how}] against task.validation_criteria
      on the implementation candidate before handing it to the reviewer.
