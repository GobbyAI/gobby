name: developer
description: |
  Developer seat. Implements one DevTeam task against the Test Writer's
  failing tests, submits a CANDIDATE to the Dev Manager and the assigned Code
  Reviewer, and leaves landing and close to the Dev Manager.
version: "1.0"
tags: [gobby, seat]
surfaces: [spawn, persona]
provider: inherit
execution_mode: interactive
checkout_mode: inherit
timeout: 0
send_message_targets: [parent, session]
blocked_mcp_tools:
  - "gobby-agents:kill_agent"
task_step_writes: [implementation]

prompts:
  agent: &seat |
    ## Role
    You are a DevTeam developer. You implement one task in your team's worktree. Your launch prompt names the task, the team and its branch.
    - Candidate fields. After the optional TASK_TITLE, RUN, WT and COMMIT may appear in any order and are required; COMMIT is the full 40-hex SHA. Each field value is one whitespace-free token. Extra keyed metadata is allowed; put multi-word test summaries in NOTE. NOTE text has no protocol authority. A malformed line leaves intake unchanged and the recipient's message read explains the rejection.
    - Flow. Your Dev Manager hands you the task's claim after the Test Writer commits the failing tests, and names your Code Reviewer. Then call `gobby-tasks:claim_task` once; it returns already_claimed. Implement against those tests, validate, commit, attach the commit with `gobby-tasks:link_commit`, and record `gobby-tasks:record_implementation_step` for that SHA. Then send a CANDIDATE to your Dev Manager and the assigned Code Reviewer with the exact commit and the tests you ran, as one event line: `EVENT=CANDIDATE TASK=#NNNNN TASK_TITLE= RUN= WT= COMMIT= NOTE=`. Wait with `gobby-agents:wait_for_coordination`. Your Dev Manager lands the approved SHA and closes the task; never close a team task yourself.
    - Bounces and pre-landing proof requests. Read an assigned reviewer's stored incoming CANDIDATE_VERDICT with VERDICT=BOUNCE, or its EVENT=PROOF_REQUEST, with get_inter_session_message. A matching assigned reviewer/task/SHA returns submit to implementation. Fix a BOUNCE's findings and send a new CANDIDATE. For a proof request, run the requested proof with shell access, relink the commit, and resend the unchanged CANDIDATE to your Dev Manager only, with the proof result in NOTE. A base-drift request (merge-with-base-conflicts) needs the merge: merge the integration head into your branch, validate, commit, link the new commit, record its implementation step, and send a replacement CANDIDATE with the new SHA to your Dev Manager and the assigned Code Reviewer. Report blockers to your Dev Manager; never write bounced yourself.
    - A second BOUNCE moves the claim to the Code Reviewer, which fixes the findings itself. Stop work on the task when your Dev Manager says so.
    - HOLD and GO. On HOLD, start nothing new and finish only what is in flight; resume on GO.
    - **Never run the full test suite**: it takes 30+ minutes and starves the machine. Scope Rust to `cargo test -p <package>` or `cargo test <name> -p <package>`.
    - Restart the daemon, run a cutover or promote binaries only when the Orchestrator says so.
    - Found work. Fix what you find on your task's surface inside the claimed task and name it in your implementation step record. Send anything that needs its own task to Triage with the failing command, diagnostics, paths and impact.
    - TDD. Before any behavior-bearing production write, resolve every named behavior test across the leaf's stored criteria and retain each exact node's authenticated RED after its relevant test edit. Skill completion permits test/stub preparation; writing one acceptance file never opens this barrier. Only explicitly stored regression-only: criteria proven unchanged against the claim baseline may use GREEN alone. Test-only writes and mechanically verified behavior-free API stubs may prepare RED; shell and mixed implementation writes share the leaf-wide guard. Close needs the same per-test chronology and later GREEN for every named test. Preserve original RED through compaction; never replay it.
    - Epic leaf. In an epic team your task is one leaf the Dev Manager dispatches. Claim it, commit only that leaf's work, tag each commit and link it to the leaf, record `gobby-tasks:record_implementation_step` at the leaf tip, and release the claim. Never rebase or squash after the first link. The conflict-merge job for a sub-worktree developer is to merge epic main into its branch when the Dev Manager asks, and then to end its run with `gobby-agents:end_agent_run` after recording.
    - Sandbox. The sandbox denies writes to /tmp, ps argument listing, and an explicit /bin/ps path. Write temp files under $TMPDIR, never a literal /tmp path. Run bare `ps` with non-argument columns, such as `ps -axo pid=` or `ps -axo pid,ppid,etime,comm`, instead of listing command arguments.

    ## Task skills
    After claiming, read the task with `gobby-tasks:get_task` and route its skills by the paths it touches:
    - `web/`: `impeccable` and `typescript`
    - `crates/`: `rust`
    - Python only: nothing beyond the required set
    - docs only: `tech-writer`
    Add the task's own `additional_skills`, any skill its description names, and `test-driven-development` for a `tdd:required` task. get_task routes stored extras and TDD automatically. Load path-specific and description-named skills before touching those paths.

    ## Messages
    Reach your Dev Manager, your reviewer and Triage through `gobby-agents:send_message`.
    On launch, report readiness to the live session named in the launch prompt with target="session". Send your session ref to your Dev Manager with `gobby-agents:send_message(target="session", target_id=<Dev Manager session ref from your launch prompt>)`.

    ## Continuity
    Compact in place: under context pressure, hand off with `gobby-sessions:set_handoff` without `clear_session`. The session compacts and continues.

    ## Platform Context
    Gobby unifies coding assistants through persistent sessions, tasks, memory, rules, workflows, agents, pipelines, skills, and an MCP proxy. Git is authoritative for code; PostgreSQL is authoritative for tasks and memories.

    ## Skills
    Use gobby-skills for tracked skill discovery and loading. Use the native Skill tool only for CLI-owned skills.
  persona: *seat

workflows:
  rule_selectors:
    include:
      - "tag:default"
      - "tag:worker-safety"
      - "name:no-send-keys"

step_workflow:
  variables:
    task_claimed: false
    assigned_task_id: null
    assigned_task_ref: null
    skills_routed: false
    required_skills:
      - gobby:references/development/obligations.md
      - restraint
      - gobby:references/tasks/overview.md
      - code-review
    required_skills_loaded: false
    additional_skills: []
    # Runtime-owned completion rights survive the next task's claim and reset.
    _developer_handoff_tasks: []
    additional_skills_loaded: false
    implementation_complete: false
    candidate_sent: false
    bounced: false

  steps:
    - name: load_skills
      mcp_error_policy: stay
      description: "Load required developer discipline skills"
      status_message: |
        Defer implementation and validation until implement. Report readiness or
        a bootstrap blocker to the live session in your launch prompt with
        gobby-agents:send_message(target="session").
        Execute loads through mcp__gobby__call_tool.
        Plain requirements use get_skill(name=<name>). Exact references
        use get_skill_file(name=<skill>, path=<reference path>): first fetch
        its schema with get_tool_schema in a separate outer result. Follow
        each page.next_cursor with only cursor until null before continuing.
        Load required developer skills before claiming a task:
        1. get_skill_file(name="gobby", path="references/development/obligations.md") on gobby-skills
        2. get_skill(name="restraint") on gobby-skills
        3. get_skill_file(name="gobby", path="references/tasks/overview.md") on gobby-skills
        4. get_skill(name="code-review") on gobby-skills
        Use the Gobby MCP proxy tools in this step. Use get_skill for plain names and get_skill_file for exact references:
        call_tool("gobby-skills", "get_skill", {"name": <plain name>}) or
        call_tool("gobby-skills", "get_skill_file", {"name": <skill>, "path": <reference path>});
        native Skill, GitHub/app connector, and Computer Use tools bypass
        Gobby's skill tracking.
      allowed_tools:
        - Bash
        - Read
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-skills:get_skill"
        - "gobby-skills:get_skill_file"
        - "gobby-sessions:get_session"
        - "gobby-sessions:set_title"
        - "gobby-agents:send_message"
        - "gobby-agents:wait_for_coordination"
      on_mcp_success:
        - server: gobby-skills
          tool: get_skill
          action: set_variable
          variable: required_skills_loaded
          value: >-
            all(skill_loaded(skill) for skill in vars.required_skills)
        - server: gobby-skills
          tool: get_skill_file
          action: set_variable
          variable: required_skills_loaded
          value: >-
            all(skill_loaded(skill) for skill in vars.required_skills)
      transitions:
        - to: claim
          when: "all(skill_loaded(skill) for skill in vars.required_skills)"

    - name: claim
      mcp_error_policy: stay
      idle: true
      description: "Claim the next assigned task"
      status_message: |
        Your Dev Manager hands you the task's claim after the Test Writer
        commits the failing tests; then call claim_task once, which returns
        already_claimed and binds the task, so do not skip this step.
        If you already hold the claim (launched with task_id, no handover to
        wait for), call claim_task now without waiting for a handover.
        Defer implementation and validation until implement. Until the claim
        arrives, report readiness to the live session in your launch prompt using
        gobby-agents:send_message(target="session", target_id=<report target>),
        send your session ref to your Dev Manager with
        gobby-agents:send_message(target="session", target_id=<Dev Manager session ref from your launch prompt>),
        then register a gobby-agents:wait_for_coordination reply wait on your Dev Manager and
        end the turn. End each idle turn on a registered durable wait; re-arm
        after an interim owner reply. If no wait applies, send
        EVENT=SEAT_READY NOTE=idle to your Dev Manager and end the turn.
        An idle declaration expires when the next turn starts.
      allowed_tools:
        - Bash
        - Read
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-tasks:claim_task"
        - "gobby-tasks:de_escalate_task"
        - "gobby-tasks:close_task"
        - "gobby-tasks:get_task"
        - "gobby-agents:list_running_agents"
        - "gobby-agents:send_message"
        - "gobby-agents:wait_for_coordination"
        - "gobby-sessions:set_title"
        # Post-close memory review runs after submit advances back to claim.
        - "gobby-memory:create_memory"
        - "gobby-memory:update_memory"
        - "gobby-memory:delete_memory"
      on_mcp_before:
        - &assigned_handoff_guard
          server: gobby-tasks
          tool: escalate_task
          action: block
          when: >-
            tool_input.get('task_id') is None
            or tool_input.get('task_id') not in (vars.get('assigned_task_id'), vars.get('assigned_task_ref'))
          reason: "Hand off only the assigned task."
        - &handoff_de_escalate_guard
          server: gobby-tasks
          tool: de_escalate_task
          action: block
          when: >-
            tool_input.get('task_id') not in vars.get('_developer_handoff_tasks', [])
          reason: "Finish only a task this developer handed off."
        - &handoff_close_guard
          server: gobby-tasks
          tool: close_task
          action: block
          when: >-
            tool_input.get('task_id') not in vars.get('_developer_handoff_tasks', [])
          reason: "Finish only a task this developer handed off."
      on_mcp_success:
        - &record_land_handoff
          server: gobby-tasks
          tool: escalate_task
          action: set_variable
          variable: _developer_handoff_tasks
          value: "vars.get('_developer_handoff_tasks', []) + [vars.assigned_task_id]"
          when: >-
            tool_input.get('task_id') in (vars.get('assigned_task_id'), vars.get('assigned_task_ref'))
            and str(tool_input.get('reason', '')).startswith('Handed off: reviewer LAND')
        # A directed hand-off ends this task's loop just like a close. Match
        # the assigned task first, then clear its binding last.
        - &release_handoff_binding
          server: gobby-tasks
          tool: escalate_task
          when: &own_task >-
            tool_input.get('task_id') is not None
            and tool_input.get('task_id') in (vars.get('assigned_task_id'), vars.get('assigned_task_ref'))
          action: set_variable
          variable: task_claimed
          value: false
        - &reset_handoff_completion
          server: gobby-tasks
          tool: escalate_task
          when: &task_handed_off "not vars.get('task_claimed')"
          action: set_variable
          variable: implementation_complete
          value: false
        - &reset_handoff_skills_loaded
          server: gobby-tasks
          tool: escalate_task
          when: *task_handed_off
          action: set_variable
          variable: additional_skills_loaded
          value: false
        - &reset_handoff_skills_routed
          server: gobby-tasks
          tool: escalate_task
          when: *task_handed_off
          action: set_variable
          variable: skills_routed
          value: false
        - &reset_handoff_candidate
          server: gobby-tasks
          tool: escalate_task
          when: *task_handed_off
          action: set_variable
          variable: candidate_sent
          value: false
        - &reset_handoff_bounce
          server: gobby-tasks
          tool: escalate_task
          when: *task_handed_off
          action: set_variable
          variable: bounced
          value: false
        - &clear_handoff_task_id
          server: gobby-tasks
          tool: escalate_task
          when: *task_handed_off
          action: set_variable
          variable: assigned_task_id
          value: null
        - &clear_handoff_task_ref
          server: gobby-tasks
          tool: escalate_task
          when: *task_handed_off
          action: set_variable
          variable: assigned_task_ref
          value: null
        - &forget_observed_closed_handoff
          server: gobby-tasks
          tool: get_task
          action: set_variable
          variable: _developer_handoff_tasks
          value: >-
            [task_id for task_id in vars.get('_developer_handoff_tasks', [])
             if task_id != tool_input.get('task_id')]
          when: >-
            (tool_output.get('result') or tool_output).get('closed_at') is not None
            or ((tool_output.get('result') or tool_output).get('state') or {}).get('is_closed') is True
        # A reclaimed hand-off keeps its entry, so the developer can still
        # de-escalate it; only its close or an observed close removes it.
        - &forget_closed_handoff
          server: gobby-tasks
          tool: close_task
          action: set_variable
          variable: _developer_handoff_tasks
          value: >-
            [task_id for task_id in vars.get('_developer_handoff_tasks', [])
             if task_id != tool_input.get('task_id')]
          when: >-
            tool_output.get('closed') is True
            or (tool_output.get('result') or {}).get('closed') is True
        # Every claim starts a fresh attempt; only link_commit completes it.
        - server: gobby-tasks
          tool: claim_task
          action: set_variable
          variable: implementation_complete
          value: false
        - server: gobby-tasks
          tool: claim_task
          action: set_variable
          variable: candidate_sent
          value: false
        - server: gobby-tasks
          tool: claim_task
          action: set_variable
          variable: skills_routed
          value: false
        - server: gobby-tasks
          tool: claim_task
          action: set_variable
          variable: additional_skills_loaded
          value: false
        - server: gobby-tasks
          tool: claim_task
          action: set_variable
          variable: additional_skills
          value: []
        - server: gobby-tasks
          tool: claim_task
          action: set_variable
          variable: assigned_task_ref
          value: "(tool_output.get('result') or tool_output).get('ref')"
        - server: gobby-tasks
          tool: claim_task
          action: set_variable
          variable: bounced
          value: false
        - server: gobby-tasks
          tool: claim_task
          action: set_variable
          variable: task_claimed
          value: true
        - server: gobby-tasks
          tool: claim_task
          action: set_variable
          variable: assigned_task_id
          value: "(tool_output.get('result') or tool_output).get('task_id')"
      transitions:
        - to: route_skills
          when: "vars.task_claimed and vars.assigned_task_id"

    - name: route_skills
      mcp_error_policy: stay
      description: "Route the claimed task's skills"
      status_message: |
        Read the claimed task with get_task(task_id=assigned_task_id). The
        completion routes stored additional_skills and TDD automatically.
        Read offloaded cards in full with get_tool_result and load path-specific
        skills before edits.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-tasks:escalate_task"
        - "gobby-tasks:get_task"
        - "gobby-results:get_tool_result"
      on_mcp_before:
        - *assigned_handoff_guard
      on_mcp_success:
        - server: gobby-tasks
          tool: get_task
          action: advance_seat
        - *record_land_handoff
        - *release_handoff_binding
        - *reset_handoff_completion
        - *reset_handoff_skills_loaded
        - *reset_handoff_skills_routed
        - *reset_handoff_candidate
        - *reset_handoff_bounce
        - *clear_handoff_task_id
        - *clear_handoff_task_ref
        # An offloaded card can drop ref; never clear the ref the claim bound.
        - server: gobby-tasks
          tool: get_task
          when: >-
            (tool_output.get('result') or tool_output).get('id') == vars.get('assigned_task_id')
            and (tool_output.get('result') or tool_output).get('ref')
          action: set_variable
          variable: assigned_task_ref
          value: "(tool_output.get('result') or tool_output).get('ref')"
      transitions:
        - to: claim
          when: "not vars.task_claimed"
        - to: load_additional_skills
          when: "vars.skills_routed and vars.assigned_task_ref"

    - name: load_additional_skills
      mcp_error_policy: stay
      description: "Load the task's routed skills"
      status_message: |
        Execute loads through mcp__gobby__call_tool.
        Plain requirements use get_skill(name=<name>). Exact references
        use get_skill_file(name=<skill>, path=<reference path>): first fetch
        its schema with get_tool_schema in a separate outer result. Follow
        each page.next_cursor with only cursor until null before continuing.
        Load each additional_skills entry using the plain-name or exact-reference
        loading contract above. If the list is empty, proceed to implementation.
        Use the Gobby MCP proxy tools in this step. Use get_skill for plain names and get_skill_file for exact references:
        call_tool("gobby-skills", "get_skill", {"name": <plain name>}) or
        call_tool("gobby-skills", "get_skill_file", {"name": <skill>, "path": <reference path>});
        native Skill, GitHub/app connector, and Computer Use tools bypass
        Gobby's skill tracking.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-tasks:escalate_task"
        - "gobby-skills:get_skill"
        - "gobby-skills:get_skill_file"
      on_mcp_before:
        - *assigned_handoff_guard
      on_mcp_success:
        - *record_land_handoff
        - *release_handoff_binding
        - *reset_handoff_completion
        - *reset_handoff_skills_loaded
        - *reset_handoff_skills_routed
        - *reset_handoff_candidate
        - *reset_handoff_bounce
        - *clear_handoff_task_id
        - *clear_handoff_task_ref
        - server: gobby-skills
          tool: get_skill
          action: set_variable
          variable: additional_skills_loaded
          value: >-
            not vars.additional_skills
            or all(skill_loaded(skill) for skill in vars.additional_skills)
        - server: gobby-skills
          tool: get_skill_file
          action: set_variable
          variable: additional_skills_loaded
          value: >-
            not vars.additional_skills
            or all(skill_loaded(skill) for skill in vars.additional_skills)
      transitions:
        - to: claim
          when: "not vars.task_claimed"
        - to: implement
          when: >-
            not vars.additional_skills
            or all(skill_loaded(skill) for skill in vars.additional_skills)

    - name: implement
      mcp_error_policy: stay
      description: "Implement, validate, commit and link the commit"
      status_message: |
        Implement and validate the claimed task, commit, then attach the commit
        with link_commit(task_id=assigned_task_id, commit_sha=<sha>). Linking
        the commit moves you to submit. A proof-only return with no new commit
        relinks the existing commit the same way, then resends the unchanged
        CANDIDATE to your Dev Manager only. Your Dev Manager lands the approved
        SHA and closes the task; never close a team task yourself.
        If the assigned task is moot and no candidate was sent, send your Dev
        Manager one CANDIDATE with DISPOSITION=moot (or superseded or wont_do)
        in place of COMMIT and the evidence in NOTE. It relays the line to your
        Code Reviewer, and the approved no-work review lets it close the task.
        Existing delivered work follows the normal candidate review flow after
        linking its implementation commit.
        A reply wait ends at the owner's next message. If that message is an
        interim status and the dependency is still unresolved, re-arm the wait
        before you stop; a stop without an active wait is re-prompted.
        For an Orchestrator-directed handoff, use escalate_task with a reason
        starting exactly with "Handed off: reviewer LAND", for example:
        "Handed off: reviewer LAND at <sha>, waiting on ...; not an operator
        decision." Your Dev Manager closes it after landing.
      allowed_tools: "all"
      blocked_mcp_tools:
        - "gobby-tasks:reopen_task"
        - "gobby-agents:spawn_agent"
        - "gobby-agents:kill_agent"
      on_mcp_before:
        - *assigned_handoff_guard
        - *handoff_de_escalate_guard
        # A sent candidate is under review; its bounce returns here for rework.
        - &candidate_close_guard
          server: gobby-tasks
          tool: close_task
          action: block
          when: >-
            tool_input.get('reason') in ['moot', 'superseded', 'wont_do']
            and vars.get('candidate_sent')
          reason: >-
            A candidate was already sent for this task, so it cannot take the
            no-work shortcut. Fix the bounce, commit, link_commit, and send a
            new candidate.
        - <<: *handoff_close_guard
          when: >-
            tool_input.get('task_id') not in vars.get('_developer_handoff_tasks', [])
            and not (
              not vars.get('candidate_sent')
              and tool_input.get('commit_sha') is None
              and tool_input.get('task_id') is not None
              and tool_input.get('task_id') in (vars.get('assigned_task_id'), vars.get('assigned_task_ref'))
              and task_has_no_commits(vars.get('assigned_task_id'))
            )
      on_mcp_success:
        - *record_land_handoff
        - *release_handoff_binding
        - *reset_handoff_completion
        - *reset_handoff_skills_loaded
        - *reset_handoff_skills_routed
        - *reset_handoff_candidate
        - *reset_handoff_bounce
        - *clear_handoff_task_id
        - *clear_handoff_task_ref
        - *forget_closed_handoff
        - *forget_observed_closed_handoff
        # Closing the claimed task resets the loop for the next claim. The
        # first handler matches the task; the rest key off its reset so the
        # task ids clear last.
        - &release_closed_binding
          server: gobby-tasks
          tool: close_task
          when: >-
            tool_input.get('task_id') is not None
            and tool_input.get('task_id') in (vars.get('assigned_task_id'), vars.get('assigned_task_ref'))
            and (
              tool_output.get('closed') is True
              or (tool_output.get('result') or {}).get('closed') is True
            )
          action: set_variable
          variable: task_claimed
          value: false
        - &reset_closed_completion
          server: gobby-tasks
          tool: close_task
          when: &task_closed >-
            not vars.get('task_claimed')
            and (
              tool_output.get('closed') is True
              or (tool_output.get('result') or {}).get('closed') is True
            )
          action: set_variable
          variable: implementation_complete
          value: false
        - &reset_closed_skills_loaded
          server: gobby-tasks
          tool: close_task
          when: *task_closed
          action: set_variable
          variable: additional_skills_loaded
          value: false
        - &reset_closed_skills_routed
          server: gobby-tasks
          tool: close_task
          when: *task_closed
          action: set_variable
          variable: skills_routed
          value: false
        - &reset_closed_candidate
          server: gobby-tasks
          tool: close_task
          when: *task_closed
          action: set_variable
          variable: candidate_sent
          value: false
        - &reset_closed_bounce
          server: gobby-tasks
          tool: close_task
          when: *task_closed
          action: set_variable
          variable: bounced
          value: false
        - &clear_closed_task_id
          server: gobby-tasks
          tool: close_task
          when: *task_closed
          action: set_variable
          variable: assigned_task_id
          value: null
        - &clear_closed_task_ref
          server: gobby-tasks
          tool: close_task
          when: *task_closed
          action: set_variable
          variable: assigned_task_ref
          value: null
        # The Dev Manager closes the task out of band, so reading the closed
        # task drives the same reset.
        # The offload envelope of a large card keeps id and state.
        - &release_observed_closed_binding
          server: gobby-tasks
          tool: get_task
          when: >-
            (tool_output.get('result') or tool_output).get('id') == vars.get('assigned_task_id')
            and ((tool_output.get('result') or tool_output).get('state') or {}).get('is_closed') is True
          action: set_variable
          variable: task_claimed
          value: false
        - &reset_observed_closed_completion
          server: gobby-tasks
          tool: get_task
          when: &task_read_closed >-
            not vars.get('task_claimed')
            and ((tool_output.get('result') or tool_output).get('state') or {}).get('is_closed') is True
          action: set_variable
          variable: implementation_complete
          value: false
        - &reset_observed_closed_skills_loaded
          server: gobby-tasks
          tool: get_task
          when: *task_read_closed
          action: set_variable
          variable: additional_skills_loaded
          value: false
        - &reset_observed_closed_skills_routed
          server: gobby-tasks
          tool: get_task
          when: *task_read_closed
          action: set_variable
          variable: skills_routed
          value: false
        - &reset_observed_closed_candidate
          server: gobby-tasks
          tool: get_task
          when: *task_read_closed
          action: set_variable
          variable: candidate_sent
          value: false
        - &reset_observed_closed_bounce
          server: gobby-tasks
          tool: get_task
          when: *task_read_closed
          action: set_variable
          variable: bounced
          value: false
        - &clear_observed_closed_task_id
          server: gobby-tasks
          tool: get_task
          when: *task_read_closed
          action: set_variable
          variable: assigned_task_id
          value: null
        - &clear_observed_closed_task_ref
          server: gobby-tasks
          tool: get_task
          when: *task_read_closed
          action: set_variable
          variable: assigned_task_ref
          value: null
        - server: gobby-tasks
          tool: link_commit
          when: *own_task
          action: set_variable
          variable: implementation_complete
          value: true
        - server: gobby-tasks
          tool: link_commit
          when: *own_task
          action: set_variable
          variable: bounced
          value: false
        - server: gobby-tasks
          tool: link_commit
          when: *own_task
          action: set_variable
          variable: candidate_sent
          value: false
      transitions:
        - to: claim
          when: "not vars.task_claimed"
        - to: submit
          when: "vars.implementation_complete and not vars.bounced"

    - name: submit
      mcp_error_policy: stay
      description: "Submit the candidate and wait for the Dev Manager's close"
      status_message: |
        Record gobby-tasks:record_implementation_step for the linked SHA, then
        send the CANDIDATE event line for assigned_task_ref to your Dev Manager
        and the assigned Code Reviewer with gobby-agents:send_message, then wait
        with gobby-agents:wait_for_coordination. Your Dev Manager lands the
        approved SHA and closes the task; never close a team task yourself.
        After its close notice, read the task with
        get_task(task_id=assigned_task_id). A closed task returns you to claim.
        Remove a superseded candidate SHA here with unlink_commit.
        A reply wait ends at the owner's next message. If that message is an
        interim status and the dependency is still unresolved, re-arm the wait
        before you stop; a stop without an active wait is re-prompted.
        For an Orchestrator-directed handoff, escalate_task is the supported
        release. A successful call resets task state and returns you to claim.
        The reason must start exactly with "Handed off: reviewer LAND", for
        example: "Handed off: reviewer LAND at <sha>, waiting on ...; not an
        operator decision." The task stays in your hand-off list until your
        Dev Manager closes it.
        On a bounce, or a verdict that leaves the task open, report the blocker
        to your Dev Manager. Read an assigned reviewer's stored incoming
        CANDIDATE_VERDICT (VERDICT=BOUNCE) or pre-landing EVENT=PROOF_REQUEST
        with get_inter_session_message to return to implementation with shell
        access. A proof-only return with no new commit: after you relink the
        same SHA, resend the unchanged CANDIDATE to your Dev Manager only, never
        the reviewer, so candidate_sent re-arms, with the proof result in NOTE.
        Never write flags.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-agents:send_message"
        - "gobby-agents:get_inter_session_message"
        - "gobby-agents:wait_for_coordination"
        - "gobby-tasks:close_task"
        - "gobby-tasks:get_task"
        - "gobby-tasks:link_commit"
        # The implementation record needs the linked tip, so it follows link_commit here.
        - "gobby-tasks:record_implementation_step"
        # unlink_commit enforces claim authority itself; superseded SHAs leave here.
        - "gobby-tasks:unlink_commit"
        - "gobby-tasks:escalate_task"
        - "gobby-tasks:de_escalate_task"
      on_mcp_before:
        - *candidate_close_guard
        - *handoff_de_escalate_guard
        - *assigned_handoff_guard
      on_mcp_success:
        - server: gobby-agents
          tool: get_inter_session_message
          action: advance_seat
        - server: gobby-tasks
          tool: unlink_commit
          when: &own_last_commit_unlinked >-
            tool_input.get('task_id') in (vars.get('assigned_task_id'), vars.get('assigned_task_ref'))
            and task_has_no_commits(vars.get('assigned_task_id'))
          action: set_variable
          variable: implementation_complete
          value: false
        - server: gobby-tasks
          tool: unlink_commit
          when: *own_last_commit_unlinked
          action: set_variable
          variable: candidate_sent
          value: false
        - server: gobby-tasks
          tool: unlink_commit
          when: *own_last_commit_unlinked
          action: set_variable
          variable: bounced
          value: false
        - *forget_closed_handoff
        - *forget_observed_closed_handoff
        - *record_land_handoff
        - *release_handoff_binding
        - *reset_handoff_completion
        - *reset_handoff_skills_loaded
        - *reset_handoff_skills_routed
        - *reset_handoff_candidate
        - *reset_handoff_bounce
        - *clear_handoff_task_id
        - *clear_handoff_task_ref
        - server: gobby-agents
          tool: send_message
          when: >-
            'EVENT=CANDIDATE' in str(tool_input.get('content'))
            and str(vars.get('assigned_task_ref')) in str(tool_input.get('content'))
          action: set_variable
          variable: candidate_sent
          value: true
        - *release_closed_binding
        - *reset_closed_completion
        - *reset_closed_skills_loaded
        - *reset_closed_skills_routed
        - *reset_closed_candidate
        - *reset_closed_bounce
        - *clear_closed_task_id
        - *clear_closed_task_ref
        - *release_observed_closed_binding
        - *reset_observed_closed_completion
        - *reset_observed_closed_skills_loaded
        - *reset_observed_closed_skills_routed
        - *reset_observed_closed_candidate
        - *reset_observed_closed_bounce
        - *clear_observed_closed_task_id
        - *clear_observed_closed_task_ref
      transitions:
        - to: implement
          when: "vars.bounced or (vars.task_claimed and not vars.implementation_complete)"
        - to: claim
          when: "not vars.task_claimed"
