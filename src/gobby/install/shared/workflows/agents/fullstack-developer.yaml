name: fullstack-developer
description: |
  Fullstack implementation agent for lifecycle dispatch leaves that require
  coordinated backend and frontend changes.

version: "1.1"
enabled: true
priority: 30
surfaces: [spawn, persona]
provider: codex
model: gpt-5.6-sol
reasoning_effort: xhigh
isolation: inherit
blocked_mcp_tools:
  - "gobby-agents:kill_agent"

skills:
  baseline:
    - backend APIs, storage, migrations, and daemon implementation
    - frontend components, routing, accessibility, and browser behavior
    - integration testing across API, UI, CLI, and persistence boundaries
    - pytest, mypy, ruff, playwright, eslint, and task-focused validation
  tool_allowlist:
    - pytest
    - mypy
    - ruff
    - psql
    - uv
    - npm
    - pnpm
    - yarn
    - playwright
    - vite
    - webpack
    - eslint

prompts:
  persona: |
    Provide interactive guidance across Gobby's backend and web application. Trace contracts end to end, keep ownership boundaries explicit, and favor the smallest complete cross-layer change.
  agent: |
    Lifecycle model:
    - Rules are authored against semantic workflow events such as `turn_start` and `turn_end`.
    - Raw `before_agent`, `after_agent`, and `stop` are provider/runtime details, not the main authoring API.
    - Dev and QA leaf work may run inside the parent epic's isolation context.
    - Agent termination is separate and still requires `end_agent_run`.

    You are the fullstack-developer for an automated leaf task. Your task ID is in
    assigned_task_id. Use backend and frontend validation proportionally to the
    change. Prefer narrow, behavior-focused commands over broad full-suite runs.

    Additional skills:
    Load gobby:references/development/obligations.md, restraint, and gobby:references/tasks/overview.md with gobby-skills before
    implementing. Then inspect the prompt's additional_skills list and call
    the appropriate get_skill or get_skill_file call for each entry before implementing.
    TDD-required leaves include test-driven-development in additional_skills.

    Handoff:
    Inspect the assigned task's stage manifest. If the current development row has
    no review gate, commit the implementation, run close_task with preview=true,
    and repair every blocker until that call closes the task. If review is
    enabled, commit the implementation and call
    submit_for_review with `stage_name="development"` so rule_qa can dispatch a reviewer.

    Boundaries:
    - Task transitions flow one way from a leaf: reopen_task and
      de_escalate_task belong to the orchestrator that dispatched you.
    - Work the leaf yourself — spawning agents from a leaf multiplies cost
      without adding capability.
    - Finish by calling end_agent_run so the daemon records the run as complete.
    - **Never run the full test suite** — it takes 30+ minutes and starves the
      worker pool. Scope Rust to `cargo test -p <package>` or
      `cargo test <name> -p <package>`.
    - Run Python through `uv run`; the system Python lacks the project deps.
    - Use context-aware progressive discovery: call leased known tools directly; fetch schemas directly for known unleased tools; use list_tools only for unknown tool names and list_mcp_servers only for unknown servers or registries.
workflows:
  rule_selectors:
    include:
      - "tag:default"
      - "tag:worker-safety"
step_workflow:
  variables:
    task_claimed: false
    required_skills:
      - gobby:references/development/obligations.md
      - restraint
      - gobby:references/tasks/overview.md
    required_skills_loaded: false
    additional_skills: []
    additional_skills_loaded: false
    implementation_complete: false
    blocker_handed_off: false

  exit_condition: "current_step == 'terminate'"
  steps:
    - name: claim
      mcp_error_policy: stay
      description: "Claim the assigned fullstack leaf"
      status_message: |
        Spawned agents normally arrive after assigned_task_id is already claimed and
        skip this step. If this step is active, claim assigned_task_id with claim_task,
        then read it with get_task(brief=false).
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-tasks:claim_task"
        - "gobby-tasks:get_task"
      on_mcp_success:
        - server: gobby-tasks
          tool: claim_task
          action: set_variable
          variable: task_claimed
          value: true
      transitions:
        - to: load_required_skills
          when: "vars.task_claimed"

    - name: load_required_skills
      mcp_error_policy: stay
      description: "Load required developer discipline skills"
      status_message: |
        Execute loads through mcp__gobby__call_tool.
        Plain requirements use get_skill(name=<name>). Exact references
        use get_skill_file(name=<skill>, path=<reference path>): first fetch
        its schema with get_tool_schema in a separate outer result. Follow
        each page.next_cursor with only cursor until null before continuing.
        Load required developer skills before loading optional task skills or
        implementing:
        1. get_skill_file(name="gobby", path="references/development/obligations.md") on gobby-skills
        2. get_skill(name="restraint") on gobby-skills
        3. get_skill_file(name="gobby", path="references/tasks/overview.md") on gobby-skills
        Use the Gobby MCP proxy tools in this step. Use get_skill for plain names and get_skill_file for exact references:
        call_tool("gobby-skills", "get_skill", {"name": <plain name>}) or
        call_tool("gobby-skills", "get_skill_file", {"name": <skill>, "path": <reference path>});
        native Skill, GitHub/app connector, and Computer Use tools bypass
        Gobby's skill tracking.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-skills:get_skill"
        - "gobby-skills:get_skill_file"
      on_mcp_success:
        - server: gobby-skills
          tool: get_skill
          action: set_variable
          variable: required_skills_loaded
          value: >-
            all(skill_loaded(skill) for skill in vars.required_skills)
        - server: gobby-skills
          tool: get_skill_file
          action: set_variable
          variable: required_skills_loaded
          value: >-
            all(skill_loaded(skill) for skill in vars.required_skills)
      transitions:
        - to: load_additional_skills
          when: >-
            all(skill_loaded(skill) for skill in vars.required_skills)

    - name: load_additional_skills
      mcp_error_policy: stay
      description: "Load optional task-specific skills"
      status_message: |
        Execute loads through mcp__gobby__call_tool.
        Plain requirements use get_skill(name=<name>). Exact references
        use get_skill_file(name=<skill>, path=<reference path>): first fetch
        its schema with get_tool_schema in a separate outer result. Follow
        each page.next_cursor with only cursor until null before continuing.
        Load each prompt additional_skills entry using the plain-name or exact-reference
        loading contract above. If the list is empty, proceed to implementation.
        Use the Gobby MCP proxy tools in this step. Use get_skill for plain names and get_skill_file for exact references:
        call_tool("gobby-skills", "get_skill", {"name": <plain name>}) or
        call_tool("gobby-skills", "get_skill_file", {"name": <skill>, "path": <reference path>});
        native Skill, GitHub/app connector, and Computer Use tools bypass
        Gobby's skill tracking.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-skills:get_skill"
        - "gobby-skills:get_skill_file"
      on_mcp_success:
        - server: gobby-skills
          tool: get_skill
          action: set_variable
          variable: additional_skills_loaded
          value: >-
            not vars.additional_skills
            or all(skill_loaded(skill) for skill in vars.additional_skills)
        - server: gobby-skills
          tool: get_skill_file
          action: set_variable
          variable: additional_skills_loaded
          value: >-
            not vars.additional_skills
            or all(skill_loaded(skill) for skill in vars.additional_skills)
      transitions:
        - to: implement
          when: >-
            not vars.additional_skills
            or all(skill_loaded(skill) for skill in vars.additional_skills)

    - name: implement
      mcp_error_policy: stay
      description: "Implement, validate, and hand off or close"
      status_message: |
        Implement the fullstack leaf. Commit changes, then inspect the assigned
        task manifest. If development review is disabled, call close_task with
        preview=true and commit_sha, then repair every blocker until it closes;
        otherwise submit_for_review(stage_name="development") for QA.
        Sending the parent a task_blocker message ends this run after delivery;
        the parent respawns you with the answer, reusing the worktree. For a question
        that needs a reply while this run stays alive, use message_type=message; the
        reply arrives in a later tool result.
      allowed_tools: "all"
      blocked_mcp_tools:
        - "gobby-tasks:de_escalate_task"
        - "gobby-tasks:reopen_task"
        - "gobby-agents:spawn_agent"
        - "gobby-agents:kill_agent"
        - "gobby-agents:end_agent_run"
      on_mcp_success:
        - server: gobby-tasks
          tool: close_task
          when: >-
            tool_input.get('task_id') == vars.get('assigned_task_id')
            and (
              tool_output.get('closed') is True
              or (tool_output.get('result') or {}).get('closed') is True
            )
          action: set_variable
          variable: implementation_complete
          value: true
        - server: gobby-tasks-ops
          tool: submit_for_review
          action: set_variable
          variable: implementation_complete
          value: true
        - server: gobby-tasks
          tool: escalate_task
          when: >-
            tool_input.get('task_id') is not None
            and tool_input.get('task_id') in (vars.get('assigned_task_id'), vars.get('assigned_task_uuid'))
          action: set_variable
          variable: implementation_complete
          value: true
        - server: gobby-agents
          tool: send_message
          when: >-
            tool_input.get('message_type') == 'task_blocker'
            and tool_input.get('target') == 'session'
            and tool_input.get('target_id') is not None
            and (tool_output.get('result') or tool_output).get('target_id', tool_input.get('target_id'))
            in (vars.get('parent_session_id'), vars.get('parent_session_ref'))
            and (tool_input.get('metadata') or {}).get('task_id') is not None
            and (tool_input.get('metadata') or {}).get('task_id') in (vars.get('assigned_task_id'), vars.get('assigned_task_uuid'))
          action: set_variable
          variable: blocker_handed_off
          value: true
      transitions:
        - to: terminate
          when: "vars.implementation_complete or vars.blocker_handed_off"

    - name: terminate
      description: "Self-terminate"
      status_message: >-
        Call mcp__gobby__call_tool with server_name="gobby-agents",
        tool_name="end_agent_run" to finish this run. Pass current_state summarizing
        the native tracker and next_steps with a specific coordinator action. If
        blocker_handed_off is true, include the blocker, failing commands,
        diagnostics, paths, and impact; otherwise state the completed deliverable.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-agents:end_agent_run"
