name: feedback-reviewer
description: |
  Taskless nightly reviewer that clusters session feedback and returns a
  Markdown report and validated findings for human-reviewed tasks.

version: "3.0"
enabled: true
priority: 20
surfaces: [spawn]
provider: codex
model: gpt-5.6-sol
reasoning_effort: medium
isolation: none
blocked_mcp_tools:
  - "gobby-agents:spawn_agent"
  - "gobby-agents:kill_agent"
  - "gobby-tasks:create_task"
  - "gobby-tasks:claim_task"
  - "gobby-tasks:update_task"
  - "gobby-tasks:close_task"

prompts:
  agent: |
    You are the taskless reviewer for Gobby's nightly session-feedback loop.
    The spawn prompt contains the review run ID and instructions. Read the
    frozen observation batch through the paginated gobby-feedback readers. You propose findings only; deterministic daemon code validates the
    proposal, deduplicates against open tasks, files tasks, and
    marks observations reviewed.

    Your step workflow requires you to load `restraint` and `proportionality`
    through gobby-skills before reviewing. Apply restraint at max level. Use
    proportionality to reject speculative or needless follow-up machinery while
    preserving fixes justified by concrete evidence.

    Investigate whether each actionable concern still exists. Read current source,
    relevant commits, installed rules, and existing tasks; use read-only Bash/gcode
    and the task/workflow readers. A later file edit alone does not prove a fix.
    Record concrete verification evidence in the task description and Markdown
    summary. Keep uncertain concerns explicit rather than claiming verification.

    Submit findings and your Markdown summary through gobby-feedback:submit_review.
    This saves the report outside handoff and queues verified findings for task
    creation with awaiting-human-review. Do not put JSON or the report into handoff.
    After submission succeeds, load handoff-discipline and call end_agent_run with
    a brief completion status, the report path in references, and one next_steps
    item for human review. This call only ends the agent lifecycle.

    Lifecycle model:
    - Rules are authored against semantic workflow events such as `turn_start`
      and `turn_end`.
    - Raw `before_agent`, `after_agent`, and `stop` are provider/runtime details,
      not the main authoring API.
    - This run is taskless. Never create, claim, update, close, or escalate tasks.

workflows:
  rule_selectors:
    include:
      - "tag:default"
      - "tag:worker-safety"
    exclude:
      - "tag:task-skill-gates"

step_workflow:
  variables:
    restraint_loaded: false
    proportionality_loaded: false
    review_complete: false

  exit_condition: "vars.review_complete"
  steps:
    - name: load_skills
      mcp_error_policy: stay
      description: "Load restraint and proportionality before reviewing feedback"
      status_message: |
        Load both required methodology skills through the Gobby proxy:
        1. get_skill(name="restraint") on gobby-skills
        2. get_skill(name="proportionality") on gobby-skills
        Use only mcp__gobby__call_tool in this step. Native skill tools bypass
        Gobby's observable skill tracking.
      allowed_tools:
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-skills:get_skill"
        - "gobby-skills:get_skill_file"
      on_mcp_success:
        - server: gobby-skills
          tool: get_skill
          when: "tool_input.name == 'restraint'"
          action: set_variable
          variable: restraint_loaded
          value: true
        - server: gobby-skills
          tool: get_skill
          when: "tool_input.name == 'proportionality'"
          action: set_variable
          variable: proportionality_loaded
          value: true
      transitions:
        - to: review
          when: "vars.restraint_loaded and vars.proportionality_loaded"

    - name: review
      mcp_error_policy: stay
      description: "Return the structured feedback proposal and terminate"
      status_message: |
        Verify concerns against current code and existing tasks. Submit findings
        and a Markdown summary using gobby-feedback:submit_review. Then end the
        run with a brief status and report reference, never the report body.
        Use Bash only for read-only inspection; do not edit source or run fixes.
      allowed_tools:
        - Bash
        - Read
        - mcp__gobby__call_tool
        - mcp__gobby__list_mcp_servers
        - mcp__gobby__list_tools
        - mcp__gobby__get_tool_schema
      allowed_mcp_tools:
        - "gobby-feedback:get_review_observations"
        - "gobby-feedback:get_review_results"
        - "gobby-feedback:submit_review"
        - "gobby-tasks:get_task"
        - "gobby-tasks:list_tasks"
        - "gobby-tasks:search_tasks"
        - "gobby-workflows:get_rule"
        - "gobby-workflows:get_agent_definition"
        - "gobby-results:get_tool_result"
        - "gobby-results:search_tool_result"
        - "gobby-skills:get_skill"
        - "gobby-skills:get_skill_file"
        - "gobby-agents:end_agent_run"
      on_mcp_success:
        - server: gobby-agents
          tool: end_agent_run
          action: set_variable
          variable: review_complete
          value: true
