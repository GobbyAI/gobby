id = "qwen"
version = "1"
engine = 1

[[rules]]
id = "trust_prompt"
state = "blocked"
reason = "trust"
priority = 1000
region = "whole_recent"
line_regex = ['(?i)(?:Do you trust the files|Is this a project you created or one you trust|Trust.*Folder)']

[[rules]]
id = "loop_prompt"
state = "blocked"
reason = "loop"
priority = 950
region = "whole_recent"
line_regex = [
  '(?i)(?:stuck in a loop|repeating myself|potential loop detected|seems? to be (?:stuck|looping|repeating))',
  '(?i)(?:(?:continue|proceed)(?:\s+anyway)?\?\s*(?:\((?:y|yes)/(?:n|no)\)|\[(?:y|yes)/(?:n|no)\])|(?:press|type)\s+(?:y|yes)\s+(?:to\s+)?(?:continue|proceed))',
]

[[rules]]
id = "approval_prompt"
state = "blocked"
reason = "approval"
priority = 900
region = "whole_recent"
line_regex = [
  '(?i)(?:\b(?:approval|permission|allow|approve|permit|confirmation)\b|\b(?:run|execute|apply)\s+(?:this\s+)?(?:command|tool|action))',
  '(?is)(?:(?:press|hit)\s+(?:enter|return)\s+to\s+(?:approve|allow|permit|proceed|continue|accept|confirm)|(?:approve|allow|permit|proceed|continue|accept|confirm).{0,40}(?:enter|return)|(?:enter|return).{0,40}(?:approve|allow|permit|proceed|continue|accept|confirm)|(?:enter|return)\s+to\s+submit)',
]

[[rules]]
id = "pane_provider_error"
state = "stall"
reason = "provider_error"
priority = 860
region = "whole_recent"
line_regex = ['(?i)^(?:(?:error|fatal|failed|warning|exception|provider(?:\s+api)?\s+error|api\s+error)\s*[:\-]\s*)?(?:\b429\b.*(?:rate|limit|too many|quota)|\b503\b.*(?:service|unavailable|overloaded)|\b502\b.*(?:bad gateway|upstream)|\b500\b.*internal server error|\b529\b.*(?:overloaded|server-side|server side)|(?:provider\s+)?(?:request|connection|read)\s+timed?\s*out\b.*|network\s+error\b.*|(?:ETIMEDOUT|ECONNREFUSED|ECONNRESET)\b.*|(?:overloaded_error|ResourceExhausted|capacity\s+exceeded)\b.*|(?:(?:openai|anthropic|google(?:\.api_core)?|google\.genai)\.)?(?:APIConnectionError|APIStatusError|InternalServerError|RateLimitError|APITimeoutError|APIError)\b.*|anthropic\.\w*Error\b.*)']

[[rules]]
id = "provider_error"
state = "stall"
reason = "provider_error"
priority = 850
region = "whole_recent"
line_regex = ['(?i)(?:\b429\b.*(?:rate|limit|too many|quota)|\b503\b.*(?:service|unavailable|overloaded)|\b502\b.*(?:bad gateway|upstream)|\b500\b.*internal server error|\b529\b.*(?:overloaded|server-side|server side)|(?:error|failed|exception|raise|fatal|❌).*rate.?limit|rate.?limit.*(?:error|exception|exceeded|please retry)|(?:error|failed|warning).*too many requests|quota\s+(?:exceeded|exhausted)|(?:request|connection|read)\s+timed?\s*out|ETIMEDOUT|ECONNREFUSED|ECONNRESET|network\s+error|overloaded_error|ResourceExhausted|capacity\s+exceeded|APIConnectionError|APIStatusError|InternalServerError|anthropic\..*Error)']

[[rules]]
id = "context_full"
state = "blocked"
reason = "context_full"
priority = 800
region = "bottom_non_empty_lines(4)"
line_regex = ['(?i)(?:The context window is full(?:\. Would you like to start a new conversation\?)?\.|I.ve run out of context space\.|This conversation is too long to continue\.)']

[[rules]]
id = "stop_hook_blocked"
state = "idle"
reason = "stop_hook_blocked"
priority = 700
region = "whole_recent"
line_regex = ['(?i)(?:Stop hook error|Rule enforced by Gobby)']

[[rules]]
id = "turn_in_flight"
state = "working"
priority = 695
region = "whole_recent"
line_regex = ['(?i)(?:^\s*[^\s\w]{1,2}\s+\S+\s*\((?:\d+h\s*)?(?:\d+m\s*)?\d+s\s*[·•]|\besc to interrupt\b)']

[[rules]]
id = "active_work"
state = "working"
priority = 690
region = "whole_recent"
line_regex = ['(?i)(?:\bRunning(?:[.…]+|\s+(?:command|task|process|job|tests?|checks?)\b)|almost done thinking|thinking with .*effort|\bReading\s+\d+\s+files?\b)']

[[rules]]
id = "queued_continuation"
state = "idle"
reason = "queued_continuation"
priority = 650
region = "whole_recent"
line_regex = [
  '(?i)(?:Continue working on your task|active Gobby step workflow is not complete)',
]

[[rules]]
id = "queued_message"
state = "idle"
reason = "queued_message"
priority = 640
region = "whole_recent"
line_regex = ['(?i)(?:queued messages|Press up to edit queued messages)']

[[rules]]
id = "status_bar"
state = "working"
priority = 200
region = "whole_recent"
line_regex = ['(?i)(?:Opus|Sonnet|Haiku|bypass permissions|^\s*[⎇𖠰]|^\s*/|^\s*[─━▪▫]+)']

[[rules]]
id = "idle_prompt"
state = "idle"
priority = 100
region = "whole_recent"
line_regex = ['(?m)^\s*[❯>$]\s*$']

[[rules]]
id = "stalled_input"
state = "idle"
priority = 90
region = "whole_recent"
line_regex = ['(?m)^\s*[❯>$]\s+\S']

[[rules]]
id = "source_shaped"
state = "working"
priority = 10
region = "whole_recent"
line_regex = ['(?i)^(?:(?:#|//|/\*|\*|--|-|\+)\s*|(?:from\s+\S+\s+import|import\s+\S+)|(?:assert|return|raise|yield|with|if|elif|else:|for|while|try:|except\b|class\b|def\b|async\s+def\b)\b|@|(?:self|cls|mock|logger|pytest|re)\.|(?:const|let|var|final)\s+\w+\s*=|[A-Za-z_][\w.]*\s*(?::\s*[^=]+)?[+\-*/%|&^]?=|/(?:\\.|[^/])+/[a-z]*[,;]?$|\w+\(.*\)\s*$|[}\]\)],?\s*$)']
