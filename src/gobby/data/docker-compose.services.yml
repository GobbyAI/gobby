# Gobby service dependencies
# Installed via: gobby install
# Managed by daemon start/stop via Docker Compose profiles.

services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "${GOBBY_SERVICES_BIND_ADDRESS:-127.0.0.1}:${GOBBY_FALKORDB_PORT:-16379}:6379"
      - "127.0.0.1:${GOBBY_FALKORDB_BROWSER_PORT:-13000}:3000"
    environment:
      # Redis AUTH - REDIS_ARGS is the documented entry point for redis-server flags.
      # --save drops the stock `60 10000` rule: graph projections are rebuildable and
      # that rule rewrote ~360 MB every minute under write bursts.
      # No shared default and no `:?`: Compose interpolates every service even for the
      # postgres-only `up` that daemon start and fresh installs run before the FalkorDB
      # secret is loaded; the compose runtime resolver fails closed before a FalkorDB start.
      - REDIS_ARGS=--requirepass ${GOBBY_FALKORDB_PASSWORD:-} --save 3600 1 300 100
      # Pass-through so the healthcheck below can read the same value.
      - GOBBY_FALKORDB_PASSWORD=${GOBBY_FALKORDB_PASSWORD:-}
      # FALKORDB_ARGS is reserved for module options; do not put auth there. Setting it
      # replaces the image default wholesale, so the unchanged values are restated.
      # TIMEOUT_DEFAULT (not the deprecated read-only TIMEOUT) makes per-query
      # `timeout` bound write queries too, with rollback; TIMEOUT_MAX 0 = no cap.
      - FALKORDB_ARGS=MAX_QUEUED_QUERIES 25 TIMEOUT_DEFAULT 30000 TIMEOUT_MAX 0 RESULTSET_SIZE 10000
    volumes:
      # FalkorDB persists snapshots in its default data directory.
      - gobby_falkordb_data:/var/lib/falkordb/data
    healthcheck:
      # Quote the shell-expanded password so future relaxed password rules do not word-split.
      test:
        - CMD-SHELL
        - 'redis-cli -a "$$GOBBY_FALKORDB_PASSWORD" PING | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles: [falkordb, all]

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${GOBBY_SERVICES_BIND_ADDRESS:-127.0.0.1}:${GOBBY_QDRANT_HTTP_PORT:-6333}:6333"
      - "${GOBBY_SERVICES_BIND_ADDRESS:-127.0.0.1}:${GOBBY_QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      # Auth disabled for local-only access (no TLS = no point in API key)
      # To enable: set QDRANT__SERVICE__API_KEY and configure TLS
      - QDRANT__LOG_LEVEL=${GOBBY_QDRANT_LOG_LEVEL:-WARN}
    volumes:
      - gobby_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && printf \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"healthz check passed\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - qdrant
      - all

  postgres:
    build:
      context: ./postgres-pgsearch
      args:
        PG_SEARCH_VERSION: ${GOBBY_PG_SEARCH_VERSION:-0.23.4}
        PG_SEARCH_SHA256: ${GOBBY_PG_SEARCH_SHA256}
    image: gobby-postgres-local:18-pgsearch
    container_name: gobby-postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_search,pgaudit
      # pgaudit stays preloaded because every database has the extension
      # installed, but it emits nothing. Earlier images baked
      # `pgaudit.log = 'write'` into postgresql.conf.sample, and data
      # directories initialized from them still carry that line, so the
      # override is explicit rather than relying on the extension default.
      - -c
      - pgaudit.log=none
    environment:
      POSTGRES_DB: ${GOBBY_POSTGRES_DB:-gobby}
      POSTGRES_USER: ${GOBBY_POSTGRES_USER:-gobby}
      POSTGRES_PASSWORD: ${GOBBY_POSTGRES_PASSWORD:?GOBBY_POSTGRES_PASSWORD must be set}
    ports:
      - "${GOBBY_SERVICES_BIND_ADDRESS:-127.0.0.1}:${GOBBY_POSTGRES_PORT:-60891}:5432"
    volumes:
      - gobby_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          set -eu;
          pg_isready -U ${GOBBY_POSTGRES_USER:-gobby};
          test "$(psql -U ${GOBBY_POSTGRES_USER:-gobby} -d ${GOBBY_POSTGRES_DB:-gobby} -tAc "SELECT 1 FROM pg_extension WHERE extname='pgaudit'")" = "1";
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    profiles:
      - postgres
      - all

volumes:
  gobby_falkordb_data:
    name: gobby_falkordb_data
  gobby_qdrant_data:
    name: gobby_qdrant_data
  gobby_postgres_data:
    name: gobby_postgres_data

# Bind-dir lifecycle entry for pack/hub-backup. Not a datastore named volume
# and not attached to postgres/qdrant/falkor.
x-gobby-lifecycle:
  gobby_files:
    type: bind
    source: ${GOBBY_FILES_HOME:?GOBBY_FILES_HOME must be set}
