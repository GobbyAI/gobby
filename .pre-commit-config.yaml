# Pre-commit hooks for Gobby
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

default_language_version:
  python: python3.13

# Fail fast on first error (set to false for CI)
fail_fast: false

repos:
  # ==========================================================================
  # Basic file hygiene
  # ==========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.gobby/
      - id: end-of-file-fixer
        exclude: ^\.gobby/
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags
      - id: check-json
        exclude: ^\.gobby/
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-case-conflict

  # ==========================================================================
  # Python linting and formatting (ruff)
  # ==========================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      # Linter - runs first, can auto-fix
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      # Formatter - runs after linter
      - id: ruff-format
        types_or: [python, pyi]

  # ==========================================================================
  # Type checking (mypy)
  # Uses `uv run` so mypy sees the full project environment and module graph.
  # Runs on the entire src/ package (not individual files) to avoid false
  # positives from missing cross-module type inference.
  # ==========================================================================
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        pass_filenames: false
        files: ^src/.*\.py$
        types: [python]

  # ==========================================================================
  # Security - secrets detection
  # ==========================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ==========================================================================
  # Security checks (pre-push) - slower checks that run before pushing
  # These complement GitHub's CodeQL/Dependabot but catch issues locally
  # ==========================================================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.2
    hooks:
      - id: bandit
        name: bandit (security linter)
        args: [-c, pyproject.toml, -r, src/]
        stages: [pre-push]

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (dependency CVEs)
        # --ignore-vuln: diskcache 5.6.3 pickle deserialization (no fix available as of 2026-03)
        entry: bash -c 'branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown"); if [ "$branch" = "main" ] || [ "$branch" = "dev" ]; then uv run pip-audit --ignore-vuln CVE-2025-69872; else echo "Skipping pip-audit on branch $branch (only runs on main/dev)"; fi'
        language: system
        pass_filenames: false
        stages: [pre-push]
