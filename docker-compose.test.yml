# Cwd-independent project so worktrees reuse gobby-postgres-test-1.
name: gobby

services:
  postgres-test:
    build:
      context: ./src/gobby/data/postgres-pgsearch
      args:
        PG_SEARCH_VERSION: ${GOBBY_PG_SEARCH_VERSION:-0.23.4}
        PG_SEARCH_SHA256: ${GOBBY_PG_SEARCH_SHA256:-6b042d61d156ca5fdcb1c417e291d90bffe3026848890be30bf6e578146b4676}
    image: gobby-postgres-local:18-pgsearch
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_search,pgaudit
      # Eight xdist workers can drop 600+ object schemas concurrently.
      - -c
      - max_locks_per_transaction=256
    environment:
      POSTGRES_DB: ${GOBBY_POSTGRES_TEST_DB:-gobby_test}
      POSTGRES_USER: ${GOBBY_POSTGRES_TEST_USER:-gobby_test}
      POSTGRES_PASSWORD: ${GOBBY_POSTGRES_TEST_PASSWORD:-gobby_test}
    ports:
      # Loopback only: the fixed test password must never be reachable off-host.
      - "127.0.0.1:${GOBBY_POSTGRES_TEST_PORT:-60892}:5432"
    tmpfs:
      - /var/lib/postgresql:rw,size=3g,nr_inodes=6000000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GOBBY_POSTGRES_TEST_USER:-gobby_test}"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Isolated FalkorDB and Qdrant mirroring the managed services in
  # src/gobby/data/docker-compose.services.yml: same images and FalkorDB module
  # arguments (a test enforces parity), loopback-only fixed ports distinct from the
  # managed ones, tmpfs storage, and test-only credentials. Tests never touch the
  # daemon's managed services. Start with: docker compose -f docker-compose.test.yml up -d --wait
  falkordb-test:
    image: falkordb/falkordb:latest
    environment:
      - REDIS_ARGS=--requirepass ${GOBBY_FALKORDB_TEST_PASSWORD:-gobby_test} --save 3600 1 300 100
      - GOBBY_FALKORDB_PASSWORD=${GOBBY_FALKORDB_TEST_PASSWORD:-gobby_test}
      - FALKORDB_ARGS=MAX_QUEUED_QUERIES 25 TIMEOUT_DEFAULT 30000 TIMEOUT_MAX 0 RESULTSET_SIZE 10000
    ports:
      - "127.0.0.1:${GOBBY_FALKORDB_TEST_PORT:-26379}:6379"
    tmpfs:
      - /var/lib/falkordb/data:rw
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -a "$$GOBBY_FALKORDB_PASSWORD" PING | grep -q PONG'
      interval: 2s
      timeout: 2s
      retries: 15

  qdrant-test:
    image: qdrant/qdrant:latest
    environment:
      - QDRANT__LOG_LEVEL=${GOBBY_QDRANT_LOG_LEVEL:-WARN}
    ports:
      - "127.0.0.1:${GOBBY_QDRANT_TEST_HTTP_PORT:-26333}:6333"
      - "127.0.0.1:${GOBBY_QDRANT_TEST_GRPC_PORT:-26334}:6334"
    tmpfs:
      - /qdrant/storage:rw
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && printf \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q \"healthz check passed\" <&3'"]
      interval: 2s
      timeout: 2s
      retries: 15
