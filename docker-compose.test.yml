services:
  postgres-test:
    build:
      context: ./src/gobby/data/postgres-pgsearch
      args:
        PG_SEARCH_VERSION: ${GOBBY_PG_SEARCH_VERSION:-0.23.4}
        PG_SEARCH_SHA256: ${GOBBY_PG_SEARCH_SHA256:-fd4ec8fec076910f60824176adddd57d192877a9ed271c1994202fdf4edb77cf}
    image: gobby-postgres-local:17-pgsearch
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_search,pgaudit
      - -c
      - pgaudit.log=write
      - -c
      - pgaudit.log_catalog=off
      - -c
      - logging_collector=on
      - -c
      - log_destination=stderr
      - -c
      - log_directory=/var/log/pgaudit
      - -c
      - log_filename=pgaudit-%Y-%m-%d_%H%M%S.log
      - -c
      - log_rotation_age=1d
      - -c
      - log_rotation_size=0
      - -c
      - log_file_mode=0640
      - -c
      - log_min_messages=log
    environment:
      POSTGRES_DB: ${GOBBY_POSTGRES_TEST_DB:-gobby_test}
      POSTGRES_USER: ${GOBBY_POSTGRES_TEST_USER:-gobby_test}
      POSTGRES_PASSWORD: ${GOBBY_POSTGRES_TEST_PASSWORD:-gobby_test}
    ports:
      - "${GOBBY_POSTGRES_TEST_PORT:-60892}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GOBBY_POSTGRES_TEST_USER:-gobby_test}"]
      interval: 2s
      timeout: 2s
      retries: 15
