# gitleaks configuration for Gobby.
#
# The pre-commit `gitleaks` hook declares `pass_filenames: false` and scans the
# staged diff itself, so pre-commit's `exclude:` cannot narrow it. Scan scope
# belongs here.

[extend]
useDefault = true

[allowlist]
description = "Vendored upstream sources and synthetic test vectors; no real credentials"
paths = [
  '''^crates/gterminal/vendor/(?:libghostty-vt|portable-pty|patches)/''',
  # Synthetic cross-language seal vector: generated test data, not a credential.
  '''^crates/gruntime/tests/fixtures/secret_seal_vector\.json$''',
]
