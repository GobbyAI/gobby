nextest-version = { required = "0.9.133" }

[profile.default]
fail-fast = false
leak-timeout = { period = "500ms", result = "fail" }

[profile.ci]
inherits = "default"
fail-fast = false

[test-groups]
ghook-process = { max-threads = 2 }
serial-db = { max-threads = 1 }
gterm-pty = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(gobby-hooks)'
test-group = 'ghook-process'

[[profile.default.overrides]]
filter = 'package(gobby-code) & (test(::serial_db::) | test(serial_db::))'
test-group = 'serial-db'

[[profile.default.overrides]]
filter = 'package(gobby-wiki) & (test(::serial_db::) | test(serial_db::))'
test-group = 'serial-db'

[[profile.default.overrides]]
filter = 'package(gobby-terminal) & (test(::pty::) | test(pty::) | test(frame_producer))'
test-group = 'gterm-pty'
