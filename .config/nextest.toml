nextest-version = { required = "0.9.133" }
experimental = ["setup-scripts"]

[scripts.setup.gclient-test-gterm]
# Validate/build the checkout's host once, before any test's timeout starts.
command = ["cargo", "build", "-p", "gobby-terminal", "--features", "vt-engine", "--bin", "gterm"]

[[profile.default.scripts]]
filter = '''package(gobby-client) & binary(suite) & (
    test(=frame_source_live::direct_frames_verify_epoch_and_render) |
    test(=frame_source_live::granted_direct_input_echoes_and_revoke_refuses) |
    test(=frame_source_live::tmux_pane_attaches_through_host_observer)
)'''
setup = 'gclient-test-gterm'

[store]
dir = ".nextest"

[profile.default]
fail-fast = false
# Leaks still fail. On macOS a test child can inherit another test's capture
# pipe while nextest spawns from several threads (rust-lang/rust#95584: pipe()
# then FD_CLOEXEC is not atomic), so the victim reads as leaky until that
# unrelated test exits. The period must outlast the longest test that can be
# co-spawned; a genuinely leaked child holds the pipe forever and still fails.
leak-timeout = { period = "10s", result = "fail" }

# Every run leaves .nextest/<profile>/junit.xml, which keeps each
# failure's name and captured output after a terminal has truncated them.
[profile.default.junit]
path = "junit.xml"

[profile.ci]
inherits = "default"
fail-fast = false

[test-groups]
ghook-process = { max-threads = 2 }
serial-db = { max-threads = 1 }
gterm-pty = { max-threads = 1 }
gdaemon-lease = { max-threads = 1 }
gdaemon-native-ws = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(gobby-hooks)'
test-group = 'ghook-process'

[[profile.default.overrides]]
# Lease and lifecycle fixtures serialize on one advisory lock with a bounded
# wait; queued behind long lifecycle cases, a lease case outwaits that bound.
# Every worktree's runs share that key on the one test hub, and a hung case holds
# it until its process dies, so terminate at 180 s: past the 60 s lifecycle key
# wait plus the slowest case (about 11 s alone).
filter = 'package(gobby-daemon) & binary(suite) & (test(/^lease::/) | test(/^lifecycle::/))'
test-group = 'gdaemon-lease'
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
# Serial, so no sibling of this binary spawns during a test's spawn window
# (see the leak-timeout note above). The publish test runs long enough to matter.
filter = 'package(gobby-daemon) & binary(suite) & test(/^native_ws_transport::/)'
test-group = 'gdaemon-native-ws'

[[profile.default.overrides]]
filter = 'package(gobby-core) & (test(schema::runner_tests) | binary(catalog_manifest_freshness) | binary(schema_contract))'
test-group = 'serial-db'

[[profile.default.overrides]]
# Schema subprocesses share hub roles and must not inherit sibling capture pipes
# while long apply tests run (the macOS FD_CLOEXEC race described above).
# Node fixtures hold one advisory lock; schedule them before their bounded lock wait.
filter = 'package(gobby-daemon) & (test(retention::tests::database) | (binary(suite) & (test(/^schema_cli::/) | test(/^cli_contract::/) | test(/^nodes::/) | test(/^node_internal_route::/))))'
test-group = 'serial-db'

[[profile.default.overrides]]
filter = 'package(gobby-code) & (test(::serial_db::) | test(serial_db::))'
test-group = 'serial-db'

[[profile.default.overrides]]
# These fixtures create hub roles under one advisory lock; run in parallel they
# deadlock against each other's role writes.
filter = 'package(gobby-runtime) & binary(suite) & (test(/^config::/) | test(/^grant::/) | test(/^handshake::/) | test(/^secrets::/) | test(/^verify::/))'
test-group = 'serial-db'

[[profile.default.overrides]]
# Fresh Cargo/Zig builds must not starve host tests sharing this run's machine:
# upgrade tests exercise the product's fixed 15s budget, including rollback.
# Include every host-prefixed module: they reuse the built executable and must
# not overlap nested Cargo builders that can replace that image.
filter = 'package(gobby-terminal) & (test(/pty::|pane::runtime/) | (binary(suite) & (test(/^frame_producer::/) | test(/^host_/) | test(/^control_protocol::/) | test(/^frame_protocol::/) | test(/^embed::/) | test(/^batch_paste::/) | test(/^terminal_theme::/) | test(/^build_env::/) | test(/^link_artifacts::/))))'
test-group = 'gterm-pty'

[[profile.default.overrides]]
# gobby-terminals has its own host_lifecycle module in its suite. The override above matches
# package gobby-terminal only, so this binary ran unserialized. explicit_drain
# spawns no process, so its LEAK-FAIL can only come from a co-running test that
# holds its inherited capture pipe. A 500ms probe of the unserialized config
# (#24228) leaked in 13 of 80 full-binary iterations, 3 of them on explicit_drain;
# the same probe leaked 0 of 40 with this group and 0 of 40 for explicit_drain
# run alone. Group it with the other host_lifecycle module.
filter = 'package(gobby-terminals) & binary(suite) & test(/^host_lifecycle::/)'
test-group = 'gterm-pty'

[[profile.default.overrides]]
filter = 'package(gobby-client) & test(late_control_reply_cannot_settle_a_newer_request)'
slow-timeout = { period = "60s", terminate-after = 2 }
test-group = 'gterm-pty'

[[profile.default.overrides]]
filter = 'package(gobby-client) & binary(suite) & test(=loop_liveness::a_held_terminal_input_flood_is_bounded_ordered_and_nonblocking)'
# Request acknowledgements govern progress; this watchdog catches a stuck test.
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'package(gobby-client) & binary(suite) & test(/^loop_liveness::/) & test(keystroke_latency)'
# These acceptance measurements require isolation from sibling test workloads.
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'package(gobby-client) & binary(suite) & test(/^teardown::/)'
test-group = 'gterm-pty'

[[profile.default.overrides]]
filter = 'package(gobby-client) & binary(suite) & test(/^frame_source_live::/)'
test-group = 'gterm-pty'
slow-timeout = { period = "120s", terminate-after = 3 }
