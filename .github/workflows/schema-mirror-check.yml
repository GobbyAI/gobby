name: Schema Mirror Check

on:
  pull_request:
    paths:
      - ".github/workflows/schema-mirror-check.yml"
      - "schemas/**"
      - "crates/ghook/schemas/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Compare Mirrored Schemas
        run: |
          set -euo pipefail

          for file in inbox-envelope.v1.schema.json diagnose-output.v2.schema.json; do
            local_sha="$(sha256sum "schemas/${file}" | awk '{print $1}')"
            source_sha="$(sha256sum "crates/ghook/schemas/${file}" | awk '{print $1}')"

            if [[ "$local_sha" != "$source_sha" ]]; then
              echo "Schema mirror drift detected for ${file}"
              echo "  local:  ${local_sha}"
              echo "  source: ${source_sha}"
              exit 1
            fi
          done
          echo "All schemas verified successfully"
