name: CI

on:
  push:
    branches: [main, "0.4.9"]
    tags:
      - "v*"
      - "ci-*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      requires_full_ci: ${{ steps.classify.outputs.requires_full_ci }}
      schemas_changed: ${{ steps.classify.outputs.schemas_changed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.1, audited for persist-credentials=false
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          requires_full_ci=false
          schemas_changed=false

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            requires_full_ci=true
          else
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
            fi

            if [[ -z "${base:-}" || -z "${head:-}" || "$base" =~ ^0+$ ]]; then
              requires_full_ci=true
            else
              if ! git diff --name-only "$base" "$head" > changed-files.txt; then
                echo "::warning::Could not diff $base..$head; running full CI"
                requires_full_ci=true
              elif [[ ! -s changed-files.txt ]]; then
                requires_full_ci=true
              else
                while IFS= read -r file; do
                  case "$file" in
                    schemas/*)
                      schemas_changed=true
                      ;;
                  esac

                  case "$file" in
                    *.md|docs/*|LICENSE*|.gobby/*|.github/ISSUE_TEMPLATE/*|.github/CODEOWNERS|.github/coderabbit.yaml)
                      ;;
                    *)
                      requires_full_ci=true
                      ;;
                  esac
                done < changed-files.txt
              fi
            fi
          fi

          echo "requires_full_ci=$requires_full_ci" >> "$GITHUB_OUTPUT"
          echo "schemas_changed=$schemas_changed" >> "$GITHUB_OUTPUT"
          {
            echo "requires_full_ci=$requires_full_ci"
            echo "schemas_changed=$schemas_changed"
          } >> "$GITHUB_STEP_SUMMARY"

  # Actions are major-version pinned so Dependabot and branch protection can
  # carry security updates without manual SHA digest churn on every workflow.
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.requires_full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check src/

      - name: Run ruff format check
        run: uv run ruff format --check src/

  lint-frontend:
    name: Lint (Frontend)
    needs: changes
    if: needs.changes.outputs.requires_full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run ESLint
        run: npm run lint
        working-directory: web

  typecheck:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.requires_full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Run mypy
        run: uv run mypy src/

  typecheck-frontend:
    name: Type Check (Frontend)
    needs: changes
    if: needs.changes.outputs.requires_full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run TypeScript check
        run: npx tsc --noEmit
        working-directory: web

  test-frontend:
    name: Test (Frontend)
    needs: changes
    if: needs.changes.outputs.requires_full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run vitest with coverage
        run: npx vitest run --coverage
        working-directory: web

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: web/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.requires_full_ci == 'true'
    runs-on: ubuntu-latest
    env:
      GOBBY_POSTGRES_TEST_CONTAINER: postgres-test
      GOBBY_POSTGRES_TEST_DB: gobby_test
      GOBBY_POSTGRES_TEST_IMAGE: gobby-postgres-local:18-pgsearch
      GOBBY_POSTGRES_TEST_PASSWORD: gobby_test
      GOBBY_POSTGRES_TEST_PORT: "60892"
      GOBBY_POSTGRES_TEST_USER: gobby_test
      GOBBY_TEST_PROTECT: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Load Postgres test image metadata
        run: |
          pg_search_version="$(jq -r '.pg_search_version' src/gobby/data/postgres-pgsearch/version.json)"
          pg_search_sha256="$(jq -r '.pg_search_sha256' src/gobby/data/postgres-pgsearch/version.json)"
          database_authority="${GOBBY_POSTGRES_TEST_USER}:${GOBBY_POSTGRES_TEST_PASSWORD}"
          database_authority="${database_authority}@localhost:${GOBBY_POSTGRES_TEST_PORT}"
          database_url="postgresql://${database_authority}/${GOBBY_POSTGRES_TEST_DB}"
          test -n "$pg_search_version"
          test -n "$pg_search_sha256"
          test "$pg_search_version" != "null"
          test "$pg_search_sha256" != "null"
          {
            echo "GOBBY_PG_SEARCH_VERSION=$pg_search_version"
            echo "GOBBY_PG_SEARCH_SHA256=$pg_search_sha256"
            echo "DATABASE_URL=$database_url"
          } >> "$GITHUB_ENV"

      - name: Build Postgres test image
        run: |
          docker build \
            --build-arg PG_SEARCH_VERSION="${GOBBY_PG_SEARCH_VERSION}" \
            --build-arg PG_SEARCH_SHA256="${GOBBY_PG_SEARCH_SHA256}" \
            -t "${GOBBY_POSTGRES_TEST_IMAGE}" \
            src/gobby/data/postgres-pgsearch

      - name: Smoke Postgres audit export helper
        run: |
          docker run --rm "${GOBBY_POSTGRES_TEST_IMAGE}" \
            /usr/local/bin/pg_audit_export.sh --help

      - name: Start Postgres test container
        run: |
          docker run -d --name "${GOBBY_POSTGRES_TEST_CONTAINER}" \
            -e POSTGRES_DB="${GOBBY_POSTGRES_TEST_DB}" \
            -e POSTGRES_USER="${GOBBY_POSTGRES_TEST_USER}" \
            -e POSTGRES_PASSWORD="${GOBBY_POSTGRES_TEST_PASSWORD}" \
            -p "${GOBBY_POSTGRES_TEST_PORT}:5432" \
            --tmpfs /var/lib/postgresql \
            --health-cmd "pg_isready -U ${GOBBY_POSTGRES_TEST_USER}" \
            --health-interval 2s \
            --health-timeout 2s \
            --health-retries 15 \
            "${GOBBY_POSTGRES_TEST_IMAGE}" \
            postgres \
              -c shared_preload_libraries=pg_search,pgaudit \
              -c pgaudit.log=write \
              -c pgaudit.log_catalog=off \
              -c logging_collector=on \
              -c log_destination=stderr \
              -c log_directory=/var/log/pgaudit \
              -c log_filename=pgaudit-%Y-%m-%d_%H%M%S.log \
              -c log_rotation_age=1d \
              -c log_rotation_size=0 \
              -c log_file_mode=0640 \
              -c log_min_messages=log

          for _ in $(seq 1 30); do
            status="$(
              docker inspect -f '{{.State.Health.Status}}' "${GOBBY_POSTGRES_TEST_CONTAINER}"
            )"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done

          docker logs "${GOBBY_POSTGRES_TEST_CONTAINER}"
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest --cov=gobby --cov-report=xml --cov-report=term-missing --cov-fail-under=80 --ignore=tests/voice --ignore=tests/servers/routes/test_voice_routes.py

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  voice-extra:
    name: Voice Extra (safetensors rc0)
    needs: changes
    if: needs.changes.outputs.requires_full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install voice extra dependencies
        run: uv sync --dev --extra voice

      - name: Run focused voice tests
        run: uv run pytest tests/voice tests/servers/routes/test_voice_routes.py

  security:
    name: Security Scan
    needs: changes
    if: needs.changes.outputs.requires_full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Run bandit (SAST)
        run: uv run bandit -c pyproject.toml -r src/

      - name: Run pip-audit (dependency CVEs)
        # CVE-2025-69872: diskcache 5.6.3 (transitive via litellm) - no fix available
        # CVE-2026-4539: pygments 2.19.2 (2.19.2 is latest) - no fix available
        run: >
          uv run pip-audit
          --ignore-vuln CVE-2025-69872
          --ignore-vuln CVE-2026-4539



  build:
    name: Build Package
    needs: changes
    if: needs.changes.outputs.requires_full_ci == 'true'
    runs-on: ubuntu-latest
    env:
      GOBBY_POSTGRES_TEST_CONTAINER: postgres-test
      GOBBY_POSTGRES_TEST_DB: gobby_test
      GOBBY_POSTGRES_TEST_IMAGE: gobby-postgres-local:18-pgsearch
      GOBBY_POSTGRES_TEST_PASSWORD: gobby_test
      GOBBY_POSTGRES_TEST_PORT: "60892"
      GOBBY_POSTGRES_TEST_USER: gobby_test
    steps:
      - uses: actions/checkout@v4

      - name: Load Postgres test image metadata
        run: |
          pg_search_version="$(jq -r '.pg_search_version' src/gobby/data/postgres-pgsearch/version.json)"
          pg_search_sha256="$(jq -r '.pg_search_sha256' src/gobby/data/postgres-pgsearch/version.json)"
          database_authority="${GOBBY_POSTGRES_TEST_USER}:${GOBBY_POSTGRES_TEST_PASSWORD}"
          database_authority="${database_authority}@localhost:${GOBBY_POSTGRES_TEST_PORT}"
          database_url="postgresql://${database_authority}/${GOBBY_POSTGRES_TEST_DB}"
          test -n "$pg_search_version"
          test -n "$pg_search_sha256"
          test "$pg_search_version" != "null"
          test "$pg_search_sha256" != "null"
          {
            echo "GOBBY_PG_SEARCH_VERSION=$pg_search_version"
            echo "GOBBY_PG_SEARCH_SHA256=$pg_search_sha256"
            echo "DATABASE_URL=$database_url"
          } >> "$GITHUB_ENV"

      - name: Build Postgres test image
        run: |
          docker build \
            --build-arg "PG_SEARCH_VERSION=${GOBBY_PG_SEARCH_VERSION}" \
            --build-arg "PG_SEARCH_SHA256=${GOBBY_PG_SEARCH_SHA256}" \
            -t "${GOBBY_POSTGRES_TEST_IMAGE}" \
            src/gobby/data/postgres-pgsearch

      - name: Smoke Postgres audit export helper
        run: |
          docker run --rm "${GOBBY_POSTGRES_TEST_IMAGE}" \
            /usr/local/bin/pg_audit_export.sh --help

      - name: Start Postgres test container
        run: |
          docker rm -f "${GOBBY_POSTGRES_TEST_CONTAINER}" >/dev/null 2>&1 || true
          docker run -d --name "${GOBBY_POSTGRES_TEST_CONTAINER}" \
            -e POSTGRES_DB="${GOBBY_POSTGRES_TEST_DB}" \
            -e POSTGRES_USER="${GOBBY_POSTGRES_TEST_USER}" \
            -e POSTGRES_PASSWORD="${GOBBY_POSTGRES_TEST_PASSWORD}" \
            -p "${GOBBY_POSTGRES_TEST_PORT}:5432" \
            --tmpfs /var/lib/postgresql \
            --health-cmd "pg_isready -U ${GOBBY_POSTGRES_TEST_USER}" \
            --health-interval 2s \
            --health-timeout 2s \
            --health-retries 15 \
            "${GOBBY_POSTGRES_TEST_IMAGE}" \
            postgres \
              -c shared_preload_libraries=pg_search,pgaudit \
              -c pgaudit.log=write \
              -c pgaudit.log_catalog=off \
              -c logging_collector=on \
              -c log_destination=stderr \
              -c log_directory=/var/log/pgaudit \
              -c log_filename=pgaudit-%Y-%m-%d_%H%M%S.log \
              -c log_rotation_age=1d \
              -c log_rotation_size=0 \
              -c log_file_mode=0640 \
              -c log_min_messages=log

          for _ in $(seq 1 30); do
            status="$(
              docker inspect -f '{{.State.Health.Status}}' "${GOBBY_POSTGRES_TEST_CONTAINER}"
            )"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done

          docker logs "${GOBBY_POSTGRES_TEST_CONTAINER}"
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Check package contents
        run: |
          uv run python -c "
          import glob, tarfile, zipfile
          sdists = glob.glob('dist/gobby-*.tar.gz')
          wheels = glob.glob('dist/gobby-*.whl')
          if not sdists:
              raise FileNotFoundError('No dist/gobby-*.tar.gz found')
          if not wheels:
              raise FileNotFoundError('No dist/gobby-*.whl found')
          t = tarfile.open(sdists[0])
          print('\\n'.join(t.getnames()[:20]))
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          if 'gobby/ui/web/dist/index.html' not in names:
              raise FileNotFoundError('Wheel missing gobby/ui/web/dist/index.html')
          "

      - name: Smoke installed wheel UI
        run: |
          wheel="$(find dist -maxdepth 1 -name 'gobby-*.whl' -print -quit)"
          test -n "$wheel"
          uv sync --dev
          GOBBY_TEST_PROTECT=1 GOBBY_RUN_WHEEL_UI_SMOKE=1 GOBBY_WHEEL_PATH="$wheel" \
            uv run pytest tests/packaging/test_installed_wheel_ui_smoke.py -v

  schema-mirror:
    name: Schema Mirror
    needs: changes
    if: needs.changes.outputs.schemas_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate SOURCE_COMMIT
        run: |
          set -euo pipefail
          source_commit="$(tr -d '\n' < schemas/SOURCE_COMMIT)"
          if ! printf '%s' "$source_commit" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "schemas/SOURCE_COMMIT must contain a bare 40-character hex SHA"
            exit 1
          fi
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"

      - name: Compare Mirrored Schemas
        run: |
          set -euo pipefail
          base_url="https://raw.githubusercontent.com/GobbyAI/gobby-cli/${SOURCE_COMMIT}/crates/ghook/schemas"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          shopt -s nullglob
          schema_files=(schemas/*.schema.json)
          if [[ "${#schema_files[@]}" -eq 0 ]]; then
            echo "No schema files found under schemas/*.schema.json"
            exit 1
          fi

          for local_file in "${schema_files[@]}"; do
            file="$(basename "$local_file")"
            url="${base_url}/${file}"
            if ! curl_error="$(curl -fSL --show-error "$url" -o "${tmp_dir}/${file}" 2>&1)"; then
              echo "Failed to fetch ${url}: ${curl_error}"
              exit 1
            fi

            local_sha="$(sha256sum "$local_file" | awk '{print $1}')"
            remote_sha="$(sha256sum "${tmp_dir}/${file}" | awk '{print $1}')"

            if [[ "$local_sha" != "$remote_sha" ]]; then
              echo "Schema mirror drift detected for ${file}"
              echo "  local:  ${local_sha}"
              echo "  remote: ${remote_sha}"
              exit 1
            fi
          done
          echo "All schemas verified successfully"

  merge-gate:
    name: Merge Gate
    needs:
      - changes
      - lint
      - lint-frontend
      - typecheck
      - typecheck-frontend
      - test-frontend
      - test
      - voice-extra
      - security
      - build
      - schema-mirror
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check gated jobs
        shell: bash
        run: |
          set -euo pipefail

          failures=0
          requires_full_ci="${{ needs.changes.outputs.requires_full_ci }}"
          schemas_changed="${{ needs.changes.outputs.schemas_changed }}"

          check_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::${name} ended with result: ${result}"
              failures=$((failures + 1))
            fi
          }

          check_success "Classify Changes" "${{ needs.changes.result }}"

          if [[ "$requires_full_ci" == "true" ]]; then
            check_success "Lint" "${{ needs.lint.result }}"
            check_success "Lint (Frontend)" "${{ needs['lint-frontend'].result }}"
            check_success "Type Check" "${{ needs.typecheck.result }}"
            check_success "Type Check (Frontend)" "${{ needs['typecheck-frontend'].result }}"
            check_success "Test (Frontend)" "${{ needs['test-frontend'].result }}"
            check_success "Test (Python)" "${{ needs.test.result }}"
            check_success "Voice Extra" "${{ needs['voice-extra'].result }}"
            check_success "Security Scan" "${{ needs.security.result }}"
            check_success "Build Package" "${{ needs.build.result }}"
          fi

          if [[ "$schemas_changed" == "true" ]]; then
            check_success "Schema Mirror" "${{ needs['schema-mirror'].result }}"
          fi

          if [[ "$requires_full_ci" != "true" && "$schemas_changed" != "true" ]]; then
            echo "Lightweight change set; full CI skipped."
          fi

          if [[ "$failures" -gt 0 ]]; then
            exit 1
          fi
