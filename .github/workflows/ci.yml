name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gobby/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gobby/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check src/

      - name: Run ruff format check
        run: uv run ruff format --check src/

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run ESLint
        run: npm run lint
        working-directory: web

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Run mypy
        run: uv run mypy src/

  typecheck-frontend:
    name: Type Check (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run TypeScript check
        run: npx tsc --noEmit
        working-directory: web

  test-frontend:
    name: Test (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run vitest with coverage
        run: npx vitest run --coverage
        working-directory: web

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: web/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      GOBBY_POSTGRES_TEST_CONTAINER: postgres-test
      GOBBY_POSTGRES_TEST_DB: gobby_test
      GOBBY_POSTGRES_TEST_IMAGE: gobby-postgres-local:17-pgsearch
      GOBBY_POSTGRES_TEST_PASSWORD: gobby_test
      GOBBY_POSTGRES_TEST_PORT: "60892"
      GOBBY_POSTGRES_TEST_USER: gobby_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Load Postgres test image metadata
        run: |
          pg_search_version="$(jq -r '.pg_search_version' src/gobby/data/postgres-pgsearch/version.json)"
          pg_search_sha256="$(jq -r '.pg_search_sha256' src/gobby/data/postgres-pgsearch/version.json)"
          database_authority="${GOBBY_POSTGRES_TEST_USER}:${GOBBY_POSTGRES_TEST_PASSWORD}"
          database_authority="${database_authority}@localhost:${GOBBY_POSTGRES_TEST_PORT}"
          database_url="postgresql://${database_authority}/${GOBBY_POSTGRES_TEST_DB}"
          test -n "$pg_search_version"
          test -n "$pg_search_sha256"
          test "$pg_search_version" != "null"
          test "$pg_search_sha256" != "null"
          {
            echo "GOBBY_PG_SEARCH_VERSION=$pg_search_version"
            echo "GOBBY_PG_SEARCH_SHA256=$pg_search_sha256"
            echo "DATABASE_URL=$database_url"
          } >> "$GITHUB_ENV"

      - name: Build Postgres test image
        run: |
          docker build \
            --build-arg PG_SEARCH_VERSION="${GOBBY_PG_SEARCH_VERSION}" \
            --build-arg PG_SEARCH_SHA256="${GOBBY_PG_SEARCH_SHA256}" \
            -t "${GOBBY_POSTGRES_TEST_IMAGE}" \
            src/gobby/data/postgres-pgsearch

      - name: Smoke Postgres audit export helper
        run: |
          docker run --rm "${GOBBY_POSTGRES_TEST_IMAGE}" \
            /usr/local/bin/pg_audit_export.sh --help

      - name: Start Postgres test container
        run: |
          docker run -d --name "${GOBBY_POSTGRES_TEST_CONTAINER}" \
            -e POSTGRES_DB="${GOBBY_POSTGRES_TEST_DB}" \
            -e POSTGRES_USER="${GOBBY_POSTGRES_TEST_USER}" \
            -e POSTGRES_PASSWORD="${GOBBY_POSTGRES_TEST_PASSWORD}" \
            -p "${GOBBY_POSTGRES_TEST_PORT}:5432" \
            --tmpfs /var/lib/postgresql/data \
            --health-cmd "pg_isready -U ${GOBBY_POSTGRES_TEST_USER}" \
            --health-interval 2s \
            --health-timeout 2s \
            --health-retries 15 \
            "${GOBBY_POSTGRES_TEST_IMAGE}" \
            postgres \
              -c shared_preload_libraries=pg_search,pgaudit \
              -c pgaudit.log=write \
              -c pgaudit.log_catalog=off \
              -c logging_collector=on \
              -c log_destination=stderr \
              -c log_directory=/var/log/pgaudit \
              -c log_filename=pgaudit-%Y-%m-%d_%H%M%S.log \
              -c log_rotation_age=1d \
              -c log_rotation_size=0 \
              -c log_file_mode=0640 \
              -c log_min_messages=log

          for _ in $(seq 1 30); do
            status="$(
              docker inspect -f '{{.State.Health.Status}}' "${GOBBY_POSTGRES_TEST_CONTAINER}"
            )"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done

          docker logs "${GOBBY_POSTGRES_TEST_CONTAINER}"
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest --cov=gobby --cov-report=xml --cov-report=term-missing --cov-fail-under=80 --ignore=tests/voice --ignore=tests/servers/routes/test_voice_routes.py --deselect tests/hooks/test_hooks_context.py::test_session_start_context_injection

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  voice-extra:
    name: Voice Extra (safetensors rc0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install voice extra dependencies
        run: uv sync --dev --extra voice

      - name: Run focused voice tests
        run: uv run pytest tests/voice tests/servers/routes/test_voice_routes.py

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Run bandit (SAST)
        run: uv run bandit -c pyproject.toml -r src/

      - name: Run pip-audit (dependency CVEs)
        # CVE-2025-69872: diskcache 5.6.3 (transitive via litellm) - no fix available
        # CVE-2026-4539: pygments 2.19.2 (2.19.2 is latest) - no fix available
        run: >
          uv run pip-audit
          --ignore-vuln CVE-2025-69872
          --ignore-vuln CVE-2026-4539



  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Check package contents
        run: |
          uv run python -c "
          import glob, tarfile, zipfile
          sdists = glob.glob('dist/gobby-*.tar.gz')
          wheels = glob.glob('dist/gobby-*.whl')
          if not sdists:
              raise FileNotFoundError('No dist/gobby-*.tar.gz found')
          if not wheels:
              raise FileNotFoundError('No dist/gobby-*.whl found')
          t = tarfile.open(sdists[0])
          print('\\n'.join(t.getnames()[:20]))
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          if 'gobby/ui/web/dist/index.html' not in names:
              raise FileNotFoundError('Wheel missing gobby/ui/web/dist/index.html')
          "

      - name: Smoke installed wheel UI
        run: |
          wheel="$(ls dist/gobby-*.whl | head -n 1)"
          uv sync --dev
          GOBBY_TEST_PROTECT=1 GOBBY_RUN_WHEEL_UI_SMOKE=1 GOBBY_WHEEL_PATH="$wheel" \
            uv run pytest tests/packaging/test_installed_wheel_ui_smoke.py -v
