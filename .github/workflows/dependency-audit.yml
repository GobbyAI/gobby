name: Dependency Audit

on:
  schedule:
    - cron: '0 9 1 * *'  # Monthly on the 1st at 09:00 UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read

jobs:
  audit:
    name: Check Dependency CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Run uv audit
        # [tool.uv.audit] contains only conditional no-fix exceptions; each
        # exception becomes reportable automatically when OSV publishes a fix.
        run: uv audit --locked --preview-features audit-command
