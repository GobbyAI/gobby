name: Dependency Audit

on:
  schedule:
    - cron: '0 9 1 * *'  # Monthly on the 1st at 09:00 UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read

jobs:
  audit:
    name: Check Dependency CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Run uv audit
        # [tool.uv.audit] contains only conditional no-fix exceptions; each
        # exception becomes reportable automatically when OSV publishes a fix.
        run: uv audit --locked --preview-features audit-command
