name: Terminal Parity Weekly

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-parity-weekly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GOBBY_TEST_PROTECT: "1"
  GOBBY_POSTGRES_TEST_CONTAINER: postgres-test
  GOBBY_POSTGRES_TEST_DB: gobby_test
  GOBBY_POSTGRES_TEST_IMAGE: gobby-postgres-local:18-pgsearch
  GOBBY_POSTGRES_TEST_PASSWORD: gobby_test
  GOBBY_POSTGRES_TEST_PORT: "60892"
  GOBBY_POSTGRES_TEST_USER: gobby_test

jobs:
  parity:
    name: Parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    env:
      PACKAGE_INSTALL_RESULT: unknown
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Cache cargo registry & build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-terminal-parity-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-terminal-parity-

      - name: Setup Zig 0.15.2
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: "0.15.2"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Install tmux (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Setup Docker on macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install docker colima
          colima start --cpu 3 --memory 6 --disk 40

      - name: Load Postgres test image metadata
        run: |
          set -euo pipefail
          pg_search_version="$(jq -r '.pg_search_version' src/gobby/data/postgres-pgsearch/version.json)"
          pg_search_sha256="$(jq -r '.pg_search_sha256' src/gobby/data/postgres-pgsearch/version.json)"
          database_authority="${GOBBY_POSTGRES_TEST_USER}:${GOBBY_POSTGRES_TEST_PASSWORD}"
          database_authority="${database_authority}@localhost:${GOBBY_POSTGRES_TEST_PORT}"
          database_url="postgresql://${database_authority}/${GOBBY_POSTGRES_TEST_DB}"
          test -n "$pg_search_version"
          test -n "$pg_search_sha256"
          test "$pg_search_version" != "null"
          test "$pg_search_sha256" != "null"
          {
            echo "GOBBY_PG_SEARCH_VERSION=$pg_search_version"
            echo "GOBBY_PG_SEARCH_SHA256=$pg_search_sha256"
            echo "DATABASE_URL=$database_url"
          } >> "$GITHUB_ENV"

      - name: Build Postgres test image
        run: |
          docker build \
            --build-arg PG_SEARCH_VERSION="${GOBBY_PG_SEARCH_VERSION}" \
            --build-arg PG_SEARCH_SHA256="${GOBBY_PG_SEARCH_SHA256}" \
            -t "${GOBBY_POSTGRES_TEST_IMAGE}" \
            src/gobby/data/postgres-pgsearch

      - name: Start Postgres test container
        run: |
          set -euo pipefail
          docker rm -f "${GOBBY_POSTGRES_TEST_CONTAINER}" >/dev/null 2>&1 || true
          docker run -d --name "${GOBBY_POSTGRES_TEST_CONTAINER}" \
            -e POSTGRES_DB="${GOBBY_POSTGRES_TEST_DB}" \
            -e POSTGRES_USER="${GOBBY_POSTGRES_TEST_USER}" \
            -e POSTGRES_PASSWORD="${GOBBY_POSTGRES_TEST_PASSWORD}" \
            -p "${GOBBY_POSTGRES_TEST_PORT}:5432" \
            --tmpfs /var/lib/postgresql:rw,size=3g,nr_inodes=6000000 \
            --health-cmd "pg_isready -U ${GOBBY_POSTGRES_TEST_USER}" \
            --health-interval 2s \
            --health-timeout 2s \
            --health-retries 15 \
            "${GOBBY_POSTGRES_TEST_IMAGE}" \
            postgres \
              -c shared_preload_libraries=pg_search,pgaudit \
              -c pgaudit.log=write \
              -c pgaudit.log_catalog=off
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "${GOBBY_POSTGRES_TEST_CONTAINER}")"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs "${GOBBY_POSTGRES_TEST_CONTAINER}"
          exit 1

      - name: Build gdaemon and gterm (vt-engine)
        run: |
          set -euo pipefail
          cargo build -p gobby-daemon
          cargo build -p gobby-terminal --features vt-engine --bin gterm
          echo "GOBBY_NATIVE_BIN_DIR=${GITHUB_WORKSPACE}/target/debug" >> "$GITHUB_ENV"
          echo "${GITHUB_WORKSPACE}/target/debug" >> "$GITHUB_PATH"

      - name: 5.1 runtime contract suite
        run: GOBBY_TEST_PROTECT=1 uv run pytest tests/terminals/test_runtime_contract.py -v

      - name: 5.2 external-session discovery e2e
        run: GOBBY_TEST_PROTECT=1 uv run pytest tests/e2e/test_external_terminal_attach.py -v

      - name: 4.3 web-proxy focused tests
        run: |
          GOBBY_TEST_PROTECT=1 uv run pytest \
            tests/servers/test_native_web_proxy.py \
            tests/servers/test_web_tmux_through_host.py \
            -v

      - name: 3.6 cargo package smokes
        run: |
          set -euo pipefail
          cargo package -p gobby-terminal --list --no-verify > /tmp/gobby-terminal-package.list
          cargo package -p gobby-client --list --no-verify > /tmp/gobby-client-package.list
          cargo package -p gobby-terminal --no-verify
          cargo package -p gobby-client --no-verify

      - name: 3.6 installer fallback-chain package-install smoke
        run: |
          set -euo pipefail
          GOBBY_TEST_PROTECT=1 uv run pytest \
            tests/cli/test_cli_install.py::test_managed_binary_install_inventory_includes_gterm_and_gclient \
            tests/cli/test_install_setup_gterm.py \
            -v
          echo "PACKAGE_INSTALL_RESULT=pass" >> "$GITHUB_ENV"

      - name: Record weekly parity evidence
        if: always()
        run: |
          set -euo pipefail
          SLOT="$(date -u +%G-W%V)"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          RESULT="${PACKAGE_INSTALL_RESULT:-unknown}"
          {
            echo "workflow_name=${GITHUB_WORKFLOW}"
            echo "weekly_slot=${SLOT}"
            echo "run_url=${RUN_URL}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "utc_timestamp=${TIMESTAMP}"
            echo "platform=${{ matrix.os }}"
            echo "package_install=${RESULT}"
          } | tee evidence.env
          {
            echo "## Terminal parity weekly evidence"
            echo ""
            echo "- workflow_name: \`${GITHUB_WORKFLOW}\`"
            echo "- weekly_slot: \`${SLOT}\`"
            echo "- run_url: ${RUN_URL}"
            echo "- commit_sha: \`${GITHUB_SHA}\`"
            echo "- utc_timestamp: \`${TIMESTAMP}\`"
            echo "- platform: \`${{ matrix.os }}\`"
            echo "- package_install: \`${RESULT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload weekly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-parity-${{ matrix.os }}-${{ github.run_id }}
          path: evidence.env
          if-no-files-found: warn
