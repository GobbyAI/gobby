name: Release

on:
  push:
    tags:
      - "v*"

# NOTE: No "test" job here. ci.yml runs the full pytest matrix on every PR
# and push to the same product tree this tag points at; re-running it on the
# tag only adds ~55min and re-rolls flaky dice (it blocked run 26053017263
# for v0.4.6). Hardening to gate publish on the tagged SHA's ci.yml
# conclusion is tracked in #14821.
jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Option 1: Trusted publishing (recommended, no token needed)
      # Just configure at https://pypi.org/manage/account/publishing/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  dispatch-homebrew-tap:
    name: Dispatch Homebrew tap update
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch tap workflow
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_DISPATCH_TOKEN is not configured; skipping tap dispatch"
            exit 0
          fi

          version="${TAG_NAME#v}"
          api_status=0
          api_response=$(gh api repos/GobbyAI/homebrew-tap/dispatches \
            --method POST \
            -f event_type=gobby-release \
            -F client_payload[tag]="$TAG_NAME" \
            -F client_payload[version]="$version" \
            -F client_payload[gobby_repo]="GobbyAI/gobby" \
            -F client_payload[helper_repo]="GobbyAI/gobby-cli" 2>&1) || api_status=$?

          if [ "$api_status" -ne 0 ]; then
            echo "::error::Failed to dispatch Homebrew tap update for ${TAG_NAME} (${version})"
            echo "gh api response:"
            printf '%s\n' "$api_response"
            exit "$api_status"
          fi

          echo "Successfully dispatched Homebrew tap update for ${TAG_NAME} (${version})"
