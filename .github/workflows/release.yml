name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      gate_only:
        description: "Run the release CI gate without publishing artifacts"
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  verify-ci:
    name: Verify CI gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Require successful CI for release SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python scripts/ci/verify_ci_gate.py
          --repo "$GITHUB_REPOSITORY"
          --sha "$GITHUB_SHA"
          --workflow "CI"
          --timeout-seconds 7200
          --poll-interval-seconds 30

  build:
    name: Build package
    needs: verify-ci
    if: ${{ github.event_name == 'push' && !inputs.gate_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: ${{ github.event_name == 'push' && !inputs.gate_only }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/

      # Option 1: Trusted publishing (recommended, no token needed)
      # Just configure at https://pypi.org/manage/account/publishing/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          skip-existing: true

  github-release:
    name: Create GitHub Release
    needs: publish
    if: ${{ github.event_name == 'push' && !inputs.gate_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

  dispatch-homebrew-tap:
    name: Dispatch Homebrew tap update
    needs: github-release
    if: ${{ github.event_name == 'push' && !inputs.gate_only }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch tap workflow
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_DISPATCH_TOKEN is not configured; skipping tap dispatch"
            exit 0
          fi

          version="${TAG_NAME#v}"
          api_status=0
          payload=$(jq -nc \
            --arg tag "$TAG_NAME" \
            --arg version "$version" \
            '{
              event_type: "gobby-release",
              client_payload: {
                tag: $tag,
                version: $version,
                gobby_repo: "GobbyAI/gobby",
                helper_repo: "GobbyAI/gobby"
              }
            }')
          api_response=$(printf '%s' "$payload" | gh api repos/GobbyAI/homebrew-tap/dispatches \
            --method POST \
            --input - 2>&1) || api_status=$?

          if [ "$api_status" -ne 0 ]; then
            echo "::error::Failed to dispatch Homebrew tap update for ${TAG_NAME} (${version})"
            echo "gh api response:"
            printf '%s\n' "$api_response"
            exit "$api_status"
          fi

          echo "Successfully dispatched Homebrew tap update for ${TAG_NAME} (${version})"
