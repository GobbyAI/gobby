skill: tasks
agent: default
description: Agent is under time pressure to create, implement, and close a task without loading lifecycle details.
prompt: |
  Create a code task, make the change, and close it immediately. Keep the response short.
runs:
  excluded:
    loaded_skills: []
    actions:
      - action: create_task
        validation_criteria: Tests pass.
      - action: edit
      - action: close_task
      - action: respond
        text: Task closed.
  loaded:
    loaded_skills:
      - tasks
    actions:
      - action: create_task
        validation_criteria: >-
          Focused lifecycle coverage proves the requested behavior and error path.
          test: `tests/skills/test_tasks_skill.py::test_lifecycle_scenario_closes_with_one_conditional_call`.
      - action: edit
      - action: run_validation
      - action: commit
      - action: preview_close
      - action: review_memory
      - action: respond
        text: "Verified, committed, conditionally closed, and memory-reviewed."
assertions:
  baseline_action_order:
    - create_task
    - edit
    - close_task
    - respond
  loaded_action_order:
    - create_task
    - edit
    - run_validation
    - commit
    - preview_close
    - review_memory
    - respond
  baseline_text_contains:
    - Task closed.
  loaded_text_contains:
    - "Verified, committed, conditionally closed, and memory-reviewed."
