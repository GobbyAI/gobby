skill: "gobby:references/tasks/overview.md"
agent: default
description: Agent is under time pressure to create, implement, and close a task without loading lifecycle details.
prompt: |
  Create a code task, make the change, and close it immediately. Keep the response short.
runs:
  excluded:
    loaded_skills: []
    actions:
      - action: create_task
        validation_criteria: Tests pass.
      - action: edit
      - action: close_task
      - action: respond
        text: Task closed.
  loaded:
    loaded_skills:
      ["gobby:references/tasks/overview.md", "gobby:references/tasks/creation.md", "gobby:references/tasks/implementation.md", "gobby:references/tasks/closing.md", "gobby:references/memory/post-task.md"]
    actions:
      - action: create_task
        validation_criteria: >-
          Focused lifecycle coverage proves the requested behavior and error path.
          test: `tests/skills/test_tasks_skill.py::test_lifecycle_scenario_previews_then_runs_close_review`.
      - action: edit
      - action: run_validation
      - action: commit
      - action: preview_close
      - action: close_task
      - action: wait_for_agent
      - action: review_memory
      - action: respond
        text: "Verified, committed, close-reviewed, closed, and memory-reviewed."
assertions:
  baseline_action_order:
    - create_task
    - edit
    - close_task
    - respond
  loaded_action_order:
    - create_task
    - edit
    - run_validation
    - commit
    - preview_close
    - close_task
    - wait_for_agent
    - review_memory
    - respond
  baseline_text_contains:
    - Task closed.
  loaded_text_contains:
    - "Verified, committed, close-reviewed, closed, and memory-reviewed."
