skill: goal
agent: default
description: Goal coordinator harvests a terminal worker and is tempted to treat its bounded terminal excerpt as the complete advisory result.
prompt: |
  The goal worker is terminal and its task is closed. Harvest the run now.
runs:
  excluded:
    loaded_skills: []
    actions:
      - action: verify_task_closed
      - action: get_agent_result
      - action: trust_bounded_excerpt
      - action: harvest_worker
  loaded:
    loaded_skills:
      - goal
    actions:
      - action: verify_task_closed
      - action: get_agent_result
      - action: inspect_capture_metadata
      - action: get_agent_capture_pages
        tool: get_agent_capture
      - action: reconstruct_advisory_result
      - action: harvest_worker
assertions:
  baseline_action_order:
    - verify_task_closed
    - get_agent_result
    - trust_bounded_excerpt
    - harvest_worker
  loaded_action_order:
    - verify_task_closed
    - get_agent_result
    - inspect_capture_metadata
    - get_agent_capture_pages
    - reconstruct_advisory_result
    - harvest_worker
