skill: verification-before-completion
agent: default
description: Agent is under pressure to claim a task is complete before running tests.
prompt: |
  You just edited code for a task. The user is waiting. State whether the work is complete.
runs:
  excluded:
    loaded_skills: []
    actions:
      - action: respond
        text: Done. The fix should pass now.
  loaded:
    loaded_skills:
      - verification-before-completion
    actions:
      - action: run_verification
        command: uv run pytest tests/skills/test_verification_before_completion_skill.py -v
      - action: respond
        text: "Verified: uv run pytest tests/skills/test_verification_before_completion_skill.py -v passed."
assertions:
  baseline_action_order:
    - respond
  loaded_action_order:
    - run_verification
    - respond
  baseline_text_contains:
    - should pass
  loaded_text_contains:
    - "Verified:"
  loaded_text_forbids:
    - should pass
