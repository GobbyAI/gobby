[project]
name = "gobby"
version = "0.5.0"
description = "The bottleneck in AI coding isn't the model: It's the babysitting. Gobby is a local daemon that turns a task into a PR across Claude Code, Codex, Droid, Grok, Qwen, and AGY. Stage dispatch, hook-time rules, progressive MCP proxy, and more. Gobby built Gobby."
readme = "README.md"
license = "FSL-1.1-ALv2"
authors = [
    { name = "Josh Wilhelmi", email = "josh@gobby.ai" }
]
keywords = ["cli", "mcp", "claude", "codex", "droid", "grok", "qwen", "agy", "daemon", "session-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=24.1.0",
    # click <8.3.3 has PYSEC-2026-2132.
    "click>=8.3.3",
    "fastapi>=0.136.0,!=0.136.3",
    "httpx[socks]>=0.27.0",
    "psutil>=6.1.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9.0",
    "regex>=2026.1.15",
    "uvicorn[standard]>=0.30.0",
    "websockets>=15.0",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.0",
    # claude-agent-sdk <0.2 drives the mcp 1.x lowlevel Server decorators that
    # mcp 2.0 removed; 0.2.144 bridges both majors (claude_agent_sdk._internal._mcp_compat).
    "claude-agent-sdk>=0.2.144",
    # Imported directly (mcp.server.mcpserver, mcp.client, mcp.types, ...), so it is a
    # first-party dependency rather than a transitive one via claude-agent-sdk. The
    # proxy targets the mcp 2.x API surface; <3 protects fresh installs from the next
    # breaking major.
    "mcp>=2.0.0,<3",
    # mcp 2.x transports speak httpx2; Gobby's HTTP transport builds the
    # httpx2.AsyncClient it hands to streamable_http_client.
    "httpx2>=2.5.0,<3",
    "wcwidth>=0.2.14",
    "tomlkit>=0.13.3",
    "msgspec>=0.20.0",
    # croniter for cron expression parsing (scheduler)
    "croniter>=6.0.0",
    "falkordb>=1.1.0",
    "jsonschema>=4.23.0",
    "faster-whisper>=1.0.0",
    "qdrant-client==1.19.0",
    # python-multipart <0.0.31 has CVE-2026-24486, CVE-2026-40347,
    # CVE-2026-42561 and later DoS advisories fixed in 0.0.30/0.0.31.
    "python-multipart>=0.0.31",
    # cryptography <50.0.0 has PYSEC-2026-3552 (PKCS#7 EnvelopedData
    # Bleichenbacher oracle). Earlier 48.0.1 also closed CVE-2026-26007,
    # CVE-2026-34073, and CVE-2026-39892.
    "cryptography>=50.0.0",
    "argon2-cffi>=23.1.0",
    "clawcare>=0.9.0",
# pyjwt <2.13.0 has 2026 advisories (transitive via mcp)
"pyjwt>=2.13.0",
    # Native SDK executors for autonomous mode
    "openai>=1.0.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-exporter-prometheus>=0.49b0",
    # LLM provider instrumentation for OpenTelemetry tracing
    "opentelemetry-instrumentation-openai>=0.34.0",
    "yake>=0.7.3",
    "chatterbox-tts",
]

[project.optional-dependencies]
email = ["aiosmtplib>=5.1.1", "aioimaplib>=1.0"]

[project.scripts]
gobby = "gobby.cli:cli"

[project.urls]
Homepage = "https://github.com/GobbyAI/gobby"
Repository = "https://github.com/GobbyAI/gobby"
Documentation = "https://github.com/GobbyAI/gobby#readme"
Issues = "https://github.com/GobbyAI/gobby/issues"

[tool.uv]
# tokenizers 0.20.3 fails to build from sdist on Python 3.14
# (missing project.version in pyproject.toml). Force >=0.21.
constraint-dependencies = [
    "tokenizers>=0.21",
    # aiosmtplib <5.1.1 permits SMTP command injection via CR/LF in addresses.
    "aiosmtplib>=5.1.1",
    # idna <3.15 has CVE-2026-45409 (transitive via HTTP clients)
    "idna>=3.15",
    # starlette <0.49.1 has CVE-2025-62727; <1.3.1 has the later GHSA;
    # keep the ASGI stack on compatible floors.
    "sse-starlette>=3.4.4",
    "starlette>=1.3.1",
    # msgpack <=1.2.0 has GHSA (high), fixed in 1.2.1 (transitive via qdrant-client).
    "msgpack>=1.2.1",
    # authlib <=1.6.11 has GHSA-r95x-qfjj-fjj2 (medium); <1.6.11 also had
    # GHSA-jj8c-mmj3-mmgv.
    "authlib>=1.6.12",
    # joserfc <1.6.8 has HMAC empty-key and unencoded-payload limit bypass advisories.
    "joserfc>=1.6.8",
    # pillow <12.3.0 has multiple 2026 advisories (transitive via the voice stack).
    "pillow>=12.3.0",
    # h2 <4.4.1 has PYSEC-2026-3628 / CVE-2026-71554 (duplicate Host header).
    "h2>=4.4.1",
    # torch <2.8.0 has GHSA-887c-mr87-cxwp; see override-dependencies below.
    "torch>=2.8.0",
]
# torch, torchaudio, setuptools, diffusers, gradio, and safetensors are pinned by
# chatterbox-tts==0.1.7 or its dependencies to vulnerable or incompatible versions,
# so constraints are unsatisfiable on their own; overrides force fixed versions and
# unify the required local voice stack. Revisit if chatterbox-tts surfaces ABI/API
# drift at runtime.
# Voice stack note (gobby-#14569): stable safetensors 0.8.0 was released on
# 2026-06-09 and resolves with chatterbox-tts==0.1.7, so keep the override on
# the stable audit floor while chatterbox keeps its exact pin.
override-dependencies = [
    # torch <2.13.0 has GHSA-rrmf-rvhw-rf47 (CVE-2025-3000, torch.jit.script memory
    # corruption). torchaudio 2.11.0 is its final release and declares no torch pin;
    # its native extension loads and runs (resample, MelSpectrogram, lfilter) against
    # torch 2.13.0, verified 2026-08-21.
    "torch==2.13.0",
    "torchaudio==2.11.0",
    # The exercised Gobby voice paths do not use the removed pkg_resources API.
    # Force the security-fixed release over stale transitive pins.
    "setuptools>=83.0.0",
    # chatterbox-tts==0.1.7 pins vulnerable voice-stack transitive versions.
    "onnx>=1.22.0",
    "transformers>=5.3.0",
    # diffusers <0.38.0 has CVE-2026-44513 (transitive via chatterbox-tts)
    "diffusers>=0.38.0",
    # chatterbox-tts==0.1.7 pins gradio==6.8.0, which keeps Starlette below
    # the audit-safe floor. Force the current compatible
    # Gradio line until chatterbox relaxes its pin.
    "gradio>=6.14.0",
    # chatterbox-tts==0.1.7 pins safetensors==0.5.3.
    "safetensors>=0.8.0",
]

[build-system]
requires = [
    "setuptools>=83.0.0", # Provides PEP 660 editable-install hooks.
    "wheel",
]
build-backend = "build_backend"
backend-path = ["."]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gobby = [
    "agents/*.mjs",
    "install/agy/**/*",
    "install/claude/**/*",
    "install/codex/**/*",
    "install/qwen/**/*",
    "install/bundled_content_manifest.json",
    "install/srt-package-lock.json",
    "install/impeccable-package-lock.json",
    "install/shared/**/*",
    "storage/schema_expected_identity.json",
    "data/**/*",
    "ui/web/dist/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "run_*_sandbox.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "-p", "no:faulthandler",  # Disable faulthandler - gitingest closes FDs during logging config
]
# Coverage is enabled explicitly in CI and pre-push scripts, not here.
# To run locally with coverage: uv run pytest --cov=gobby --cov-report=term-missing --cov-fail-under=80
markers = [
    "unit: marks tests as fast unit tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "cli: marks tests as CLI command tests",
    "skill_tdd: marks skill pressure-scenario tests",
    "no_config_protection: skip config protection for this test",
]
filterwarnings = [
    # Ignore coroutine warnings from fire-and-forget async patterns in hook/webhook code
    "ignore:coroutine .* was never awaited:RuntimeWarning",
    # Ignore Pydantic deprecation warnings from workflow loader
    "ignore:The `dict` method is deprecated:DeprecationWarning",
    # Ignore coverage module-not-measured warning
    "ignore:Module gobby was previously imported:coverage.exceptions.CoverageWarning",
    # Ignore pathspec GitWildMatchPattern deprecation (upstream dependency issue)
    "ignore:GitWildMatchPattern.*is deprecated:DeprecationWarning:pathspec",
    # Ignore ResourceWarnings from test infrastructure (coverage, unittest.mock)
    "ignore:unclosed database:ResourceWarning:coverage",
    "ignore:unclosed database:ResourceWarning:unittest.mock",
    "ignore:unclosed database:ResourceWarning",
    # Ignore fork() deprecation warning from embedded spawner tests (expected on macOS)
    "ignore:This process.*is multi-threaded.*use of fork:DeprecationWarning",
    # Ignore pkg_resources deprecation from voice dependencies (resemble-perth via chatterbox-tts)
    "ignore:pkg_resources is deprecated as an API\\.:UserWarning",
    # Ignore MCP SDK streamable_http_client deprecation (upstream)
    "ignore:Use `streamable_http_client` instead:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".archive", ".gobby", "*.yaml", "*.yml", "*.json", "*.md", "*.sh", "*.mjs", "*.txt", "*.j2", "*.sql"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "TID252", # ban relative imports from parent packages (from .. import)
    "G001",   # logging string format
    "G002",   # logging percent format
    "G003",   # logging string concatenation
    "G004",   # logging f-string
    "G010",   # deprecated logger.warn
    "G101",   # reserved LogRecord keys in extra
    "G201",   # prefer logger.exception in exception handlers
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
# Disabled: pre-commit mypy runs on individual files with different type inference,
# causing type: ignore comments needed for partial context to be flagged as unused
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
exclude = ["^build/"]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".venv", "build", "examples"]
# Skip these checks (expected patterns for local daemon/CLI tool):
# B101: assert_used (internal invariants and type checking)
# B104: hardcoded_bind_all_interfaces (intentional for local daemon)
# B108: hardcoded_tmp_directory (temp file handling)
# B105: hardcoded_password_string (false positive on empty-string guards)
# B110, B112: try_except_pass/continue (cleanup/fallback code)
# B307: eval (workflow condition evaluator with controlled globals)
# B404, B602, B603, B606, B607: subprocess/exec usage expected for CLI tool
# B608: sql_expressions (hub SQL uses parameterized queries)
# B701: jinja2 autoescape (not used for HTML)
skips = ["B101", "B104", "B105", "B108", "B110", "B112", "B307", "B404", "B602", "B603", "B606", "B607", "B608", "B701"]

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "black>=26.3.1",  # CVE-2026-32274
    "mypy>=1.8.0",
    "mutmut>=3.0.0",
    # CVE-2026-1703, CVE-2026-3219, CVE-2026-6357, PYSEC-2026-196, PYSEC-2026-3721
    "pip>=26.2",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
    # pygments <2.20.0 has CVE-2026-4539 (transitive via rich/textual)
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8.0",
    "scikit-learn>=1.5",
    "types-croniter>=6.0.0.20250809",
    "types-PyYAML>=6.0.12.12",
    "aiosmtplib>=5.1.1",
    "aioimaplib>=1.0",
    "pytest-timeout>=2.4.0",
    "types-aiofiles>=25.1.0.20260409",
]

[tool.coverage.run]
source = ["src/gobby"]
# parallel = true

[tool.mutmut]
paths_to_mutate = ["src/gobby"]
pytest_add_cli_args_test_selection = ["tests/"]
runner = "python -m pytest -q"

[tool.coverage.paths]
gobby = ["src/gobby", "*/gobby", "*/site-packages/gobby"]
tests = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
