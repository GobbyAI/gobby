[project]
name = "gobby"
version = "0.4.7"
description = "The bottleneck in AI coding isn't the model: It's the babysitting. Gobby is a local daemon that turns a task into a PR across Claude Code, Codex, Gemini, Qwen, and Droid. Stage dispatch, hook-time rules, progressive MCP proxy, and more. Gobby built Gobby."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Josh Wilhelmi", email = "josh@gobby.ai" }
]
keywords = ["cli", "mcp", "claude", "gemini", "codex", "daemon", "session-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.0",
    "anthropic>=0.75.0",
    "click>=8.1.0",
    "fastapi>=0.115.0",
    # fastmcp <3.2.0 has CVE-2025-64340, CVE-2026-27124
    "fastmcp>=3.2.0",
    "httpx>=0.27.0",
    "psutil>=6.1.0",
    "py-machineid>=0.6.0",
    "pydantic>=2.9.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=15.0",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.0",
    "claude-agent-sdk>=0.1.81",
    "wcwidth>=0.2.14",
    "tomlkit>=0.13.3",
    "tomli-w>=1.0.0",
    "msgspec>=0.20.0",
    # croniter for cron expression parsing (scheduler)
    "croniter>=6.0.0",
    "qdrant-client>=1.12.0",
    # python-multipart <0.0.27 has CVE-2026-24486, CVE-2026-40347, CVE-2026-42561
    "python-multipart>=0.0.27",
    # pygments <2.20.0 has CVE-2026-4539 (transitive via rich/textual)
    "pygments>=2.20.0",
    # cryptography <46.0.7 has CVE-2026-26007, CVE-2026-34073, CVE-2026-39892
    "cryptography>=46.0.7",
    "clawcare>=0.9.0",
    # pyjwt <2.12.0 has CVE-2026-32597 (transitive via mcp)
    "pyjwt>=2.12.0",
    # Native SDK executors for autonomous mode
    "openai>=1.0.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-exporter-prometheus>=0.49b0",
    "opentelemetry-instrumentation-logging>=0.49b0",
    "opentelemetry-semantic-conventions>=0.49b0",
    # LLM provider instrumentation for OpenTelemetry tracing
    "opentelemetry-instrumentation-anthropic>=0.34.0",
    "opentelemetry-instrumentation-openai>=0.34.0",
    "yake>=0.7.3",
]

[project.optional-dependencies]
email = ["aiosmtplib>=2.0", "aioimaplib>=1.0"]
voice = [
    "faster-whisper>=1.0.0",
    "chatterbox-tts",
]

[project.scripts]
gobby = "gobby.cli:cli"

[project.urls]
Homepage = "https://github.com/GobbyAI/gobby"
Repository = "https://github.com/GobbyAI/gobby"
Documentation = "https://github.com/GobbyAI/gobby#readme"
Issues = "https://github.com/GobbyAI/gobby/issues"

[tool.uv]
# tokenizers 0.20.3 fails to build from sdist on Python 3.14
# (missing project.version in pyproject.toml). Force >=0.21.
constraint-dependencies = [
    "tokenizers>=0.21",
    # authlib <=1.6.11 has GHSA-r95x-qfjj-fjj2 (medium); <1.6.11 also had
    # GHSA-jj8c-mmj3-mmgv. Transitive via fastmcp.
    "authlib>=1.6.12",
    # torch <2.8.0 has GHSA-887c-mr87-cxwp (medium); <2.7.1-rc1 has GHSA-3749-ghw9-m3mg (low) - see override-dependencies below
    "torch>=2.8.0",
]
# torch, torchaudio, diffusers, and safetensors are exact-pinned by
# chatterbox-tts==0.1.7 to vulnerable or incompatible versions, so constraints are
# unsatisfiable on their own; overrides force fixed versions and unify the
# voice-extra resolution. Voice extra is opt-in; revisit if chatterbox-tts
# surfaces ABI/API drift at runtime.
# Voice-extra watch note (gobby-#14569). PyPI checked 2026-05-13:
# stable latest is 0.7.0 and 0.8.0rc0 remains a pre-release, so the RC floor is intentional.
# Removal checklist:
# - confirm safetensors>=0.8.0 stable exists and resolves with chatterbox-tts==0.1.7
# - run the CI "Voice Extra (safetensors rc0)" job with uv sync --extra voice
# - run focused voice route/STT tests and update this note with the replacement date
override-dependencies = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    # diffusers <0.38.0 has CVE-2026-44513 (transitive via chatterbox-tts voice extra)
    "diffusers>=0.38.0",
    # Temporary chatterbox-tts==0.1.7 override; keep until the checklist above passes.
    "safetensors>=0.8.0rc0",
]

[build-system]
requires = [
    "setuptools>=64.0", # Provides PEP 660 editable-install hooks.
    "wheel",
]
build-backend = "build_backend"
backend-path = ["."]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gobby = [
    "install/claude/**/*",
    "install/gemini/**/*",
    "install/codex/**/*",
    "install/qwen/**/*",
    "install/bundled_content_manifest.json",
    "install/shared/**/*",
    "storage/*.sql",
    "data/*",
    "ui/web/dist/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "run_*_sandbox.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "-p", "no:faulthandler",  # Disable faulthandler - gitingest closes FDs during logging config
]
# Coverage is enabled explicitly in CI and pre-push scripts, not here.
# To run locally with coverage: uv run pytest --cov=gobby --cov-report=term-missing --cov-fail-under=80
markers = [
    "unit: marks tests as fast unit tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "cli: marks tests as CLI command tests",
    "skill_tdd: marks skill pressure-scenario tests",
    "no_config_protection: skip config protection for this test",
]
filterwarnings = [
    # Ignore coroutine warnings from fire-and-forget async patterns in hook/webhook code
    "ignore:coroutine .* was never awaited:RuntimeWarning",
    # Ignore Pydantic deprecation warnings from workflow loader
    "ignore:The `dict` method is deprecated:DeprecationWarning",
    # Ignore coverage module-not-measured warning
    "ignore:Module gobby was previously imported:coverage.exceptions.CoverageWarning",
    # Ignore pathspec GitWildMatchPattern deprecation (upstream dependency issue)
    "ignore:GitWildMatchPattern.*is deprecated:DeprecationWarning:pathspec",
    # Ignore ResourceWarnings from test infrastructure (coverage, unittest.mock)
    "ignore:unclosed database:ResourceWarning:coverage",
    "ignore:unclosed database:ResourceWarning:unittest.mock",
    "ignore:unclosed database:ResourceWarning",
    # Ignore fork() deprecation warning from embedded spawner tests (expected on macOS)
    "ignore:This process.*is multi-threaded.*use of fork:DeprecationWarning",
    # Ignore pkg_resources deprecation from optional voice dependencies (resemble-perth via chatterbox-tts)
    "ignore:pkg_resources is deprecated as an API\\.:UserWarning",
    # Ignore MCP SDK streamable_http_client deprecation (upstream)
    "ignore:Use `streamable_http_client` instead:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".archive", ".gobby", "*.yaml", "*.yml", "*.json", "*.md", "*.sh", "*.mjs", "*.txt", "*.j2", "*.sql"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "TID252", # ban relative imports from parent packages (from .. import)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
# Disabled: pre-commit mypy runs on individual files with different type inference,
# causing type: ignore comments needed for partial context to be flagged as unused
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_any_generics = false
ignore_missing_imports = true
exclude = ["^build/"]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".venv", "build", "examples"]
# Skip these checks (expected patterns for local daemon/CLI tool):
# B101: assert_used (internal invariants and type checking)
# B104: hardcoded_bind_all_interfaces (intentional for local daemon)
# B108: hardcoded_tmp_directory (temp file handling)
# B105: hardcoded_password_string (false positive on empty-string guards)
# B110, B112: try_except_pass/continue (cleanup/fallback code)
# B307: eval (workflow condition evaluator with controlled globals)
# B404, B602, B603, B606, B607: subprocess/exec usage expected for CLI tool
# B608: sql_expressions (local SQLite with parameterized queries)
# B701: jinja2 autoescape (not used for HTML)
skips = ["B101", "B104", "B105", "B108", "B110", "B112", "B307", "B404", "B602", "B603", "B606", "B607", "B608", "B701"]

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "black>=26.3.1",  # CVE-2026-32274
    "mypy>=1.8.0",
    "mutmut>=3.0.0",
    "pip>=26.1",  # CVE-2026-1703, CVE-2026-3219, CVE-2026-6357
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8.0",
    "types-croniter>=6.0.0.20250809",
    "types-PyYAML>=6.0.12.12",
    "aiosmtplib>=2.0",
    "aioimaplib>=1.0",
    "pytest-timeout>=2.4.0",
    "types-aiofiles>=25.1.0.20260409",
]

[tool.coverage.run]
source = ["src/gobby"]
# parallel = true

[tool.mutmut]
paths_to_mutate = ["src/gobby"]
pytest_add_cli_args_test_selection = ["tests/"]
runner = "python -m pytest -q"

[tool.coverage.paths]
gobby = ["src/gobby", "*/gobby", "*/site-packages/gobby"]
tests = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
