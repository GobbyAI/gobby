[project]
name = "gobby"
version = "0.3.7"
description = "A local-first daemon to unify your AI coding tools. Session tracking and handoffs across Claude Code, Gemini CLI, Qwen CLI, and Codex. An MCP proxy that discovers tools without flooding context. Task management with dependencies, validation, and TDD expansion. Agent spawning and worktree orchestration. Persistent memory, extensible workflows, and hooks."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Josh Wilhelmi", email = "josh@gobby.ai" }
]
keywords = ["cli", "mcp", "claude", "gemini", "codex", "daemon", "session-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.0",
    "anthropic>=0.75.0",
    "click>=8.1.0",
    "fastapi>=0.115.0",
    # fastmcp <3.2.0 has CVE-2025-64340, CVE-2026-27124
    "fastmcp>=3.2.0",
    "httpx>=0.27.0",
    "psutil>=6.1.0",
    "py-machineid>=0.6.0",
    "pydantic>=2.9.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=15.0",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.0",
    "claude-agent-sdk>=0.1.39",
    "wcwidth>=0.2.14",
    "tomlkit>=0.13.3",
    "tomli-w>=1.0.0",
    "msgspec>=0.20.0",
    # croniter for cron expression parsing (scheduler)
    "croniter>=6.0.0",
    "qdrant-client>=1.12.0",
    # python-multipart <0.0.26 has CVE-2026-24486, CVE-2026-40347 - pin to fixed version
    "python-multipart>=0.0.26",
    # pygments <2.20.0 has CVE-2026-4539 (transitive via rich/textual)
    "pygments>=2.20.0",
    # cryptography <46.0.7 has CVE-2026-26007, CVE-2026-34073, CVE-2026-39892
    "cryptography>=46.0.7",
    "clawcare>=0.9.0",
    # pyjwt <2.12.0 has CVE-2026-32597 (transitive via mcp)
    "pyjwt>=2.12.0",
    # Native SDK executors for autonomous mode
    "openai>=1.0.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-exporter-prometheus>=0.49b0",
    "opentelemetry-instrumentation-logging>=0.49b0",
    "opentelemetry-semantic-conventions>=0.49b0",
    # LLM provider instrumentation for OpenTelemetry tracing
    "opentelemetry-instrumentation-anthropic>=0.34.0",
    "opentelemetry-instrumentation-openai>=0.34.0",
    "yake>=0.7.3",
]

[project.optional-dependencies]
email = ["aiosmtplib>=2.0", "aioimaplib>=1.0"]
voice = [
    "faster-whisper>=1.0.0",
    "chatterbox-tts",
]

[project.scripts]
gobby = "gobby.cli:cli"

[project.urls]
Homepage = "https://github.com/GobbyAI/gobby"
Repository = "https://github.com/GobbyAI/gobby"
Documentation = "https://github.com/GobbyAI/gobby#readme"
Issues = "https://github.com/GobbyAI/gobby/issues"

[tool.uv]
# tokenizers 0.20.3 fails to build from sdist on Python 3.14
# (missing project.version in pyproject.toml). Force >=0.21.
constraint-dependencies = [
    "tokenizers>=0.21",
    # authlib <1.6.11 has GHSA-jj8c-mmj3-mmgv (transitive via fastmcp)
    "authlib>=1.6.11",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gobby = [
    "install/claude/**/*",
    "install/gemini/**/*",
    "install/codex/**/*",
    "install/qwen/**/*",
    "install/shared/**/*",
    "storage/*.sql",
    "data/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "run_*_sandbox.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "-p", "no:faulthandler",  # Disable faulthandler - gitingest closes FDs during logging config
]
# Coverage is enabled explicitly in CI and pre-push scripts, not here.
# To run locally with coverage: uv run pytest --cov=gobby --cov-report=term-missing --cov-fail-under=80
markers = [
    "unit: marks tests as fast unit tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "cli: marks tests as CLI command tests",
    "no_config_protection: skip config protection for this test",
]
filterwarnings = [
    # Ignore coroutine warnings from fire-and-forget async patterns in hook/webhook code
    "ignore:coroutine .* was never awaited:RuntimeWarning",
    # Ignore Pydantic deprecation warnings from workflow loader
    "ignore:The `dict` method is deprecated:DeprecationWarning",
    # Ignore coverage module-not-measured warning
    "ignore:Module gobby was previously imported:coverage.exceptions.CoverageWarning",
    # Ignore pathspec GitWildMatchPattern deprecation (upstream dependency issue)
    "ignore:GitWildMatchPattern.*is deprecated:DeprecationWarning:pathspec",
    # Ignore ResourceWarnings from test infrastructure (coverage, unittest.mock)
    "ignore:unclosed database:ResourceWarning:coverage",
    "ignore:unclosed database:ResourceWarning:unittest.mock",
    "ignore:unclosed database:ResourceWarning",
    # Ignore fork() deprecation warning from embedded spawner tests (expected on macOS)
    "ignore:This process.*is multi-threaded.*use of fork:DeprecationWarning",
    # Ignore third-party deprecation warnings (oletools)
    "ignore::DeprecationWarning:oletools",
    "ignore::DeprecationWarning:oletools.*",
    # Ignore upstream warnings from optional voice dependencies on Python 3.14
    "ignore:pkg_resources is deprecated as an API\\.:UserWarning",
    "ignore:Deprecated call to `pkg_resources\\.declare_namespace\\('google'\\)`:DeprecationWarning",
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    # Ignore MCP SDK streamable_http_client deprecation (upstream)
    "ignore:Use `streamable_http_client` instead:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".archive", ".gobby", "*.yaml", "*.yml", "*.json", "*.md", "*.sh", "*.mjs", "*.txt", "*.j2", "*.sql"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "TID252", # ban relative imports from parent packages (from .. import)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
# Disabled: pre-commit mypy runs on individual files with different type inference,
# causing type: ignore comments needed for partial context to be flagged as unused
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_any_generics = false
ignore_missing_imports = true
exclude = ["build"]

[[tool.mypy.overrides]]
module = "aiofiles.*"
ignore_missing_imports = true

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".venv", "build", "examples"]
# Skip these checks (expected patterns for local daemon/CLI tool):
# B101: assert_used (internal invariants and type checking)
# B104: hardcoded_bind_all_interfaces (intentional for local daemon)
# B108: hardcoded_tmp_directory (temp file handling)
# B105: hardcoded_password_string (false positive on empty-string guards)
# B110, B112: try_except_pass/continue (cleanup/fallback code)
# B307: eval (workflow condition evaluator with controlled globals)
# B404, B602, B603, B606, B607: subprocess/exec usage expected for CLI tool
# B608: sql_expressions (local SQLite with parameterized queries)
# B701: jinja2 autoescape (not used for HTML)
skips = ["B101", "B104", "B105", "B108", "B110", "B112", "B307", "B404", "B602", "B603", "B606", "B607", "B608", "B701"]

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "black>=26.3.1",  # CVE-2026-32274
    "mypy>=1.8.0",
    "pip>=26.0",  # CVE-2026-1703
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8.0",
    "types-croniter>=6.0.0.20250809",
    "types-PyYAML>=6.0.12.12",
    "aiosmtplib>=2.0",
    "aioimaplib>=1.0",
    "pytest-timeout>=2.4.0",
]

[tool.coverage.run]
source = ["src/gobby"]
# parallel = true

[tool.coverage.paths]
gobby = ["src/gobby", "*/gobby", "*/site-packages/gobby"]
tests = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
