processors:
  batch:

exporters:
  otlp_http/generic:
    endpoint: "${env:GOBBY_OTLP_ENDPOINT}"
    sending_queue:
      enabled: true
      storage: file_storage
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s

service:
  extensions: [file_storage]
  pipelines:
    logs/gobby:
      receivers:
        - file_log/daemon
        - file_log/errors
        - file_log/runtime
        - file_log/hooks
        - file_log/llm
        - file_log/mcp
        - file_log/automation
        - file_log/ui
        - file_log/parser
      processors: [batch]
      exporters: [otlp_http/generic]
