# Gobby log collection reference for otelcol-contrib 0.156.0.
# Required environment variables:
#   GOBBY_LOG_DIR
#   GOBBY_OTEL_STORAGE_DIR
#   GOBBY_OTLP_ENDPOINT

extensions:
  file_storage:
    directory: "${env:GOBBY_OTEL_STORAGE_DIR}"
    create_directory: true
    fsync: true

receivers:
  file_log/daemon:
    include: ["${env:GOBBY_LOG_DIR}/daemon.log"]
    start_at: end
    storage: file_storage
    on_truncate: read_whole_file
    include_file_name: true
    include_file_path: true
    attributes:
      gobby.log.surface: daemon
    multiline:
      line_start_pattern: '^(?:\{|\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} - )'
    operators:
      - type: json_parser
        if: 'body matches "^[[:space:]]*[{]"'
        parse_to: body
        on_error: send_quiet
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s

  file_log/errors:
    include: ["${env:GOBBY_LOG_DIR}/errors.log"]
    start_at: end
    storage: file_storage
    on_truncate: read_whole_file
    include_file_name: true
