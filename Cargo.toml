[workspace]
members = ["crates/gcode", "crates/gcore", "crates/gclient", "crates/gdaemon", "crates/ghook", "crates/gterminal"]
resolver = "3"

[profile.release]
lto = true
strip = true

[profile.release.package.gobby-client]
strip = "debuginfo"

[profile.release.package.gobby-code]
opt-level = 3

[profile.release.package.gobby-daemon]
opt-level = 3

[profile.release.package.gobby-hooks]
opt-level = "z"

[patch.crates-io]
portable-pty = { path = "crates/gterminal/vendor/portable-pty" }
