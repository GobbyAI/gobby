[workspace]
members = ["crates/gcode", "crates/gcore", "crates/gclient", "crates/gdaemon", "crates/ghook", "crates/gterminal", "crates/gterminals"]
resolver = "3"

# Inherited by daemon family crates (crates/AGENTS.md, "Daemon family crates").
[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "FSL-1.1-ALv2"
repository = "https://github.com/GobbyAI/gobby"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
strip = true

[profile.release.package.gobby-client]
strip = "debuginfo"

[profile.release.package.gobby-code]
opt-level = 3

[profile.release.package.gobby-daemon]
opt-level = 3

[profile.release.package.gobby-hooks]
opt-level = "z"

# Every gterm host start hashes its own binary to pin it; unoptimized SHA-256
# over a debug gterm adds seconds to each host integration test.
[profile.dev.package.sha2]
opt-level = 3

[patch.crates-io]
portable-pty = { path = "crates/gterminal/vendor/portable-pty" }
