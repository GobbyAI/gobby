name: crew-control
type: pipeline
version: "1.0"
description: |
  Relaunch Crew control seats from the current project roster.
  Workspace must already exist. This launches fresh sessions; use seats to
  relaunch only missing seats, because another run duplicates live seats.
  First selected seat opens a tab; later seats split the previous selected pane.
tags: [runbook]
resume_on_restart: true

inputs:
  workspace:
    type: string
    required: true
    description: "Existing target workspace"
  seats:
    type: string
    default: "seat_15070,seat_14972,seat_15379,seat_15380,seat_15406,seat_15407"
    description: "Comma-separated seat IDs; any nonempty subset"
  main_checkout:
    type: string
    default: "/Users/josh/Projects/gobby"
  codex_model:
    type: string
    default: null
  codex_effort:
    type: string
    default: null

steps:
  - id: guard
    mcp:
      server: gobby-agents
      tool: check_runbook_seats
      arguments:
        workspace: "${{ inputs.workspace }}"
        requested: "${{ inputs.seats }}"
        catalogue:
          - name: seat_15070
            title: "Assistant"
            agent: developer
          - name: seat_14972
            title: "Orchestrator"
            agent: developer
          - name: seat_15379
            title: "Monitor"
            agent: developer
          - name: seat_15380
            title: "Archivist"
            agent: developer
          - name: seat_15406
            title: "Merge Manager"
            agent: developer
          - name: seat_15407
            title: "Inbox Manager"
            agent: developer

  - id: seat_15070
    condition: "${{ 'seat_15070' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: developer
        provider: claude
        model: "claude-opus-5-5"
        reasoning_effort: "high"
        execution_mode: interactive
        checkout_mode: none
        project_path: "${{ inputs.main_checkout }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Assistant. Your current session ref is fresh; read /Users/josh/Projects/gobby/.gobby/roles/_common.md first, then /Users/josh/Projects/gobby/.gobby/roles/assistant.md and follow that role. Explicit lane assignment: Crew control; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and any SRT denial. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: "${{ {'tab': {'workspace': inputs.workspace, 'title': \"Crew control\"}} }}"

  - id: seat_14972
    condition: "${{ 'seat_14972' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: developer
        provider: claude
        model: "claude-opus-5-5"
        reasoning_effort: "xhigh"
        execution_mode: interactive
        checkout_mode: none
        project_path: "${{ inputs.main_checkout }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Orchestrator. Your current session ref is fresh; read /Users/josh/Projects/gobby/.gobby/roles/_common.md first, then /Users/josh/Projects/gobby/.gobby/roles/orchestrator.md and follow that role. Explicit lane assignment: Crew control; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and any SRT denial. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: "${{ {'split': {'pane': steps.seat_15070.output.pane_ref, 'axis': 'right', 'title': \"Orchestrator\"}} if 'seat_15070' in inputs.seats.split(',') else ({'tab': {'workspace': inputs.workspace, 'title': \"Crew control\"}}) }}"

  - id: seat_15379
    condition: "${{ 'seat_15379' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: developer
        provider: claude
        model: "claude-opus-5-5"
        reasoning_effort: "medium"
        execution_mode: interactive
        checkout_mode: none
        project_path: "${{ inputs.main_checkout }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Monitor. Your current session ref is fresh; read /Users/josh/Projects/gobby/.gobby/roles/_common.md first, then /Users/josh/Projects/gobby/.gobby/roles/monitor.md and follow that role. Explicit lane assignment: Crew control; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and any SRT denial. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: "${{ {'split': {'pane': steps.seat_14972.output.pane_ref, 'axis': 'down', 'title': \"Monitor\"}} if 'seat_14972' in inputs.seats.split(',') else ({'split': {'pane': steps.seat_15070.output.pane_ref, 'axis': 'down', 'title': \"Monitor\"}} if 'seat_15070' in inputs.seats.split(',') else ({'tab': {'workspace': inputs.workspace, 'title': \"Crew control\"}})) }}"

  - id: seat_15380
    condition: "${{ 'seat_15380' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: developer
        provider: claude
        model: "claude-opus-5-5"
        reasoning_effort: "medium"
        execution_mode: interactive
        checkout_mode: none
        project_path: "${{ inputs.main_checkout }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Archivist. Your current session ref is fresh; read /Users/josh/Projects/gobby/.gobby/roles/_common.md first, then /Users/josh/Projects/gobby/.gobby/roles/archivist.md and follow that role. Explicit lane assignment: Crew control; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and any SRT denial. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: "${{ {'split': {'pane': steps.seat_15379.output.pane_ref, 'axis': 'right', 'title': \"Archivist\"}} if 'seat_15379' in inputs.seats.split(',') else ({'split': {'pane': steps.seat_14972.output.pane_ref, 'axis': 'right', 'title': \"Archivist\"}} if 'seat_14972' in inputs.seats.split(',') else ({'split': {'pane': steps.seat_15070.output.pane_ref, 'axis': 'right', 'title': \"Archivist\"}} if 'seat_15070' in inputs.seats.split(',') else ({'tab': {'workspace': inputs.workspace, 'title': \"Crew control\"}}))) }}"

  - id: seat_15406
    condition: "${{ 'seat_15406' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: developer
        provider: codex
        model: "${{ inputs.codex_model }}"
        reasoning_effort: "${{ inputs.codex_effort }}"
        execution_mode: interactive
        checkout_mode: none
        project_path: "${{ inputs.main_checkout }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Merge Manager. Your current session ref is fresh; read /Users/josh/Projects/gobby/.gobby/roles/_common.md first, then /Users/josh/Projects/gobby/.gobby/roles/merge-manager.md and follow that role. Explicit lane assignment: Crew control; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and any SRT denial. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: "${{ {'split': {'pane': steps.seat_15380.output.pane_ref, 'axis': 'down', 'title': \"Merge Manager\"}} if 'seat_15380' in inputs.seats.split(',') else ({'split': {'pane': steps.seat_15379.output.pane_ref, 'axis': 'down', 'title': \"Merge Manager\"}} if 'seat_15379' in inputs.seats.split(',') else ({'split': {'pane': steps.seat_14972.output.pane_ref, 'axis': 'down', 'title': \"Merge Manager\"}} if 'seat_14972' in inputs.seats.split(',') else ({'split': {'pane': steps.seat_15070.output.pane_ref, 'axis': 'down', 'title': \"Merge Manager\"}} if 'seat_15070' in inputs.seats.split(',') else ({'tab': {'workspace': inputs.workspace, 'title': \"Crew control\"}})))) }}"

  - id: seat_15407
    condition: "${{ 'seat_15407' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: developer
        provider: claude
        model: "claude-opus-5-5"
        reasoning_effort: "medium"
        execution_mode: interactive
        checkout_mode: none
        project_path: "${{ inputs.main_checkout }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Inbox Manager. Your current session ref is fresh; read /Users/josh/Projects/gobby/.gobby/roles/_common.md first, then /Users/josh/Projects/gobby/.gobby/roles/inbox-manager.md and follow that role. Explicit lane assignment: Crew control; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and any SRT denial. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: "${{ {'split': {'pane': steps.seat_15406.output.pane_ref, 'axis': 'right', 'title': \"Inbox Manager\"}} if 'seat_15406' in inputs.seats.split(',') else ({'split': {'pane': steps.seat_15380.output.pane_ref, 'axis': 'right', 'title': \"Inbox Manager\"}} if 'seat_15380' in inputs.seats.split(',') else ({'split': {'pane': steps.seat_15379.output.pane_ref, 'axis': 'right', 'title': \"Inbox Manager\"}} if 'seat_15379' in inputs.seats.split(',') else ({'split': {'pane': steps.seat_14972.output.pane_ref, 'axis': 'right', 'title': \"Inbox Manager\"}} if 'seat_14972' in inputs.seats.split(',') else ({'split': {'pane': steps.seat_15070.output.pane_ref, 'axis': 'right', 'title': \"Inbox Manager\"}} if 'seat_15070' in inputs.seats.split(',') else ({'tab': {'workspace': inputs.workspace, 'title': \"Crew control\"}}))))) }}"
