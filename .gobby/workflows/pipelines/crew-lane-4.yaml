name: crew-lane-4
type: pipeline
version: "1.0"
description: |
  Relaunch Lane 4 seats from the current project roster.
  Workspace must already exist. This launches fresh sessions; use seats to
  relaunch only missing seats, because another run duplicates live seats.
  First selected seat opens a tab; later seats split the previous selected pane.
tags: [runbook]
resume_on_restart: true

inputs:
  workspace:
    type: string
    required: true
    description: "Existing target workspace"
  seats:
    type: string
    default: "seat_15386,seat_15381,seat_15393,seat_15411,seat_15410"
    description: "Comma-separated seat IDs; any nonempty subset"
  worktree_id:
    type: string
    default: "f4954d0e-90bc-45c6-8122-7403efcce875"
    description: "Existing Lane 4 worktree; override for replacement seats"

  second_worktree_id:
    type: string
    default: "3ffdc986-7470-4434-8c2f-3ee011fe31fc"
    description: "Existing second Lane 4 worktree"

steps:
  - id: guard
    mcp:
      server: gobby-agents
      tool: check_runbook_seats
      arguments:
        workspace: "${{ inputs.workspace }}"
        requested: "${{ inputs.seats }}"
        catalogue:
          - name: seat_15386
            title: "Lane 4 manager"
            agent: developer
          - name: seat_15381
            title: "Lane 4 developer (daemon stability)"
            agent: developer
          - name: seat_15393
            title: "Lane 4 code reviewer"
            agent: developer
          - name: seat_15411
            title: "Lane 4 developer (second developer)"
            agent: developer
          - name: seat_15410
            title: "Lane 4 second code reviewer"
            agent: developer

  - id: seat_15386
    condition: "${{ 'seat_15386' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: developer
        provider: claude
        model: "claude-sonnet-5-5"
        reasoning_effort: "medium"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ inputs.worktree_id }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Lane 4 manager. Your current session ref is fresh; read /Users/josh/Projects/gobby/.gobby/roles/_common.md first, then /Users/josh/Projects/gobby/.gobby/roles/lane-manager.md and follow that role. Explicit lane assignment: Lane 4; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and any SRT denial. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: "${{ {'tab': {'workspace': inputs.workspace, 'title': \"Lane 4\"}} }}"

  - id: seat_15381
    condition: "${{ 'seat_15381' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: developer
        provider: codex
        model: "gpt-6.1-sol"
        reasoning_effort: "medium"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ inputs.worktree_id }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Lane 4 developer (daemon stability). Your current session ref is fresh; read /Users/josh/Projects/gobby/.gobby/roles/_common.md first, then /Users/josh/Projects/gobby/.gobby/roles/lane-2-stability.md and follow that role. Explicit lane assignment: Lane 4; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and any SRT denial. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: "${{ {'split': {'pane': steps.seat_15386.output.pane_ref, 'axis': 'right', 'title': \"Lane 4 developer (daemon stability)\"}} if 'seat_15386' in inputs.seats.split(',') else ({'tab': {'workspace': inputs.workspace, 'title': \"Lane 4\"}}) }}"

  - id: seat_15393
    condition: "${{ 'seat_15393' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: developer
        provider: claude
        model: "claude-opus-5-5"
        reasoning_effort: "xhigh"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ inputs.worktree_id }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Lane 4 code reviewer. Your current session ref is fresh; read /Users/josh/Projects/gobby/.gobby/roles/_common.md first, then /Users/josh/Projects/gobby/.gobby/roles/code-reviewer.md and follow that role. Explicit lane assignment: Lane 4; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and any SRT denial. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: "${{ {'split': {'pane': steps.seat_15381.output.pane_ref, 'axis': 'down', 'title': \"Lane 4 code reviewer\"}} if 'seat_15381' in inputs.seats.split(',') else ({'split': {'pane': steps.seat_15386.output.pane_ref, 'axis': 'down', 'title': \"Lane 4 code reviewer\"}} if 'seat_15386' in inputs.seats.split(',') else ({'tab': {'workspace': inputs.workspace, 'title': \"Lane 4\"}})) }}"

  - id: seat_15411
    condition: "${{ 'seat_15411' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: developer
        provider: codex
        model: "gpt-6.1-sol"
        reasoning_effort: "medium"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ inputs.second_worktree_id }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Lane 4 developer (second developer). Your current session ref is fresh; read /Users/josh/Projects/gobby/.gobby/roles/_common.md first, then /Users/josh/Projects/gobby/.gobby/roles/lane-2-stability.md and follow that role. Explicit lane assignment: Lane 4; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and any SRT denial. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: "${{ {'split': {'pane': steps.seat_15393.output.pane_ref, 'axis': 'right', 'title': \"Lane 4 developer (second developer)\"}} if 'seat_15393' in inputs.seats.split(',') else ({'split': {'pane': steps.seat_15381.output.pane_ref, 'axis': 'right', 'title': \"Lane 4 developer (second developer)\"}} if 'seat_15381' in inputs.seats.split(',') else ({'split': {'pane': steps.seat_15386.output.pane_ref, 'axis': 'right', 'title': \"Lane 4 developer (second developer)\"}} if 'seat_15386' in inputs.seats.split(',') else ({'tab': {'workspace': inputs.workspace, 'title': \"Lane 4\"}}))) }}"

  - id: seat_15410
    condition: "${{ 'seat_15410' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: developer
        provider: claude
        model: "claude-opus-5-5"
        reasoning_effort: "xhigh"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ inputs.second_worktree_id }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Lane 4 second code reviewer. Your current session ref is fresh; read /Users/josh/Projects/gobby/.gobby/roles/_common.md first, then /Users/josh/Projects/gobby/.gobby/roles/code-reviewer.md and follow that role. Explicit lane assignment: Lane 4; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and any SRT denial. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: "${{ {'split': {'pane': steps.seat_15411.output.pane_ref, 'axis': 'down', 'title': \"Lane 4 second code reviewer\"}} if 'seat_15411' in inputs.seats.split(',') else ({'split': {'pane': steps.seat_15393.output.pane_ref, 'axis': 'down', 'title': \"Lane 4 second code reviewer\"}} if 'seat_15393' in inputs.seats.split(',') else ({'split': {'pane': steps.seat_15381.output.pane_ref, 'axis': 'down', 'title': \"Lane 4 second code reviewer\"}} if 'seat_15381' in inputs.seats.split(',') else ({'split': {'pane': steps.seat_15386.output.pane_ref, 'axis': 'down', 'title': \"Lane 4 second code reviewer\"}} if 'seat_15386' in inputs.seats.split(',') else ({'tab': {'workspace': inputs.workspace, 'title': \"Lane 4\"}})))) }}"
