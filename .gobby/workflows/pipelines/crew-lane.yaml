name: crew-lane
type: pipeline
version: "1.0"
description: |
  Relaunch selected seats into an existing workspace and worktree.
  Step 1 approved by Josh: developer only. Add further roles after pilot approval.
  Launches fresh sessions; rerunning duplicates live seats. The operator runs this pipeline.
tags: [runbook]
resume_on_restart: true

inputs:
  lane:
    type: string
    default: "3"
    description: "Current lane number, overriding historical role-file headings"
  workspace:
    type: string
    required: true
    description: "Existing target workspace UUID or ref"
  worktree_id:
    type: string
    required: true
    description: "Existing target worktree UUID or prefix; no worktree is created"
  seats:
    type: string
    default: developer
    description: "Comma-separated missing seat kinds; currently developer only"
  developer_provider:
    type: string
    default: codex
  developer_model:
    type: string
    default: gpt-6.1-sol
  developer_reasoning_effort:
    type: string
    default: medium
  developer_role_file:
    type: string
    default: lane-4-runbooks.md
    description: "Role filename under the shared checkout .gobby/roles/"

steps:
  - id: guard
    mcp:
      server: gobby-agents
      tool: check_runbook_seats
      arguments:
        workspace: "${{ inputs.workspace }}"
        requested: "${{ inputs.seats }}"
        catalogue:
          - name: developer
            title: "${{ 'Lane ' + inputs.lane + ' developer' }}"
            agent: developer

  - id: developer
    condition: "${{ 'developer' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: developer
        provider: "${{ inputs.developer_provider }}"
        model: "${{ inputs.developer_model }}"
        reasoning_effort: "${{ inputs.developer_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ inputs.worktree_id }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Lane ${{ inputs.lane }} developer. Your current session ref is fresh; read /Users/josh/Projects/gobby/.gobby/roles/_common.md first, then /Users/josh/Projects/gobby/.gobby/roles/${{ inputs.developer_role_file }} and follow that role. Explicit lane assignment: Lane ${{ inputs.lane }}; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and every SRT denial you hit. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: "${{ {'tab': {'workspace': inputs.workspace, 'title': 'Lane ' + inputs.lane + ' developer'}} }}"
