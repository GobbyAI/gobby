name: crew-lane
type: pipeline
version: "1.0"
description: |
  Relaunch selected seats into an existing workspace and worktree.
  Approved seats: developer, code-reviewer, researcher and lane-manager.
  Launches fresh sessions; rerunning duplicates live seats. The operator runs this pipeline.
tags: [runbook]
resume_on_restart: true

inputs:
  lane:
    type: string
    default: "3"
    description: "Current lane number, overriding historical role-file headings"
  workspace:
    type: string
    required: true
    description: "Existing target workspace UUID or ref"
  lane_pane:
    type: string
    default: null
    description: "Existing lane pane to split; omit to open one Lane N tab for this run"
  worktree_id:
    type: string
    required: true
    description: "Existing target worktree UUID or prefix; no worktree is created"
  seats:
    type: string
    default: developer
    description: "Comma-separated missing seat kinds: developer, code-reviewer, researcher, lane-manager"
  report_to:
    type: string
    required: true
    description: "Live operator or Lane Manager session ref for readiness, blockers and unassigned waits"
  developer_provider:
    type: string
    default: codex
  developer_model:
    type: string
    default: gpt-6.1-sol
  developer_reasoning_effort:
    type: string
    default: medium
  developer_role_file:
    type: string
    default: lane-4-runbooks.md
    description: "Role filename under the shared checkout .gobby/roles/"
  reviewer_provider:
    type: string
    default: claude
  reviewer_model:
    type: string
    default: claude-opus-5-5
  reviewer_reasoning_effort:
    type: string
    default: xhigh
  reviewer_role_file:
    type: string
    default: code-reviewer.md
    description: "Role filename under the shared checkout .gobby/roles/"
  researcher_provider:
    type: string
    default: codex
  researcher_model:
    type: string
    default: gpt-6.1-sol
  researcher_reasoning_effort:
    type: string
    default: medium
  researcher_role_file:
    type: string
    default: researcher.md
    description: "Role filename under the shared checkout .gobby/roles/"
  manager_provider:
    type: string
    default: claude
  manager_model:
    type: string
    default: claude-sonnet-5-5
  manager_reasoning_effort:
    type: string
    default: medium
  manager_role_file:
    type: string
    default: lane-manager.md
    description: "Role filename under the shared checkout .gobby/roles/"

steps:
  - id: guard
    mcp:
      server: gobby-agents
      tool: check_runbook_seats
      arguments:
        workspace: "${{ inputs.workspace }}"
        requested: "${{ inputs.seats }}"
        report_to: "${{ inputs.report_to }}"
        require_report_to: true
        catalogue:
          - name: developer
            title: "${{ 'Lane ' + inputs.lane + ' developer' }}"
            agent: developer
          - name: code-reviewer
            title: "${{ 'Lane ' + inputs.lane + ' code reviewer' }}"
            agent: code-reviewer
          - name: researcher
            title: "${{ 'Lane ' + inputs.lane + ' researcher' }}"
            agent: researcher
          - name: lane-manager
            title: "${{ 'Lane ' + inputs.lane + ' manager' }}"
            agent: lane-manager

  - id: developer
    condition: "${{ 'developer' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: developer
        provider: "${{ inputs.developer_provider }}"
        model: "${{ inputs.developer_model }}"
        reasoning_effort: "${{ inputs.developer_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ inputs.worktree_id }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Lane ${{ inputs.lane }} developer. Your current session ref is fresh; read /Users/josh/Projects/gobby/.gobby/roles/_common.md first, then /Users/josh/Projects/gobby/.gobby/roles/${{ inputs.developer_role_file }} and follow that role. Explicit lane assignment: Lane ${{ inputs.lane }}; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and every SRT denial you hit. Send that report through gobby-agents:send_message(target=\"session\", target_id=\"${{ inputs.report_to }}\"). With no assigned work, wait_for_coordination(owner_session=\"${{ inputs.report_to }}\", reply=true). Use that live session for bootstrap blockers and coordination; the pipeline parent may have ended. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: >-
          ${{ {'split': {'pane': inputs.lane_pane, 'axis': 'right', 'title': 'Lane ' + inputs.lane + ' developer'}}
          if inputs.lane_pane else {'tab': {'workspace': inputs.workspace, 'title': 'Lane ' + inputs.lane}} }}

  - id: code-reviewer
    condition: "${{ 'code-reviewer' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: code-reviewer
        provider: "${{ inputs.reviewer_provider }}"
        model: "${{ inputs.reviewer_model }}"
        reasoning_effort: "${{ inputs.reviewer_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ inputs.worktree_id }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Lane ${{ inputs.lane }} code reviewer. Your current session ref is fresh; read /Users/josh/Projects/gobby/.gobby/roles/_common.md first, then /Users/josh/Projects/gobby/.gobby/roles/${{ inputs.reviewer_role_file }} and follow that role. Explicit lane assignment: Lane ${{ inputs.lane }}; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and every SRT denial you hit. Send that report through gobby-agents:send_message(target=\"session\", target_id=\"${{ inputs.report_to }}\"). With no assigned work, wait_for_coordination(owner_session=\"${{ inputs.report_to }}\", reply=true). Use that live session for bootstrap blockers and coordination; the pipeline parent may have ended. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: >-
          ${{ {'split': {'pane': inputs.lane_pane or steps.developer.output.pane_ref,
          'axis': 'right', 'title': 'Lane ' + inputs.lane + ' code reviewer'}}
          if inputs.lane_pane or 'developer' in inputs.seats.split(',')
          else {'tab': {'workspace': inputs.workspace, 'title': 'Lane ' + inputs.lane}} }}

  - id: researcher
    condition: "${{ 'researcher' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: researcher
        provider: "${{ inputs.researcher_provider }}"
        model: "${{ inputs.researcher_model }}"
        reasoning_effort: "${{ inputs.researcher_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ inputs.worktree_id }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Lane ${{ inputs.lane }} researcher. Your current session ref is fresh; read /Users/josh/Projects/gobby/.gobby/roles/_common.md first, then /Users/josh/Projects/gobby/.gobby/roles/${{ inputs.researcher_role_file }} and follow that role. Explicit lane assignment: Lane ${{ inputs.lane }}; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and every SRT denial you hit. Send that report through gobby-agents:send_message(target=\"session\", target_id=\"${{ inputs.report_to }}\"). With no assigned work, wait_for_coordination(owner_session=\"${{ inputs.report_to }}\", reply=true). Use that live session for bootstrap blockers and coordination; the pipeline parent may have ended. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: >-
          ${{ {'split': {'pane': inputs.lane_pane or
          (steps.developer.output.pane_ref if 'developer' in inputs.seats.split(',')
          else steps['code-reviewer'].output.pane_ref),
          'axis': 'right', 'title': 'Lane ' + inputs.lane + ' researcher'}}
          if inputs.lane_pane or 'developer' in inputs.seats.split(',') or 'code-reviewer' in inputs.seats.split(',')
          else {'tab': {'workspace': inputs.workspace, 'title': 'Lane ' + inputs.lane}} }}

  - id: lane-manager
    condition: "${{ 'lane-manager' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: lane-manager
        provider: "${{ inputs.manager_provider }}"
        model: "${{ inputs.manager_model }}"
        reasoning_effort: "${{ inputs.manager_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ inputs.worktree_id }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Lane ${{ inputs.lane }} manager. Your current session ref is fresh; read /Users/josh/Projects/gobby/.gobby/roles/_common.md first, then /Users/josh/Projects/gobby/.gobby/roles/${{ inputs.manager_role_file }} and follow that role. Explicit lane assignment: Lane ${{ inputs.lane }}; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and every SRT denial you hit. Send that report through gobby-agents:send_message(target=\"session\", target_id=\"${{ inputs.report_to }}\"). With no assigned work, wait_for_coordination(owner_session=\"${{ inputs.report_to }}\", reply=true). Use that live session for bootstrap blockers and coordination; the pipeline parent may have ended. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: >-
          ${{ {'split': {'pane': inputs.lane_pane or
          (steps.developer.output.pane_ref if 'developer' in inputs.seats.split(',')
          else steps['code-reviewer'].output.pane_ref if 'code-reviewer' in inputs.seats.split(',')
          else steps.researcher.output.pane_ref),
          'axis': 'right', 'title': 'Lane ' + inputs.lane + ' manager'}}
          if inputs.lane_pane or 'developer' in inputs.seats.split(',') or 'code-reviewer' in inputs.seats.split(',') or 'researcher' in inputs.seats.split(',')
          else {'tab': {'workspace': inputs.workspace, 'title': 'Lane ' + inputs.lane}} }}
