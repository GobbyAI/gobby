name: crew-lane
type: pipeline
version: "1.0"
description: |
  Relaunch selected seats into an existing workspace and worktree.
  Run with seats and lane; infer the lane manager, workspace, pane and unique idle worktree.
  Workspace names and worktree branch names are accepted as explicit overrides.
  Approved seats: developer, code-reviewer, researcher and lane-manager.
  Launches fresh sessions; rerunning duplicates live seats. The operator runs this pipeline.
tags: [runbook]
resume_on_restart: true

inputs:
  lane_columns:
    type: integer
    default: 80
    description: "Known tab content width in terminal cells; never infer from hidden PTYs"
  lane_rows:
    type: integer
    required: true
    description: "Known tab content height in terminal cells; placement refuses below an 80x12 pane floor"
  lane:
    type: string
    default: "3"
    description: "Current lane number, overriding historical role-file headings"
  workspace:
    type: string
    default: null
    description: "Workspace name, UUID or ref override; otherwise infer from the lane"
  lane_pane:
    type: string
    default: null
    description: "Pane UUID or ref override; otherwise infer from Lane N or its manager"
  worktree:
    type: string
    default: null
    description: "Worktree branch name or UUID override; otherwise require one idle lane worktree"
  seats:
    type: string
    default: developer
    description: "Comma-separated missing seat kinds: developer, code-reviewer, researcher, lane-manager"
  report_to:
    type: string
    default: null
    description: "Live report target override; otherwise use the lane manager from the shared roster"
  developer_provider:
    type: string
    default: codex
  developer_model:
    type: string
    default: gpt-6.1-sol
  developer_reasoning_effort:
    type: string
    default: medium
  developer_role_file:
    type: string
    default: lane-4-runbooks.md
    description: "Role filename under the shared checkout .gobby/roles/"
  reviewer_provider:
    type: string
    default: claude
  reviewer_model:
    type: string
    default: claude-opus-5-5
  reviewer_reasoning_effort:
    type: string
    default: xhigh
  reviewer_role_file:
    type: string
    default: code-reviewer.md
    description: "Role filename under the shared checkout .gobby/roles/"
  researcher_provider:
    type: string
    default: codex
  researcher_model:
    type: string
    default: gpt-6.1-sol
  researcher_reasoning_effort:
    type: string
    default: medium
  researcher_role_file:
    type: string
    default: researcher.md
    description: "Role filename under the shared checkout .gobby/roles/"
  manager_provider:
    type: string
    default: claude
  manager_model:
    type: string
    default: claude-sonnet-5-5
  manager_reasoning_effort:
    type: string
    default: medium
  manager_role_file:
    type: string
    default: lane-manager.md
    description: "Role filename under the shared checkout .gobby/roles/"

steps:
  - id: guard
    mcp:
      server: gobby-agents
      tool: check_runbook_seats
      arguments:
        lane: "${{ inputs.lane }}"
        workspace: "${{ inputs.workspace }}"
        lane_pane: "${{ inputs.lane_pane }}"
        worktree: "${{ inputs.worktree }}"
        requested: "${{ inputs.seats }}"
        report_to: "${{ inputs.report_to }}"
        require_report_to: true
        catalogue:
          - name: developer
            title: "${{ 'Lane ' + inputs.lane + ' developer' }}"
            agent: developer
          - name: code-reviewer
            title: "${{ 'Lane ' + inputs.lane + ' code reviewer' }}"
            agent: code-reviewer
          - name: researcher
            title: "${{ 'Lane ' + inputs.lane + ' researcher' }}"
            agent: researcher
          - name: lane-manager
            title: "${{ 'Lane ' + inputs.lane + ' manager' }}"
            agent: lane-manager

  - id: developer
    condition: "${{ 'developer' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: developer
        provider: "${{ inputs.developer_provider }}"
        model: "${{ inputs.developer_model }}"
        reasoning_effort: "${{ inputs.developer_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ steps.guard.output.worktree }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Lane ${{ inputs.lane }} developer. Your current session ref is fresh; read ${{ steps.guard.output.project_path }}/.gobby/roles/_common.md first, then ${{ steps.guard.output.project_path }}/.gobby/roles/${{ inputs.developer_role_file }} and follow that role. Explicit lane assignment: Lane ${{ inputs.lane }}; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and every SRT denial you hit. Send that report through gobby-agents:send_message(target=\"session\", target_id=\"${{ steps.guard.output.report_to }}\"). With no assigned work, wait_for_coordination(owner_session=\"${{ steps.guard.output.report_to }}\", reply=true). Use that live session for bootstrap blockers and coordination; the pipeline parent may have ended. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: >-
          ${{ {'split': {'pane': steps.guard.output.lane_pane, 'axis': 'balanced', 'columns': inputs.lane_columns, 'rows': inputs.lane_rows,
          'title': 'Lane ' + inputs.lane + ' developer'}} }}

  - id: code-reviewer
    condition: "${{ 'code-reviewer' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: code-reviewer
        provider: "${{ inputs.reviewer_provider }}"
        model: "${{ inputs.reviewer_model }}"
        reasoning_effort: "${{ inputs.reviewer_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ steps.guard.output.worktree }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Lane ${{ inputs.lane }} code reviewer. Your current session ref is fresh; read ${{ steps.guard.output.project_path }}/.gobby/roles/_common.md first, then ${{ steps.guard.output.project_path }}/.gobby/roles/${{ inputs.reviewer_role_file }} and follow that role. Explicit lane assignment: Lane ${{ inputs.lane }}; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and every SRT denial you hit. Send that report through gobby-agents:send_message(target=\"session\", target_id=\"${{ steps.guard.output.report_to }}\"). With no assigned work, wait_for_coordination(owner_session=\"${{ steps.guard.output.report_to }}\", reply=true). Use that live session for bootstrap blockers and coordination; the pipeline parent may have ended. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: >-
          ${{ {'split': {'pane': steps.guard.output.lane_pane, 'axis': 'balanced', 'columns': inputs.lane_columns, 'rows': inputs.lane_rows,
          'title': 'Lane ' + inputs.lane + ' code reviewer'}} }}

  - id: researcher
    condition: "${{ 'researcher' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: researcher
        provider: "${{ inputs.researcher_provider }}"
        model: "${{ inputs.researcher_model }}"
        reasoning_effort: "${{ inputs.researcher_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ steps.guard.output.worktree }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Lane ${{ inputs.lane }} researcher. Your current session ref is fresh; read ${{ steps.guard.output.project_path }}/.gobby/roles/_common.md first, then ${{ steps.guard.output.project_path }}/.gobby/roles/${{ inputs.researcher_role_file }} and follow that role. Explicit lane assignment: Lane ${{ inputs.lane }}; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and every SRT denial you hit. Send that report through gobby-agents:send_message(target=\"session\", target_id=\"${{ steps.guard.output.report_to }}\"). With no assigned work, wait_for_coordination(owner_session=\"${{ steps.guard.output.report_to }}\", reply=true). Use that live session for bootstrap blockers and coordination; the pipeline parent may have ended. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: >-
          ${{ {'split': {'pane': steps.guard.output.lane_pane, 'axis': 'balanced', 'columns': inputs.lane_columns, 'rows': inputs.lane_rows,
          'title': 'Lane ' + inputs.lane + ' researcher'}} }}

  - id: lane-manager
    condition: "${{ 'lane-manager' in inputs.seats.split(',') }}"
    mcp:
      server: gobby-agents
      tool: spawn_agent
      arguments:
        agent: lane-manager
        provider: "${{ inputs.manager_provider }}"
        model: "${{ inputs.manager_model }}"
        reasoning_effort: "${{ inputs.manager_reasoning_effort }}"
        execution_mode: interactive
        checkout_mode: none
        worktree_id: "${{ steps.guard.output.worktree }}"
        reserved_run_id: "${{ invocation_id }}"
        prompt: "You are Lane ${{ inputs.lane }} manager. Your current session ref is fresh; read ${{ steps.guard.output.project_path }}/.gobby/roles/_common.md first, then ${{ steps.guard.output.project_path }}/.gobby/roles/${{ inputs.manager_role_file }} and follow that role. Explicit lane assignment: Lane ${{ inputs.lane }}; use this assignment where historical role-file headings or roster refs differ. Report your current session ref, the role file you loaded, whether your agent run counts toward max_active_agents, and every SRT denial you hit. Send that report through gobby-agents:send_message(target=\"session\", target_id=\"${{ steps.guard.output.report_to }}\"). With no assigned work, wait_for_coordination(owner_session=\"${{ steps.guard.output.report_to }}\", reply=true). Use that live session for bootstrap blockers and coordination; the pipeline parent may have ended. Coordinate roster updates through the Assistant. Do not launch other seats or pipelines."
        placement: >-
          ${{ {'split': {'pane': steps.guard.output.lane_pane, 'axis': 'balanced', 'columns': inputs.lane_columns, 'rows': inputs.lane_rows,
          'title': 'Lane ' + inputs.lane + ' manager'}} }}
