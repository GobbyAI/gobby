      - type: inject_context
        delivery: on_receipt
        template: |
          ## Project Operating Policy

          - Brevity. Load `gobby-skills:get_skill(name="brevity", level="max")` at session start and after every compaction or clear, and apply it to every message and report.
          - Operator: Josh. Resolve operator delivery from communications config using channel `gobby-telegram` and `resolve_operator_conversation`; never hardcode a conversation ID.
          - Reporter cadence: status-report runs every 1800 seconds (30 minutes). UTC minute 00-29 selects full; minute 30-59 selects delta. Explicit launch mode wins. Reports include ROADMAP progress and the Story B critical path from task dependencies.
          - Consolidator first job: #23378 Everything else and its open direct children and subtrees. Route Rust proposals to #22801 Rust. Check stale candidates #23668, #23700 and #23143 against current evidence before retirement proposals. Exclude #22978 triage and its whole subtree, including #22360 post-1.0 deferrals, and all plan-expanded epic subtrees.
          - Historical role launch defaults: {{ variables.get('project_policy', {}).get('role_launch_defaults', {}) }}. Supply explicit overrides when launching these roles; bundled definitions inherit.
          - Team launch defaults: {{ variables.get('project_policy', {}).get('launch_defaults', {}) }}. The coordinator supplies these as explicit runbook inputs; bundled runbooks inherit when omitted.
          - Bundled agent definitions and runbooks remain project-agnostic. Supply lane, lane_epic, worktree and first_job as launch inputs; project facts live in this rule.
          - Integration branch: `0.5.0`. Authorized pushes run `git push origin <sha>:refs/heads/0.5.0`.
          - Lanes, in priority order. Each lane's open epic carries the `lane` label; `gobby-tasks:list_tasks(label="lane")` is the current list.
          {% for lane in variables.get('project_policy', {}).get('lanes', []) %}
            {{ lane.number }}. {{ lane.description }}
          {% endfor %}
          - Lanes 1-4 come first. A Lane 5-9 seat takes a heavy slot or close admission only when no Lane 1-4 request is waiting, and Lanes 5-9 launch in stages as load and the close backlog allow.
          - No new task outside a lane. Found work goes to the Orchestrator, which files it in the lane that owns it. Existing tasks and epics outside the lanes stay where they are.
          - Operator placements stay put. No sweep, consolidation, fold, lane move or re-parent touches #22978 (Triage: needs Josh's decision), its descendants, or a task Josh explicitly placed elsewhere without his explicit word. #22225 (Gobby Annotate) stays under #22978. Determine placement from the parent, never from a deferred-by-josh label; do not add or remove that label.
          - Lane tasks first, in every lane. Found work is filed at low priority unless it blocks a lane task or its landing; only a blocker takes a seat ahead of lane tasks. Found work that a lane task's progress resolves folds into that task.
          - One task per lane or sub-lane seat. A candidate waiting on landing, activation or a live check is still that seat's task; read-only prep is fine. A developer whose task is reviewer-LANDed and only waits on landing, activation or close may hand it off with `escalate_task` (reason "Handed off: reviewer LAND at <sha>, waiting on ...; not an operator decision. Developer closes after landing.") and claim the next task when the Orchestrator directs. After landing and the Lane Manager's release, de-escalate it and the developer closes.
          - Don't rebalance lanes. Add a developer and reviewer when a lane can take parallel work; never move tasks between lanes for load balancing. Seat moves are allowed.
          - Worktrees. Only the Orchestrator creates worktrees. Each lane has one primary worktree, `lane-N-<lane-name>`; a sub-lane seat gets `lane-N-<lane-name>-K`, and it stays with that seat. Never create a worktree per task: a seat's next task goes on a new branch cut from the `0.5.0` tip inside its own worktree (`git switch -c <branch> 0.5.0`, once the previous branch is committed and the worktree is clean). Planners write in the main checkout on `0.5.0`; reviewers review in the developer's worktree.
          - Close backlog cap: 20. The backlog is every task, across all lanes, whose candidate was sent and which is not yet closed. While it exceeds the cap, no new task is assigned; assignment resumes once it is at or under the cap. Planning tasks, tasks parked on an operator decision, and work that drives a backlog task to close don't count. Park any close that needs the operator's review and keep the lanes moving.
          - Close admission. A passing `close_task(preview=true)` checks the deterministic gates only. Wait for the Lane Manager's explicit release before `close_task(preview=false)`. On `close_review_busy`, wait for the active reviewer and the release, then retry.
          - Load. The heavy-work hold starts only after two consecutive five-minute load readings above 54; one reading, or 54 exactly, triggers nothing. It lifts after two consecutive readings below 36. No seat invents, lowers or changes a threshold, admission limit or escalation level: send any proposal to the operator through the Assistant and wait for approval. Give no load numbers unless load is breaching.
          - Heavy-run cap: 6 concurrent heavy commands (cargo build, clippy, full-crate test runs, e2e suites, benchmarks), granted by the Release Manager. Every granted cargo run sets CARGO_BUILD_JOBS=3. Skip the post-land Rust retest when the landed tree equals the reviewed merge tree. Build gclient in the same cutover cargo run.
          - Quiet hours are 04:45–06:45 CT for the Game Goblins jobs: no restarts or cutovers, and keep load low. Game Goblins jobs are never rerun.
          - Crate releases. Every crate binary release bumps that crate's `Cargo.toml` patch version by +0.0.1 and carries the `Cargo.lock` update in the release commit. A gcode release keeps `MIN_GCODE_PRUNE_BUDGET_VERSION` in `src/gobby/code_index/gcode_gateway.py` equal to the crate version; a gdaemon release updates `MANAGED_BIN_VERSION_PINS`.
          - The Assistant and the Orchestrator run in operator-opened panes. Launch the rest of a team with the bundled `team-coordination`, `team-lane` and `team-planning` runbooks.
      - type: set_variable
        delivery: on_receipt
        variable: _project_policy_injected
        value: true

  reset-project-operating-policy-on-context-loss:
    description: "Re-arm the project operating policy after context loss"
    event: session_start
    enabled: true
    # Same condition and priority as reset-seat-common-on-context-loss.
    priority: 8
    when: "event.data.get('source') in ['clear', 'compact'] or (event.data.get('source') == 'resume' and variables.get('pending_context_reset'))"
    effects:
      - type: set_variable
        variable: _project_policy_injected
        value: false
