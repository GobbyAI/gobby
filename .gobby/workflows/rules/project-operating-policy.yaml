tags: [default, seat, project-policy]

# This project's operating structure for seats: lanes, worktrees, queue caps,
# load and quiet hours. Bundled definitions carry roles only; this rule carries
# how this repository runs them. Lane focus and queues live in the open epics
# labeled `lane`.
rules:
  project-operating-policy:
    description: "Inject this project's operating policy for seats once per context epoch"
    event: turn_start
    enabled: true
    priority: 21
    when: >
      variables.get('_agent_type') in ['assistant', 'orchestrator', 'lane-manager',
        'developer', 'code-reviewer', 'researcher', 'archivist', 'log-monitor',
        'plan-writer', 'plan-enhancer', 'plan-adversary', 'inbox-manager',
        'release-manager', 'reporter', 'security-reviewer', 'debugger',
        'design-reviewer', 'recovery-steward', 'consolidator']
      and not variables.get('_project_policy_injected')
    effects:
      - type: set_variable
        variable: project_policy
        value:
          {
            "lanes": [
              {
                "number": 1,
                "name": "Lane 1: Runbooks",
                "epic": "#22691",
                "description": "Runbooks: finish runbooks as pipelines (#22691). Sub-lanes allowed."
              },
              {
                "number": 2,
                "name": "Lane 2: 1.0 Rust port",
                "epic": "#21542",
                "description": "1.0 Rust port (#21542): the Stage 1 front door (#21543), then Stage 2 and the multi-machine path, except #21555, which is Lane 3, and hub mode (#21575), which is Lane 5. Stage 2 stays blocked until Stage 1 closes. Sub-lanes allowed."
              },
              {
                "number": 3,
                "name": "Lane 3: API keys and node registration",
                "epic": "#21555",
                "description": "API keys and node registration (#21555): user-issued machine-bound keys replace the shared daemon token, plus the node channel. Part of Stage 1; split from Lane 2 by operator exception on 2026-10-11. Sub-lanes allowed."
              },
              {
                "number": 4,
                "name": "Lane 4: Rust",
                "epic": "#22801",
                "description": "Rust (#22801): non-1.0 Rust work, including Graphify parity (#22948) and the Jev decision classifier it needs. Staffed by its Lane Manager and one developer."
              },
              {
                "number": 5,
                "name": "Lane 5: Hub mode",
                "epic": "#21575",
                "description": "Hub mode (#21575). Staffed by its Lane Manager, one developer and one code reviewer; implementation waits for the operator's plan approval."
              },
              {
                "number": 6,
                "name": "Lane 6: Everything else",
                "epic": "#23378",
                "description": "Everything else (#23378): backlog consolidation and triage. The Consolidator proposes and the Orchestrator applies every task edit. Never sweep the #22978 triage subtree or plan-expanded epics."
              },
              {
                "number": 7,
                "name": "Lane 7: Stability and restart reliability",
                "epic": "#24093",
                "description": "Stability and restart reliability (#24093)."
              },
              {
                "number": 8,
                "name": "Lane 8: Client chrome and UI",
                "epic": "#24094",
                "description": "Client chrome and UI (#24094)."
              },
              {
                "number": 9,
                "name": "Lane 9: Remove gobby build",
                "epic": "#24317",
                "description": "Remove gobby build (#24317): #23341. Planning first; staffed with a Lane Manager, one developer and one reviewer after the operator approves the plan."
              }
            ],
            "integration_branch": "0.5.0",
            "operator": "Josh",
            "operator_channel": "gobby-telegram",
            "close_backlog_cap": 20,
            "heavy_run_cap": 6,
            "quiet_hours": "04:45–06:45 America/Chicago",
            "report_cadence_seconds": 1800,
            "full_report_minutes": "00-29 UTC",
            "delta_report_minutes": "30-59 UTC",
            "critical_paths": [
              "Story B"
            ],
            "role_guidance": {"reporter":"Reporter cadence: status-report runs every 1800 seconds (30 minutes). UTC minute 00-29 selects full; minute 30-59 selects delta. Explicit launch mode wins. Reports include ROADMAP progress and the Story B critical path from task dependencies.","consolidator":"Consolidator first job: #23378 Everything else and its open direct children and subtrees. Route Rust proposals to #22801 Rust. Check stale candidates #23668, #23700 and #23143 against current evidence before retirement proposals. Exclude #22978 triage and its whole subtree, including #22360 post-1.0 deferrals, and all plan-expanded epic subtrees."},
            "release_guidance": "Crate releases. Every crate binary release bumps that crate's `Cargo.toml` patch version by +0.0.1 and carries the `Cargo.lock` update in the release commit. A gcode release keeps `MIN_GCODE_PRUNE_BUDGET_VERSION` in `src/gobby/code_index/gcode_gateway.py` equal to the crate version; a gdaemon release updates `MANAGED_BIN_VERSION_PINS`.",
            "handoff_reason_template": "Handed off: reviewer LAND at <sha>, waiting on ...; not an operator decision. Developer closes after landing.",
            "launch_defaults": {
              "team-lane": {
                "developer_provider": "codex",
                "developer_model": "gpt-6.1-sol",
                "developer_reasoning_effort": "medium",
                "reviewer_provider": "claude",
                "reviewer_model": "claude-opus-5-5",
                "reviewer_reasoning_effort": "xhigh",
                "security_reviewer_provider": "codex",
                "security_reviewer_model": "gpt-6.1-sol",
                "security_reviewer_reasoning_effort": "xhigh",
                "researcher_provider": "codex",
                "researcher_model": "gpt-6.1-sol",
                "researcher_reasoning_effort": "medium",
                "manager_provider": "claude",
                "manager_model": "claude-sonnet-5-5",
                "manager_reasoning_effort": "medium"
              },
              "team-coordination": {
                "archivist_provider": "claude",
                "archivist_model": "claude-opus-5-5",
                "archivist_reasoning_effort": "medium",
                "log_monitor_provider": "claude",
                "log_monitor_model": "claude-sonnet-5-5",
                "log_monitor_reasoning_effort": "medium",
                "metrics_monitor_provider": "claude",
                "metrics_monitor_model": "claude-sonnet-5-5",
                "metrics_monitor_reasoning_effort": "medium",
                "release_manager_provider": "codex",
                "release_manager_model": "gpt-6.1-sol",
                "release_manager_reasoning_effort": "medium",
                "inbox_manager_provider": "claude",
                "recovery_steward_provider": "claude",
                "recovery_steward_model": "claude-opus-5-5",
                "recovery_steward_reasoning_effort": "high",
                "consolidator_provider": "claude",
                "consolidator_model": "claude-opus-5-5",
                "consolidator_reasoning_effort": "medium"
              },
              "team-planning": {
                "plan_writer_provider": "claude",
