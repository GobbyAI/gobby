            "spend_policy": "Operator ruling (Josh, 2026-11-10): OpenRouter spend under $10 needs no operator approval; report every known OpenRouter spend to the operator through the Assistant (amount, model and task). OpenRouter spend of $10 or more, and every other paid spend of any amount, needs operator approval first.",
