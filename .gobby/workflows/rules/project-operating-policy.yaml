version: "1.4.0"

# This project's operating structure for seats: domain roots, worktrees, launch
# defaults, tab layout, load and quiet hours. Bundled definitions carry roles
# only; this rule carries how this repository runs them. Lanes are retired
# (operator ruling, 2026-10-23); work groups under the domain roots in project_policy.roots.
# The general policy reaches every session through the default tag; the runbook
# policy reaches only definitions that select the runbook tag.
rules:
  project-operating-policy:
    description: "Inject general project operating policy for every session"
    tags: [default, project-policy]
    event: turn_start
    enabled: true
    priority: 21
    when: >
      not variables.get('_project_policy_injected')
      or variables.get('_project_policy_revision') != '{{ rule_digest }}'
    effects:
      - type: set_variable
        variable: project_policy
        value:
          {
            "roots": [
              {"epic": "#24818", "name": "Runbooks and task system", "lang": "Python", "description": "Runbooks v5 (unified dev-team, #25451), seat definitions and lifecycle, handoff and coordination, task tools, close invariants, landing and DevTeam worktrees, plus critical-path Python fixes that keep seats and the hub working."},
              {"epic": "#24819", "name": "Rust port candidates", "lang": "Python (deferred)", "description": "Leaves off the critical path. Not worked until the port unless the operator says otherwise."},
              {"epic": "#24820", "name": "Code index", "lang": "Rust", "description": "crates/gcode: indexing, freshness, evidence."},
              {"epic": "#24821", "name": "Terminal and client", "lang": "Rust", "description": "crates/gterminal* and crates/gclient: panes, host lifecycle, client UI, pane restore."},
              {"epic": "#24822", "name": "Gobby Annotate", "lang": "Web/iOS", "description": "Annotate work. #22225 stays under #22978 until the operator moves it."},
              {"epic": "#21542", "name": "Gobby 1.0", "lang": "Rust", "description": "gdaemon front door, strangler port, hub and node, including hub mode (#21575)."}
            ],
            "integration_branch": "0.5.0",
            "deferral_labels": ["deferred-by-user"],
            "security_paths": [
              "crates/gclient/src/daemon/**",
              "crates/gclient/src/app/live_loop/**",
              "crates/gclient/src/ui/dialogs.rs",
              "crates/gclient/src/ui/dialogs/**",
              "src/gobby/mcp_proxy/server.py",
              "src/gobby/mcp_proxy/services/schema_guidance.py",
              "src/gobby/mcp_proxy/services/session_context.py",
              "src/gobby/mcp_proxy/services/tool_execution.py",
              "src/gobby/mcp_proxy/services/server_resolution.py",
              "src/gobby/utils/session_context.py",
              "src/gobby/servers/auth_service.py",
              "src/gobby/servers/middleware/auth.py",
              "src/gobby/servers/routes/mcp/endpoints/request_context.py",
              "src/gobby/servers/routes/mcp/endpoints/execution.py",
              "crates/gdaemon/src/websocket/**",
              "src/gobby/workflows/workspace_read_targets.py",
              "src/gobby/workflows/condition_helpers_sessions.py",
              "src/gobby/hooks/_path_scope.py",
              "src/gobby/hooks/_normalization_shell.py",
              "src/gobby/agents/agent_workspaces.py",
              "src/gobby/agents/sandbox.py",
              "src/gobby/agents/srt_settings.py",
              "src/gobby/install/shared/workflows/rules/roles/agent-workspace-scope.yaml",
              "crates/gdaemon/src/nodes/agents/sandbox/workspace_scope.rs",
              "src/gobby/sessions/processor_stats.py",
              "src/gobby/communications/manager.py",
              "src/gobby/communications/outbound.py",
              "src/gobby/storage/communications.py",
              "src/gobby/adapters/codex_impl/cell_shell_reach.py",
              "src/gobby/adapters/codex_impl/execution_chain.py",
              "src/gobby/adapters/codex_impl/hooks_adapter.py",
              "src/gobby/adapters/codex_impl/literal_shell_calls.py",
              "src/gobby/communications/transcript_order.py",
              "src/gobby/communications/inbound.py",
              "src/gobby/communications/group_policy.py",
              "src/gobby/communications/adapters/telegram.py",
              "src/gobby/communications/adapters/telegram_inbound.py",
              "crates/gcore/assets/schema/migrations/487_comms_message_destination_key.sql",
              "src/gobby/workflows/condition_helpers_pods.py",
              "src/gobby/workflows/condition_helpers_paths.py",
              "src/gobby/agents/team_lifecycle.py",
              "src/gobby/mcp_proxy/tools/tasks/_team_progress.py",
              "src/gobby/install/shared/workflows/agents/dev-team-lead.yaml",
              "src/gobby/install/shared/workflows/rules/roles/seat-write-scope.yaml",
              "src/gobby/install/shared/workflows/rules/roles/seat-spawn-policy.yaml",
              "src/gobby/install/shared/workflows/rules/tool-hygiene/definition-mutation-authority.yaml",
              "src/gobby/install/shared/workflows/rules/tool-hygiene/workflow-cli-authority.yaml",
              "src/gobby/install/shared/workflows/rules/tool-hygiene/agent-activation-authority.yaml",
              "src/gobby/workflows/condition_helpers_spawn.py",
              "src/gobby/install/shared/workflows/rules/tool-hygiene/spawn-capability-authority.yaml"
            ],
            "operator_channel": "gobby-telegram",
            "quiet_hours": "04:00–05:00 America/Chicago daily; 04:00–06:00 on Mondays",
            "report_cadence_seconds": 1800,
            "full_report_minutes": "00-29 UTC",
            "delta_report_minutes": "30-59 UTC",
            "critical_paths": [
              "Full Rust port"
            ],
            "role_guidance": {"consolidator":"Consolidator first job: the open backlog under the current roots #24818 Runbooks and task system, #24820 Code index, #24821 Terminal and client, #24822 Gobby Annotate and #21542 Gobby 1.0. Route Rust proposals to their Rust root, #24820, #24821 or #21542. Leave #24819 Rust port candidates unworked unless the operator says otherwise. Check stale candidates against current evidence before retirement proposals. Exclude #22225 Annotate and #22978 triage and its whole subtree, including #22360 post-1.0 deferrals, and all plan-expanded epic subtrees. Also review the friction batch in #25580: propose folding each item into combined work, fixing it, or retiring it, for operator approval.","orchestrator":"1.0 path reference (operator-approved #25460): .gobby/plans/research/rust-port-order-v2-2026-10-31.md; tree plan: .gobby/plans/task-25460.md. Read by reference; do not paste.","archivist":"1.0 path reference (operator-approved #25460): .gobby/plans/research/rust-port-order-v2-2026-10-31.md; tree plan: .gobby/plans/task-25460.md. Read by reference; do not paste.","assistant":"Status reports include ROADMAP progress and the Full Rust port critical path from task dependencies. 1.0 path reference (operator-approved #25460): .gobby/plans/research/rust-port-order-v2-2026-10-31.md; tree plan: .gobby/plans/task-25460.md. Read by reference; do not paste."},
            "release_guidance": "Crate releases. Every crate binary release bumps that crate's `Cargo.toml` patch version by +0.0.1 and carries the `Cargo.lock` update in the release commit. A gcode or gdaemon release updates its pin in `MANAGED_BIN_VERSION_PINS` (`src/gobby/install/version_pins.py`); the gcode floors in `src/gobby/code_index/gcode_versions.py`, including `MIN_GCODE_PRUNE_BUDGET_VERSION`, derive from the gcode pin.",
            "handoff_reason_template": "Handed off: reviewer LAND at <sha>, waiting on ...; not an operator decision. The configured closer completes landing and closure.",
            "workspace_layout": {
              "admin": "The operator's tab holds the Assistant and Orchestrator panes only. Never place another seat in it.",
              "support": "One tab titled Support holds the support runbook's seats.",
              "dev-team": "Each DevTeam has one tab titled 'Dev Team - #<task>', holding its seats. Each pane is titled with its seat's agent definition name only.",
              "planning": "Each plan-team run's writer opens a tab titled 'Plan Team - #<task>'; the other plan-team seats split that tab.",
              "research": "Each research-team run opens one tab titled 'Research Team - #<task>' holding its Researcher and Research Reviewer."
            },
            "agent_model_defaults": {
              "assistant": {"provider": "claude", "model": "claude-opus-5-5", "reasoning_effort": "medium", "fallbacks": [{"provider": "codex", "model": "gpt-6.1-sol"}]},
              "orchestrator": {"provider": "claude", "model": "claude-opus-5-5", "reasoning_effort": "medium", "fallbacks": [{"provider": "codex", "model": "gpt-6.1-sol"}]},
              "developer": {"provider": "claude", "model": "claude-haiku-5-5", "reasoning_effort": "xhigh", "fallbacks": [{"provider": "codex", "model": "gpt-6.1-terra", "reasoning_effort": "xhigh"}]},
              "dev-team-lead": {"provider": "claude", "model": "claude-haiku-5-5", "reasoning_effort": "xhigh", "fallbacks": [{"provider": "codex", "model": "gpt-6.1-terra", "reasoning_effort": "xhigh"}]},
              "code-reviewer": {"provider": "codex", "model": "gpt-6.1-sol", "reasoning_effort": "medium", "fallbacks": [{"provider": "claude", "model": "claude-opus-5-5"}]},
              "security-auditor": {"provider": "grok", "model": "grok-4.7", "reasoning_effort": "high", "fallbacks": [{"provider": "codex", "model": "gpt-6.1-sol", "reasoning_effort": "xhigh"}, {"provider": "claude", "model": "claude-opus-5-5", "reasoning_effort": "xhigh"}]},
              "design-reviewer": {"provider": "claude", "model": "claude-opus-5-5", "reasoning_effort": "medium", "fallbacks": [{"provider": "codex", "model": "gpt-6.1-sol"}]},
              "docs-writer": {"provider": "claude", "model": "claude-opus-5-5", "reasoning_effort": "medium", "fallbacks": [{"provider": "codex", "model": "gpt-6.1-sol"}]},
              "docs-reviewer": {"provider": "codex", "model": "gpt-6.1-sol", "reasoning_effort": "medium", "fallbacks": [{"provider": "claude", "model": "claude-opus-5-5"}]},
              "plan-writer": {"provider": "claude", "model": "claude-opus-5-5", "reasoning_effort": "xhigh", "fallbacks": [{"provider": "codex", "model": "gpt-6.1-sol"}]},
              "plan-team-lead": {"provider": "claude", "model": "claude-opus-5-5", "reasoning_effort": "xhigh", "fallbacks": [{"provider": "codex", "model": "gpt-6.1-sol"}]},
              "plan-advocate": {"provider": "codex", "model": "gpt-6.1-sol", "reasoning_effort": "xhigh", "fallbacks": [{"provider": "claude", "model": "claude-opus-5-5"}]},
              "plan-adversary": {"provider": "codex", "model": "gpt-6.1-sol", "reasoning_effort": "xhigh", "fallbacks": [{"provider": "claude", "model": "claude-opus-5-5"}]},
              "researcher": {"provider": "codex", "model": "gpt-6.1-sol", "reasoning_effort": "medium", "fallbacks": [{"provider": "claude", "model": "claude-opus-5-5"}]},
              "research-reviewer": {"provider": "claude", "model": "claude-opus-5-5", "reasoning_effort": "medium", "fallbacks": [{"provider": "codex", "model": "gpt-6.1-sol"}]},
              "research-team-lead": {"provider": "claude", "model": "claude-haiku-5-5", "reasoning_effort": "xhigh", "fallbacks": [{"provider": "codex", "model": "gpt-6.1-terra", "reasoning_effort": "xhigh"}]},
              "triage": {"provider": "claude", "model": "claude-sonnet-5-5", "reasoning_effort": "medium", "fallbacks": [{"provider": "codex", "model": "gpt-6.1-terra", "reasoning_effort": "xhigh"}]},
              "recovery-steward": {"provider": "claude", "model": "claude-sonnet-5-5", "reasoning_effort": "medium", "fallbacks": [{"provider": "codex", "model": "gpt-6.1-terra", "reasoning_effort": "xhigh"}]},
              "archivist": {"provider": "claude", "model": "claude-haiku-5-5", "reasoning_effort": "medium", "fallbacks": [{"provider": "codex", "model": "gpt-6.1-terra", "reasoning_effort": "xhigh"}]},
              "consolidator": {"provider": "claude", "model": "claude-opus-5-5", "reasoning_effort": "medium", "fallbacks": [{"provider": "codex", "model": "gpt-6.1-sol"}]},
              "release-manager": {"provider": "codex", "model": "gpt-6.1-sol", "reasoning_effort": "medium", "fallbacks": [{"provider": "claude", "model": "claude-opus-5-5"}]},
              "feedback-reviewer": {"provider": "codex", "model": "gpt-6.1-sol", "reasoning_effort": "medium", "fallbacks": [{"provider": "claude", "model": "claude-opus-5-5"}]}
            },
            "default_model_denylist": ["fable", "astra", "argon", "carbon"]
          }
      - type: inject_context
        delivery: on_receipt
        template: |
          ## General Project Operating Policy
          - Read project_policy for domain roots, integration branch, operator route, quiet hours and release guidance.
          - Integration 0.5.0. Push: the operator and sessions running the default agent definition may push. Other definitions follow their runbook push policy.
          - Claim before editing; preserve foreign files and stage only owned task paths.
          - Follow TDD where applicable, focused validation and OCR self-review. Record truthful completion evidence and close with the commit SHA.
          - Direct integration commits require the active definition's capability and declared path coverage. Otherwise follow the configured landing workflow.
          - The operator alone moves protected/operator-placed tasks. Preserve the deferred-by-user label.
          - Honor project_policy.quiet_hours; read release_guidance before crate releases.
          - Friction: work around it and file it as a task under the Friction epic #25603.
      - type: set_variable
        delivery: on_receipt
        variable: _project_policy_injected
        value: true
      - type: set_variable
        delivery: on_receipt
        variable: _project_policy_revision
        value: '{{ rule_digest }}'

  runbook-seat-policy:
    description: "Inject coordination guidance for every runbook seat"
    tags: [runbook, project-policy]
    event: turn_start
    enabled: true
    priority: 22
    when: >
      not variables.get('_runbook_policy_injected')
      or variables.get('_runbook_policy_revision') != '{{ rule_digest }}'
    effects:
      - type: inject_context
        delivery: on_receipt
        template: |
          ## Project Operating Policy
          - Operator: resolve_operator_conversation(channel="gobby-telegram"); no hardcoded IDs.
          - Before routing/launch/handoff: get_variable(name="project_policy") for roots/agent_model_defaults/default_model_denylist/workspace_layout. Consolidator reads role_guidance before work. A spawn that names no model takes its agent_model_defaults entry; pass model= only to override it. Runbooks pass their required inputs only; bundles inherit, project-agnostic.
          - Integration 0.5.0. Push: the operator and sessions running the default agent definition may push. Other seats push only for the exact SHA the operator approves, and only the Orchestrator runs git push origin <sha>:refs/heads/0.5.0.
          - Critical path: the 1.0 full Rust port (#21542) in port order: runner retirement (R0-R7 under #21544), Stage 2 families, Stage 3 (#21571, #21573, #21574), then hub/node multi-machine control. #24818 carries live runbook fixes and live Python fixes such as #25272. Stage launches by load/backlog. New tasks go under their domain root; #24819 is deferred. Found work to ORCH: low unless blocking critical-path work/landing; only blockers preempt; fold findings existing work resolves.
          - The operator alone moves/sweeps/folds/reparents #22978 Triage subtree, #22225 Annotate or operator-placed tasks. Check parent; never change deferred-by-user.
          - One task/seat includes pending candidates; read-only prep allowed. Directed reviewer-LANDed waits use project_policy.handoff_reason_template; the configured closer completes landing and closure.
          - No task rebalancing; parallel work adds developer+reviewer. Seat moves allowed.
          - One tree per DevTeam task: admit_team creates it and the team's seats join it. Planners main; reviewers developer tree.
          - The operator retired the backlog cap; drain candidate-sent/open tasks under the current close-only authority.
          - Close preview is deterministic only; the configured authorized closer closes after landing.
          - Hold: two consecutive 5-minute loads>60; lift: two <36; one/equality does nothing. Threshold/admission/escalation changes need the operator via Assistant. Report load only if breaching.
          - Skip landed Rust retest if tree equals reviewed merge; build gclient in same cutover run.
          - Quiet hours (project_policy.quiet_hours, for the Game Goblins jobs): no restart/cutover, low load; never rerun.
          - Crate release: read project_policy.release_guidance first.
          - Place panes by project_policy.workspace_layout.
          - Friction: work around it and report it to Triage; the Orchestrator files it as a task under the Friction epic #25603.
      - type: set_variable
        delivery: on_receipt
        variable: _runbook_policy_injected
        value: true
      - type: set_variable
        delivery: on_receipt
        variable: _runbook_policy_revision
        value: '{{ rule_digest }}'

  reset-project-operating-policy-on-context-loss:
    description: "Re-arm the project operating policy after context loss"
    tags: [default, project-policy]
    event: session_start
    enabled: true
    # Same condition and priority as reset-seat-common-on-context-loss.
    priority: 8
    when: "event.data.get('source') in ['clear', 'compact'] or (event.data.get('source') == 'resume' and variables.get('pending_context_reset'))"
    effects:
      - type: set_variable
        variable: _project_policy_injected
        value: false
      - type: set_variable
        variable: _runbook_policy_injected
        value: false
