version: "1.13.0"

# This project's operating structure for seats: domain roots, worktrees, launch
# defaults, tab layout, load and quiet hours. Bundled definitions carry roles
# only; this rule carries how this repository runs them. Lanes are retired
# (operator ruling, 2026-10-23); work groups under the domain roots in project_policy.roots.
# The general policy reaches every session through the default tag; the runbook
# policy reaches only definitions that select the runbook tag.
rules:
  project-operating-policy:
    description: "Inject general project operating policy for every session"
    tags: [default, project-policy]
    event: turn_start
    enabled: true
    priority: 21
    when: >
      not variables.get('_project_policy_injected')
      or variables.get('_project_policy_revision') != '{{ rule_digest }}'
    effects:
      - type: set_variable
        variable: project_policy
        value:
          {
            "roots": [
              {"epic": "#25603", "name": "Friction", "lang": "Python", "description": "Runbooks, seat definitions and lifecycle, handoff and coordination, task tools, close invariants, landing and DevTeam worktrees, plus critical-path Python fixes that keep seats and the hub working. Non-blocking items go under #25662."},
              {"epic": "#23591", "name": "Provider quota ledger", "lang": "Python", "description": "Provider quota, per-call usage ledger, and per-session and per-task spend."},
              {"epic": "#24819", "name": "Rust port candidates", "lang": "Python (deferred)", "description": "Leaves off the critical path. Not worked until the port unless the operator says otherwise."},
              {"epic": "#24820", "name": "Code index", "lang": "Rust", "description": "crates/gcode: indexing, freshness, evidence."},
              {"epic": "#24821", "name": "Terminal and client", "lang": "Rust", "description": "crates/gterminal* and crates/gclient: panes, host lifecycle, client UI, pane restore."},
              {"epic": "#24822", "name": "Gobby Annotate", "lang": "Web/iOS", "description": "Annotate work. #22225 stays under #22978 until the operator moves it."},
              {"epic": "#21542", "name": "Gobby 1.0", "lang": "Rust", "description": "gdaemon front door, strangler port, hub and node, including hub mode (#21575)."}
