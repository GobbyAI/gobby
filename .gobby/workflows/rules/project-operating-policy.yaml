          }
      - type: inject_context
        delivery: on_receipt
        template: |
          ## Project Operating Policy
          - Load brevity(max) at start/compact/clear; use throughout.
          - Josh: resolve_operator_conversation(channel="gobby-telegram"); no hardcoded IDs.
          - Before routing/launch/handoff: get_variable(name="project_policy") for lanes/role_launch_defaults/launch_defaults. Reporter/Consolidator read role_guidance before work. Pass defaults+lane/lane_epic/worktree/first_job; bundles inherit, project-agnostic.
          - Integration 0.5.0; authorized push: git push origin <sha>:refs/heads/0.5.0.
          - Current lanes: list_tasks(label="lane").
          - Lanes1-4 first;5-9 heavy/close only if none waiting; stage launches by load/backlog. New tasks in lanes; outsiders stay. Found work to ORCH: low unless blocking lane work/landing; only blockers preempt; fold findings existing work resolves.
          - Josh alone moves/sweeps/folds/reparents #22978 Triage subtree, #22225 Annotate or operator-placed tasks. Check parent; never change deferred-by-josh.
          - One task/seat includes pending candidates; read-only prep allowed. ORCH-directed reviewer-LANDed waits: escalate_task(project_policy.handoff_reason_template); de-escalate/close after landing+LM release.
          - No task rebalancing; parallel work adds developer+reviewer. Seat moves allowed.
          - ORCH alone creates trees: lane-N-<name>[-K], retained per seat, never per task. Next task, clean+committed: git switch -c <branch> 0.5.0. Planners main; reviewers developer tree.
          - Backlog cap 20: candidate-sent/open tasks across lanes, except planning/operator-decision parks/closure-enabling work. Assign only <=20; park operator-review closes.
          - close preview is deterministic only; actual close requires explicit LM release. close_review_busy: wait reviewer+release, retry.
          - Hold: two consecutive 5-minute loads>60; lift: two <36; one/equality does nothing. Threshold/admission/escalation changes need Josh via Assistant. Report load only if breaching.
          - RM grants heavy cap 6: build/clippy/full-crate/e2e/bench; cargo CARGO_BUILD_JOBS=3. Skip landed Rust retest if tree equals reviewed merge; build gclient in same cutover run.
          - Game Goblins04:45–06:45 CT: no restart/cutover, low load; never rerun.
          - Crate release: read project_policy.release_guidance first.
          - Assistant/ORCH: operator panes; others: team-coordination/team-lane/team-planning.
      - type: set_variable
        delivery: on_receipt
        variable: _project_policy_injected
        value: true

  reset-project-operating-policy-on-context-loss:
    description: "Re-arm the project operating policy after context loss"
    event: session_start
    enabled: true
    # Same condition and priority as reset-seat-common-on-context-loss.
    priority: 8
    when: "event.data.get('source') in ['clear', 'compact'] or (event.data.get('source') == 'resume' and variables.get('pending_context_reset'))"
    effects:
      - type: set_variable
        variable: _project_policy_injected
        value: false
