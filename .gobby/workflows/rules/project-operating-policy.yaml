            "role_guidance": {"dev-team-lead":"Developer escalation (operator, 2026-11-05): when independent review has rejected a developer's candidate twice on the same task, replace that developer with a stronger model. Have it end its run with end_agent_run, carrying a handoff that names the rejected candidates and every open finding. Then relaunch dev-team with your team_id and developer_provider=codex, developer_model=gpt-6.1-sol, developer_reasoning_effort=medium. The new developer claims the task, reads both rejections, and continues from the latest candidate. When that task closes, have the escalated developer end its run, then relaunch dev-team with your team_id and no developer model inputs, so the next task gets the normal developer. Report each escalation and return to Triage.","consolidator":"Scope (operator, 2026-11-05, until the open worktrees clear): only the epics that have worktrees: #25603 Friction (with #25662 Non-blocking friction), #23591 Provider quota ledger, #24820 Code index, #24821 Terminal and client, and #23220. Do not touch #21542 Gobby 1.0, #24822 Gobby Annotate or #24819 Rust port candidates. Route proposals to the epic they belong to inside that scope. Check stale candidates against current evidence before retirement proposals. Exclude #22225 Annotate and #22978 triage and its whole subtree, including #22360 post-1.0 deferrals, and all plan-expanded epic subtrees.","orchestrator":"1.0 path reference (operator-approved #25460): .gobby/plans/research/rust-port-order-v2-2026-10-31.md; tree plan: .gobby/plans/task-25460.md. Read by reference; do not paste. Never claim or close #25609 (Friction placeholder). The gusto and lightspeed MCP connections belong to game-goblins; no gobby seat gets them.","archivist":"1.0 path reference (operator-approved #25460): .gobby/plans/research/rust-port-order-v2-2026-10-31.md; tree plan: .gobby/plans/task-25460.md. Read by reference; do not paste.","assistant":"1.0 path reference (operator-approved #25460): .gobby/plans/research/rust-port-order-v2-2026-10-31.md; tree plan: .gobby/plans/task-25460.md. Read by reference; do not paste."},
