              informational prose. This matches strategy A1's "at
              least one" cardinality. tests:
              tests/plans/test_parser.py::test_acceptance_item_without_artifact_raises
              (zero raises),
              tests/plans/test_parser.py::test_acceptance_item_with_multiple_artifacts_uses_first
              (multi parses cleanly, first wins).
        notes: >-
          Round 6 fix: prior contract said "exactly one" which the
          plan's own items violated (~30 of 115). Strategy A1 says
          "at least one"; aligning the detail plan's parser rule
          eliminates the contradiction.
      A2.15:
        expected_leaves:
          - title: "Parser plan_kind enum: implementation strict, strategy permissive on both narrative and canonical-no-kind headings"
            owner_agent: backend-developer
            validation_criteria_summary: >-
              gobby.plans.parser.PlanKind is a StrEnum exposing
              implementation and strategy. parse_plan(path,
              plan_kind=PlanKind.strategy) is permissive on both
              missing-kind heading classes: (1) non-canonical
              narrative headings record into
              PlanDocument.framing_headings; (2) canonical headings
              missing kind: yield PlanSection(kind=Kind.framing,
              acceptance_items=()). parse_plan(path,
              plan_kind=PlanKind.implementation) (the default)
              raises PlanParseError on either input. tests:
              tests/plans/test_parser.py::test_strategy_kind_permissive_no_raise_on_narrative_headings,
              tests/plans/test_parser.py::test_strategy_kind_permissive_canonical_heading_no_kind.
      A2.16:
        expected_leaves:
          - title: "Parser masks fenced code blocks from all structural scans using full CommonMark fence-matching semantics"
            owner_agent: backend-developer
            validation_criteria_summary: >-
              gobby.plans.parser.parse_plan computes a code-fence
              mask before structural scanning. Open: ≥3 consecutive
              ` (backticks) or ~ (tildes), with optional info
              string, up to 3 leading spaces. Close: same character
              at length ≥ opener's length, with empty info string
              after the delimiter. A shorter same-character fence
              inside the block does NOT close it; a different-
              character fence inside does NOT close it. While
              masked, lines are excluded from heading, kind:,
              **Acceptance:**, acceptance-bullet, and deferral-YAML
              detection. The single exception is a deferred
              section's first fenced YAML block, which is
              intentionally consumed as the deferral object. Fenced
              examples that look like real headings or acceptance
              bullets MUST NOT contribute to PlanDocument.sections
              or any PlanSection.acceptance_items. tests:
              tests/plans/test_parser.py::test_fenced_headings_are_masked,
              ::test_fenced_acceptance_bullets_are_masked,
              ::test_fenced_deferral_yaml_outside_deferred_is_ignored,
              ::test_tilde_fence_also_masks,
              ::test_fence_closes_with_longer_delimiter,
              ::test_shorter_inner_fence_does_not_close,
              ::test_different_fence_char_does_not_close,
              ::test_indented_fence_up_to_3_spaces.
        notes: >-
          This is load-bearing for A2.5 (test_parses_self) — without
          fence masking the plan's own A1/A3/A4 fenced examples
          would either fail to parse (duplicate-ID, missing-kind)
          or pass for implementation-dependent reasons.
          Round 9 fix: prior text said "delimiter character and
          length must match" which CommonMark allows ``` to close
          ``` , and a strict-equal-length rule would silently
          extend the fenced region past valid ```` closers. The
          rule now matches CommonMark exactly (closer ≥ opener
          length, same character).
      A2.17:
        expected_leaves:
          - title: "test_parses_self verifies fenced examples in this plan do not leak into sections"
            owner_agent: backend-developer
            validation_criteria_summary: >-
              tests/plans/test_parser.py::test_parses_self parses
              .gobby/plans/task-13175-plan-coverage-contract.md and
              asserts: (1) PlanDocument.sections contains exactly
              A0..A12 with no fenced fake A?.? IDs leaking in;
              (2) every deliverable section has acceptance_items
              count matching the on-disk **Acceptance:** block real
              bullets only (fenced fake bullets excluded);
              (3) PlanDocument.source_hash equals
              hashlib.sha256(plan.read_bytes()).hexdigest().
        notes: >-
          Direct regression test of A2.16 against the very plan that
          motivated the rule. Depends on A2.16 landing first.

