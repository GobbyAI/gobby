#
# This ledger is the manual stand-in for the A4 coverage tooling that
# does not yet exist. It enumerates every deliverable acceptance item
# in the Epic 1 plan and the leaves that are expected to cover it.
# Adversary-reviewed before Epic 1 expansion (per strategy A8); re-
# validated by the new tooling after A4 lands (blocks Epic 1 close
# on mismatch — A8.7).
#
# Sections A0 (framing), A11 (framing), and A12 (verification) are
# intentionally absent: they have no acceptance items.

