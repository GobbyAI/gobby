      A2.14:
        expected_leaves:
          - title: "Parser requires at least one artifact reference per acceptance item; multi-artifact items use first match"
            owner_agent: backend-developer
            validation_criteria_summary: >-
              gobby.plans.parser raises PlanParseError when an
              acceptance item has zero file:|symbol:|test:|behavior:
              references. Items with multiple artifact references
