    validation_criteria_snippet: "Coverage mapped to #12776 for plan item 1.4.2; acceptance\
      \ artifact `tests/dispatch/test_mutex.py::test_detach_does_not_leak_across_acquires`\
      \ covers the scenario the prior global-state design failed: (a) acquire kind=\"\
      spawn\" \u2192 detach_from_context(token1) \u2192 exit; (b) hook clears the\
      \ DB row; (c) acquire kind=\"lifecycle\" on the same task_id \u2192 exit without\
      \ detach \u2192 assert the DB row is DELETED on scope exit (would have been\
      \ retained under the leaked-detach design). Also covers (d) calling `detach_from_context`\
      \ with an unknown/stale token is a no-op (defensive)."
