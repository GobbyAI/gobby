          orchestrator remains thin and below 850 lines while `compact_staging.py` owns resolve/peek,
          source stage, destination take, generation-CAS consume, acknowledgment-triggered
          admission, and generation-keyed scheduling state; crash before schedule, crash after
          send before durable recording, duplicate retry, and scheduling failure preserve
          the staged briefing and source marker under explicit at-least-once scheduling semantics;
          predecessor→successor clear and a racing second generation retain distinct IDs while
          only one generation per class is resident. test: `tests/sessions/test_compact_continuation.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.21:
        text: 'One- and many-contributor oversize briefings deliver in one response through
          `fit_grok_briefing_response`: full serialized PreToolUse reason and Stop/SubagentStop
          additionalContext envelopes stay within their asymmetric UTF-8 byte budgets, retain
          a non-empty character-safe head, full canonical content, and one stable persisted
          reference; every different-class replay refits with that helper including multibyte
          text and real-gate prepending, while persistence/reference failure leaves replay
          identity pending without acknowledgment or denial payload. test: `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.22:
        text: 'Commit atomically persists full canonical delivery content, one stable reference,
          component classes, origin class, request id, and replay state; same-ID native replay
          has precedence, every eligible different-class replay calls `fit_grok_briefing_response`
          for the receiving class before advancing request identity, passive hooks leave it
          pending, and a real receiving gate is included in the refit budget. Ghook inbox-file
          absence acknowledges only a mapped provider action whose stdout write and flush
          succeeded before deletion; mapping/emission/deletion failure retains the envelope,
          commit-before-emission crash/disconnect replays at least once, and `_drain_hook_inbox_once_locked`
          retains a provider-ack-pending Grok file on its processed-marker branch. A controlled
          direct-POST commit → processed marker → daemon drain → ghook stdout-failure race
          leaves the file and replay pending. test: `tests/hooks/test_grok_pending_context.py`.
          test: `tests/hooks/test_inbox.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.23:
        text: 'A second PreToolUse arriving during a live unexpired claim returns a retriable
          non-payload deny and never allows its tool; after the owner commits or releases,
          the next PreToolUse proceeds normally; owner-timeout takeover is tested separately
          from the payload-bearing denial. test: `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.24:
        text: 'A stale racer reaching its enqueue step after the startup component committed
          finds its finite one-shot identity in the activation-epoch set and does not re-enqueue:
          the commit-before-late-stash interleaving yields no second briefing denial. test:
          `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.25:
        text: 'PreToolUse→Stop, Stop→PreToolUse, SubagentStop, same-ID retry, compatible different-ID
          replay, passive incompatibility, real-gate precedence, asymmetric receiving-class
          refit, persistence/reference failure, disconnect, ghook mapping/stdout-write/flush
          failure, stale reclaim, and post-receipt/pre-ack crash follow one canonical replay
          precedence table with envelope retention, at-least-once emission, and exactly-once
          ack mutations. test: `tests/servers/test_mcp_routes.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.26:
        text: 'Terminal dedupe stays bounded over a long session: only five finite lifecycle
          one-shots occupy the current epoch set, compact/clear retain one generation watermark
          per active source relation, P2P rechecks delivered_at in the same transaction as
          enqueue/acknowledgment, and thousands of sequential commits plus activation-epoch
          rollover neither grow an unbounded collection nor re-enqueue. test: `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.27:
        text: 'Session-boundary contract, sessions guide, and variables guide document Grok
          PreToolUse/Stop delivery, compact/clear single ownership, and acknowledgment-time
          clearing semantics. file: `docs/contracts/session-boundary.md`, `docs/guides/sessions.md`,
          `docs/guides/variables.md`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.28:
        text: 'P2P acknowledgment first peeks the replay token and P2P IDs without locks,
          then opens a no-initial-lock immediate transaction, UUID-locks and eligibility-checks
          those rows, acquires `SessionVariableMutation(session_id)` through connection-aware
          `_mutate_variables`, revalidates the exact replay token/component ownership, and
          only then atomically runs `mark_delivered_batch`, all ack mutations, and replay
          advance/clear; stale peeks and injected failures acknowledge nothing. test: `tests/workflows/test_state_manager.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.29:
        text: 'Replay eligibility preserves component class: Stop(real block + turn-context
          only) → ungated PreToolUse leaves replay pending without creating a deny, and PreToolUse(real
          deny + turn-context only) → allowing Stop follows the explicit drop arm without
          creating a block or executing ack mutations; briefing-containing replay may create
          its one delivery gate in both directions. test: `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.30:
        text: 'P2P is briefing-class and never exceeds its nine-slot static ceiling: nine
          P2P plus five lifecycle one-shots, one resident compact, and one resident clear
          fill exactly 16; second compact and clear arrivals while the resident is queued,
          claimed, or replay-owned retain distinct source-staged IDs, enter only on acknowledgment-triggered
          class-slot release, and later P2P batches drain in `sent_at`/id order without duplicate
          components, corruption logs, or general retry/backpressure machinery. test: `tests/hooks/test_pending_message_provider_contracts.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.31:
        text: 'P2P selection first UUID-locks at most nine earliest candidates, then acquires
          `SessionVariableMutation(session_id)`, recomputes reservation-aware live capacity
          inside `_mutate_variables`, and enqueues only the earliest fitting eligible prefix;
          a finite-source enqueue between candidate selection and session-lock acquisition
          shrinks that prefix while excess rows remain untouched. test: `tests/hooks/test_pending_message_provider_contracts.py`.
          test: `tests/workflows/test_state_manager.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.32:
        text: 'In the reverse first-activity interleaving, PreToolUse creates the row and
          commits briefing first while a losing UPS reaches each lifecycle producer before
          and after acknowledgment; stable producer IDs yield one briefing identity, zero
          aggregate-stash turn-context duplicate, and exactly one acknowledgment mutation.
          test: `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.33:
        text: 'Resume, clear, and inactive-row re-materialization roll activation epoch through
          one CAS owner: queued, claimed, and replay-owned old-epoch state drains under its
          existing token/ack contract before a pending rollover advances once; daemon restart
          plus concurrent rollover/acknowledgment races preserve one epoch, clear committed-one-shot
          and watermark state only at the atomic advance, keep undelivered P2P rows eligible,
          and reject stale old-epoch completion. test: `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.34:
        text: 'P2P acknowledgment-versus-enqueue and acknowledgment-versus-legacy-merge races
          obey the common UUID-row-lock → `SessionVariableMutation` order; replay-token revalidation
          prevents stale ownership acknowledgment, and rollback preserves delivered rows,
          ack mutations, canonical replay, and buffer state as one unit. test: `tests/storage/test_inter_session_messages.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.35:
        text: 'Adapter worker-result constructors and async-route pattern matching exhaustively
          distinguish ordinary payload from payload plus opaque claim token; `handle_native`
          has no commit/release path, and only `execute_hook` commits or releases after the
          immutable deadline check. test: `tests/adapters/test_acp_hook_integration.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.36:
        text: 'Direct AGY handle_native consumer exhaustively unwraps PayloadResult while
          preserving the native payload contract. test: `tests/adapters/test_adapters_agy.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.37:
        text: 'While `_activation_epoch.pending` is set, new P2P component enqueue, turn-context
          stash, and staged-memory selection are fenced alongside lifecycle, copied-dispatch,
          and compact/clear producers — only old-epoch release, replay, acknowledgment, explicit
          drop, and lease recovery proceed; continuous P2P and turn-context arrivals through
          a pending drain cannot starve rollover, and a final-acknowledgment epoch advance
          during `_complete_response` re-evaluates the current hook''s uncommitted selection
          under the new epoch or returns its typed per-class retryable fallback. test: `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.38:
        text: 'At most one live claim or canonical replay exists per session across all hook
          classes: concurrent PreToolUse-versus-Stop/SubagentStop races in both completion
          orders prove the losing class never claims or attaches pending components, a real
          Stop/SubagentStop still emits its own gate content, and every release, timeout,
          and lease-takeover branch recovers the losing claim without stranding a claimed
          set. test: `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.39:
        text: 'Controlled pre-token persistence, reference, and budget failures CAS-release
          the newly created claim through `ClaimHandle` before the retryable fallback returns
          — no live claim remains and the next eligible hook selects the same components —
          while receiving-class refit/retranslation failure on an already committed canonical
          replay preserves the replay, its identity, and its stable reference unchanged. test:
          `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
