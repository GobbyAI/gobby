  '4.1':
    acceptance_items:
      4.1.1:
        text: 'First-prompt, binding-SessionStart, and continuation-prompt context on Grok is stashed
          as briefing while ordinary UPS context is stashed as turn-context; neither returns additionalContext
          or systemMessage. test: `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.2:
        text: 'First Grok PreToolUse after a briefing stash denies once with that reason and claims the
          components; the identical PreToolUse after ghook''s inbox-file removal allows absent another
          gate. test: `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.3:
        text: 'Turn-context concatenates onto an already-blocking Stop and is dropped (debug-logged) when
          Stop allows; Grok Stop with only turn-context and no stop-gate allows the stop. test: `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.4:
        text: 'On Grok, the `inject-compact-handoff-on-prompt` / `inject-clear-handoff-on-prompt` render
          is captured as a briefing component on the continuation prompt and delivered by the next PreToolUse
          deny; the rule templates are unchanged. test: `tests/hooks/test_hook_manager.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.5:
        text: 'Grok wire envelopes for flush outputs (deny reason, Stop block + additionalContext) are
          asserted at the adapter layer only. test: `tests/adapters/test_acp_hook_translation.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.6:
        text: 'Briefing and turn-context flush onto workflow-block and webhook-block responses under `preserve_original=True`,
          on the object returned to the adapter. test: `tests/hooks/test_hook_manager.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.7:
        text: 'Buffer bounds enforce the named caps: turn-context is drop-oldest at 32 components / 16384
          bytes and rejects a single component over 8192 bytes; briefing components are deduplicated by
          id and never cap-evicted; every mutation is one `_mutate_variables` call. test: `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.8:
        text: 'A no-UPS first PreToolUse stashes the startup packet as briefing and deny-once delivers
          it on that same response. test: `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.9:
        text: 'Grok pending P2P messages enqueue as `p2p:<id>` components without `mark_delivered_batch`,
          dedupe across concurrent selectors and select-after-claim, are bounded per selection, and are
          marked delivered only in the acknowledgment; non-Grok inline delivery is unchanged. test: `tests/hooks/test_event_enrichment.py`.
          test: `tests/hooks/test_pending_message_provider_contracts.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.10:
        text: 'Acknowledgment on the next hook with a different envelope id treats an absent inbox file
          as delivered (ack effects run, delivery cleared) and a present file as undelivered (file unlinked,
          components requeued at the front, delivered again on the next gate). test: `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.11:
        text: 'ghook removes the inbox envelope only after the mapped provider action was written and
          flushed to stdout; mapping failure or stdout failure leaves the envelope in place. test: `crates/ghook/tests/contract.rs`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.12:
        text: 'The daemon drain leaves an already-processed envelope whose terminal response carries `_grok_delivery`
          in place and still unlinks other processed leftovers. test: `tests/hooks/test_inbox.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.13:
        text: '`grok_pending_briefing`, `grok_pending_turn_context`, and `grok_pending_delivery` are reserved;
          `is_reserved_workflow_variable` is true for all three. test: `tests/hooks/test_grok_pending_context.py`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
      4.1.14:
        text: 'Session-boundary contract, sessions guide, and variables guide document Grok PreToolUse/Stop
          delivery, the reserved buffers, and post-stdout acknowledgment. file: `docs/contracts/session-boundary.md`,
          `docs/guides/sessions.md`, `docs/guides/variables.md`.'
        expected_leaves:
        - title: Stash observe context and flush briefing without a Stop loop
          owner_agent: backend-developer
