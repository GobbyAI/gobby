# Project-local rule for the gobby repo. Not a bundled template — install with:
#   uv run gobby rules import .gobby/rules/gobby-project-testing.yaml
# The installed DB row is the active enforcement; this file is the durable source.
# The `default` tag is what agent rule_selectors include (tag:default), so the
# rule is active for interactive and worker agents alike; the `when` condition
# confines it to this project.
group: gobby-project-testing
tags: [user, project, testing, enforcement, default]

rules:
  require-pytest-guard-env:
    description: >-
      Require the guard_tests env prefix (GOBBY_TEST_PROTECT=1 and a test
      DATABASE_URL) on agent pytest runs in the gobby repo.
    event: before_tool
    enabled: true
    priority: 40
    when: "event.project_id == 'd45545c5-ded5-4335-b115-0245752edacf'"
    effect:
      type: block
      tools: [Bash]
      # Match pytest only in command position (segment start, uv run, python -m)
      # so prose mentions of "pytest" in commit messages or echoes don't trip it.
      command_pattern: "(^\\s*|[;&|(]\\s*|\\buv\\s+run\\s+|\\bpython3?\\s+-m\\s+)pytest\\b"
      command_not_pattern: "(?s)(?=.*GOBBY_TEST_PROTECT=1)(?=.*DATABASE_URL=)"
      reason: >-
        Run pytest through the project's guard prefix (verification.custom.guard_tests
        in .gobby/project.json):
        DATABASE_URL="${DATABASE_URL:-postgresql://gobby_test:gobby_test@127.0.0.1:60892/gobby_test}"
        GOBBY_TEST_PROTECT=1 uv run pytest <targets>.
        Without GOBBY_TEST_PROTECT=1, DB-backed tests skip silently and read as
        passing; with it but no test DATABASE_URL, they fail loudly. The prefix
        makes both explicit.
